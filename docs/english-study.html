 효과 = 원격근무 도입의 가속 → 어떻게·어디서 일하는가 에 중대한 변화 ⭐⭐⭐ 관련 키워드 4종 = 원격근무 도구 · 디지털 협업 · 유연근무 정책 · 일과 삶의 균형 📌 문장비교 → the covid 19 pandemic made more people start working from home . this change has affected how and where people work. → because of covid 19, many people now work from home . this has changed how and where people work. → important topics related to remote work include tools for online work, working together online, flexible work hours, and balancing work with personal life . these topics will continue to be important as remote work becomes more common . ℹ️ 강의록 보충 - pandemic : pertaining to all people 세계적으로 큰 영향을 미친 질병 cf. endemic : particular to a people or locality 풍토병 ⭐⭐ 대비 암기 ⑥ 키워드 ⑥ 헬스테크 healthtech 89p. ⭐⭐⭐ healthtech : the healthcare industry is undergoing rapid transformation driven by advancements in technology, including telemedicine, wearable devices, personalized medicine, and health analytics . keywords related to healthtech innovation and digital health solutions are expected to be prominent {as the industry adapts to new challenges and opportunities}. 헬스테크 4종 = 원격의료 · 웨어러블 기기 · 맞춤 의료 · 건강 데이터 분석 ⭐⭐⭐ 📌 문장비교 → the healthcare industry is changing quickly because of new technology. this includes things like telemedicine, {where you see a doctor online}, wearable devices like smartwatches {that track check your health}, personalized medicine {that fits your needs / made just for you}, and health analytics {that helps understand health data}. → words related to healthtech and digital health solutions will be important as the industry faces new challenges and opportunities. ⭐⭐⭐ undergoing rapid transformation = 빠르고 중대한 변화를 겪는 중 연습문제 3 으로 직접 출제 - \"성장 둔화\" \"기술에 저항\" \"변화 없음\"은 모두 오답 ⑦ 키워드 ⑦ 사이버보안 cybersecurity 90p. ⭐⭐⭐ cybersecurity : {as cyber threats become more sophisticated and prevalent ,} cybersecurity remains a critical concern for individuals, businesses, and governments . keywords related to cybersecurity , such as ransomware, data breaches, zero trust architecture, and cybersecurity awareness , are likely to be significant {as organizations prioritize efforts to protect their digital assets }. 사이버보안 키워드 4종 = 랜섬웨어 · 정보 유출 · 제로 트러스트 구조 · 보안 인식 ⭐⭐⭐ 보호 대상 = 디지털 자산 digital assets ⭐⭐⭐ 📌 문장비교 → cyber threats are becoming more advanced and common . because of this , cybersecurity is very important for people, companies, and governments. → key words to know about cybersecurity are ransomware bad software that asks for money , data breaches when private information is stolen , zero trust architecture checking everyone before letting them in , and cybersecurity awareness understanding how to be safe online . 원문 용어 쉬운 설명 ransomware bad software that asks for money data breaches when private information is stolen zero trust architecture checking everyone before letting them in cybersecurity awareness understanding how to be safe online 2. 연습문제 강의록 원문 1 grammatical understanding - which of the following sentences is grammatically correct? a the rise … have led to the emergence of defi applications, which aims to disrupt … ← 주어 수 불일치 + 관계절 수 불일치 b the rise of blockchain technology and cryptocurrencies has led to the emergence of decentralized finance defi applications, which aim to disrupt traditional financial systems. ✅ c … has lead to … which aim to … ← lead 원형 를 과거분사 자리에 씀 d … have lead … which aims to … ← 세 곳 모두 오류 2 word usage - \"keywords … are likely to remain ______ as remote work becomes more entrenched in the global workforce.\" a relevance b relevant ✅ c relevance's d relevantly → remain 은 보어 형용사 를 취하는 2형식 동사 → relevant ⭐⭐⭐ 3강의 remain 2형식과 연결 3 phrase understanding - what does \"healthcare industry is undergoing rapid transformation\" most likely mean? a the healthcare industry is slowing down in terms of growth. b the healthcare industry is experiencing quick and significant changes. ✅ c the healthcare industry is resistant to technological advancements. d the healthcare industry is staying the same without much change. 4 sentence understanding - which sentence best summarizes: \"keywords related to cybersecurity, such as ransomware, data breaches, zero trust architecture, and cybersecurity awareness, are likely to be significant as organizations prioritize efforts to protect their digital assets.\" a the importance of cybersecurity related keywords will decrease as organizations focus on other priorities. b organizations are expected to deprioritize cybersecurity, making related keywords less relevant. c cybersecurity related keywords will continue to be important as organizations focus on protecting their digital resources. ✅ d cybersecurity is no longer a concern, so related keywords will become irrelevant. 5 understanding of the content - \"keywords related to cybersecurity … are likely to be significant as organizations prioritize efforts to protect ______.\" a healthcare b ethical considerations c the metaverse d their digital assets ✅ 핵심 정리 📌 9·10강을 합치면 키워드는 모두 7개 - 시험은 \"어느 키워드가 어느 설명과 짝인가\"를 묻는다. 키워드 원인 as/with ~ 하위 용어 4종 ① metaverse vr·ar·몰입형 경험 관심 증가 meta의 대규모 투자 ② sustainability 기후변화·환경 악화 우려 고조 재생에너지·순환경제·친환경 관행·기후행동 ③ ai ethics ai의 사회 통합 심화 편향 완화·투명성·책무성 ④ defi 블록체인·암호화폐의 부상 블록체인·스마트계약·탈중앙화거래소·토큰화 ⑤ remote work covid 19 팬데믹 원격근무도구·디지털협업·유연근무·워라밸 ⑥ healthtech 기술 발전 원격의료·웨어러블·맞춤의료·건강분석 ⑦ cybersecurity 사이버 위협의 정교화·만연 랜섬웨어·정보유출·제로트러스트·보안인식 📌 모든 항목이 as/with 원인 , 키워드 is likely to ~ 라는 같은 틀 - 원인과 결과를 뒤집은 보기가 오답이다. 📌 문법 문항은 두 곳의 수 일치를 동시에 본다 - 주어 the rise 단수 → has 와 관계대명사절 선행사 applications 복수 → aim . 여기에 lead–led–led 3단 변화까지 겹쳐 출제된다 ⚠️ 📌 remain + 형용사 - 연습문제 2 의 정답이 relevant 인 이유는 remain 이 보어를 취하는 2형식 동사 이기 때문. 3강에서 배운 he remained silent. 와 같은 구조다 ⭐⭐⭐ 📌 어려운 용어 ↔ 쉬운 설명 짝이 곧 정답 - undergo rapid transformation = experiencing quick and significant changes, disrupt = change the way ~ works, entrenched = more common, prevalent = common. 📌 pandemic ↔ endemic - 강의록이 따로 표기한 대비. 전자는 전 세계적, 후자는 특정 지역의 풍토병. 시험 대비 포인트 ⭐⭐⭐ 키워드 4종 defi / remote work / healthtech / cybersecurity 과 각각의 하위 용어 ⭐⭐⭐ defi의 목표 = 전통 금융 시스템을 disrupt 뒤흔들다 ⭐⭐⭐ undergoing rapid transformation = 빠르고 중대한 변화를 겪는 중 ⭐⭐⭐ 사이버보안이 보호하려는 대상 = digital assets ⭐⭐⭐ 주어 수 일치 the rise → has led + 관계절 수 일치 applications → aim ⭐⭐⭐ remain + 형용사 보어 remain relevant ⭐⭐ 팬데믹이 원격근무에 미친 영향 = 도입 가속, 일하는 방식·장소의 변화 ⭐⭐ 헬스테크 4종 telemedicine / wearable devices / personalized medicine / health analytics ⭐⭐ 사이버보안 용어의 쉬운 정의 ransomware / data breach / zero trust / awareness ⭐ lead – led – led 3단 변화 ⭐ pandemic 전 세계적 vs endemic 풍토병 ⭐ 스마트 계약 = 조건 충족 시 자동 실행되는 계약 "}, {"id": 11, "title": "The Village of Harmony Haven: 7 Concepts (1)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>quaint<\/strong><\/td><td><strong>예스럽고 아담한<\/strong> (= old-fashioned) ⚠️ large/busy/noisy가 아니다<\/td><\/tr><tr><td><strong>nestled<\/strong><\/td><td>(~사이에) <strong>아늑히 자리 잡은<\/strong><\/td><\/tr><tr><td><strong>rolling hills / lush forests<\/strong><\/td><td><strong>완만한 구릉 / 무성한 숲<\/strong><\/td><\/tr><tr><td><strong>embody<\/strong><\/td><td><strong>구현하다<\/strong> (= believed, cared about)<\/td><\/tr><tr><td><strong>empathy<\/strong><\/td><td><strong>공감<\/strong><\/td><\/tr><tr><td><strong>equality<\/strong><\/td><td><strong>평등<\/strong><\/td><\/tr><tr><td><strong>sustainability<\/strong><\/td><td><strong>지속가능성<\/strong><\/td><\/tr><tr><td><strong>critical thinking<\/strong><\/td><td><strong>비판적 사고<\/strong><\/td><\/tr><tr><td><strong>resilience<\/strong><\/td><td><strong>회복력<\/strong><\/td><\/tr><tr><td><strong>global citizenship<\/strong><\/td><td><strong>세계시민의식<\/strong><\/td><\/tr><tr><td><strong>empowerment<\/strong><\/td><td><strong>역량 강화, 권한 부여<\/strong><\/td><\/tr><tr><td><strong>thrive on ~<\/strong><\/td><td><strong>~을 발판으로 번성하다<\/strong><\/td><\/tr><tr><td><strong>interconnectedness<\/strong><\/td><td><strong>상호연결성<\/strong><\/td><\/tr><tr><td><strong>towering<\/strong><\/td><td><strong>우뚝 솟은<\/strong><\/td><\/tr><tr><td><strong>Legend had it that ~<\/strong><\/td><td><strong>전설에 따르면 ~라고 한다<\/strong> ⚠️ 사실이 아니라 \"전설에 따르면\"<\/td><\/tr><tr><td><strong>grant<\/strong><\/td><td><strong>주다, 부여하다<\/strong> (= giving) ⚠️ denying/blocking/stopping이 아니다<\/td><\/tr><tr><td><strong>flourish<\/strong><\/td><td><strong>번영하다, 융성하다<\/strong><\/td><\/tr><tr><td><strong>forge<\/strong><\/td><td>(관계를) <strong>다지다, 구축하다<\/strong><\/td><\/tr><tr><td><strong>foster<\/strong><\/td><td><strong>기르다, 조성하다<\/strong><\/td><\/tr><tr><td><strong>a sense of belonging<\/strong><\/td><td><strong>소속감<\/strong><\/td><\/tr><tr><td><strong>plagued by ~<\/strong><\/td><td><strong>~로 시달리는<\/strong><\/td><\/tr><tr><td><strong>inequality / injustice<\/strong><\/td><td><strong>불평등 / 부정의<\/strong><\/td><\/tr><tr><td><strong>be drawn to ~<\/strong><\/td><td><strong>~에 이끌리다<\/strong><\/td><\/tr><tr><td><strong>welcomed with open arms<\/strong><\/td><td><strong>두 팔 벌려 환영받다<\/strong> (= 기쁘게 받아들여지다)<\/td><\/tr><tr><td><strong>social justice<\/strong><\/td><td><strong>사회 정의<\/strong><\/td><\/tr><tr><td><strong>oasis<\/strong><\/td><td><strong>오아시스<\/strong> - 여기서는 \"지속가능한 안식처\"<\/td><\/tr><tr><td><strong>cultivate<\/strong><\/td><td><strong>재배하다, 기르다<\/strong><\/td><\/tr><tr><td><strong>environmental stewardship<\/strong><\/td><td><strong>환경 관리 책임<\/strong><\/td><\/tr><tr><td><strong>composting / rainwater harvesting<\/strong><\/td><td><strong>퇴비화 / 빗물 수집<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 99p.~104p.)<\/h4>\n<p><strong>① 마을 소개 - 7개 개념<\/strong> (99p.~100p.) ⭐⭐⭐<\/p>\n<blockquote><p>In a <strong>quaint<\/strong> village [<strong>nestled<\/strong> between rolling hills and lush forests], there existed a community {that <strong>embodied<\/strong> the principles of <strong>empathy, equality, sustainability, critical thinking, resilience, global citizenship, and empowerment<\/strong>}.<\/p><\/blockquote>\n<ul><li>이 마을이 구현한 <strong>7개 개념<\/strong>이 곧 단원 제목의 \"7 Concepts\" ⭐⭐⭐<\/li><\/ul>\n<pre class=\"cb\"><code class=\"lang-text\">① empathy(공감)  ② equality(평등)  ③ sustainability(지속가능성)\n④ critical thinking(비판적 사고)  ⑤ resilience(회복력)\n⑥ global citizenship(세계시민의식)  ⑦ empowerment(역량 강화)<\/code><\/pre>\n<ul><li><code>embodied<\/code> ≈ <strong>believed, cared about<\/strong> (강의록 주석)<\/li><\/ul>\n<blockquote><p>This village, [<strong>known<\/strong> simply as Harmony Haven], <strong>thrived on<\/strong> the <strong>interconnectedness<\/strong> of its inhabitants and their shared commitment to [creating a better world].<\/p><\/blockquote>\n<ul><li><code>known simply as<\/code> ≈ <strong>named / called<\/strong> (강의록 주석)<\/li><li>마을이 번성한 이유 = <strong>주민들의 상호연결성 + 더 나은 세상을 만들겠다는 공동의 헌신<\/strong> ⭐⭐⭐<\/li><li>📌 강의록 풀이: *grew stronger because its people were connected and shared the same goal of making the world better.*<\/li><\/ul>\n<p><strong>② 조화의 나무 (The Tree of Harmony)<\/strong> (100p.~101p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>At the heart of<\/strong> Harmony Haven <strong>stood<\/strong> a <strong>towering<\/strong> tree, [known as the Tree of Harmony]. <strong>Legend had it<\/strong> {that the tree possessed <strong>magical powers<\/strong>, <strong>granting<\/strong> those [who gathered beneath its branches] the ability [to understand and share the feelings of others]}.<\/p><\/blockquote>\n<ul><li>나무의 힘 = <strong>그 아래 모인 이들에게 타인의 감정을 이해하고 공유하는 능력을 부여<\/strong> (= 공감 능력) ⭐⭐⭐<\/li><li>⚠️ <code>Legend had it that ~<\/code> = <strong>전설에 따르면<\/strong> - \"사실이다\"도 \"입증되었다\"도 아니다 (연습문제로 직접 출제) ⭐⭐⭐<\/li><li>⚠️ <code>granting<\/code> = <strong>giving<\/strong>(주는 것) - denying/blocking/stopping이 아니다 (연습문제로 직접 출제) ⭐⭐⭐<\/li><li><code>At the heart of ~ stood ~<\/code> = <strong>도치 구문<\/strong> (장소 부사구가 앞에 오면 주어·동사가 도치) ⭐⭐<\/li><\/ul>\n<p><strong>③ 저녁의 모임<\/strong> (100p.~101p.)<\/p>\n<blockquote><p>Every evening, villagers would gather around the tree, <strong>sharing<\/strong> stories of their joys and sorrows, triumphs and challenges. [Through these communal gatherings], harmony <strong>flourished<\/strong>, <strong>forging<\/strong> deep connections among neighbors and <strong>fostering<\/strong> a sense of belonging.<\/p><\/blockquote>\n<ul><li>공동 모임의 결과 = <strong>조화의 융성 + 이웃 간 깊은 유대 + 소속감 조성<\/strong> ⭐⭐<\/li><li><code>would<\/code> = <strong>과거의 반복적 습관<\/strong> ⭐⭐ (\"~하곤 했다\")<\/li><li>분사구문 3연속: <code>sharing<\/code> … <code>forging<\/code> … <code>fostering<\/code> ⭐⭐<\/li><\/ul>\n<p><strong>④ 새로 온 사람 - Aria<\/strong> (102p.~103p.) ⭐⭐⭐<\/p>\n<blockquote><p>One day, a <strong>newcomer<\/strong> arrived in Harmony Haven. Her name was <strong>Aria<\/strong>, and she came from a distant land [<strong>plagued by inequality and injustice<\/strong>]. [<strong>Determined to find a place<\/strong> {where she could <strong>make a difference<\/strong>}], Aria <strong>was drawn to<\/strong> the village's reputation for [<strong>embracing diversity and promoting equality<\/strong>].<\/p><\/blockquote>\n<ul><li>Aria의 출신 = <strong>불평등과 부정의로 시달리는 먼 땅<\/strong> ⭐⭐⭐<\/li><li>마을에 이끌린 이유 = <strong>다양성을 포용하고 평등을 증진한다는 평판<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p>(연습문제로 직접 출제 - \"싫어했다/피했다/혼란스러웠다\"는 모두 오답)<\/p>\n<blockquote><p>{<strong>As<\/strong> she settled into her new home}, Aria was <strong>welcomed with open arms<\/strong> by the villagers, {who recognized her passion for <strong>social justice and empowerment<\/strong>}.<\/p><\/blockquote>\n<ul><li>⚠️ <code>welcomed with open arms<\/code> = <strong>마을 사람들이 기쁘게 받아들였다<\/strong> (연습문제로 직접 출제) ⭐⭐⭐<\/li><\/ul>\n<p><strong>⑤ 공동체 정원<\/strong> (103p.~104p.) ⭐⭐⭐<\/p>\n<blockquote><p>[<strong>Driven by<\/strong> her desire <strong>to contribute to<\/strong> the community], Aria <strong>proposed<\/strong> the development of a community garden-a sustainable <strong>oasis<\/strong> {where villagers could <strong>cultivate<\/strong> fresh produce <strong>while learning about environmental stewardship<\/strong>}.<\/p><\/blockquote>\n<ul><li>Aria가 제안한 것 = <strong>공동체 정원<\/strong> = 신선한 농산물을 기르며 <strong>환경 관리 책임을 배우는<\/strong> 지속가능한 안식처 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>[With the support of her neighbors], Aria <strong>transformed<\/strong> an unused plot of land <strong>into<\/strong> a thriving garden, <strong>utilizing eco-friendly practices such as composting and rainwater harvesting<\/strong>.<\/p><\/blockquote>\n<ul><li>사용한 친환경 방법 = <strong>퇴비화(composting)<\/strong> 와 <strong>빗물 수집(rainwater harvesting)<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>📌 문장비교 (강의록 원문)<\/strong><\/p>\n<blockquote><p>* With her neighbors' <strong>help<\/strong>, Aria <strong>changed<\/strong> an <strong>empty<\/strong> piece of land <strong>into<\/strong> a <strong>busy<\/strong> garden. They used <strong>natural ways<\/strong> like <strong>making<\/strong> compost and <strong>saving<\/strong> rainwater to take care of the garden.<\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>원문 표현<\/th><th>쉬운 표현<\/th><\/tr><\/thead><tbody><tr><td><code>with the support of ~<\/code><\/td><td><code>with ~'s help<\/code><\/td><\/tr><tr><td><code>transformed A into B<\/code><\/td><td><code>changed A into B<\/code><\/td><\/tr><tr><td><code>an unused plot of land<\/code><\/td><td><code>an empty piece of land<\/code><\/td><\/tr><tr><td><code>a thriving garden<\/code><\/td><td><code>a busy garden<\/code><\/td><\/tr><tr><td><code>eco-friendly practices<\/code><\/td><td><code>natural ways<\/code><\/td><\/tr><tr><td><code>composting<\/code><\/td><td><code>making compost<\/code><\/td><\/tr><tr><td><code>rainwater harvesting<\/code><\/td><td><code>saving rainwater<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What does the word \"<strong>granting<\/strong>\" mean in the sentence \"the tree possessed magical powers, granting those who gathered beneath its branches the ability to understand and share the feelings of others\"?<\/li><\/ol>\n<p>a) Denying <strong>b) Giving<\/strong> ✅ c) al of making the world better. ② 조화의 나무 the tree of harmony 100p.~101p. ⭐⭐⭐ at the heart of harmony haven stood a towering tree, known as the tree of harmony . legend had it {that the tree possessed magical powers , granting those who gathered beneath its branches the ability to understand and share the feelings of others }. 나무의 힘 = 그 아래 모인 이들에게 타인의 감정을 이해하고 공유하는 능력을 부여 = 공감 능력 ⭐⭐⭐ ⚠️ legend had it that ~ = 전설에 따르면 - \"사실이다\"도 \"입증되었다\"도 아니다 연습문제로 직접 출제 ⭐⭐⭐ ⚠️ granting = giving 주는 것 - denying/blocking/stopping이 아니다 연습문제로 직접 출제 ⭐⭐⭐ at the heart of ~ stood ~ = 도치 구문 장소 부사구가 앞에 오면 주어·동사가 도치 ⭐⭐ ③ 저녁의 모임 100p.~101p. every evening, villagers would gather around the tree, sharing stories of their joys and sorrows, triumphs and challenges. through these communal gatherings , harmony flourished , forging deep connections among neighbors and fostering a sense of belonging. 공동 모임의 결과 = 조화의 융성 + 이웃 간 깊은 유대 + 소속감 조성 ⭐⭐ would = 과거의 반복적 습관 ⭐⭐ \"~하곤 했다\" 분사구문 3연속: sharing … forging … fostering ⭐⭐ ④ 새로 온 사람 - aria 102p.~103p. ⭐⭐⭐ one day, a newcomer arrived in harmony haven. her name was aria , and she came from a distant land plagued by inequality and injustice . determined to find a place {where she could make a difference } , aria was drawn to the village's reputation for embracing diversity and promoting equality . aria의 출신 = 불평등과 부정의로 시달리는 먼 땅 ⭐⭐⭐ 마을에 이끌린 이유 = 다양성을 포용하고 평등을 증진한다는 평판 ⭐⭐⭐ 연습문제로 직접 출제 - \"싫어했다/피했다/혼란스러웠다\"는 모두 오답 { as she settled into her new home}, aria was welcomed with open arms by the villagers, {who recognized her passion for social justice and empowerment }. ⚠️ welcomed with open arms = 마을 사람들이 기쁘게 받아들였다 연습문제로 직접 출제 ⭐⭐⭐ ⑤ 공동체 정원 103p.~104p. ⭐⭐⭐ driven by her desire to contribute to the community , aria proposed the development of a community garden-a sustainable oasis {where villagers could cultivate fresh produce while learning about environmental stewardship }. aria가 제안한 것 = 공동체 정원 = 신선한 농산물을 기르며 환경 관리 책임을 배우는 지속가능한 안식처 ⭐⭐⭐ with the support of her neighbors , aria transformed an unused plot of land into a thriving garden, utilizing eco friendly practices such as composting and rainwater harvesting . 사용한 친환경 방법 = 퇴비화 composting 와 빗물 수집 rainwater harvesting ⭐⭐⭐ 📌 문장비교 강의록 원문 with her neighbors' help , aria changed an empty piece of land into a busy garden. they used natural ways like making compost and saving rainwater to take care of the garden. 원문 표현 쉬운 표현 with the support of ~ with ~'s help transformed a into b changed a into b an unused plot of land an empty piece of land a thriving garden a busy garden eco friendly practices natural ways composting making compost rainwater harvesting saving rainwater 2. 연습문제 강의록 원문 1. what does the word \" granting \" mean in the sentence \"the tree possessed magical powers, granting those who gathered beneath its branches the ability to understand and share the feelings of others\"? a denying b giving ✅ c blocking d stopping 2. which word best replaces \" quaint \" in the sentence? - \"in a quaint village nestled between rolling hills and lush forests...\" a large b old fashioned ✅ c busy d noisy 3. which of the following is the correct meaning of the sentence \" legend had it that the tree possessed magical powers\"? a it is a fact that the tree had magical powers. b the tree might have had magical powers. c according to the legend, the tree had magical powers. ✅ d it was proven that the tree had magical powers. 4. what does the phrase \" welcomed with open arms \" mean in the sentence \"aria was welcomed with open arms by the villagers\"? a the villagers did not trust aria. b the villagers were happy to accept aria. ✅ c the villagers ignored aria. d the villagers rejected aria. 5. which of the following best rephrases the sentence \"aria was drawn to the village's reputation for embracing diversity and promoting equality\"? a aria disliked the village's focus on diversity and equality. b aria was attracted to the village because of its values of diversity and equality. ✅ c aria avoided the village because of its strict rules on diversity. d aria was confused by the village's reputation for promoting equality. 핵심 정리 📌 7개 개념이 이 단원의 뼈대 - empathy · equality · sustainability · critical thinking · resilience · global citizenship · empowerment. 제목의 \"7 concepts\"가 그대로 이 목록이고, 12강에서 이 개념들이 하나씩 사건으로 구현된다. 📌 11강 연습문제 5개가 전부 \"표현의 뜻\"을 묻는다 - 내용 이해가 아니라 어구 해석 이 시험 형태다. 표현 뜻 오답 미끼 granting giving 주는 것 denying / blocking / stopping quaint old fashioned 예스러운 large / busy / noisy legend had it that ~ 전설에 따르면 ~ \"사실이다\" / \"입증되었다\" welcomed with open arms 기쁘게 받아들였다 불신 / 무시 / 거부 was drawn to ~ ~에 이끌렸다 싫어함 / 피함 / 혼란스러움 오답은 항상 정반대 뜻 이거나 어조를 뒤집은 것 이다 ⚠️ 📌 aria의 서사 = 대비 구조 - 떠나온 땅 불평등·부정의 ↔ 도착한 마을 다양성 포용·평등 증진 . \"왜 이 마을에 끌렸는가\"의 답은 언제나 이 대비에서 나온다. 📌 정원 = 7개 개념의 실천 - 지속가능성 sustainability 과 환경 관리 stewardship 를 퇴비화·빗물 수집 이라는 구체적 행위로 보여준다. 추상 개념과 구체 행위를 짝지어 외운다. 📌 문법 3종 - ① 도치 at the heart of ~ stood a tree ② 과거의 습관 would ③ 연속 분사구문 sharing / forging / fostering . 모두 본문 한 단락에 몰려 있다. 시험 대비 포인트 ⭐⭐⭐ 마을이 구현한 7개 개념 목록 ⭐⭐⭐ granting = giving, quaint = old fashioned ⭐⭐⭐ legend had it that ~ = 전설에 따르면 사실 주장이 아님 ⭐⭐⭐ welcomed with open arms = 기쁘게 받아들였다 ⭐⭐⭐ was drawn to ~ = ~에 이끌렸다 마을의 다양성·평등 평판 때문 ⭐⭐⭐ aria의 출신지 = 불평등과 부정의로 시달리는 먼 땅 ⭐⭐⭐ aria가 제안한 것 = 공동체 정원 퇴비화·빗물 수집 ⭐⭐ 조화의 나무가 준 능력 = 타인의 감정을 이해하고 공유하는 능력 ⭐⭐ 마을이 번성한 이유 = 상호연결성 + 더 나은 세상을 향한 공동의 헌신 ⭐⭐ 저녁 모임의 결과 = 조화 융성 · 깊은 유대 · 소속감 ⭐ 도치 구문 at the heart of ~ stood ~ ⭐ 과거의 반복 습관 would gather ⭐ 쉬운 표현 치환 transformed→changed, unused plot→empty piece, thriving→busy "}, {"id": 12, "title": "The Village of Harmony Haven: 7 Concepts (2)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>initiative<\/strong><\/td><td><strong>주도, 솔선<\/strong><\/td><\/tr><tr><td><strong>address<\/strong><\/td><td>(문제를) <strong>다루다, 해결하다<\/strong> (= solve) ⚠️ ignore/avoid/create가 아니다<\/td><\/tr><tr><td><strong>advocate for ~<\/strong><\/td><td><strong>~을 옹호하다, 주장하다<\/strong><\/td><\/tr><tr><td><strong>marginalized voices<\/strong><\/td><td><strong>소외된 목소리<\/strong> - 자주 무시되거나 대표되지 못하는 사람들<\/td><\/tr><tr><td><strong>decision-making processes<\/strong><\/td><td><strong>의사결정 과정<\/strong><\/td><\/tr><tr><td><strong>collective action<\/strong><\/td><td><strong>집단 행동<\/strong><\/td><\/tr><tr><td><strong>aspirations<\/strong><\/td><td><strong>열망, 포부<\/strong><\/td><\/tr><tr><td><strong>tangible outcomes<\/strong><\/td><td><strong>가시적(실질적) 성과<\/strong><\/td><\/tr><tr><td><strong>lay the groundwork for ~<\/strong><\/td><td><strong>~의 토대를 놓다<\/strong><\/td><\/tr><tr><td><strong>equitable and inclusive<\/strong><\/td><td><strong>공정하고 포용적인<\/strong><\/td><\/tr><tr><td><strong>immune to ~<\/strong><\/td><td><strong>~에 면역인, ~의 영향을 받지 않는<\/strong><\/td><\/tr><tr><td><strong>adversity<\/strong><\/td><td><strong>역경<\/strong><\/td><\/tr><tr><td><strong>devastating<\/strong><\/td><td><strong>파괴적인<\/strong><\/td><\/tr><tr><td><strong>wither<\/strong><\/td><td><strong>시들다, 시들게 하다<\/strong><\/td><\/tr><tr><td><strong>deplete<\/strong><\/td><td><strong>고갈시키다<\/strong><\/td><\/tr><tr><td><strong>rally together<\/strong><\/td><td><strong>함께 결집하다<\/strong><\/td><\/tr><tr><td><strong>draw upon ~<\/strong><\/td><td><strong>~을 이용하다, ~에 의지하다<\/strong> (강의록 주석)<\/td><\/tr><tr><td><strong>resilience / ingenuity<\/strong><\/td><td><strong>회복력 / 독창성<\/strong><\/td><\/tr><tr><td><strong>weather<\/strong> (동사)<\/td><td>(위기를) <strong>견뎌내다, 이겨내다<\/strong> ⚠️ 명사 \"날씨\"가 아니다<\/td><\/tr><tr><td><strong>remarkable<\/strong><\/td><td><strong>놀라운, 주목할 만한<\/strong><\/td><\/tr><tr><td><strong>spread far and wide<\/strong><\/td><td><strong>널리 퍼지다<\/strong><\/td><\/tr><tr><td><strong>embrace<\/strong><\/td><td><strong>포용하다<\/strong><\/td><\/tr><tr><td><strong>fellow global citizens<\/strong><\/td><td><strong>동료 세계시민<\/strong><\/td><\/tr><tr><td><strong>just and sustainable<\/strong><\/td><td><strong>정의롭고 지속가능한<\/strong><\/td><\/tr><tr><td><strong>beacon of hope<\/strong><\/td><td><strong>희망의 등대<\/strong><\/td><\/tr><tr><td><strong>in pursuit of ~<\/strong><\/td><td><strong>~을 추구하여<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 104p.~109p.)<\/h4>\n<p><strong>① Aria의 주도가 퍼지다<\/strong> (104p.~105p.) ⭐⭐⭐<\/p>\n<blockquote><p>[Inspired by Aria's <strong>initiative<\/strong>], villagers began to explore new ways [to <strong>address<\/strong> local challenges], <strong>from<\/strong> organizing educational workshops on critical thinking <strong>to advocating for greater representation of marginalized voices<\/strong> in village <strong>decision-making processes<\/strong>.<\/p><\/blockquote>\n<ul><li>마을 사람들의 새로운 시도 두 갈래 (<code>from A to B<\/code> 구문) ⭐⭐⭐<\/li><li>A: <strong>비판적 사고에 관한 교육 워크숍 조직<\/strong><\/li><li>B: <strong>의사결정 과정에서 소외된 목소리의 대표성 확대 옹호<\/strong><\/li><li>⚠️ <code>address<\/code> = <strong>solve<\/strong>(해결하다) - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>⚠️ <code>marginalized voices<\/code> = <strong>자주 무시되거나 대표되지 못하는 사람들<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>[Through <strong>collective action and collaboration<\/strong>], the villagers <strong>transformed their aspirations for change into tangible outcomes<\/strong>, <strong>laying the groundwork<\/strong> for a more <strong>equitable and inclusive society<\/strong>.<\/p><\/blockquote>\n<ul><li>집단 행동과 협력 → <strong>변화의 열망을 가시적 성과로 전환<\/strong> → <strong>더 공정하고 포용적인 사회의 토대<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>② 위기 - 가뭄<\/strong> (106p.~107p.) ⭐⭐⭐<\/p>\n<blockquote><p>Yet, Harmony Haven was <strong>not immune to adversity<\/strong>. One summer, a <strong>devastating<\/strong> drought threatened to <strong>wither<\/strong> the village's crops and <strong>deplete<\/strong> its water supply.<\/p><\/blockquote>\n<ul><li>⚠️ <code>not immune to adversity<\/code> = <strong>역경의 영향을 받았다<\/strong> (= affected by difficulties)<\/li><\/ul>\n<p>\"완전히 안전했다\"가 아니다 - 연습문제로 직접 출제 ⭐⭐⭐<\/p>\n<ul><li>📌 강의록 쉬운 풀이: *Even though Harmony Haven was a good place, it still had problems.<\/li><\/ul>\n<p>One summer, a big drought made it hard to grow food and find enough water.*<\/p>\n<blockquote><p>[<strong>Faced<\/strong> with this crisis], the villagers <strong>rallied together<\/strong>, [<strong>drawing upon their resilience and ingenuity<\/strong> to find solutions].<\/p><\/blockquote>\n<ul><li>⚠️ <code>drawing upon their resilience and ingenuity<\/code> = <strong>자신들의 회복력과 독창성을 사용하는 것<\/strong><\/li><\/ul>\n<p>(무시/망각/포기가 아니다) - 연습문제로 직접 출제 ⭐⭐⭐<\/p>\n<ul><li>ℹ️ 강의록 주석: <strong>draw upon<\/strong> = 이용하다, 의지하다<\/li><\/ul>\n<blockquote><p>[Through a combination of <strong>water conservation measures, community support networks, and innovative agricultural techniques<\/strong>], they managed to <strong>weather the drought<\/strong> and <strong>emerge stronger than ever<\/strong>.<\/p><\/blockquote>\n<ul><li>가뭄 극복의 세 수단 = <strong>물 절약 조치 · 공동체 지원망 · 혁신적 농업 기법<\/strong> ⭐⭐⭐<\/li><li>⚠️ <code>weather<\/code>가 <strong>동사<\/strong>로 \"이겨내다\"의 뜻 ⭐⭐<\/li><\/ul>\n<p><strong>③ 명성의 확산과 방문객<\/strong> (107p.~108p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Meanwhile<\/strong>, word of Harmony Haven's <strong>remarkable<\/strong> achievements <strong>spread far and wide<\/strong>, attracting visitors from <strong>distant lands<\/strong> {who sought to learn from the village's example}.<\/p><\/blockquote>\n<ul><li>📌 쉬운 풀이: *At the same time, news about Harmony Haven's success spread to many places. People from far away came to learn from the village.*<\/li><\/ul>\n<blockquote><p>[<strong>Eager to share<\/strong> their knowledge and experiences], the villagers welcomed these newcomers <strong>with open arms<\/strong>, <strong>embracing them as fellow global citizens<\/strong> [united by <strong>a common vision of a more just and sustainable world<\/strong>].<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ 이 문장의 요지 = <strong>마을 사람들은 새로 온 이들을 더 나은 세상이라는 공동 목표를 나누는 일원으로 여겼다<\/strong><\/li><\/ul>\n<p>(의견 충돌·거부·자기 비전만 고집은 모두 오답) - 연습문제로 직접 출제<\/p>\n<ul><li>📌 쉬운 풀이: *The villagers were happy to share what they knew and welcomed these new visitors warmly.<\/li><\/ul>\n<p>They saw them as part of the global community, all working towards the same goal of creating a fair and sustainable world.*<\/p>\n<ul><li><code>welcomed with open arms<\/code>가 11강(Aria)에 이어 <strong>2회 반복<\/strong> ⭐ (출제 신호)<\/li><\/ul>\n<p><strong>④ 결말 - 7개 개념의 확인<\/strong> (108p.~109p.) ⭐⭐⭐<\/p>\n<blockquote><p>{<strong>As<\/strong> the years passed}, Harmony Haven continued to <strong>thrive<\/strong>, its residents living in harmony with one another and the <strong>eco-friendly<\/strong> world.<\/p><\/blockquote>\n<blockquote><p>[Under the shade of the Tree of Harmony], <strong>generations<\/strong> gathered to celebrate their <strong>shared values of empathy, equality, sustainability, critical thinking, resilience, global citizenship, and empowerment<\/strong>.<\/p><\/blockquote>\n<ul><li>📌 11강 서두의 <strong>7개 개념이 마지막에 그대로 되풀이<\/strong>되며 수미상관을 이룬다 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>And {<strong>though<\/strong> the challenges of the world beyond its borders <strong>remained ever-present<\/strong>}, the village stood as <strong>a beacon of hope<\/strong>-a shining example of {what is possible when people come together <strong>in pursuit of a brighter future for all<\/strong>}.<\/p><\/blockquote>\n<ul><li>마을의 최종 위상 = <strong>희망의 등대<\/strong>, 사람들이 함께 모일 때 무엇이 가능한지 보여주는 빛나는 사례<\/li><li>⚠️ 바깥 세상의 도전은 <strong>여전히 존재한다<\/strong>(remained ever-present) - 낙관 일변도가 아님<\/li><\/ul>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<ol><li>Which word could best replace \"<strong>address<\/strong>\" in \"villagers began to explore new ways to address local challenges\"?<\/li><\/ol>\n<p>a) Ignore <strong>b) Solve<\/strong> ✅ c) Avoid d) Create<\/p>\n<ol><li>What does the phrase \"<strong>not immune to adversity<\/strong>\" mean in \"Yet, Harmony Haven was not immune to adversity\"?<\/li><\/ol>\n<p>a) Completely safe from challenges b) Easily defeated by challenges c) Unable to resist challenges <strong>d) Affected by difficulties<\/strong> ✅<\/p>\n<ol><li>In \"advocating for greater representation of <strong>marginalized voices<\/strong>,\" what does \"marginalized voices\" refer to?<\/li><\/ol>\n<p>a) People who have strong influence in the village. <strong>b) People who are often ignored or underrepresented.<\/strong> ✅ c) People who make decisions for the village. d) People who are satisfied with the village's current state.<\/p>\n<ol><li>What does \"<strong>drawing upon their resilience and ingenuity<\/strong>\" mean in \"the villagers rallied together, drawing upon their resilience and ingenuity to find solutions\"?<\/li><\/ol>\n<p>a) Ignoring their strength and creativity <strong>b) Using their strength and creativity<\/strong> ✅ c) Forgetting their strength and creativity d) Giving up on their strength and creativity<\/p>\n<ol><li>What is the main idea of \"<strong>embracing them as fellow global citizens united by a common vision of a more just and sustainable world<\/strong>\"?<\/li><\/ol>\n<p><strong>a) The villagers saw the newcomers as part of a shared goal for a better world.<\/strong> ✅ b) The villagers and newcomers disagreed about their goals. c) The villagers rejected the newcomers' ideas. d) The villagers only focused on their own vision for the world.<\/p>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>12강도 연습문제 5개가 전부 어구 해석<\/strong> - 11강과 완전히 같은 형태다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>표현<\/th><th>뜻<\/th><th>오답 미끼<\/th><\/tr><\/thead><tbody><tr><td><code>address<\/code> (동사)<\/td><td>solve (해결하다)<\/td><td>ignore / avoid / create<\/td><\/tr><tr><td><code>not immune to adversity<\/code><\/td><td>역경의 영향을 받았다<\/td><td>\"완전히 안전했다\"<\/td><\/tr><tr><td><code>marginalized voices<\/code><\/td><td>무시·과소대표되는 사람들<\/td><td>영향력 큰 사람 / 결정권자<\/td><\/tr><tr><td><code>drawing upon ~<\/code><\/td><td>~을 사용하는 것<\/td><td>무시 / 망각 / 포기<\ y haven was a good place, it still had problems. one summer, a big drought made it hard to grow food and find enough water. faced with this crisis , the villagers rallied together , drawing upon their resilience and ingenuity to find solutions . ⚠️ drawing upon their resilience and ingenuity = 자신들의 회복력과 독창성을 사용하는 것 무시/망각/포기가 아니다 - 연습문제로 직접 출제 ⭐⭐⭐ ℹ️ 강의록 주석: draw upon = 이용하다, 의지하다 through a combination of water conservation measures, community support networks, and innovative agricultural techniques , they managed to weather the drought and emerge stronger than ever . 가뭄 극복의 세 수단 = 물 절약 조치 · 공동체 지원망 · 혁신적 농업 기법 ⭐⭐⭐ ⚠️ weather 가 동사 로 \"이겨내다\"의 뜻 ⭐⭐ ③ 명성의 확산과 방문객 107p.~108p. ⭐⭐⭐ meanwhile , word of harmony haven's remarkable achievements spread far and wide , attracting visitors from distant lands {who sought to learn from the village's example}. 📌 쉬운 풀이: at the same time, news about harmony haven's success spread to many places. people from far away came to learn from the village. eager to share their knowledge and experiences , the villagers welcomed these newcomers with open arms , embracing them as fellow global citizens united by a common vision of a more just and sustainable world . ⭐⭐⭐ 이 문장의 요지 = 마을 사람들은 새로 온 이들을 더 나은 세상이라는 공동 목표를 나누는 일원으로 여겼다 의견 충돌·거부·자기 비전만 고집은 모두 오답 - 연습문제로 직접 출제 📌 쉬운 풀이: the villagers were happy to share what they knew and welcomed these new visitors warmly. they saw them as part of the global community, all working towards the same goal of creating a fair and sustainable world. welcomed with open arms 가 11강 aria 에 이어 2회 반복 ⭐ 출제 신호 ④ 결말 - 7개 개념의 확인 108p.~109p. ⭐⭐⭐ { as the years passed}, harmony haven continued to thrive , its residents living in harmony with one another and the eco friendly world. under the shade of the tree of harmony , generations gathered to celebrate their shared values of empathy, equality, sustainability, critical thinking, resilience, global citizenship, and empowerment . 📌 11강 서두의 7개 개념이 마지막에 그대로 되풀이 되며 수미상관을 이룬다 ⭐⭐⭐ and { though the challenges of the world beyond its borders remained ever present }, the village stood as a beacon of hope -a shining example of {what is possible when people come together in pursuit of a brighter future for all }. 마을의 최종 위상 = 희망의 등대 , 사람들이 함께 모일 때 무엇이 가능한지 보여주는 빛나는 사례 ⚠️ 바깥 세상의 도전은 여전히 존재한다 remained ever present - 낙관 일변도가 아님 2. 연습문제 강의록 원문 1. which word could best replace \" address \" in \"villagers began to explore new ways to address local challenges\"? a ignore b solve ✅ c avoid d create 2. what does the phrase \" not immune to adversity \" mean in \"yet, harmony haven was not immune to adversity\"? a completely safe from challenges b easily defeated by challenges c unable to resist challenges d affected by difficulties ✅ 3. in \"advocating for greater representation of marginalized voices ,\" what does \"marginalized voices\" refer to? a people who have strong influence in the village. b people who are often ignored or underrepresented. ✅ c people who make decisions for the village. d people who are satisfied with the village's current state. 4. what does \" drawing upon their resilience and ingenuity \" mean in \"the villagers rallied together, drawing upon their resilience and ingenuity to find solutions\"? a ignoring their strength and creativity b using their strength and creativity ✅ c forgetting their strength and creativity d giving up on their strength and creativity 5. what is the main idea of \" embracing them as fellow global citizens united by a common vision of a more just and sustainable world \"? a the villagers saw the newcomers as part of a shared goal for a better world. ✅ b the villagers and newcomers disagreed about their goals. c the villagers rejected the newcomers' ideas. d the villagers only focused on their own vision for the world. 핵심 정리 📌 12강도 연습문제 5개가 전부 어구 해석 - 11강과 완전히 같은 형태다. 표현 뜻 오답 미끼 address 동사 solve 해결하다 ignore / avoid / create not immune to adversity 역경의 영향을 받았다 \"완전히 안전했다\" marginalized voices 무시·과소대표되는 사람들 영향력 큰 사람 / 결정권자 drawing upon ~ ~을 사용하는 것 무시 / 망각 / 포기 embracing them as fellow global citizens 공동 목표를 나누는 일원으로 봄 의견 충돌 / 거부 ⚠️ 특히 not immune to 는 이중부정처럼 읽히는 함정 이다. \"면역이 아니다 = 영향을 받는다\". 📌 이야기의 3단 구조 - 11·12강을 하나로 묶으면 다음과 같다. 📌 위기 극복의 세 수단을 묶어 외운다 - 물 절약 조치 · 공동체 지원망 · 혁신적 농업 기법. 여기에 쓰인 인간적 자원이 resilience 회복력 와 ingenuity 독창성 이고, 둘 다 7개 개념 중 하나 resilience 와 이어진다. 📌 수미상관 - 11강 서두에 나열된 7개 개념이 12강 결말에서 그대로 반복된다. \"이 단원의 주제어 7개\"를 묻는 문항은 어느 쪽 문장으로도 출제될 수 있다 ⭐⭐⭐ 📌 weather는 동사 - \"날씨\"가 아니라 위기를 견뎌내다 . weather the drought 가 그 예다 ⚠️ 시험 대비 포인트 ⭐⭐⭐ address = solve, not immune to adversity = 영향을 받았다 ⭐⭐⭐ marginalized voices = 자주 무시되거나 대표되지 못하는 사람들 ⭐⭐⭐ drawing upon their resilience and ingenuity = 회복력과 독창성을 사용함 ⭐⭐⭐ 방문객을 \"동료 세계시민\"으로 포용한다는 문장의 요지 ⭐⭐⭐ 7개 개념 empathy·equality·sustainability·critical thinking·resilience·global citizenship·empowerment 재확인 ⭐⭐ aria의 주도로 시작된 두 활동 비판적 사고 워크숍 / 소외된 목소리의 대표성 옹호 ⭐⭐ 가뭄 극복 세 수단 물 절약 · 공동체 지원망 · 혁신적 농업 기법 ⭐⭐ 집단 행동 → 열망을 가시적 성과로 → 공정하고 포용적인 사회의 토대 ⭐⭐ weather 의 동사 용법 견뎌내다 ⭐ 마을의 최종 위상 = beacon of hope 희망의 등대 ⭐ from a to b 병렬 구문, though ~ remained ever present 양보절 "}, {"id": 13, "title": "The Canvas of Creativity: Navigating the Ecosystem of Infinite Inspiration (1)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>bustling metropolis<\/strong><\/td><td><strong>분주한 대도시<\/strong><\/td><\/tr><tr><td><strong>realm<\/strong><\/td><td><strong>영역, 왕국<\/strong><\/td><\/tr><tr><td><strong>pulsating<\/strong><\/td><td><strong>고동치는, 약동하는<\/strong><\/td><\/tr><tr><td><strong>ecosystem<\/strong><\/td><td><strong>생태계<\/strong> - 이 단원의 핵심 비유<\/td><\/tr><tr><td><strong>teeming with ~<\/strong><\/td><td><strong>~로 가득한, 우글거리는<\/strong><\/td><\/tr><tr><td><strong>surpass<\/strong><\/td><td><strong>넘어서다, 능가하다<\/strong><\/td><\/tr><tr><td><strong>testament to ~<\/strong><\/td><td><strong>~의 증거<\/strong><\/td><\/tr><tr><td><strong>static<\/strong><\/td><td><strong>정적인, 변하지 않는<\/strong> (= unchanging) ⚠️ moving/quiet/temporary가 아니다<\/td><\/tr><tr><td><strong>showcase<\/strong><\/td><td><strong>전시장, 진열대<\/strong><\/td><\/tr><tr><td><strong>relish<\/strong><\/td><td><strong>즐기다, 만끽하다<\/strong><\/td><\/tr><tr><td><strong>a handful of ~<\/strong><\/td><td><strong>소수의 ~<\/strong><\/td><\/tr><tr><td><strong>command the attention of ~<\/strong><\/td><td><strong>~의 관심을 사로잡다<\/strong> (4강의 <code>command<\/code> 다의어와 연결)<\/td><\/tr><tr><td><strong>coexist<\/strong><\/td><td><strong>공존하다<\/strong><\/td><\/tr><tr><td><strong>budding artist<\/strong><\/td><td><strong>신예(막 싹트는) 화가<\/strong><\/td><\/tr><tr><td><strong>be drawn into ~<\/strong><\/td><td><strong>~에 (의도치 않게) 빠져들다<\/strong><\/td><\/tr><tr><td><strong>modest<\/strong><\/td><td><strong>소박한, 대단하지 않은<\/strong><\/td><\/tr><tr><td><strong>tucked away<\/strong><\/td><td><strong>감추어진, 구석에 있는<\/strong> (강의록 주석)<\/td><\/tr><tr><td><strong>vast expanse<\/strong><\/td><td><strong>광대한 펼쳐짐<\/strong><\/td><\/tr><tr><td><strong>outlet<\/strong><\/td><td>(감정·재능의) <strong>배출구, 표현 수단<\/strong><\/td><\/tr><tr><td><strong>kaleidoscope<\/strong><\/td><td><strong>만화경<\/strong> - 여기서는 \"다채로운 집합\"<\/td><\/tr><tr><td><strong>tapestry<\/strong><\/td><td><strong>태피스트리<\/strong> - 여기서는 \"풍성하게 짜인 총체\"<\/td><\/tr><tr><td><strong>envelop<\/strong><\/td><td><strong>감싸다<\/strong><\/td><\/tr><tr><td><strong>solitude<\/strong><\/td><td><strong>고독<\/strong><\/td><\/tr><tr><td><strong>ambitious<\/strong><\/td><td><strong>야심 있는, 강한 목표·꿈을 가진<\/strong><\/td><\/tr><tr><td><strong>perspectives<\/strong><\/td><td><strong>관점<\/strong><\/td><\/tr><tr><td><strong>onlooker<\/strong><\/td><td><strong>구경꾼<\/strong><\/td><\/tr><tr><td><strong>absorb<\/strong><\/td><td><strong>흡수하다<\/strong> (여기서는 \"조용히 배우다\")<\/td><\/tr><tr><td><strong>mentorship<\/strong><\/td><td><strong>멘토십, 지도<\/strong><\/td><\/tr><tr><td><strong>foster / flourish<\/strong><\/td><td><strong>조성하다 / 융성하다<\/strong> (11강 반복 ⭐)<\/td><\/tr><tr><td><strong>build upon the foundation laid by others<\/strong><\/td><td><strong>남이 놓은 토대 위에 쌓아 올리다<\/strong><\/td><\/tr><tr><td><strong>delineate and demarcate<\/strong><\/td><td><strong>구분하다 / 경계를 명확히 하다<\/strong> (강의록 주석)<\/td><\/tr><tr><td><strong>derivative works<\/strong><\/td><td><strong>파생 저작물<\/strong><\/td><\/tr><tr><td><strong>plagiarism<\/strong><\/td><td><strong>표절<\/strong><\/td><\/tr><tr><td><strong>nuanced<\/strong><\/td><td><strong>미묘한, 세밀한<\/strong><\/td><\/tr><tr><td><strong>stifle<\/strong><\/td><td><strong>억누르다, 질식시키다<\/strong><\/td><\/tr><tr><td><strong>ethical bounds<\/strong><\/td><td><strong>윤리적 범위<\/strong><\/td><\/tr><tr><td><strong>constraint<\/strong><\/td><td><strong>제약<\/strong> ⚠️ <code>guideline<\/code>(지침)과 대비<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 125p.~132p.)<\/h4>\n<p><strong>① 창작 생태계의 규모<\/strong> (125p.~126p.) ⭐⭐⭐<\/p>\n<blockquote><p>[In the heart of <strong>a bustling metropolis<\/strong>], there existed a <strong>realm<\/strong> [<strong>pulsating<\/strong> with creative energy]-an <strong>ecosystem<\/strong> [<strong>teeming<\/strong> with creators and visitors]. In this vibrant space, the number of <strong>NeoTube channels surpassed 7 billion by the year 2030<\/strong>, [a <strong>testament<\/strong> to the explosive growth of the creative landscape].<\/p><\/blockquote>\n<ul><li>숫자 두 개 ⭐⭐⭐ - <strong>NeoTube 채널 70억 개<\/strong>, <strong>2030년까지<\/strong><\/li><li>📌 쉬운 풀이: *In the middle of a busy city, there was a place full of creative energy.<\/li><\/ul>\n<p>This place was like a living system with many creators and visitors. By 2030, the number of NeoTube channels grew to over 7 billion, showing how fast the creative world was growing.*<\/p>\n<blockquote><p>It was <strong>not a static market or a showcase but a living, breathing community<\/strong> {where individuals, [<strong>from<\/strong> those <strong>relishing<\/strong> quiet hobbies with a handful of friends <strong>to<\/strong> those <strong>commanding the attention of over a million subscribers<\/strong>], <strong>coexisted and thrived<\/strong>}.<\/p><\/blockquote>\n<ul><li>⚠️ <code>static<\/code> = <strong>unchanging<\/strong>(변하지 않는) - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li><code>not A but B<\/code> 구문: 정적인 시장/전시장이 <strong>아니라<\/strong> 살아 숨 쉬는 <strong>공동체<\/strong> ⭐⭐⭐<\/li><li><code>from A to B<\/code> 병렬: <strong>소수의 친구와 조용한 취미를 즐기는 이<\/strong> ~ <strong>100만 구독자의 관심을 사로잡는 이<\/strong><\/li><\/ul>\n<p><strong>② Shynne의 등장<\/strong> (127p.~128p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Shynne<\/strong>, [a <strong>budding<\/strong> artist], <strong>found herself drawn into<\/strong> this dynamic world. Her <strong>modest<\/strong> NeoTube channel, [<strong>tucked away<\/strong> amidst the <strong>vast expanse<\/strong> of creative endeavors], began as a simple <strong>outlet<\/strong> for her <strong>passion for painting<\/strong>.<\/p><\/blockquote>\n<ul><li>⚠️ <code>found herself drawn into<\/code> = <strong>계획하지 않았는데 그 세계에 발을 들이게 되었다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>Shynne의 채널은 <strong>그림에 대한 열정을 나누는 단순한 창구<\/strong>로 시작 ⭐⭐<\/li><\/ul>\n<blockquote><p>{<strong>As<\/strong> she navigated through the ecosystem}, she discovered a <strong>kaleidoscope<\/strong> of diverse talents and ideas, [each contributing to the rich <strong>tapestry<\/strong> of creativity {that <strong>enveloped<\/strong> the platform}].<\/p><\/blockquote>\n<p><strong>③ 함께한 방문객들<\/strong> (128p.~129p.) ⭐⭐⭐<\/p>\n<blockquote><p>Shynne's journey was <strong>not one of solitude<\/strong>. [Alongside her] were <strong>ambitious<\/strong> visitors, [<strong>drawn to<\/strong> the ecosystem with dreams of sharing their unique <strong>perspectives<\/strong> and contributions].<\/p><\/blockquote>\n<ul><li>⚠️ <code>ambitious<\/code> = <strong>강한 목표나 꿈을 가진<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>Some were <strong>shy onlookers<\/strong>, [<strong>silently absorbing<\/strong> the creative energies], {<strong>while<\/strong> others were already preparing their content, [eager to join the ranks of creators <strong>leaving their mark on the digital canvas<\/strong>]}.<\/p><\/blockquote>\n<ul><li>⚠️ <code>silently absorbing<\/code> = <strong>창작 환경에서 조용히 배우고 있었다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>방문객의 두 부류 ⭐⭐⭐<\/li><\/ul>\n<pre class=\"cb\"><code class=\"lang-text\">① shy onlookers        조용히 창작 에너지를 흡수 (관찰)\n② 이미 콘텐츠를 준비 중  창작자 대열에 합류하려 함 (실행)<\/code><\/pre>\n<p><strong>④ 영감과 멘토십의 생태계<\/strong> (129p.~131p.) ⭐⭐⭐<\/p>\n<blockquote><p>The ecosystem was a place of both <strong>inspiration and mentorship<\/strong>. Creators <strong>freely shared<\/strong> tips, tricks, and insights, [<strong>fostering<\/strong> an environment {where creativity <strong>flourished<\/strong>}]. <strong>It wasn't just about copying; it was about evolving ideas, [building upon the foundation laid by others, and creating something new and meaningful]<\/strong>.<\/p><\/blockquote>\n<ul><li>⚠️ <code>building upon the foundation laid by others<\/code> = <strong>남의 아이디어를 토대 삼아 새로운 것을 만드는 것<\/strong><\/li><\/ul>\n<p>(그대로 베끼기도, 무에서 시작하기도, 이전 작업을 무시하기도 아니다) - 연습문제로 직접 출제 ⭐⭐⭐<\/p>\n<ul><li>📌 쉬운 풀이: *making a space where creativity could grow. It wasn't just about copying others;<\/li><\/ul>\n<p>it was about improving ideas, using what others had done before, and making something new.*<\/p>\n<p><strong>⑤ 기술의 역할<\/strong> (129p.~131p.) ⭐⭐<\/p>\n<blockquote><p>{<strong>As<\/strong> technology advanced}, tools were developed to <strong>delineate and demarcate<\/strong> the boundary [between originals and <strong>derivative works<\/strong>], [ensuring <strong>a fair and ethical playground<\/strong> for creativity].<\/p><\/blockquote>\n<ul><li>기술이 한 일 = <strong>원작과 파생 저작물의 경계를 구분<\/strong> → 공정하고 윤리적인 창작의 장 보장 ⭐⭐⭐<\/li><li>ℹ️ 강의록 주석: <strong>delineate and demarcate<\/strong> = '구분하다'와 '경계를 명확히 하다'<\/li><\/ul>\n<p><strong>⑥ 표절 논의의 전환<\/strong> (131p.~132p.) ⭐⭐⭐<\/p>\n<blockquote><p>[In this <strong>evolving landscape<\/strong>], the debate over <strong>plagiarism transformed into a nuanced discussion<\/strong> [about <strong>the responsible use of creative works<\/strong>]. <strong>The goal was not to stifle creativity but to encourage it within ethical bounds.<\/strong><\/p><\/blockquote>\n<ul><li>표절 논의의 목표 ⭐⭐⭐ = <strong>창의성을 억누르는 것이 아니라 윤리적 범위 안에서 장려하는 것<\/strong><\/li><\/ul>\n<blockquote><p>Creators were taught the importance of avoiding plagiarism, [<strong>not as a constraint but as a guideline<\/strong> to ensure <strong>respect for the originals<\/strong>].<\/p><\/blockquote>\n<ul><li>⚠️ 표절 회피 = <strong>제약(constraint)이 아니라 지침(guideline)<\/strong> ⭐⭐⭐<\/li><li>📌 쉬운 풀이: *Creators were taught that avoiding plagiarism was <strong>not a rule to limit them<\/strong>,<\/li><\/ul>\n<p>but <strong>a guide to help them<\/strong> respect the original works of others.*<\/p>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<ol><li>In the sentence \"It was not a <strong>static<\/strong> market or a showcase but a living, breathing community,\" what does \"static\" most likely mean?<\/li><\/ol>\n<p><strong>A) Unchanging<\/strong> ✅ B) Moving C) Quiet D) Temporary<\/p>\n<ol><li>In the sentence \"<strong>Ambitious<\/strong> visitors, drawn to the ecosystem,\" what does the word \"ambitious\" mean?<\/li><\/ol>\n<p>A) Shy <strong>B) Having strong goals or dreams<\/strong> ✅ C) Lazy D) Scared<\/p>\n<ol><li>What does the phrase \"<strong>found herself drawn into<\/strong>\" mean in \"Shynne, a budding artist, found herself drawn into this dynamic world\"?<\/li><\/ol>\n<p>A) She created the dynamic world. B) She tried to avoid the dynamic world. <strong>C) She became involved in the dynamic world without planning to.<\/strong> ✅ D) She built the dynamic world from scratch.<\/p>\n<ol><li>In \"Some were shy onlookers, <strong>silently absorbing<\/strong> the creative energies,\" what does \"silently absorbing\" tell us about the onlookers?<\/li><\/ol>\n<p
