ket or a showcase but a living, breathing community {where individuals, from those relishing quiet hobbies with a handful of friends to those commanding the attention of over a million subscribers , coexisted and thrived }. ⚠️ static = unchanging 변하지 않는 - 연습문제로 직접 출제 ⭐⭐⭐ not a but b 구문: 정적인 시장/전시장이 아니라 살아 숨 쉬는 공동체 ⭐⭐⭐ from a to b 병렬: 소수의 친구와 조용한 취미를 즐기는 이 ~ 100만 구독자의 관심을 사로잡는 이 ② shynne의 등장 127p.~128p. ⭐⭐⭐ shynne , a budding artist , found herself drawn into this dynamic world. her modest neotube channel, tucked away amidst the vast expanse of creative endeavors , began as a simple outlet for her passion for painting . ⚠️ found herself drawn into = 계획하지 않았는데 그 세계에 발을 들이게 되었다 - 연습문제로 직접 출제 ⭐⭐⭐ shynne의 채널은 그림에 대한 열정을 나누는 단순한 창구 로 시작 ⭐⭐ { as she navigated through the ecosystem}, she discovered a kaleidoscope of diverse talents and ideas, each contributing to the rich tapestry of creativity {that enveloped the platform} . ③ 함께한 방문객들 128p.~129p. ⭐⭐⭐ shynne's journey was not one of solitude . alongside her were ambitious visitors, drawn to the ecosystem with dreams of sharing their unique perspectives and contributions . ⚠️ ambitious = 강한 목표나 꿈을 가진 - 연습문제로 직접 출제 ⭐⭐⭐ some were shy onlookers , silently absorbing the creative energies , { while others were already preparing their content, eager to join the ranks of creators leaving their mark on the digital canvas }. ⚠️ silently absorbing = 창작 환경에서 조용히 배우고 있었다 - 연습문제로 직접 출제 ⭐⭐⭐ 방문객의 두 부류 ⭐⭐⭐ ④ 영감과 멘토십의 생태계 129p.~131p. ⭐⭐⭐ the ecosystem was a place of both inspiration and mentorship . creators freely shared tips, tricks, and insights, fostering an environment {where creativity flourished } . it wasn't just about copying; it was about evolving ideas, building upon the foundation laid by others, and creating something new and meaningful . ⚠️ building upon the foundation laid by others = 남의 아이디어를 토대 삼아 새로운 것을 만드는 것 그대로 베끼기도, 무에서 시작하기도, 이전 작업을 무시하기도 아니다 - 연습문제로 직접 출제 ⭐⭐⭐ 📌 쉬운 풀이: making a space where creativity could grow. it wasn't just about copying others; it was about improving ideas, using what others had done before, and making something new. ⑤ 기술의 역할 129p.~131p. ⭐⭐ { as technology advanced}, tools were developed to delineate and demarcate the boundary between originals and derivative works , ensuring a fair and ethical playground for creativity . 기술이 한 일 = 원작과 파생 저작물의 경계를 구분 → 공정하고 윤리적인 창작의 장 보장 ⭐⭐⭐ ℹ️ 강의록 주석: delineate and demarcate = '구분하다'와 '경계를 명확히 하다' ⑥ 표절 논의의 전환 131p.~132p. ⭐⭐⭐ in this evolving landscape , the debate over plagiarism transformed into a nuanced discussion about the responsible use of creative works . the goal was not to stifle creativity but to encourage it within ethical bounds. 표절 논의의 목표 ⭐⭐⭐ = 창의성을 억누르는 것이 아니라 윤리적 범위 안에서 장려하는 것 creators were taught the importance of avoiding plagiarism, not as a constraint but as a guideline to ensure respect for the originals . ⚠️ 표절 회피 = 제약 constraint 이 아니라 지침 guideline ⭐⭐⭐ 📌 쉬운 풀이: creators were taught that avoiding plagiarism was not a rule to limit them , but a guide to help them respect the original works of others. 2. 연습문제 강의록 원문 1. in the sentence \"it was not a static market or a showcase but a living, breathing community,\" what does \"static\" most likely mean? a unchanging ✅ b moving c quiet d temporary 2. in the sentence \" ambitious visitors, drawn to the ecosystem,\" what does the word \"ambitious\" mean? a shy b having strong goals or dreams ✅ c lazy d scared 3. what does the phrase \" found herself drawn into \" mean in \"shynne, a budding artist, found herself drawn into this dynamic world\"? a she created the dynamic world. b she tried to avoid the dynamic world. c she became involved in the dynamic world without planning to. ✅ d she built the dynamic world from scratch. 4. in \"some were shy onlookers, silently absorbing the creative energies,\" what does \"silently absorbing\" tell us about the onlookers? a they were talking a lot. b they were creating content. c they were quietly learning from the creative environment. ✅ d they were ignoring the creative energies. 5. what does the phrase \" building upon the foundation laid by others \" mean? a copying someone else's work exactly b starting from nothing and creating something new c using others' ideas as a base to create something new ✅ d ignoring previous work and doing your own thing 핵심 정리 📌 이 단원의 비유는 \"생태계 ecosystem \" - 시장 market 도 전시장 showcase 도 아닌 살아 숨 쉬는 공동체 다. 이 not a but b 대비가 단원 전체의 논지를 압축한다 ⭐⭐⭐ 📌 not a but b 구문이 세 번 반복된다 - 출제 신호다 ⭐ 위치 not a but b 생태계의 정의 a static market or a showcase a living, breathing community 창작의 본질 just copying evolving ideas, building upon others' foundation 표절 회피의 성격 a constraint 제약 a guideline 지침 세 문장 모두 \"부정되는 쪽\"이 오답 보기로 나온다 ⚠️ 📌 13강 연습문제 5개도 전부 어구 해석 - 11·12강과 동일한 형식이다. 표현 뜻 오답 미끼 static unchanging 변하지 않는 moving / quiet / temporary ambitious 강한 목표·꿈을 가진 shy / lazy / scared found herself drawn into 의도치 않게 발을 들였다 창조했다 / 피했다 / 처음부터 만들었다 silently absorbing 조용히 배우고 있었다 말을 많이 함 / 무시함 building upon the foundation laid by others 남의 아이디어를 토대로 새것 창조 그대로 베낌 / 무에서 시작 📌 숫자는 그대로 출제 후보 - neotube 채널 70억 개 , 시점 2030년 . 📌 창작 윤리의 결론 - 목표는 창의성 억압 stifle 이 아니라 윤리적 범위 안에서의 장려 . 기술은 이를 위해 원작과 파생물의 경계를 구분하는 도구 로 쓰인다. 시험 대비 포인트 ⭐⭐⭐ static = unchanging, ambitious = 강한 목표·꿈을 가진 ⭐⭐⭐ found herself drawn into = 계획 없이 발을 들이게 되었다 ⭐⭐⭐ silently absorbing = 조용히 배우고 있었다 ⭐⭐⭐ building upon the foundation laid by others = 남의 아이디어를 토대로 새것 창조 ⭐⭐⭐ 생태계의 정의 - 정적 시장/전시장이 아니라 살아 숨 쉬는 공동체 ⭐⭐⭐ 표절 회피 = 제약이 아니라 지침 ⭐⭐⭐ 표절 논의의 목표 = 창의성 억압이 아니라 윤리적 범위 내 장려 ⭐⭐ neotube 채널 70억 개 / 2030년 ⭐⭐ 기술의 역할 = 원작과 파생 저작물의 경계 구분 ⭐⭐ 방문객 두 부류 조용한 구경꾼 / 이미 콘텐츠를 준비하는 이 ⭐ shynne = budding artist, 채널은 그림 열정의 단순한 배출구로 시작 ⭐ from a to b 병렬 구문 소수의 친구 ~ 100만 구독자 "}, {"id": 14, "title": "The Canvas of Creativity: Navigating the Ecosystem of Infinite Inspiration (2)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>pivotal moment<\/strong><\/td><td><strong>결정적 순간, 전환점<\/strong><\/td><\/tr><tr><td><strong>facilitate<\/strong><\/td><td><strong>쉽게 하다, 촉진하다<\/strong> (= made easier) ⚠️ slowed down / prevented / complicated가 아니다<\/td><\/tr><tr><td><strong>alleviate<\/strong><\/td><td><strong>완화하다, 덜어주다<\/strong><\/td><\/tr><tr><td><strong>unintentional plagiarism<\/strong><\/td><td><strong>의도치 않은 표절<\/strong><\/td><\/tr><tr><td><strong>hail<\/strong><\/td><td><strong>환영하다, 칭송하다<\/strong><\/td><\/tr><tr><td><strong>idealistic utopia<\/strong><\/td><td><strong>이상적 유토피아<\/strong><\/td><\/tr><tr><td><strong>bogged down by ~<\/strong><\/td><td><strong>~에 발목 잡힌<\/strong><\/td><\/tr><tr><td><strong>legal intricacies<\/strong><\/td><td><strong>법률적 복잡성<\/strong><\/td><\/tr><tr><td><strong>skepticism<\/strong><\/td><td><strong>회의(懷疑)<\/strong><\/td><\/tr><tr><td><strong>dystopian future<\/strong><\/td><td><strong>디스토피아적 미래<\/strong> - 나쁘거나 억압적인 미래<\/td><\/tr><tr><td><strong>stifle<\/strong><\/td><td><strong>억누르다, 질식시키다<\/strong> (13강 반복 ⭐)<\/td><\/tr><tr><td><strong>automated regulations<\/strong><\/td><td><strong>자동화된 규제<\/strong><\/td><\/tr><tr><td><strong>essence<\/strong><\/td><td><strong>본질<\/strong><\/td><\/tr><tr><td><strong>unwritten rules<\/strong><\/td><td><strong>암묵적 규범, 불문율<\/strong><\/td><\/tr><tr><td><strong>voluntarily<\/strong><\/td><td><strong>자발적으로<\/strong> (= without being forced) ⚠️ \"엄격한 규칙에 따라\"가 아니다<\/td><\/tr><tr><td><strong>adhere to ~<\/strong><\/td><td><strong>~을 준수하다<\/strong><\/td><\/tr><tr><td><strong>extort profits<\/strong><\/td><td><strong>부당하게 이익을 취하다<\/strong><\/td><\/tr><tr><td><strong>delicate balance<\/strong><\/td><td><strong>미묘한 균형<\/strong><\/td><\/tr><tr><td><strong>embody<\/strong><\/td><td><strong>구현하다, 체현하다<\/strong> (= showed or represented) (11강 반복 ⭐)<\/td><\/tr><tr><td><strong>seamlessly<\/strong><\/td><td><strong>매끄럽게, 이음매 없이<\/strong><\/td><\/tr><tr><td><strong>ever-expanding tapestry<\/strong><\/td><td><strong>끝없이 확장되는 총체<\/strong><\/td><\/tr><tr><td><strong>stumble upon ~<\/strong><\/td><td><strong>우연히 발견하다<\/strong> (= accidentally discovered) ⚠️ \"넘어지다\"가 아니다<\/td><\/tr><tr><td><strong>mentorship<\/strong><\/td><td><strong>멘토십, 지도<\/strong><\/td><\/tr><tr><td><strong>evolve into ~<\/strong><\/td><td><strong>~로 발전하다<\/strong><\/td><\/tr><tr><td><strong>testament to ~<\/strong><\/td><td><strong>~의 증거<\/strong> (13강 반복 ⭐)<\/td><\/tr><tr><td><strong>boundless / limitless<\/strong><\/td><td><strong>무한한<\/strong><\/td><\/tr><tr><td><strong>hinder<\/strong><\/td><td><strong>방해하다<\/strong><\/td><\/tr><tr><td><strong>transcend<\/strong><\/td><td><strong>초월하다<\/strong><\/td><\/tr><tr><td><strong>beacon of inspiration<\/strong><\/td><td><strong>영감의 등대<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 132p.~137p.)<\/h4>\n<p><strong>① 전환점 - 기술의 도입<\/strong> (132p.~133p.) ⭐⭐⭐<\/p>\n<blockquote><p>A <strong>pivotal moment<\/strong> came [with the introduction of advanced technology {that <strong>facilitated<\/strong> the creative process}]. [With just one click], creators could check the boundaries [between their work and the originals], [<strong>alleviating<\/strong> concerns about <strong>unintentional plagiarism<\/strong>].<\/p><\/blockquote>\n<ul><li>기술이 한 일 = <strong>클릭 한 번으로 자기 작품과 원작의 경계를 확인<\/strong> → <strong>의도치 않은 표절 걱정을 덜어줌<\/strong> ⭐⭐⭐<\/li><li>⚠️ <code>facilitated<\/code> = <strong>made easier<\/strong>(더 쉽게 만들었다) - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>📌 쉬운 풀이: *A key moment happened when advanced technology made the creative process easier.<\/li><\/ul>\n<p>With just one click, creators could see the differences between their work and the originals, reducing worries about accidental copying.*<\/p>\n<p><strong>② 두 갈래 반응 - 유토피아 vs 디스토피아<\/strong> (132p.~133p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Some hailed it<\/strong> [as an <strong>idealistic utopia<\/strong>], a world {where creators could focus on their craft [without being <strong>bogged down by legal intricacies<\/strong>]}. <strong>Others viewed it with skepticism<\/strong>, [<strong>fearing a dystopian future<\/strong> {where creativity was <strong>stifled by automated regulations<\/strong>}].<\/p><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">찬성 측(Some)   → 이상적 유토피아: 법률적 복잡성에 발목 잡히지 않고 창작에 집중\n회의 측(Others) → 디스토피아 우려: 자동화된 규제가 창의성을 억누름<\/code><\/pre>\n<ul><li>⚠️ <code>fearing a dystopian future<\/code> = <strong>나쁘거나 억압적인 미래를 걱정했다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<p>(\"완벽한 세상을 기대했다\"는 정반대 오답)<\/p>\n<p><strong>③ 생태계의 진짜 본질 - 암묵적 규범<\/strong> (133p.~135p.) ⭐⭐⭐<\/p>\n<blockquote><p>However, <strong>the true essence of the ecosystem lay in the unwritten rules<\/strong>-creators <strong>voluntarily adhering to a code<\/strong> {that ensured <strong>the fair use of ideas<\/strong>}.<\/p><\/blockquote>\n<ul><li>생태계의 진짜 본질 = <strong>기술이 아니라 암묵적 규범(불문율)<\/strong> - 창작자들이 <strong>자발적으로<\/strong> 지킨 규약 ⭐⭐⭐<\/li><li>⚠️ <code>voluntarily<\/code> = <strong>without being forced<\/strong>(강요받지 않고) - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>📌 쉬운 풀이: *The real strength of the ecosystem was in the unspoken rules-creators followed a code<\/li><\/ul>\n<p>to make sure ideas were used fairly.*<\/p>\n<blockquote><p>[With the understanding {that they <strong>must not damage the potential market of the originals or extort profits<\/strong>}], creators freely shared their unique pleasure [derived from the works {that inspired them}].<\/p><\/blockquote>\n<ul><li>지켜야 할 두 가지 선 = <strong>원작의 잠재적 시장을 해치지 않을 것<\/strong>, <strong>부당한 이익을 취하지 않을 것<\/strong> ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>The ecosystem <strong>thrived on this delicate balance<\/strong>, {where the exchange of ideas was <strong>not a threat but a celebration of creativity<\/strong> in all its forms}.<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ <code>not A but B<\/code> - 아이디어의 교환은 <strong>위협이 아니라 창의성의 축하<\/strong><\/li><\/ul>\n<p><strong>④ Shynne의 성장<\/strong> (135p.) ⭐⭐⭐<\/p>\n<blockquote><p>Shynne, [now a <strong>respected<\/strong> member of the creative community], <strong>embodied the spirit of the ecosystem<\/strong>. Her channel had grown, <strong>not just in terms of subscribers, but in the depth of creativity<\/strong> {she brought to her paintings}.<\/p><\/blockquote>\n<ul><li>⚠️ <code>embodied<\/code> = <strong>showed or represented<\/strong>(보여주다·대표하다) - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>Shynne의 채널 성장 = <strong>구독자 수뿐 아니라 창의성의 깊이<\/strong>에서 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>She <strong>seamlessly integrated<\/strong> her ideas, thoughts, feelings, dreams, and visions into her work, [contributing to the <strong>ever-expanding tapestry of the digital realm<\/strong>].<\/p><\/blockquote>\n<p><strong>⑤ 순환 - 새로운 방문객들<\/strong> (136p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Day by day<\/strong>, shy visitors <strong>stumbled upon<\/strong> Shynne's channel. [<strong>Inspired<\/strong> by her journey], they decided to take their first steps into the world of online creativity. The ecosystem <strong>embraced them<\/strong>, [offering <strong>mentorship and support<\/strong> {as they found their voice and style}].<\/p><\/blockquote>\n<ul><li>⚠️ <code>stumbled upon<\/code> = <strong>우연히 발견했다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐ (\"넘어져 쓰러졌다\"가 아니다)<\/li><li>생태계가 새 방문객에게 준 것 = <strong>멘토십과 지원<\/strong><\/li><\/ul>\n<blockquote><p><strong>The once-shy onlooker evolved into a confident creator<\/strong>, [adding their unique perspective to the ever-growing community].<\/p><\/blockquote>\n<ul><li>📌 <strong>13강의 \"shy onlooker\"가 14강에서 \"confident creator\"로 바뀐다<\/strong> - 단원 전체를 관통하는 성장의 축 ⭐⭐⭐<\/li><\/ul>\n<p><strong>⑥ 결말 - 무한한 캔버스<\/strong> (136p.~137p.) ⭐⭐⭐<\/p>\n<blockquote><p>{<strong>As<\/strong> the ecosystem continued to thrive}, it became <strong>a testament to the boundless potential of human creativity<\/strong>. It was a world {where the exchange of ideas was <strong>not hindered by legal constraints but guided by a sense of responsibility and respect<\/strong>}.<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ 최종 명제: 아이디어 교환은 <strong>법적 제약에 방해받은 것이 아니라 책임감과 존중이라는 감각에 이끌렸다<\/strong><\/li><li>📌 13강의 \"제약(constraint)이 아니라 지침(guideline)\"과 정확히 같은 논리 ⭐<\/li><\/ul>\n<blockquote><p>[In this new age of creators], the possibilities <strong>were not limited<\/strong>-it was <strong>an open canvas<\/strong>, [inviting all to paint their dreams and visions, contributing to a <strong>tapestry<\/strong> {that <strong>transcended the boundaries of individual expression<\/strong>}]. The ecosystem had become <strong>a beacon of inspiration<\/strong>, [encouraging everyone to create, share, and celebrate the <strong>limitless possibilities of human imagination<\/strong>].<\/p><\/blockquote>\n<ul><li>생태계의 최종 위상 = <strong>영감의 등대(a beacon of inspiration)<\/strong><\/li><\/ul>\n<p>📌 12강 Harmony Haven의 <strong>\"희망의 등대(a beacon of hope)\"<\/strong> 와 같은 표현 구조 ⭐ (반복 2회)<\/p>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What does the word \"<strong>facilitated<\/strong>\" mean in \"advanced technology that facilitated the creative process\"?<\/li><\/ol>\n<p>A) Slowed down <strong>B) Made easier<\/strong> ✅ C) Prevented D) Complicated<\/p>\n<ol><li>What does \"<strong>voluntarily<\/strong>\" mean in \"creators voluntarily adhering to a code that ensured the fair use of ideas\"?<\/li><\/ol>\n<p><strong>A) Without being forced<\/strong> ✅ B) With strict rules C) For profit D) In a confused way<\/p>\n<ol><li>What does the word \"<strong>embodied<\/strong>\" most closely mean in \"Shynne, now a respected member of the creative community, embodied the spirit of the ecosystem\"?<\/li><\/ol>\n<p>A) Replaced <strong>B) Showed or represented<\/strong> ✅ C) Ignored D) Separated<\/p>\n<ol><li>What does the phrase \"<strong>fearing a dystopian future<\/strong>\" mean in \"Others viewed it with skepticism, fearing a dystopian future where creativity was stifled by automated regulations\"?<\/li><\/ol>\n<p>A) They looked forward to a perfect world. <strong>B) They were worried about a bad or oppressive future.<\/strong> ✅ C) They were hoping for more technology in the future. D) They were excited about creative freedom in the future.<\/p>\n<ol><li>What does the phrase \"<strong>stumbled upon<\/strong>\" mean in \"shy visitors stumbled upon Shynne's channel\"?<\/li><\/ol>\n<p>A) Tripped and fell <strong>B) Accidentally discovered<\/strong> ✅ C) Walked towards D) Ignored<\/p>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>14강의 논지 = \"기술이 아니라 사람의 규범이 생태계를 지탱한다\"<\/strong> 기술은 전환점(pivotal moment)을 만들었지만, <strong>진짜 본질(true essence)은 암묵적 규범<\/strong>에 있었다. 이 대비가 단원의 결론이다 ⭐⭐⭐<\/p>\n<p>📌 <strong>두 갈래 반응을 짝으로 외운다<\/strong><\/p>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>표현<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td><strong>찬성(Some)<\/strong><\/td><td>hailed it as an <strong>idealistic utopia<\/strong><\/td><td>법률적 복잡성에 발목 잡히지 않음<\/td><\/tr><tr><td><strong>회의(Others)<\/strong><\/td><td>viewed it with <strong>skepticism<\/strong>, fearing a <strong>dystopian future<\/strong><\/td><td>자동화된 규제가 창의성을 억누름<\/td><\/tr><\/tbody><\/table><\/div>\n<p>두 입장을 뒤바꾼 보기가 오답으로 나온다 ⚠️<\/p>\n<p>📌 <strong>14강 연습문제 5개도 전부 어구 해석<\/strong> - 11~13강과 동일한 형식이다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>표현<\/th><th>뜻<\/th><th>오답 미끼<\/th><\/tr><\/thead><tbody><tr><td><code>facilitated<\/code><\/td><td>made easier (쉽게 만들었다)<\/td><td>slowed down / prevented / complicated<\/td><\/tr><tr><td><code>voluntarily<\/code><\/td><td>강요받지 않고<\/td><td>엄격한 규칙에 따라 / 이익을 위해<\/td><\/tr><tr><td><code>embodied<\/code><\/td><td>보여주다·대표하다<\/td><td>replaced / ignored / separated<\/td><\/tr><tr><td><code>fearing a dystopian future<\/code><\/td><td>나쁜·억압적 미래를 걱정<\/td><td>완벽한 세상을 기대<\/td><\/tr><tr><td><code>stumbled upon<\/code><\/td><td>우연히 발견했다<\/td><td>넘어져 쓰러졌다<\/td><\/tr><\/tbody><\/table><\/div>\n<p>⚠️ <code>stumbled upon<\/code>은 <strong>문자 그대로의 뜻(넘어지다)<\/strong> 이 오답으로 붙는 전형적 관용구 문항이다.<\/p>\n<p>📌 <strong>성장 서사의 완결<\/strong> - 13강의 <code>shy onlooker<\/code>(조용한 구경꾼)가 14강에서 <code>confident creator<\/code>(자신감 있는 창작자)로 바뀌고, 그가 다시 새 방문객의 멘토가 된다. <strong>순환 구조<\/strong>가 단원의 마지막 메시지다.<\/p>\n<p>📌 <strong>두 개의 \"등대\"<\/strong> - 12강 Harmony Haven = <strong>beacon of hope<\/strong>, 14강 창작 생태계 = <strong>beacon of inspiration<\/strong>. 신현욱 교수 담당 단원의 결말이 같은 수사(修辭)로 맺어진다 ⭐<\/p>\n<p>📌 <strong>지켜야 할 두 선<\/strong> - ① 원작의 잠재적 시장을 해치지 않을 것 ② 부당한 이익을 취하지 않을 것. 이것이 \"공정 이용(fair use)\"의 실질적 기준으로 제시된다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ <code>facilitated<\/code> = made easier, <code>voluntarily<\/code> = without being forced<\/li><li>⭐⭐⭐ <code>embodied<\/code> = showed or represented<\/li><li>⭐⭐⭐ <code>fearing a dystopian future<\/code> = 나쁘거나 억압적인 미래를 걱정함<\/li><li>⭐⭐⭐ <code>stumbled upon<\/code> = 우연히 발견했다<\/li><li>⭐⭐⭐ 생태계의 진짜 본질 = 암묵적 규범(unwritten rules), 자발적 준수<\/li><li>⭐⭐⭐ 기술이 한 일 = 원작과의 경계 확인 → 의도치 않은 표절 걱정 완화<\/li><li>⭐⭐⭐ 두 갈래 반응 (이상적 유토피아 ↔ 디스토피아 우려)<\/li><li>⭐⭐ 지켜야 할 두 선 (원작의 잠재적 시장 훼손 금지 / 부당 이익 금지)<\/li><li>⭐⭐ Shynne의 성장 = 구독자 수 + <strong>창의성의 깊이<\/strong><\/li><li>⭐⭐ 최종 명제 - 법적 제약이 아니라 <strong>책임감과 존중<\/strong>이 아이디어 교환을 이끌었다<\/li><li>⭐ <code>not A but B<\/code> 구문 반복 (위협이 아니라 축하 / 제약이 아니라 존중)<\/li><li>⭐ 생태계의 최종 위상 = beacon of inspiration<\/li><\/ul>"}], "terms": [{"t": "<strong>pivotal moment<\/strong>", "d": "<strong>결정적 순간, 전환점<\/strong>"}, {"t": "<strong>facilitate<\/strong>", "d": "<strong>쉽게 하다, 촉진하다<\/strong> (= made easier) ⚠️ slowed down / prevented / complicated가 아니다"}, {"t": "<strong>alleviate<\/strong>", "d": "<strong>완화하다, 덜어주다<\/strong>"}, {"t": "<strong>unintentional plagiarism<\/strong>", "d": "<strong>의도치 않은 표절<\/strong>"}, {"t": "<strong>hail<\/strong>", "d": "<strong>환영하다, 칭송하다<\/strong>"}, {"t": "<strong>idealistic utopia<\/strong>", "d": "<strong>이상적 유토피아<\/strong>"}, {"t": "<strong>bogged down by ~<\/strong>", "d": "<strong>~에 발목 잡힌<\/strong>"}, {"t": "<strong>legal intricacies<\/strong>", "d": "<strong>법률적 복잡성<\/strong>"}, {"t": "<strong>skepticism<\/strong>", "d": "<strong>회의(懷疑)<\/strong>"}, {"t": "<strong>dystopian future<\/strong>", "d": "<strong>디스토피아적 미래<\/strong> - 나쁘거나 억압적인 미래"}, {"t": "<strong>stifle<\/strong>", "d": "<strong>억누르다, 질식시키다<\/strong> (13강 반복 ⭐)"}, {"t": "<strong>automated regulations<\/strong>", "d": "<strong>자동화된 규제<\/strong>"}, {"t": "<strong>essence<\/strong>", "d": "<strong>본질<\/strong>"}, {"t": "<strong>unwritten rules<\/strong>", "d": "<strong>암묵적 규범, 불문율<\/strong>"}, {"t": "<strong>voluntarily<\/strong>", "d": "<strong>자발적으로<\/strong> (= without being forced) ⚠️ \"엄격한 규칙에 따라\"가 아니다"}, {"t": "<strong>adhere to ~<\/strong>", "d": "<strong>~을 준수하다<\/strong>"}, {"t": "<strong>extort profits<\/strong>", "d": "<strong>부당하게 이익을 취하다<\/strong>"}, {"t": "<strong>delicate balance<\/strong>", "d": "<strong>미묘한 균형<\/strong>"}, {"t": "<strong>embody<\/strong>", "d": "<strong>구현하다, 체현하다<\/strong> (= showed or represented) (11강 반복 ⭐)"}, {"t": "<strong>seamlessly<\/strong>", "d": "<strong>매끄럽게, 이음매 없이<\/strong>"}, {"t": "<strong>ever-expanding tapestry<\/strong>", "d": "<strong>끝없이 확장되는 총체<\/strong>"}, {"t": "<strong>stumble upon ~<\/strong>", "d": "<strong>우연히 발견하다<\/strong> (= accidentally discovered) ⚠️ \"넘어지다\"가 아니다"}, {"t": "<strong>mentorship<\/strong>", "d": "<strong>멘토십, 지도<\/strong>"}, {"t": "<strong>evolve into ~<\/strong>", "d": "<strong>~로 발전하다<\/strong>"}, {"t": "<strong>testament to ~<\/strong>", "d": "<strong>~의 증거<\/strong> (13강 반복 ⭐)"}, {"t": "<strong>boundless / limitless<\/strong>", "d": "<strong>무한한<\/strong>"}, {"t": "<strong>hinder<\/strong>", "d": "<strong>방해하다<\/strong>"}, {"t": "<strong>transcend<\/strong>", "d": "<strong>초월하다<\/strong>"}, {"t": "<strong>beacon of inspiration<\/strong>", "d": "<strong>영감의 등대<\/strong>"}], "search": " 14강 - the canvas of creativity: navigating the ecosystem of infinite inspiration 2 part ii · unit 13 · 교재 132p.~137p. 교재 13장 2 · 담당 신현욱 교수 13강에서 이어짐 - 기술의 전환점, 암묵적 규범, shynne의 성장, 그리고 결말 학습목차 1. 학습하기 - 본문해석, 어휘와 표현, 문장비교 2. 연습문제 주요용어 용어 정의 pivotal moment 결정적 순간, 전환점 facilitate 쉽게 하다, 촉진하다 = made easier ⚠️ slowed down / prevented / complicated가 아니다 alleviate 완화하다, 덜어주다 unintentional plagiarism 의도치 않은 표절 hail 환영하다, 칭송하다 idealistic utopia 이상적 유토피아 bogged down by ~ ~에 발목 잡힌 legal intricacies 법률적 복잡성 skepticism 회의 懷疑 dystopian future 디스토피아적 미래 - 나쁘거나 억압적인 미래 stifle 억누르다, 질식시키다 13강 반복 ⭐ automated regulations 자동화된 규제 essence 본질 unwritten rules 암묵적 규범, 불문율 voluntarily 자발적으로 = without being forced ⚠️ \"엄격한 규칙에 따라\"가 아니다 adhere to ~ ~을 준수하다 extort profits 부당하게 이익을 취하다 delicate balance 미묘한 균형 embody 구현하다, 체현하다 = showed or represented 11강 반복 ⭐ seamlessly 매끄럽게, 이음매 없이 ever expanding tapestry 끝없이 확장되는 총체 stumble upon ~ 우연히 발견하다 = accidentally discovered ⚠️ \"넘어지다\"가 아니다 mentorship 멘토십, 지도 evolve into ~ ~로 발전하다 testament to ~ ~의 증거 13강 반복 ⭐ boundless / limitless 무한한 hinder 방해하다 transcend 초월하다 beacon of inspiration 영감의 등대 본문 정리 1. 학습하기 - 본문해석 교재 132p.~137p. ① 전환점 - 기술의 도입 132p.~133p. ⭐⭐⭐ a pivotal moment came with the introduction of advanced technology {that facilitated the creative process} . with just one click , creators could check the boundaries between their work and the originals , alleviating concerns about unintentional plagiarism . 기술이 한 일 = 클릭 한 번으로 자기 작품과 원작의 경계를 확인 → 의도치 않은 표절 걱정을 덜어줌 ⭐⭐⭐ ⚠️ facilitated = made easier 더 쉽게 만들었다 - 연습문제로 직접 출제 ⭐⭐⭐ 📌 쉬운 풀이: a key moment happened when advanced technology made the creative process easier. with just one click, creators could see the differences between their work and the originals, reducing worries about accidental copying. ② 두 갈래 반응 - 유토피아 vs 디스토피아 132p.~133p. ⭐⭐⭐ some hailed it as an idealistic utopia , a world {where creators could focus on their craft without being bogged down by legal intricacies }. others viewed it with skepticism , fearing a dystopian future {where creativity was stifled by automated regulations } . ⚠️ fearing a dystopian future = 나쁘거나 억압적인 미래를 걱정했다 - 연습문제로 직접 출제 ⭐⭐⭐ \"완벽한 세상을 기대했다\"는 정반대 오답 ③ 생태계의 진짜 본질 - 암묵적 규범 133p.~135p. ⭐⭐⭐ however, the true essence of the ecosystem lay in the unwritten rules -creators voluntarily adhering to a code {that ensured the fair use of ideas }. 생태계의 진짜 본질 = 기술이 아니라 암묵적 규범 불문율 - 창작자들이 자발적으로 지킨 규약 ⭐⭐⭐ ⚠️ voluntarily = without being forced 강요받지 않고 - 연습문제로 직접 출제 ⭐⭐⭐ 📌 쉬운 풀이: the real strength of the ecosystem was in the unspoken rules-creators followed a code to make sure ideas were used fairly. with the understanding {that they must not damage the potential market of the originals or extort profits } , creators freely shared their unique pleasure derived from the works {that inspired them} . 지켜야 할 두 가지 선 = 원작의 잠재적 시장을 해치지 않을 것 , 부당한 이익을 취하지 않을 것 ⭐⭐⭐ the ecosystem thrived on this delicate balance , {where the exchange of ideas was not a threat but a celebration of creativity in all its forms}. ⭐⭐⭐ not a but b - 아이디어의 교환은 위협이 아니라 창의성의 축하 ④ shynne의 성장 135p. ⭐⭐⭐ shynne, now a respected member of the creative community , embodied the spirit of the ecosystem . her channel had grown, not just in terms of subscribers, but in the depth of creativity {she brought to her paintings}. ⚠️ embodied = showed or represented 보여주다·대표하다 - 연습문제로 직접 출제 ⭐⭐⭐ shynne의 채널 성장 = 구독자 수뿐 아니라 창의성의 깊이 에서 ⭐⭐⭐ she seamlessly integrated her ideas, thoughts, feelings, dreams, and visions into her work, contributing to the ever expanding tapestry of the digital realm . ⑤ 순환 - 새로운 방문객들 136p. ⭐⭐⭐ day by day , shy visitors stumbled upon shynne's channel. inspired by her journey , they decided to take their first steps into the world of online creativity. the ecosystem embraced them , offering mentorship and support {as they found their voice and style} . ⚠️ stumbled upon = 우연히 발견했다 - 연습문제로 직접 출제 ⭐⭐⭐ \"넘어져 쓰러졌다\"가 아니다 생태계가 새 방문객에게 준 것 = 멘토십과 지원 the once shy onlooker evolved into a confident creator , adding their unique perspective to the ever growing community . 📌 13강의 \"shy onlooker\"가 14강에서 \"confident creator\"로 바뀐다 - 단원 전체를 관통하는 성장의 축 ⭐⭐⭐ ⑥ 결말 - 무한한 캔버스 136p.~137p. ⭐⭐⭐ { as the ecosystem continued to thrive}, it became a testament to the boundless potential of human creativity . it was a world {where the exchange of ideas was not hindered by legal constraints but guided by a sense of responsibility and respect }. ⭐⭐⭐ 최종 명제: 아이디어 교환은 법적 제약에 방해받은 것이 아니라 책임감과 존중이라는 감각에 이끌렸다 📌 13강의 \"제약 constraint 이 아니라 지침 guideline \"과 정확히 같은 논리 ⭐ in this new age of creators , the possibilities were not limited -it was an open canvas , inviting all to paint their dreams and visions, contributing to a tapestry {that transcended the boundaries of individual expression } . the ecosystem had become a beacon of inspiration , encouraging everyone to create, share, and celebrate the limitless possibilities of human imagination . 생태계의 최종 위상 = 영감의 등대 a beacon of inspiration 📌 12강 harmony haven의 \"희망의 등대 a beacon of hope \" 와 같은 표현 구조 ⭐ 반복 2회 2. 연습문제 강의록 원문 1. what does the word \" facilitated \" mean in \"advanced technology that facilitated the creative process\"? a slowed down b made easier ✅ c prevented d complicated 2. what does \" voluntarily \" mean in \"creators voluntarily adhering to a code that ensured the fair use of ideas\"? a without being forced ✅ b with strict rules c for profit d in a confused way 3. what does the word \" embodied \" most closely mean in \"shynne, now a respected member of the creative community, embodied the spirit of the ecosystem\"? a replaced b showed or represented ✅ c ignored d separated 4. what does the phrase \" fearing a dystopian future \" mean in \"others viewed it with skepticism, fearing a dystopian future where creativity was stifled by automated regulations\"? a they looked forward to a perfect world. b they were worried about a bad or oppressive future. ✅ c they were hoping for more technology in the future. d they were excited about creative freedom in the future. 5. what does the phrase \" stumbled upon \" mean in \"shy visitors stumbled upon shynne's channel\"? a tripped and fell b accidentally discovered ✅ c walked towards d ignored 핵심 정리 📌 14강의 논지 = \"기술이 아니라 사람의 규범이 생태계를 지탱한다\" 기술은 전환점 pivotal moment 을 만들었지만, 진짜 본질 true essence 은 암묵적 규범 에 있었다. 이 대비가 단원의 결론이다 ⭐⭐⭐ 📌 두 갈래 반응을 짝으로 외운다 표현 근거 찬성 some hailed it as an idealistic utopia 법률적 복잡성에 발목 잡히지 않음 회의 others viewed it with skepticism , fearing a dystopian future 자동화된 규제가 창의성을 억누름 두 입장을 뒤바꾼 보기가 오답으로 나온다 ⚠️ 📌 14강 연습문제 5개도 전부 어구 해석 - 11~13강과 동일한 형식이다. 표현 뜻 오답 미끼 facilitated made easier 쉽게 만들었다 slowed down / prevented / complicated voluntarily 강요받지 않고 엄격한 규칙에 따라 / 이익을 위해 embodied 보여주다·대표하다 replaced / ignored / separated fearing a dystopian future 나쁜·억압적 미래를 걱정 완벽한 세상을 기대 stumbled upon 우연히 발견했다 넘어져 쓰러졌다 ⚠️ stumbled upon 은 문자 그대로의 뜻 넘어지다 이 오답으로 붙는 전형적 관용구 문항이다. 📌 성장 서사의 완결 - 13강의 shy onlooker 조용한 구경꾼 가 14강에서 confident creator 자신감 있는 창작자 로 바뀌고, 그가 다시 새 방문객의 멘토가 된다. 순환 구조 가 단원의 마지막 메시지다. 📌 두 개의 \"등대\" - 12강 harmony haven = beacon of hope , 14강 창작 생태계 = beacon of inspiration . 신현욱 교수 담당 단원의 결말이 같은 수사 修辭 로 맺어진다 ⭐ 📌 지켜야 할 두 선 - ① 원작의 잠재적 시장을 해치지 않을 것 ② 부당한 이익을 취하지 않을 것. 이것이 \"공정 이용 fair use \"의 실질적 기준으로 제시된다. 시험 대비 포인트 ⭐⭐⭐ facilitated = made easier, voluntarily = without being forced ⭐⭐⭐ embodied = showed or represented ⭐⭐⭐ fearing a dystopian future = 나쁘거나 억압적인 미래를 걱정함 ⭐⭐⭐ stumbled upon = 우연히 발견했다 ⭐⭐⭐ 생태계의 진짜 본질 = 암묵적 규범 unwritten rules , 자발적 준수 ⭐⭐⭐ 기술이 한 일 = 원작과의 경계 확인 → 의도치 않은 표절 걱정 완화 ⭐⭐⭐ 두 갈래 반응 이상적 유토피아 ↔ 디스토피아 우려 ⭐⭐ 지켜야 할 두 선 원작의 잠재적 시장 훼손 금지 / 부당 이익 금지 ⭐⭐ shynne의 성장 = 구독자 수 + 창의성의 깊이 ⭐⭐ 최종 명제 - 법적 제약이 아니라 책임감과 존중 이 아이디어 교환을 이끌었다 ⭐ not a but b 구문 반복 위협이 아니라 축하 / 제약이 아니라 존중 ⭐ 생태계의 최종 위상 = beacon of inspiration "}, {"id": 15, "title": "Harmony's Forge: A Tale of Ethical Innovation and Human Potentiality", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "등장인물·핵심 사물", "html": "<div class=\"tbl\"><table><thead><tr><th>이름<\/th><th>정체<\/th><\/tr><\/thead><tbody><tr><td><strong>Dongpyeon (동편)<\/strong><\/td><td>에메랄드빛 언덕과 졸졸 흐르는 시내 사이에 자리한 <strong>작은 마을<\/strong><\/td><\/tr><tr><td><strong>Jung<\/strong><\/td><td>Dongpyeon의 <strong>선견지명 있는 발명가(visionary inventor)<\/strong> - Ethical Engine의 창조자<\/td><\/tr><tr><td><strong>the Ethical Engine<\/strong><\/td><td>Jung의 <strong>최고 걸작(magnum opus)<\/strong> - 톱니와 회로의 경이. <strong>혁신을 위한 것만이 아니라 도덕적 나침반을 지키기 위해<\/strong> 설계됨<\/td><\/tr><tr><td><strong>Nova<\/strong><\/td><td>Jung의 설명을 <strong>골똘히 듣던 어린 소녀<\/strong>. 눈이 <strong>경외와 호기심<\/strong>으로 반짝임. 훗날 젊은 세대의 <strong>영감의 등대<\/strong>가 됨<\/td><\/tr><tr><td><strong>Orion<\/strong><\/td><td>먼 땅에서 온 <strong>지식의 탐구자(seeker of knowledge)<\/strong>. Ethical Engine에 감탄하고 마을에 남아 지혜를 보탬<\/td><\/tr><tr><td><strong>Prometheus / Icarus<\/strong><\/td><td>기술의 위험을 경고하는 <strong>교훈적 이야기(cautionary tales)<\/strong> 의 주인공들<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>visionary<\/strong><\/td><td><strong>선견지명 있는<\/strong> - 창의적이고 미래지향적인 생각을 가진 (사람)<\/td><\/tr><tr><td><strong>cautionary tale<\/strong><\/td><td><strong>교훈적 경고담<\/strong><\/td><\/tr><tr><td><strong>harness<\/strong><\/td><td>(힘·잠재력을) <strong>활용하다<\/strong><\/td><\/tr><tr><td><strong>betterment of humanity<\/strong><\/td><td><strong>인류의 개선·향상<\/strong><\/td><\/tr><tr><td><strong>sanctuary<\/strong><\/td><td><strong>성역, 안식처<\/strong><\/td><\/tr><tr><td><strong>insatiable<\/strong><\/td><td><strong>채울 수 없는, 만족을 모르는<\/strong><\/td><\/tr><tr><td><strong>relentless<\/strong><\/td><td><strong>끈질긴, 수그러들지 않는<\/strong><\/td><\/tr><tr><td><strong>potentiality<\/strong><\/td><td><strong>잠재력<\/strong><\/td><\/tr><tr><td><strong>quaint<\/strong><\/td><td><strong>예스럽고 아담한<\/strong> (11강 반복 ⭐ 2회)<\/td><\/tr><tr><td><strong>untouched by ~<\/strong><\/td><td><strong>~의 영향을 받지 않은<\/strong><\/td><\/tr><tr><td><strong>usher in ~<\/strong><\/td><td>(시대를) <strong>열다, 도래시키다<\/strong><\/td><\/tr><tr><td><strong>magnum opus<\/strong><\/td><td><strong>최고 걸작<\/strong> - 가장 중요한 대표작<\/td><\/tr><tr><td><strong>marvel<\/strong><\/td><td><strong>경이, 놀라운 것<\/strong><\/td><\/tr><tr><td><strong>moral compass<\/strong><\/td><td><strong>도덕적 나침반<\/strong><\/td><\/tr><tr><td><strong>skeptical<\/strong><\/td><td><strong>회의적인<\/strong> (14강 <code>skepticism<\/code> 반복 ⭐)<\/td><\/tr><tr><td><strong>succumb to ~<\/strong><\/td><td><strong>~에 굴복하다, 빠지다<\/strong><\/td><\/tr><tr><td><strong>pitfall<\/strong><\/td><td><strong>함정, 위험<\/strong><\/td><\/tr><tr><td><strong>guardian<\/strong><\/td><td><strong>수호자<\/strong><\/td><\/tr><tr><td><strong>at the expense of ~<\/strong><\/td><td><strong>~을 희생하여<\/strong><\/td><\/tr><tr><td><strong>intently<\/strong><\/td><td><strong>골똘히, 열심히<\/strong><\/td><\/tr><tr><td><strong>awe<\/strong><\/td><td><strong>경외<\/strong><\/td><\/tr><tr><td><strong>wary of ~<\/strong><\/td><td><strong>~을 경계하는<\/strong><\/td><\/tr><tr><td><strong>unchecked<\/strong><\/td><td><strong>견제받지 않은, 제어되지 않은<\/strong><\/td><\/tr><tr><td><strong>glimmer of hope<\/strong><\/td><td><strong>한 줄기 희망<\/strong><\/td><\/tr><tr><td><strong>cautious approval<\/strong><\/td><td><strong>신중한 승인<\/strong><\/td><\/tr><tr><td><strong>looming shadow<\/strong><\/td><td><strong>드리운 그림자<\/strong><\/td><\/tr><tr><td><strong>irrigate<\/strong><\/td><td><strong>관개하다<\/strong> (3강 <code>irrigation<\/code> 반복 ⭐)<\/td><\/tr><tr><td><strong>bountiful<\/strong><\/td><td><strong>풍성한<\/strong><\/td><\/tr><tr><td><strong>vigilant<\/strong><\/td><td><strong>경계를 늦추지 않는<\/strong><\/td><\/tr><tr><td><strong>balance the scales<\/strong><\/td><td><strong>저울의 균형을 맞추다<\/strong><\/td><\/tr><tr><td><strong>intrigued<\/strong><\/td><td><strong>흥미를 느낀<\/strong><\/td><\/tr><tr><td><strong>enduring motif<\/strong><\/td><td><strong>지속되는 모티프<\/strong><\/td><\/tr><tr><td><strong>transcend<\/strong><\/td><td><strong>초월하다<\/strong> (14강 반복 ⭐)<\/td><\/tr><tr><td><strong>alliance<\/strong><\/td><td><strong>동맹<\/strong><\/td><\/tr><tr><td><strong>steadfast<\/strong><\/td><td><strong>확고한<\/strong> (강의록 주석)<\/td><\/tr><tr><td><strong>hub<\/strong><\/td><td><strong>중심지, 허브<\/strong><\/td><\/tr><tr><td><strong>mar<\/strong><\/td><td><strong>훼손하다, 망치다<\/strong><\/td><\/tr><tr><td><strong>untethered by ~<\/strong><\/td><td><strong>~에 매이지 않은<\/strong><\/td><\/tr><tr><td><strong>unwavering<\/strong><\/td><td><strong>흔들림 없는<\/strong><\/td><\/tr><tr><td><strong>resonate / echo<\/strong><\/td><td><strong>울려 퍼지다 / 메아리치다<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 151p.~164p.)<\/h4>\n<p><strong>① 마을과 발명가<\/strong> (151p.~152p.) ⭐⭐⭐<\/p>\n<blockquote><p>In the small village of <strong>Dongpyeon<\/strong>, [<strong>nestled<\/strong> between <strong>emerald hills<\/strong> and <strong>babbling brooks<\/strong>], there lived a <strong>visionary<\/strong> inventor [named <strong>Jung<\/strong>]. In the shadows of history, {where the <strong>cautionary tales<\/strong> of <strong>Prometheus and Icarus<\/strong> still echoed}, Jung dared to dream of a future {where technology could be <strong>harnessed for the betterment of humanity<\/strong>}.<\/p><\/blockquote>\n<ul><li>⚠️ <code>visionary<\/code> = <strong>창의적이고 미래지향적인 생각을 가진 사람<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<p>(기계를 고치는 사람도, 행동 없이 꿈만 꾸는 사람도, 과거를 연구하는 사람도 아니다)<\/p>\n<ul><li>Jung의 꿈 = <strong>기술을 인류의 향상을 위해 활용하는 미래<\/strong><\/li><\/ul>\n<p><strong>② Jung의 작업실과 마을의 성격<\/strong> (152p.~154p.) ⭐⭐⭐<\/p>\n<blockquote><p>Jung's workshop was a <strong>sanctuary<\/strong> of <strong>whirring<\/strong> gears and flickering lights. She <strong>toiled day and night<\/strong>, [driven by an <strong>insatiable curiosity<\/strong> and a <strong>relentless belief<\/strong> in the <strong>potentiality of human advancement<\/strong>].<\/p><\/blockquote>\n<ul><li>Jung을 움직인 두 힘 = <strong>채울 수 없는 호기심<\/strong> + <strong>인간 진보의 잠재력에 대한 끈질긴 믿음<\/strong> ⭐⭐<\/li><\/ul>\n<blockquote><p>Dongpyeon was a <strong>quaint<\/strong> village, [<strong>untouched by the rapid currents of change<\/strong> {sweeping through the world}], <strong>but<\/strong> Jung felt a calling to <strong>usher in an era of progress<\/strong>, [<strong>guided by ethical considerations<\/strong>].<\/p><\/blockquote>\n<ul><li>⚠️ <code>untouched by the rapid currents of change<\/code> = <strong>마을이 큰 변화를 겪지 않았다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<p>(홍수가 났다·현대 기술로 가득했다·세계적으로 유명했다는 모두 오답)<\/p>\n<ul><li>📌 대비 구조: <strong>변화 없는 마을<\/strong> ↔ <strong>진보의 시대를 열려는 Jung<\/strong> ⭐⭐<\/li><\/ul>\n<p><strong>③ Ethical Engine의 공개<\/strong> (154p.~155p.) ⭐⭐⭐<\/p>\n<blockquote><p>One day, {<strong>as<\/strong> the sun <strong>painted the sky with hues of gold<\/strong>}, Jung <strong>unveiled her magnum opus<\/strong>-a creation {she called <strong>the Ethical Engine<\/strong>}. It was a <strong>marvel<\/strong> of gears and circuits, [designed <strong>not just to innovate but to uphold a moral compass<\/strong> in the face of progress]. The villagers, [<strong>initially skeptical<\/strong> of such advancements], gathered in the town square to witness Jung's creation.<\/p><\/blockquote>\n<ul><li>⚠️ <code>magnum opus<\/code> = <strong>가장 중요한 대표작(major or most important work)<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>Ethical Engine의 설계 목적 (<code>not just A but B<\/code>) = <strong>혁신만이 아니라 진보 앞에서 도덕적 나침반을 지키는 것<\/strong> ⭐⭐⭐<\/li><li>마을 사람들의 최초 반응 = <strong>회의적(skeptical)<\/strong> ⚠️<\/li><\/ul>\n<p><strong>④ Ethical Engine의 목적<\/strong> (155p.) ⭐⭐⭐<\/p>\n<blockquote><p>It was a technology [meant to guide human advancement <strong>without succumbing to the pitfalls<\/strong> {that had <strong>plagued<\/strong> Prometheus and Icarus}]. It would be <strong>a guardian of progress<\/strong>, [ensuring {that <strong>the pursuit of knowledge did not come at the expense of ethical considerations<\/strong>}].<\/p><\/blockquote>\n<ul><li>⚠️ <code>succumbing to<\/code> = <strong>~에 빠지거나 영향을 받는 것<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><\/ul>\n<p>(극복하다·배우다·막아내다가 아니다 - 정확히 <strong>반대 방향<\/strong>의 오답이 붙는다)<\/p>\n<ul><li>Ethical Engine의 위상 = <strong>진보의 수호자(a guardian of progress)<\/strong> ⭐⭐⭐<\/li><li>핵심 명제: <strong>지식의 추구가 윤리적 고려를 희생시키지 않도록<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>⑤ Nova의 등장<\/strong> (156p.) ⭐⭐⭐<\/p>\n<blockquote><p>{<strong>As<\/strong> Jung spoke}, a young girl [named <strong>Nova<\/strong>] listened <strong>intently<\/strong>. <strong>Her eyes sparkled with a mixture of awe and curiosity.<\/strong> Nova's parents, [like many in Dongpyeon], had grown <strong>wary of the dangers<\/strong> [associated with <strong>unchecked technology<\/strong>]. <strong>However<\/strong>, Jung's vision of an ethical dimension to innovation <strong>sparked a glimmer of hope<\/strong> in their hearts.<\/p><\/blockquote>\n<ul><li>⚠️ <code>Her eyes sparkled with a mixture of awe and curiosity<\/code> = <strong>감탄과 흥미를 함께 드러냈다<\/strong> - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>부모 세대의 태도 변화: <strong>견제받지 않는 기술에 대한 경계<\/strong> → Jung의 윤리적 비전이 <strong>한 줄기 희망<\/strong>을 지핌<\/li><\/ul>\n<p><strong>⑥ 도입과 변화<\/strong> (156p.~158p.) ⭐⭐⭐<\/p>\n<blockquote><p>[With the villagers' <strong>cautious approval<\/strong>], Jung <strong>integrated the Ethical Engine into the daily life of Dongpyeon<\/strong>. It <strong>monitored<\/strong> the village's technological advancements, [providing <strong>insights and ethical guidance<\/strong>]. The <strong>once-skeptical villagers<\/strong> began to witness the positive impact of progress [<strong>without the looming shadow of consequences<\/strong>].<\/p><\/blockquote>\n<ul><li>도입 조건 = <strong>마을 사람들의 신중한 승인<\/strong> ⭐⭐⭐<\/li><li>Engine의 역할 = <strong>기술 발전을 감시하고 통찰과 윤리적 지침을 제공<\/strong> ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>In Dongpyeon, <strong>a new era unfolded<\/strong>. Fields were <strong>irrigated with sustainable technology<\/strong>, [ensuring <strong>bountiful harvests without harming the environment<\/strong>]. Communication devices connected families across the village, [<strong>fostering a sense of unity<\/strong>]. Dongpyeon became <strong>a beacon of human potentiality<\/strong>, [a <strong>testament to<\/strong> the harmony {that could exist between <strong>innovation and ethics<\/strong>}].<\/p><\/blockquote>\n<ul><li>변화 두 가지 = ① <strong>지속가능한 기술로 관개<\/strong> → 환경 훼손 없는 풍성한 수확 ② <strong>통신 기기<\/strong> → 마을의 단합 ⭐⭐⭐<\/li><li>Dongpyeon의 위상 = <strong>인간 잠재력의 등대(a beacon of human potentiality)<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p>📌 12강 <code>beacon of hope<\/code>, 14강 <code>beacon of inspiration<\/code>에 이은 <strong>세 번째 \"등대\"<\/strong> ⭐<\/p>\n<p><strong>⑦ Jung의 경계<\/strong> (158p.~159p.) ⭐⭐<\/p>\n<blockquote><p>However, {as Dongpyeon thrived}, Jung <strong>remained vigilant<\/strong>. She knew {that <strong>the ethical dimension of technology required continuous attention<\/strong>}. The Ethical Engine was <strong>not just a creation; it was a commitment to balance the scales of progress and responsibility<\/strong>.<\/p><\/blockquote>\n<ul><li>⚠️ 성공 후에도 <strong>경계를 늦추지 않는다<\/strong>는 것이 이 이야기의 도덕이다 ⭐⭐⭐<\/li><li>Ethical Engine = 창조물이 아니라 <strong>진보와 책임의 저울을 맞추겠다는 약속(commitment)<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>⑧ Orion의 방문<\/strong> (159p.~161p.) ⭐⭐<\/p>\n<blockquote><p>One day, a traveler arrived in Dongpyeon. His name was <strong>Orion<\/strong>, [a <strong>seeker of knowledge<\/strong> from a distant land]. [<strong>Intrigued<\/strong> by the tales of Dongpyeon's harmonious coexistence with technology], Orion <strong>marveled at<\/strong> the Ethical Engine. He had witnessed <strong>the consequences of unchecked advancements<\/strong> in other regions, {where <strong>the pursuit of knowledge had often led to unintended harm<\/strong>}.<\/p><\/blockquote>\n<blockquote><p>Jung welcomed Orion and shared the story of Prometheus and Icarus. She spoke of the <strong>enduring motif of danger in technology<\/strong> and {how Dongpyeon had sought to <strong>transcend that narrative<\/strong>}. Orion, [<strong>moved by<\/strong> the village's <strong>commitment to ethical innovation<\/strong>], decided to <strong>stay and contribute his wisdom<\/strong> to Dongpyeon's journey.<\/p><\/blockquote>\n<ul><li>Orion의 선택 = <strong>머물러 자신의 지혜를 보태기로 결정<\/strong> ⭐⭐<\/li><\/ul>\n<p><strong>⑨ 확산 - 동맹<\/strong> (161p.~162p.) ⭐⭐⭐<\/p>\n<blockquote><p>{<strong>As<\/strong> the seasons changed and Dongpyeon continued to <strong>flourish<\/strong>}, the Ethical Engine became a symbol <strong>not just for the village but for neighboring countries<\/strong>. <strong>Elders<\/strong> [from distant lands] sought Jung's guidance on implementing similar ethical considerations in their own technological pursuits.<\/p><\/blockquote>\n<blockquote><p>Together, Dongpyeon and its neighboring communities and countries <strong>formed an alliance<\/strong>-[a <strong>collective commitment to harness the potentiality of human advancement<\/strong> (with a <strong>steadfast<\/strong> focus on the ethical dimension)]. The <strong>once-isolated village became a hub of knowledge exchange<\/strong>, [a testament to the idea {that <strong>progress need not be marred by the consequences<\/strong> [that haunted the tales of old]}].<\/p><\/blockquote>\n<ul><li>동맹의 내용 = <strong>윤리적 차원에 확고히 초점을 둔 채 인류 진보의 잠재력을 활용하겠다는 집단적 약속<\/strong> ⭐⭐⭐<\/li><li>마을의 변화: <strong>고립된 마을 → 지식 교류의 허브<\/strong> ⭐⭐⭐<\/li><li>ℹ️ 강의록 주석: <strong>steadfast<\/strong> = 확고한<\/li><\/ul>\n<p><strong>⑩ Nova의 성장과 결말<\/strong> (162p.~164p.) ⭐⭐⭐<\/p>\n<blockquote><p>In the heart of Dongpyeon, <strong>Nova<\/strong>, [now grown], stood alongside Jung and Orion. She had become <strong>a beacon of inspiration for the younger generation<\/strong>, [a reminder {that <strong>human potentiality, when guided by ethical considerations, could create a future untethered by the chains of past cautionary tales<\/strong>}].<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ 단원의 주제문: <strong>인간의 잠재력은 윤리적 고려에 이끌릴 때 과거의 경고담이라는 사슬에 매이지 않은 미래를 만들 수 있다<\/strong><\/li><li>📌 쉬운 풀이: *She had become an example for the younger generation, showing that human potential,<\/li><\/ul>\n<p>when guided by good values, could build a future free from the mistakes of the past.*<\/p>\n<blockquote><p>And so, in the small village of Dongpyeon, <strong>a new myth was born<\/strong>-[a tale of <strong>resilience, progress, and the unwavering commitment to the ethical dimension of human advancement<\/strong>]. The Ethical Engine, [<strong>a guardian of innovation<\/strong>], continued to hum softly, [a melody {that resonated <strong>not just in Dongpyeon but echoed across the vast tapestry of a world<\/strong> [transformed by <strong>the harmonious dance between technology and ethics<\/strong>]}].<\/p><\/blockquote>\n<ul><li>결말 = <strong>새로운 신화의 탄생<\/strong> - 회복력·진보·윤리적 차원에 대한 흔들림 없는 헌신의 이야기 ⭐⭐⭐<\/li><li>📌 <strong>Prometheus·Icarus의 옛 신화(경고담)<\/strong> 를 <strong>Dongpyeon의 새 신화<\/strong>가 대체하는 구조가 단원 전체의 뼈대다<\/li><\/ul>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What is the meaning of the word \"<strong>visionary<\/strong>\" in \"there lived a visionary inventor named Jung\"?<\/li><\/ol>\n<p>A. Someone who fixes machines <strong>B. Someone with creative and future-oriented ideas<\/strong> ✅ C. Someone who is always dreaming without action D. Someone who studies the past<\/p>\n<ol><li>What does \"<strong>magnum opus<\/strong>\" mean in \"Jung unveiled her magnum opus-a creation she called the Ethical Engine\"?<\/li><\/ol>\n<p>A. A small, unimportant work B. A scientific theory <strong>C. A major or most important work<\/strong> ✅ D. A failed experiment<\/p>\n<ol><li>What does the phrase \"<strong>untouched by the rapid currents of change<\/strong>\" mean in \"Dongpyeon was a quaint village, untouched by the rapid currents of change sweeping through the world\"?<\/li><\/ol>\n<p><strong>A. The village had not experienced much change<\/strong> ✅ B. The village was flooded by water C. The village was full of modern technology D. The village was famous around the world<\/p>\n<ol><li>In \"It was a technology meant to guide human advancement without <strong>succumbing to<\/strong> the pitfalls that had plagued Prometheus and Icarus,\" what does \"succumbing to\" mean?<\/li><\/ol>\n<p>A. Overcoming <strong>B. Falling into or being affected by<\/strong> ✅ C. Learning from D. Protecting against<\/p>\n<ol><li>What is the meaning of the phrase \"<strong>Her eyes sparkled with a mixture of awe and curiosity<\/strong>\"?<\/li><\/ol>\n<p>A. Her eyes were tired <strong>B. Her eyes showed both admiration and interest<\/strong> ✅ C. Her eyes were full of fear D. Her eyes showed no emotion<\/p>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>옛 신화 → 새 신화<\/strong>가 이 단원의 골격이다.<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Prometheus · Icarus   기술의 위험을 경고하는 옛 이야기(cautionary tales)\n         ↓  Jung은 그 서사를 \"초월(transcend)\"하려 한다\n  Ethical Engine      진보의 수호자 - 지식 추구가 윤리를 희생시키지 않게 함\n         ↓  마을의 신중한 승인 → 도입 → 새 시대\n  Dongpyeon           고립된 마을 → 인간 잠재력의 등대 → 지식 교류의 허브\n         ↓  이웃 나라들과 동맹\n  A new myth          회복력·진보·윤리에 대한 흔들림 없는 헌신의 이야기<\/code><\/pre>\n<p>📌 <strong>15강 연습문제 5개도 전부 어구 해석<\/strong> - 11~14강과 완전히 같은 형식이다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>표현<\/th><th>뜻<\/th><th>오답 미끼<\/th><\/tr><\/thead><tbody><tr><td><code>visionary<\/code><\/td><td>창의적·미래지향적 생각을 가진<\/td><td>기계공 / 행동 없는 몽상가 / 과거 연구자<\/td><\/tr><tr><td><code>magnum opus<\/code><\/td><td>가장 중요한 대표작<\/td><td>사소한 작품 / 과학 이론 / 실패한 실험<\/td><\/tr><tr><td><code>untouched by the rapid currents of change<\/code><\/td><td>큰 변화를 겪지 않았다<\/td><td>홍수가 남 / 현대 기술로 가득<\/td><\/tr><tr><td><code>succumbing to<\/code><\/td><td>~에 빠지다·영향받다<\/td><td>극복하다 / 배우다 / 막아내다<\/td><\/tr><tr><td><code>Her eyes sparkled with awe and curiosity<\/code><\/td><td>감탄과 흥미를 함께 드러냄<\/td><td>피곤함 / 두려움 / 무표정<\/td><\/tr><\/tbody><\/table><\/div>\n<p>⚠️ 특히 <code>succumbing to<\/code>는 <strong>정확히 반대 뜻(Overcoming)<\/strong> 이 매력적인 오답으로 붙는다.<\/p>\n<p>📌 <strong><code>not just A but B<\/code> 구문이 세 번<\/strong> - Ethical Engine의 설계 목적(혁신만이 아니라 도덕적 나침반), Engine의 정체(창조물이 아니라 <strong>약속<\/strong>), 그리고 결말의 울림(동편만이 아니라 온 세상). 신현욱 교수 단원의 공통 문형이다 ⭐<\/p>\n<p>📌 <strong>세 개의 \"등대\"로 시리즈가 맺어진다<\/strong> - 12강 <code>beacon of hope<\/code>(Harmony Haven), 14강 <code>beacon of inspiration<\/code>(창작 생태계), 15강 <code>beacon of human potentiality<\/code>(Dongpyeon) + <code>beacon of inspiration<\/code>(Nova). 같은 수사가 반복되므로 <strong>어느 강의 무엇인지<\/strong>를 구별해 둔다 ⚠️<\/p>\n<p>📌 <strong>성공 뒤에도 경계<\/strong> - Jung은 마을이 번성한 뒤에도 <code>remained vigilant<\/code>했다. \"윤리적 차원은 지속적인 관심을 요한다\"는 문장이 이 이야기의 도덕이다 ⭐⭐⭐<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ <code>visionary<\/code> = 창의적·미래지향적 생각을 가진 사람<\/li><li>⭐⭐⭐ <code>magnum opus<\/code> = 가장 중요한 대표작<\/li><li>⭐⭐⭐ <code>untouched by the rapid currents of change<\/code> = 큰 변화를 겪지 않았다<\/li><li>⭐⭐⭐ <code>succumbing to<\/code> = ~에 빠지다·영향을 받다 (Overcoming이 아님)<\/li><li>⭐⭐⭐ <code>Her eyes sparkled with a mixture of awe and curiosity<\/code> = 감탄과 흥미를 함께 드러냄<\/li><li>⭐⭐⭐ Ethical Engine의 목적 = 지식 추구가 윤리적 고려를 희생시키지 않게 하는 <strong>진보의 수호자<\/strong><\/li><li>⭐⭐⭐ 설계 원칙 = 혁신만이 아니라 <strong>도덕적 나침반<\/strong>을 지키는 것<\/li><li>⭐⭐⭐ 단원 주제문 = 인간의 잠재력은 윤리에 이끌릴 때 과거의 사슬에서 자유로운 미래를 만든다<\/li><li>⭐⭐ 등장인물 4인 (Jung 발명가 / Nova 소녀 → 영감의 등대 / Orion 지식의 탐구자 / Prometheus·Icarus 경고담)<\/li><li>⭐⭐ 도입 조건 = 마을 사람들의 <strong>신중한 승인<\/strong>, Engine의 역할 = 감시 + 통찰·윤리 지침<\/li><li>⭐⭐ 새 시대의 변화 = 지속가능한 관개(환경 훼손 없는 수확) + 통신 기기(단합)<\/li><li>⭐⭐ 동맹의 성격 = 윤리에 확고히 초점을 둔 인류 진보 활용의 <strong>집단적 약속<\/strong><\/li><li>⭐ 고립된 마을 → <strong>지식 교류의 허브<\/strong><\/li><li>⭐ Jung을 움직인 두 힘 = 채울 수 없는 호기심 + 인간 진보에 대한 끈질긴 믿음<\/li><li>⭐ 마을 사람들의 최초 반응 = <strong>회의적<\/strong>(initially skeptical)<\/li><\/ul>"}], "terms": [{"t": "<strong>visionary<\/strong>", "d": "<strong>선견지명 있는<\/strong> - 창의적이고 미래지향적인 생각을 가진 (사람)"}, {"t": "<strong>cautionary tale<\/strong>", "d": "<strong>교훈적 경고담<\/strong>"}, {"t": "<strong>harness<\/strong>", "d": "(힘·잠재력을) <strong>활용하다<\/strong>"}, {"t": "<strong>betterment of humanity<\/strong>", "d": "<strong>인류의 개선·향상<\/strong>"}, {"t": "<strong>sanctuary<\/strong>", "d": "<strong>성역, 안식처<\/strong>"}, {"t": "<strong>insatiable<\/strong>", "d": "<strong>채울 수 없는, 만족을 모르는<\/strong>"}, {"t": "<strong>r  "Bias mitigation, transparency, and accountability", "Privacy, encryption, and storage", "Automation, efficiency, and scale"], "answer": 1, "expl": "<p><code>ethical considerations surrounding AI use, such as <strong>bias mitigation, transparency, and accountability<\/strong>, are gaining attention.<\/code> 📌 쉬운 풀이 대응: <code>reducing bias<\/code> / <code>making AI systems clear and open<\/code> / <code>ensuring responsibility<\/code> ⭐⭐⭐<\/p>", "verify": "강의록 9강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q06", "num": 6, "points": 3, "tags": ["어구해석", "치환"], "lecture": 9, "stem": "<p>Which expression best replaces \"gain more prominence\"?<\/p>", "options": ["Lose importance gradually", "Become more important or popular", "Be discussed only by experts", "Become more expensive"], "answer": 1, "expl": "<p>강의록 문장비교가 <code>the <strong>idea<\/strong> of the metaverse is likely to become <strong>more important<\/strong><\/code> / <code>the metaverse will probably become <strong>more popular<\/strong><\/code>로 직접 치환해 보여준다. 📌 신현욱 교수 단원은 <strong>어려운 표현 ↔ 쉬운 표현의 짝<\/strong>을 일부러 제시한다 - 그 짝이 곧 출제 후보다 ⭐⭐⭐<\/p>", "verify": "강의록 9강 문장비교 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q07", "num": 7, "points": 3, "tags": ["어법", "수일치"], "lecture": 10, "stem": "<p>Which of the following sentences is grammatically correct?<\/p>", "options": ["The rise of blockchain technology and cryptocurrencies have led to the emergence of DeFi applications, which aims to disrupt traditional financial systems.", "The rise of blockchain technology and cryptocurrencies has led to the emergence of decentralized finance (DeFi) applications, which aim to disrupt traditional financial systems.", "The rise of blockchain technology and cryptocurrencies has lead to the emergence of DeFi applications, which aim to disrupt traditional financial systems.", "The rise of blockchain technology and cryptocurrencies have lead to the emergence of DeFi applications, which aims to disrupt traditional financial systems."], "answer": 1, "expl": "<p>세 곳을 동시에 본다 - ⓐ 주어의 핵은 <strong><code>The rise<\/code>(단수)<\/strong> 이므로 <code>has<\/code>(<code>of ~ and ~<\/code>는 수식구일 뿐이다), ⓑ 과거분사는 <code>lead–led–<strong>led<\/strong><\/code>, ⓒ 관계대명사 <code>which<\/code>의 선행사는 <strong><code>applications<\/code>(복수)<\/strong> 이므로 <code>aim<\/code>. ⚠️ <strong>긴 수식구에 가려진 주어의 핵<\/strong>을 찾는 것이 관건 ⭐⭐⭐<\/p>", "verify": "강의록 10강 연습문제 (1)과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q08", "num": 8, "points": 3, "tags": ["어법", "2형식"], "lecture": 10, "stem": "<p>괄호에 들어갈 알맞은 형태는?<\/p>\n<blockquote><p>Keywords related to remote work tools are likely to remain ______ as remote work becomes more entrenched in the global workforce.<\/p><\/blockquote>", "options": ["relevance", "relevant", "relevance's", "relevantly"], "answer": 1, "expl": "<p><code>remain<\/code>은 <strong>보어를 취하는 2형식 동사<\/strong>이므로 <strong>형용사 <code>relevant<\/code><\/strong> 가 온다. 📌 3강의 <code>He remained <strong>silent<\/strong>.<\/code>와 같은 구조 ⭐⭐⭐<\/p>", "verify": "강의록 10강 연습문제 (2)와 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q09", "num": 9, "points": 3, "tags": ["어구해석", "헬스테크"], "lecture": 10, "stem": "<p>What does \"the healthcare industry is undergoing rapid transformation\" most likely mean?<\/p>", "options": ["The healthcare industry is slowing down in terms of growth.", "The healthcare industry is experiencing quick and significant changes.", "The healthcare industry is resistant to technological advancements.", "The healthcare industry is staying the same without much change."], "answer": 1, "expl": "<p><code>undergo<\/code> = <strong>겪다<\/strong>, <code>transformation<\/code> = <strong>변혁<\/strong>. 강의록 쉬운 풀이는 <code>changing quickly because of new technology<\/code>. ③④ 는 정반대이고 ① 은 \"성장 둔화\"로 초점을 바꾼 오답이다.<\/p>", "verify": "강의록 10강 연습문제 (3)과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q10", "num": 10, "points": 3, "tags": ["내용일치", "사이버보안"], "lecture": 10, "stem": "<p>According to the text, what do organizations prioritize efforts to protect?<\/p>", "options": ["Healthcare records only", "Ethical considerations", "The metaverse", "Their digital assets"], "answer": 3, "expl": "<p><code>Keywords related to cybersecurity ~ are likely to be significant as organizations <strong>prioritize efforts to protect their digital assets<\/strong>.<\/code><\/p>", "verify": "강의록 10강 연습문제 (5)와 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q11", "num": 11, "points": 3, "tags": ["어휘", "IT용어"], "lecture": 10, "stem": "<p>Which pairing of a cybersecurity term with its plain-language description is INCORRECT?<\/p>", "options": ["ransomware - bad software that asks for money", "data breaches - when private information is stolen", "zero-trust architecture - trusting everyone inside the network by default", "cybersecurity awareness - understanding how to be safe online"], "answer": 2, "expl": "<p><code>zero-trust architecture<\/code>의 쉬운 설명은 강의록에서 <strong><code>checking everyone before letting them in<\/code><\/strong> (들여보내기 전에 <strong>모두를 검증<\/strong>하는 것)이다. \"기본적으로 모두를 신뢰한다\"는 이름(<code>zero-trust<\/code>)과도 정면으로 어긋난다 ⚠️<\/p>", "verify": "강의록 10강 문장비교 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q12", "num": 12, "points": 3, "tags": ["내용일치", "원격근무"], "lecture": 10, "stem": "<p>According to the text, what effect did the COVID-19 pandemic have on remote work?<\/p>", "options": ["It accelerated the adoption of remote work arrangements.", "It delayed the introduction of digital collaboration tools.", "It had no measurable effect on how work is conducted.", "It made flexible work policies illegal in most countries."], "answer": 0, "expl": "<p><code>The COVID-19 pandemic has <strong>accelerated the adoption of<\/strong> remote work arrangements, leading to significant changes in <strong>how and where work is conducted<\/strong>.<\/code> 📌 <code>accelerate the adoption of ~<\/code> = ~의 도입을 가속하다 ⭐⭐<\/p>", "verify": "강의록 10강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q13", "num": 13, "points": 3, "tags": ["어휘", "대비쌍"], "lecture": 10, "stem": "<p>What is the difference between <strong>pandemic<\/strong> and <strong>endemic<\/strong>?<\/p>", "options": ["Pandemic pertains to all people; endemic is particular to a people or locality.", "Pandemic is a mild illness; endemic is a severe illness.", "Pandemic refers to animals; endemic refers to humans.", "There is no difference between the two terms."], "answer": 0, "expl": "<p>강의록 보충: <strong>pandemic<\/strong> = *pertaining to all people*(세계적 대유행), <strong>endemic<\/strong> = *particular to a people or locality*(풍토병). 📌 <code>pan-<\/code>(모두) vs <code>en-/endo-<\/code>(안·국지) 접두사로 구분 ⭐⭐<\/p>", "verify": "강의록 10강 보충 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q14", "num": 14, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 11, "stem": "<p>What does the word \"granting\" mean in the sentence below?<\/p>\n<blockquote><p>The tree possessed magical powers, <strong>granting<\/strong> those who gathered beneath its branches the ability to understand and share the feelings of others.<\/p><\/blockquote>", "options": ["Denying", "Giving", "Blocking", "Stopping"], "answer": 1, "expl": "<p><code>grant<\/code> = <strong>주다·부여하다<\/strong>. 나무가 사람들에게 <strong>능력을 준다<\/strong>는 문맥이다. ⚠️ 오답 3개가 모두 <strong>정반대 방향<\/strong>(거부·차단·중지)이다 - 이 단원 오답의 기본 수법 ⭐⭐⭐<\/p>", "verify": "강의록 11강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q15", "num": 15, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 11, "stem": "<p>Which word best replaces \"quaint\" in the sentence below?<\/p>\n<blockquote><p>In a <strong>quaint<\/strong> village nestled between rolling hills and lush forests...<\/p><\/blockquote>", "options": ["Large", "Old-fashioned", "Busy", "Noisy"], "answer": 1, "expl": "<p><code>quaint<\/code> = <strong>예스럽고 아담한<\/strong>(= old-fashioned, charming in an old way). 📌 15강의 <code>Dongpyeon was a <strong>quaint<\/strong> village<\/code>에도 같은 단어가 다시 나온다 - <strong>반복 2회<\/strong> ⭐<\/p>", "verify": "강의록 11강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q16", "num": 16, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 11, "stem": "<p>Which of the following is the correct meaning of the sentence below?<\/p>\n<blockquote><p><strong>Legend had it that<\/strong> the tree possessed magical powers.<\/p><\/blockquote>", "options": ["It is a fact that the tree had magical powers.", "The tree might have had magical powers.", "According to the legend, the tree had magical powers.", "It was proven that the tree had magical powers."], "answer": 2, "expl": "<p><code>Legend had it that ~<\/code> = <strong>\"전설에 따르면 ~라고 한다\"<\/strong>. ⚠️ ①④는 <strong>사실 주장<\/strong>으로 바꾼 오답이다. 화자는 사실 여부를 단언하지 않는다 ⭐⭐⭐<\/p>", "verify": "강의록 11강 연습문제 3번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q17", "num": 17, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 11, "stem": "<p>What does the phrase \"welcomed with open arms\" mean in the sentence below?<\/p>\n<blockquote><p>Aria was <strong>welcomed with open arms<\/strong> by the villagers.<\/p><\/blockquote>", "options": ["The villagers did not trust Aria.", "The villagers were happy to accept Aria.", "The villagers ignored Aria.", "The villagers rejected Aria."], "answer": 1, "expl": "<p><code>welcome ~ with open arms<\/code> = <strong>두 팔 벌려 환영하다·기쁘게 받아들이다<\/strong>. 📌 12강에서 마을이 방문객들을 맞을 때 <strong>같은 표현이 다시<\/strong> 쓰인다 - <strong>반복 2회<\/strong> ⭐<\/p>", "verify": "강의록 11강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q18", "num": 18, "points": 3, "tags": ["내용일치", "Harmony-Haven"], "lecture": 11, "stem": "<p>What did Aria propose to the village?<\/p>", "options": ["A new school for critical thinking", "A community garden where villagers could grow produce and learn about environmental stewardship", "A trade agreement with neighboring villages", "A festival under the Tree of Harmony"], "answer": 1, "expl": "<p><code>Aria <strong>proposed the development of a community garden<\/strong>-a sustainable oasis where villagers could cultivate fresh produce while learning about environmental stewardship.<\/code> 📌 사용한 친환경 방법은 <strong>composting(퇴비화)<\/strong> 과 <strong>rainwater harvesting(빗물 수집)<\/strong> ⭐⭐<\/p>", "verify": "강의록 11강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q19", "num": 19, "points": 3, "tags": ["내용일치", "7개개념"], "lecture": 11, "stem": "<p>Which of the following is NOT one of the seven concepts embodied by Harmony Haven?<\/p>", "options": ["Empathy", "Sustainability", "Prosperity", "Global citizenship"], "answer": 2, "expl": "<p>7개 개념은 <strong>empathy, equality, sustainability, critical thinking, resilience, global citizenship, empowerment<\/strong>다. <code>prosperity<\/code>(번영)는 목록에 없다. 📌 이 목록은 11강 서두와 12강 결말에 <strong>똑같이 두 번<\/strong> 나온다(수미상관) ⭐⭐⭐<\/p>", "verify": "강의록 11·12강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q20", "num": 20, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 12, "stem": "<p>Which word could best replace \"address\" in the sentence below?<\/p>\n<blockquote><p>Villagers began to explore new ways to <strong>address<\/strong> local challenges.<\/p><\/blockquote>", "options": ["Ignore", "Solve", "Avoid", "Create"], "answer": 1, "expl": "<p><code>address<\/code>가 동사로 쓰이면 <strong>(문제를) 다루다·해결하다<\/strong>의 뜻이다. ⚠️ \"주소\"라는 명사 뜻에 갇히면 못 푼다 - <strong>품사 전환 다의어<\/strong> ⭐⭐⭐<\/p>", "verify": "강의록 12강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q21", "num": 21, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 12, "stem": "<p>What does the phrase \"not immune to adversity\" mean in the sentence below?<\/p>\n<blockquote><p>Yet, Harmony Haven was <strong>not immune to adversity<\/strong>.<\/p><\/blockquote>", "options": ["Completely safe from challenges", "Easily defeated by challenges", "Unable to resist challenges", "Affected by difficulties"], "answer": 3, "expl": "<p><code>immune to ~<\/code> = ~의 영향을 받지 않는 → <code><strong>not<\/strong> immune to adversity<\/code> = <strong>역경의 영향을 받았다<\/strong>. ⚠️ <code>not<\/code> + <code>immune<\/code>이 겹쳐 <strong>이중부정처럼 읽히는 함정<\/strong>이다. ① 은 <code>not<\/code>을 무시한 오답 ⭐⭐⭐<\/p>", "verify": "강의록 12강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q22", "num": 22, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 12, "stem": "<p>In the phrase \"advocating for greater representation of marginalized voices,\" what does \"marginalized voices\" refer to?<\/p>", "options": ["People who have strong influence in the village", "People who are often ignored or underrepresented", "People who make decisions for the village", "People who are satisfied with the village's current state"], "answer": 1, "expl": "<p><code>marginalize<\/code> = <strong>주변으로 밀어내다<\/strong> → <code>marginalized<\/code>는 <strong>소외된<\/strong>. ①③ 은 오히려 <strong>권력을 가진 쪽<\/strong>이라 정반대다.<\/p>", "verify": "강의록 12강 연습문제 3번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q23", "num": 23, "points": 3, "tags": ["어구해석", "Harmony-Haven"], "lecture": 12, "stem": "<p>What does \"drawing upon their resilience and ingenuity\" mean in the sentence below?<\/p>\n<blockquote><p>The villagers rallied together, <strong>drawing upon their resilience and ingenuity<\/strong> to find solutions.<\/p><\/blockquote>", "options": ["Ignoring their strength and creativity", "Using their strength and creativity", "Forgetting their strength and creativity", "Giving up on their strength and creativity"], "answer": 1, "expl": "<p><code>draw upon ~<\/code> = <strong>~을 이용하다·~에 의지하다<\/strong>(강의록 주석). <code>resilience<\/code>(회복력) + <code>ingenuity<\/code>(독창성)를 <strong>끌어다 쓴다<\/strong>는 뜻이다.<\/p>", "verify": "강의록 12강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q24", "num": 24, "points": 3, "tags": ["내용일치", "Harmony-Haven"], "lecture": 12, "stem": "<p>Through what combination did the villagers manage to weather the drought?<\/p>", "options": ["Water conservation measures, community support networks, and innovative agricultural techniques", "Government aid, imported food, and relocation", "Trade agreements, new wells, and machinery purchases", "Rationing, prayer, and waiting for rain"], "answer": 0, "expl": "<p><code>Through a combination of <strong>water conservation measures, community support networks, and innovative agricultural techniques<\/strong>, they managed to weather the drought and emerge stronger than ever.<\/code> 📌 <code>weather<\/code>가 <strong>동사로 \"견뎌내다\"<\/strong> 라는 점도 함께 익힌다 ⚠️<\/p>", "verify": "강의록 12강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q25", "num": 25, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 13, "stem": "<p>In the sentence below, what does \"static\" most likely mean?<\/p>\n<blockquote><p>It was <strong>not a static market<\/strong> or a showcase <strong>but a living, breathing community<\/strong>.<\/p><\/blockquote>", "options": ["Unchanging", "Moving", "Quiet", "Temporary"], "answer": 0, "expl": "<p><code>static<\/code> = <strong>정적인·변하지 않는<\/strong>. <code>not A <strong>but<\/strong> B<\/code> 구문에서 B(<code>living, breathing<\/code>)의 <strong>반대말<\/strong>이라는 점이 결정적 단서다. ② <code>Moving<\/code>은 오히려 <code>living, breathing<\/code> 쪽에 가깝다 ⚠️<\/p>", "verify": "강의록 13강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q26", "num": 26, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 13, "stem": "<p>What does the word \"ambitious\" mean in the sentence below?<\/p>\n<blockquote><p><strong>Ambitious<\/strong> visitors, drawn to the ecosystem with dreams of sharing their unique perspectives...<\/p><\/blockquote>", "options": ["Shy", "Having strong goals or dreams", "Lazy", "Scared"], "answer": 1, "expl": "<p><code>ambitious<\/code> = <strong>야심 있는·강한 목표나 꿈을 가진<\/strong>. 뒤에 <code>with <strong>dreams of<\/strong> sharing
