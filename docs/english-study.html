습을 위한 읽기 강의록 원문 sarah could perceive a subtle change in her surroundings, as if something new had been embedded in her daily routine. this shift seemed to affect her mood, leaving her more contemplative than usual. as she reflected, she realized that change was inevitable and embraced it with curiosity rather than fear. the idea that life was constantly evolving brought her a sense of freedom and opportunity. sarah decided to approach each day with an open mind, ready to embrace whatever the future held. 핵심어 4개 perceive / embed / affect / inevitable 가 한 단락에 모두 들어 있다 📌 핵심 정리 📌 정의 문장이 곧 어법 문제 - \"fear is an intensely unpleasant emotion in response to perceiving …\" in response to 의 to는 to부정사가 아니라 전치사 다. 그래서 뒤에 ing 가 온다. 이 한 문장이 정의 문항과 어법 문항 양쪽으로 쓰인다 ⭐⭐⭐ 📌 fight or flight 세트 - 선천적 innate 공포 반응 → 별칭 투쟁 도피 기제 → 인간 경험에 깊이 박혀 embedded in 있다. 전치사 referred to as / embedded in 이 그대로 빈칸이 된다. 📌 fear ↔ anxiety - 공포는 지금의 위험 인지 에 대한 반응, 불안은 통제 불가·불가피한 미래 위협 에서 온다. 시점 현재 vs 미래 으로 갈라 두면 서로 바꿔 낸 보기를 잡는다. 📌 진화적 답은 언제나 \"생존\" - 공포 반응이 보존된 이유는 생존에 적합한 행동 반응을 끌어내기 때문. \"사회적 행동 보장\" \"감정 억제\"는 모두 오답. 📌 두 요인은 반드시 짝으로 - ① 타고난 본성 ② 사회적 관계와 문화. not only a but also b 구문이 정답 근거이며, 식습관·학력은 본문에 없다. 시험 대비 포인트 ⭐⭐⭐ in response to perceiving - 전치사 to + 동명사 틀린 형태 고치기 ⭐⭐⭐ referred to as / embedded in 전치사 채우기 ⭐⭐⭐ 공포 반응의 진화적 목적 = 생존에 적합한 행동 반응 유도 ⭐⭐⭐ 공포에 영향을 주는 두 요인 = 타고난 본성 + 사회적 관계와 문화 ⭐⭐ 공포의 정의 위험·위협 인지에 대한 강렬하게 불쾌한 감정 ⭐⭐ 선천적 공포 반응의 별칭 = fight or flight mechanism ⭐⭐ fear와 anxiety의 차이 현재 위험 vs 미래 위협 ⭐⭐ affect 의 다의어 - 특히 \"~인 척하다\" affected indifference ⭐ 공포의 행동 반응 두 갈래 = 공격 aggressive response / 도피 fleeing ⭐ perceive a as b / perceive a to be b 문형 "}, {"id": 6, "title": "Unit 4 Fear [2]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>\n<ul><li>어휘 복습을 위한 읽기<\/li><\/ul>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>antithesis<\/strong><\/td><td><strong>정반대, 대립물<\/strong>. <code>anti-<\/code>(대항) 계열<\/td><\/tr><tr><td><strong>courage<\/strong><\/td><td><strong>용기<\/strong>. 역경에 맞설 <strong>준비 태세(readiness to confront adversity)<\/strong> 로 규정됨<\/td><\/tr><tr><td><strong>unfold<\/strong><\/td><td><strong>펼쳐지다, 전개되다<\/strong><\/td><\/tr><tr><td><strong>hyperventilation<\/strong><\/td><td><strong>과호흡<\/strong>. <code>hyper-<\/code>(과도한) + ventilation(환기)<\/td><\/tr><tr><td><strong>constrict<\/strong><\/td><td><strong>수축시키다, 좁히다<\/strong><\/td><\/tr><tr><td><strong>peripheral blood vessels<\/strong><\/td><td><strong>말초 혈관<\/strong><\/td><\/tr><tr><td><strong>hair follicle<\/strong><\/td><td><strong>모낭<\/strong> - 여기에 연결된 근육 수축이 곧 소름(goosebumps)<\/td><\/tr><tr><td><strong>goosebumps<\/strong><\/td><td><strong>소름, 닭살<\/strong><\/td><\/tr><tr><td><strong>induce<\/strong><\/td><td><strong>유발하다, 유도하다<\/strong><\/td><\/tr><tr><td><strong>blood glucose level<\/strong><\/td><td><strong>혈당 수치<\/strong><\/td><\/tr><tr><td><strong>alertness<\/strong><\/td><td><strong>각성도, 기민함<\/strong><\/td><\/tr><tr><td><strong>cognitive behavioral therapy (CBT)<\/strong><\/td><td><strong>인지행동치료<\/strong><\/td><\/tr><tr><td><strong>exposure therapy<\/strong><\/td><td><strong>노출 치료<\/strong> - 특정 공포증 환자의 <strong>약 90%<\/strong> 가 공포 감소를 경험<\/td><\/tr><tr><td><strong>phobia<\/strong><\/td><td><strong>공포증<\/strong>. <code>-phobia<\/code> = \"exaggerated fear of\"<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 41p.~43p.)<\/h4>\n<p><strong>① 공포와 용기의 관계<\/strong> (41p.) ⭐⭐⭐<\/p>\n<blockquote><ol><li><strong>Contrary to common perception<\/strong>, fear is <strong>not the antithesis of courage<\/strong>; rather, it is <strong>a condition that makes the exercise of courage possible<\/strong>.<\/li><\/ol><\/blockquote>\n<blockquote><p><strong>Courage<\/strong>, characterized by a <strong>readiness to confront adversity<\/strong>, <strong>unfolds within the context of fear<\/strong>, creating a dynamic interplay that shapes the human experience.<\/p><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">통념: 공포 ↔ 용기 (반대말)\n본문: 공포는 용기의 반대가 아니라, 용기를 발휘할 수 있게 하는 \"조건\"\n      → 용기는 공포라는 맥락 \"안에서\" 펼쳐진다<\/code><\/pre>\n<ul><li>⚠️ \"공포가 용기를 완전히 없앤다\" \"용기는 공포와 무관하게 존재한다\" \"용기가 공포를 줄인다\" 모두 오답<\/li><\/ul>\n<p><strong>② 투쟁-도피 반응의 생리적 변화<\/strong> (41p.~42p.) ⭐⭐⭐<\/p>\n<blockquote><ol><li>Many physiological changes in the body are associated with fear, summarized as the <strong>fight-or-flight response<\/strong>. It <strong>operates<\/strong> by<\/li><\/ol>\n<ul><li><strong>increasing the breathing rate (hyperventilation)<\/strong> - 호흡률 증가<\/li><li><strong>elevating the heart rate<\/strong> - 심박수 상승<\/li><li><strong>constricting peripheral blood vessels<\/strong> - 말초 혈관 수축<\/li><\/ul><\/blockquote>\n<blockquote><p>This process also <strong>heightens muscle tension<\/strong>, leading to the <strong>contraction of muscles connected to each hair follicle<\/strong>, resulting in the occurrence of <strong>\"goosebumps.\"<\/strong><\/p><\/blockquote>\n<blockquote><p>Additionally, it <strong>induces sweating<\/strong>, <strong>elevates blood glucose levels<\/strong>, and <strong>enhances alertness<\/strong>, potentially leading to <strong>sleep disturbance<\/strong> and the sensation of <strong>\"butterflies in the stomach.\"<\/strong><\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>변화<\/th><th>방향<\/th><\/tr><\/thead><tbody><tr><td>호흡률<\/td><td><strong>증가<\/strong> (과호흡)<\/td><\/tr><tr><td>심박수<\/td><td><strong>상승<\/strong><\/td><\/tr><tr><td>말초 혈관<\/td><td><strong>수축<\/strong><\/td><\/tr><tr><td>근육 긴장<\/td><td><strong>고조<\/strong> → 모낭 근육 수축 → <strong>소름<\/strong><\/td><\/tr><tr><td>발한<\/td><td><strong>유발<\/strong><\/td><\/tr><tr><td>혈당<\/td><td><strong>상승<\/strong><\/td><\/tr><tr><td>각성도<\/td><td><strong>증대<\/strong> → <strong>수면 장애<\/strong> 가능<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>⚠️ 오답 미끼는 전부 <strong>방향을 뒤집은 것<\/strong>: \"근육 긴장 감소\" \"호흡률 감소\" \"혈당 저하\"<\/li><\/ul>\n<p><strong>③ 공포 극복 - 치료법<\/strong> (43p.) ⭐⭐⭐<\/p>\n<blockquote><ol><li>In addition to medications, <strong>cognitive behavioral therapy has proven effective<\/strong> in helping people overcome their fears.<\/li><\/ol><\/blockquote>\n<blockquote><p>Fear is <strong>more intricate than just forgetting or erasing memories<\/strong>, so a successful approach involves <strong>people facing their fears repeatedly<\/strong>.<\/p><\/blockquote>\n<ul><li>성공적 접근법 = <strong>공포를 반복적으로 (안전하게) 마주하기<\/strong> ⚠️ 기억을 지우는 것이 아니다<\/li><\/ul>\n<blockquote><p><strong>By confronting fears in a safe way<\/strong>, a person can suppress the memories or things that trigger their fear. With the help of <strong>exposure therapy<\/strong>, approximately <strong>90%<\/strong> of individuals with specific <strong>phobias<\/strong> experience a significant decrease in their fears over time.<\/p><\/blockquote>\n<ul><li>노출 치료 효과 = 특정 공포증 환자의 <strong>약 90%<\/strong> ⭐⭐⭐ (50%·75%·100%가 오답 보기)<\/li><li><code>has proven<\/code> - <strong>현재완료<\/strong> 시제 ⭐⭐<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>anti-<\/strong> (1강에 이어 반복 ⭐ 2회) - antibacterial, antibody, anticlimactic, antigravity, antipathy, antisocial, antivirus<\/p>\n<p><strong>hyper-<\/strong> ⭐⭐<\/p>\n<div class=\"tbl\"><table><thead><tr><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>\"above, beyond\"<\/td><td>hypermarket<\/td><\/tr><tr><td>\"excessively\"<\/td><td>hypersensitive<\/td><\/tr><tr><td>\"excessive\"<\/td><td>hyperemia<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>-phobia<\/strong> - \"exaggerated fear of\" ⭐⭐⭐<\/p>\n<div class=\"tbl\"><table><thead><tr><th>단어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><strong>acrophobia<\/strong><\/td><td>고소공포증<\/td><\/tr><tr><td><strong>arachnophobia<\/strong><\/td><td>거미공포증<\/td><\/tr><tr><td><strong>claustrophobia<\/strong><\/td><td>폐소공포증<\/td><\/tr><tr><td><strong>hydrophobia<\/strong><\/td><td>물공포증(공수병)<\/td><\/tr><tr><td><strong>agoraphobia<\/strong><\/td><td>광장공포증<\/td><\/tr><tr><td><strong>aerophobia<\/strong><\/td><td>비행공포증<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>unfold<\/strong> - 1형식 자동사 / 3형식 타동사<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">As the plot unfolds, you gradually realize that all your initial assumptions were wrong.  (1형식)\nThe flower petals slowly began to unfold in the warmth of the morning sun.                (1형식)\nHe watched her expression as she unfolded the letter.                                     (3형식)<\/code><\/pre>\n<p><strong>operate<\/strong> - 1형식(작동·활동하다) / 3형식(조작·운영하다) ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">How do you operate the remote control unit?                      (3형식)\nDoes the company operate a pension scheme?                        (3형식)\nFor several years she operated a dating agency from her basement. (3형식)\nChanges are being introduced to make the department operate more efficiently.  (1형식)\nSpecially equipped troops are operating in the hills.             (1형식)\nWe have representatives operating in most countries.              (1형식)\nExchange rates are currently operating to the advantage of exporters.\nDoctors will operate on her tomorrow morning.                     (수술하다 - operate on)<\/code><\/pre>\n<p><strong>induce<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Nothing could induce me to climb a mountain.\nPills for seasickness often induce drowsiness.     (뱃멀미 약은 종종 졸음을 유발한다)\nThe aim of advertising is to induce brand loyalty.<\/code><\/pre>\n<p><strong>현재완료시제<\/strong> ⭐⭐ (본문 <code>has proven<\/code>과 연결)<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">He has finished his work.\nI have seen him before.\nI have heard nothing from him since then.\nShe has lost her eyesight.<\/code><\/pre>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>unfold 동사를 사용하여 <strong>1형식<\/strong> 문장을 두 개 만든다.<\/li><li>operate 동사를 사용하여 <strong>1형식 문장과 3형식 문장<\/strong>을 만든다.<\/li><li>'뱃멀미 약은 종종 졸음을 유발한다'는 뜻이다. 괄호 안에 적절한 동사는? → <strong>induces<\/strong><\/li><\/ol>\n<ul><li>Pills for seasickness often ( ) drowsiness.<\/li><\/ul>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>Which of the following describes the relationship between fear and courage correctly?<\/li><\/ol>\n<p>A) Fear eradicates courage entirely. B) Courage exists independently of fear. <strong>C) Fear is a necessary condition for the exercise of courage.<\/strong> D) Courage diminishes the presence of fear in human experience.<\/p>\n<ol><li>Which of the following is mentioned as a result of the fight-or-flight response?<\/li><\/ol>\n<p>A) Reduction in muscle tension. <strong>B) Contraction of muscles leading to goosebumps.<\/strong> C) Decrease in breathing rate. D) Lowering of blood glucose levels.<\/p>\n<ol><li>How does the fight-or-flight response potentially affect sleep?<\/li><\/ol>\n<p>A) It causes an increased need for sleep. B) It leads to more restful sleep. C) It has no effect on sleep. <strong>D) It may cause sleep disturbance.<\/strong><\/p>\n<ol><li>What key strategy is involved in the successful approach to overcoming fears?<\/li><\/ol>\n<p>A) Avoiding any situation that might trigger fear <strong>B) Facing fears repeatedly in a safe environment<\/strong> C) Taking medication only D) Forgetting or erasing memories associated with the fear<\/p>\n<ol><li>What percentage of individuals with specific phobias experience a significant decrease in their fears through exposure therapy?<\/li><\/ol>\n<p>A) About 50% B) Approximately 75% <strong>C) Approximately 90%<\/strong> D) Almost 100%<\/p>\n<h4>5. 어휘 복습을 위한 읽기 (강의록 원문)<\/h4>\n<blockquote><p>In a bustling city, a young engineer named Alex faced a unique challenge-a paralyzing <strong>phobia<\/strong> of heights that seemed to control his every move. Determined to get over his fear, Alex delved into the world of virtual reality, hoping to <strong>induce<\/strong> a sense of calm amidst dizzying heights. As he immersed himself in a virtual skyscraper setting, Alex felt his heart race and palms sweat, but he persevered, determined to conquer his fear. With each session, a gradual transformation began to <strong>unfold<\/strong> within him, and eventually, Alex found himself no longer paralyzed by his phobia. Empowered by his new-found courage, Alex overcame <strong>acrophobia<\/strong> he once thought insurmountable.<\/p><\/blockquote>\n<ul><li>핵심어 4개(phobia / induce / unfold / acrophobia)가 한 단락에 모두 들어 있다 📌<\/li><li>📌 이 단락은 그 자체로 <strong>노출 치료(exposure therapy)의 사례<\/strong>다 - 본문 ③과 연결해 읽는다<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>공포는 용기의 반대가 아니라 전제조건<\/strong> - 이 한 문장이 6강 최대 출제 포인트다. <code>Contrary to common perception<\/code>으로 시작하는 문장은 곧 \"통념을 뒤집는 정답\"이라는 신호다 ⚠️<\/p>\n<p>📌 <strong>투쟁-도피 반응은 전부 \"↑\" 방향<\/strong> - 호흡↑ 심박↑ 근육긴장↑ 발한↑ 혈당↑ 각성↑, 그리고 말초 혈관만 <strong>수축<\/strong>. 오답 보기는 예외 없이 이 방향을 뒤집는다. <strong>\"감소\"라는 단어가 보이면 일단 의심<\/strong>한다.<\/p>\n<p>📌 <strong>소름의 메커니즘<\/strong> - 근육 긴장 고조 → <strong>모낭에 연결된 근육 수축<\/strong> → goosebumps. 단순 암기가 아니라 인과 사슬로 기억해야 \"무엇의 결과인가\" 문항을 푼다.<\/p>\n<p>📌 <strong>치료법 3층<\/strong> - 약물 + <strong>인지행동치료(CBT)<\/strong> + <strong>노출 치료<\/strong>. 핵심 전략은 \"기억 지우기\"가 아니라 <strong>안전한 환경에서 반복적으로 마주하기<\/strong>이며, 효과는 <strong>약 90%<\/strong>.<\/p>\n<p>📌 <strong>접두사·접미사 확장<\/strong> - <code>anti-<\/code>(1강 반복 ⭐2회) <code>hyper-<\/code>(과도) <code>-phobia<\/code>(과도한 공포). 특히 <code>-phobia<\/code> 목록 6개는 그대로 어휘 문항이 된다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ 공포 = 용기의 반대가 아니라 <strong>용기 발휘를 가능케 하는 조건<\/strong><\/li><li>⭐⭐⭐ 투쟁-도피 반응의 생리 변화 방향 (호흡↑ 심박↑ 근육긴장↑ 혈당↑ 각성↑ / 말초혈관 수축)<\/li><li>⭐⭐⭐ 소름 = 모낭에 연결된 근육의 수축 결과<\/li><li>⭐⭐⭐ 공포 극복의 핵심 전략 = 안전한 환경에서 반복적으로 마주하기<\/li><li>⭐⭐⭐ 노출 치료 효과 = 특정 공포증 환자의 약 <strong>90%<\/strong><\/li><li>⭐⭐ 수면에 미치는 영향 = <strong>수면 장애(sleep disturbance)<\/strong> 가능<\/li><li>⭐⭐ <code>-phobia<\/code> 어휘 (acrophobia, arachnophobia, claustrophobia, hydrophobia, agoraphobia, aerophobia)<\/li><li>⭐⭐ <code>hyper-<\/code> = above/beyond, excessively, excessive<\/li><li>⭐⭐ <code>operate<\/code>의 1형식·3형식, <code>operate on<\/code>(수술하다)<\/li><li>⭐ 현재완료 <code>has proven<\/code> - 시제 문항<\/li><li>⭐ <code>induce<\/code>(유발하다), <code>unfold<\/code>(펼쳐지다), <code>antithesis<\/code>(정반대)<\/li><\/ul>"}], "terms": [{"t": "<strong>antithesis<\/strong>", "d": "<strong>정반대, 대립물<\/strong>. <code>anti-<\/code>(대항) 계열"}, {"t": "<strong>courage<\/strong>", "d": "<strong>용기<\/strong>. 역경에 맞설 <strong>준비 태세(readiness to confront adversity)<\/strong> 로 규정됨"}, {"t": "<strong>unfold<\/strong>", "d": "<strong>펼쳐지다, 전개되다<\/strong>"}, {"t": "<strong>hyperventilation<\/strong>", "d": "<strong>과호흡<\/strong>. <code>hyper-<\/code>(과도한) + ventilation(환기)"}, {"t": "<strong>constrict<\/strong>", "d": "<strong>수축시키다, 좁히다<\/strong>"}, {"t": "<strong>peripheral blood vessels<\/strong>", "d": "<strong>말초 혈관<\/strong>"}, {"t": "<strong>hair follicle<\/strong>", "d": "<strong>모낭<\/strong> - 여기에 연결된 근육 수축이 곧 소름(goosebumps)"}, {"t": "<strong>goosebumps<\/strong>", "d": "<strong>소름, 닭살<\/strong>"}, {"t": "<strong>induce<\/strong>", "d": "<strong>유발하다, 유도하다<\/strong>"}, {"t": "<strong>blood glucose level<\/strong>", "d": "<strong>혈당 수치<\/strong>"}, {"t": "<strong>alertness<\/strong>", "d": "<strong>각성도, 기민함<\/strong>"}, {"t": "<strong>cognitive behavioral therapy (CBT)<\/strong>", "d": "<strong>인지행동치료<\/strong>"}, {"t": "<strong>exposure therapy<\/strong>", "d": "<strong>노출 치료<\/strong> - 특정 공포증 환자의 <strong>약 90%<\/strong> 가 공포 감소를 경험"}, {"t": "<strong>phobia<\/strong>", "d": "<strong>공포증<\/strong>. <code>-phobia<\/code> = \"exaggerated fear of\""}], "search": " 06강 - unit 4 fear 2 part i · unit 4 · 교재 41p.~43p. · 담당 손향숙 교수 학습목차 1. 학습하기 2. 어휘연습 3. 연습문제 어휘 복습을 위한 읽기 주요용어 용어 정의 antithesis 정반대, 대립물 . anti 대항 계열 courage 용기 . 역경에 맞설 준비 태세 readiness to confront adversity 로 규정됨 unfold 펼쳐지다, 전개되다 hyperventilation 과호흡 . hyper 과도한 + ventilation 환기 constrict 수축시키다, 좁히다 peripheral blood vessels 말초 혈관 hair follicle 모낭 - 여기에 연결된 근육 수축이 곧 소름 goosebumps goosebumps 소름, 닭살 induce 유발하다, 유도하다 blood glucose level 혈당 수치 alertness 각성도, 기민함 cognitive behavioral therapy cbt 인지행동치료 exposure therapy 노출 치료 - 특정 공포증 환자의 약 90% 가 공포 감소를 경험 phobia 공포증 . phobia = \"exaggerated fear of\" 본문 정리 1. 학습하기 - 본문 교재 41p.~43p. ① 공포와 용기의 관계 41p. ⭐⭐⭐ 3. contrary to common perception , fear is not the antithesis of courage ; rather, it is a condition that makes the exercise of courage possible . courage , characterized by a readiness to confront adversity , unfolds within the context of fear , creating a dynamic interplay that shapes the human experience. ⚠️ \"공포가 용기를 완전히 없앤다\" \"용기는 공포와 무관하게 존재한다\" \"용기가 공포를 줄인다\" 모두 오답 ② 투쟁 도피 반응의 생리적 변화 41p.~42p. ⭐⭐⭐ 4. many physiological changes in the body are associated with fear, summarized as the fight or flight response . it operates by increasing the breathing rate hyperventilation - 호흡률 증가 elevating the heart rate - 심박수 상승 constricting peripheral blood vessels - 말초 혈관 수축 this process also heightens muscle tension , leading to the contraction of muscles connected to each hair follicle , resulting in the occurrence of \"goosebumps.\" additionally, it induces sweating , elevates blood glucose levels , and enhances alertness , potentially leading to sleep disturbance and the sensation of \"butterflies in the stomach.\" 변화 방향 호흡률 증가 과호흡 심박수 상승 말초 혈관 수축 근육 긴장 고조 → 모낭 근육 수축 → 소름 발한 유발 혈당 상승 각성도 증대 → 수면 장애 가능 ⚠️ 오답 미끼는 전부 방향을 뒤집은 것 : \"근육 긴장 감소\" \"호흡률 감소\" \"혈당 저하\" ③ 공포 극복 - 치료법 43p. ⭐⭐⭐ 5. in addition to medications, cognitive behavioral therapy has proven effective in helping people overcome their fears. fear is more intricate than just forgetting or erasing memories , so a successful approach involves people facing their fears repeatedly . 성공적 접근법 = 공포를 반복적으로 안전하게 마주하기 ⚠️ 기억을 지우는 것이 아니다 by confronting fears in a safe way , a person can suppress the memories or things that trigger their fear. with the help of exposure therapy , approximately 90% of individuals with specific phobias experience a significant decrease in their fears over time. 노출 치료 효과 = 특정 공포증 환자의 약 90% ⭐⭐⭐ 50%·75%·100%가 오답 보기 has proven - 현재완료 시제 ⭐⭐ 2. 어휘·어법 노트 강의록 원문 anti 1강에 이어 반복 ⭐ 2회 - antibacterial, antibody, anticlimactic, antigravity, antipathy, antisocial, antivirus hyper ⭐⭐ 의미 예 \"above, beyond\" hypermarket \"excessively\" hypersensitive \"excessive\" hyperemia phobia - \"exaggerated fear of\" ⭐⭐⭐ 단어 뜻 acrophobia 고소공포증 arachnophobia 거미공포증 claustrophobia 폐소공포증 hydrophobia 물공포증 공수병 agoraphobia 광장공포증 aerophobia 비행공포증 unfold - 1형식 자동사 / 3형식 타동사 operate - 1형식 작동·활동하다 / 3형식 조작·운영하다 ⭐⭐ induce 현재완료시제 ⭐⭐ 본문 has proven 과 연결 3. 어휘연습 강의록 원문 1. unfold 동사를 사용하여 1형식 문장을 두 개 만든다. 2. operate 동사를 사용하여 1형식 문장과 3형식 문장 을 만든다. 3. '뱃멀미 약은 종종 졸음을 유발한다'는 뜻이다. 괄호 안에 적절한 동사는? → induces pills for seasickness often drowsiness. 4. 연습문제 강의록 원문 1. which of the following describes the relationship between fear and courage correctly? a fear eradicates courage entirely. b courage exists independently of fear. c fear is a necessary condition for the exercise of courage. d courage diminishes the presence of fear in human experience. 2. which of the following is mentioned as a result of the fight or flight response? a reduction in muscle tension. b contraction of muscles leading to goosebumps. c decrease in breathing rate. d lowering of blood glucose levels. 3. how does the fight or flight response potentially affect sleep? a it causes an increased need for sleep. b it leads to more restful sleep. c it has no effect on sleep. d it may cause sleep disturbance. 4. what key strategy is involved in the successful approach to overcoming fears? a avoiding any situation that might trigger fear b facing fears repeatedly in a safe environment c taking medication only d forgetting or erasing memories associated with the fear 5. what percentage of individuals with specific phobias experience a significant decrease in their fears through exposure therapy? a about 50% b approximately 75% c approximately 90% d almost 100% 5. 어휘 복습을 위한 읽기 강의록 원문 in a bustling city, a young engineer named alex faced a unique challenge-a paralyzing phobia of heights that seemed to control his every move. determined to get over his fear, alex delved into the world of virtual reality, hoping to induce a sense of calm amidst dizzying heights. as he immersed himself in a virtual skyscraper setting, alex felt his heart race and palms sweat, but he persevered, determined to conquer his fear. with each session, a gradual transformation began to unfold within him, and eventually, alex found himself no longer paralyzed by his phobia. empowered by his new found courage, alex overcame acrophobia he once thought insurmountable. 핵심어 4개 phobia / induce / unfold / acrophobia 가 한 단락에 모두 들어 있다 📌 📌 이 단락은 그 자체로 노출 치료 exposure therapy 의 사례 다 - 본문 ③과 연결해 읽는다 핵심 정리 📌 공포는 용기의 반대가 아니라 전제조건 - 이 한 문장이 6강 최대 출제 포인트다. contrary to common perception 으로 시작하는 문장은 곧 \"통념을 뒤집는 정답\"이라는 신호다 ⚠️ 📌 투쟁 도피 반응은 전부 \"↑\" 방향 - 호흡↑ 심박↑ 근육긴장↑ 발한↑ 혈당↑ 각성↑, 그리고 말초 혈관만 수축 . 오답 보기는 예외 없이 이 방향을 뒤집는다. \"감소\"라는 단어가 보이면 일단 의심 한다. 📌 소름의 메커니즘 - 근육 긴장 고조 → 모낭에 연결된 근육 수축 → goosebumps. 단순 암기가 아니라 인과 사슬로 기억해야 \"무엇의 결과인가\" 문항을 푼다. 📌 치료법 3층 - 약물 + 인지행동치료 cbt + 노출 치료 . 핵심 전략은 \"기억 지우기\"가 아니라 안전한 환경에서 반복적으로 마주하기 이며, 효과는 약 90% . 📌 접두사·접미사 확장 - anti 1강 반복 ⭐2회 hyper 과도 phobia 과도한 공포 . 특히 phobia 목록 6개는 그대로 어휘 문항이 된다. 시험 대비 포인트 ⭐⭐⭐ 공포 = 용기의 반대가 아니라 용기 발휘를 가능케 하는 조건 ⭐⭐⭐ 투쟁 도피 반응의 생리 변화 방향 호흡↑ 심박↑ 근육긴장↑ 혈당↑ 각성↑ / 말초혈관 수축 ⭐⭐⭐ 소름 = 모낭에 연결된 근육의 수축 결과 ⭐⭐⭐ 공포 극복의 핵심 전략 = 안전한 환경에서 반복적으로 마주하기 ⭐⭐⭐ 노출 치료 효과 = 특정 공포증 환자의 약 90% ⭐⭐ 수면에 미치는 영향 = 수면 장애 sleep disturbance 가능 ⭐⭐ phobia 어휘 acrophobia, arachnophobia, claustrophobia, hydrophobia, agoraphobia, aerophobia ⭐⭐ hyper = above/beyond, excessively, excessive ⭐⭐ operate 의 1형식·3형식, operate on 수술하다 ⭐ 현재완료 has proven - 시제 문항 ⭐ induce 유발하다 , unfold 펼쳐지다 , antithesis 정반대 "}, {"id": 7, "title": "Unit 7 \"Artists Fight Back against AI Using Their Work\" [1]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><li>어휘 복습을 위한 읽기<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>Kelly McKernan<\/strong><\/td><td>테네시주 <strong>내슈빌<\/strong> 출신 <strong>37세<\/strong> 화가. 자신을 지칭할 때 <code>his/her<\/code>가 아닌 <strong><code>they<\/code><\/strong> 를 사용<\/td><\/tr><tr><td><strong>surreal<\/strong><\/td><td><strong>초현실적인<\/strong> - McKernan이 자기 작품을 부른 말<\/td><\/tr><tr><td><strong>discomfort<\/strong><\/td><td><strong>불편, 불쾌<\/strong> (<code>dis-<\/code> + comfort)<\/td><\/tr><tr><td><strong>image-generator company<\/strong><\/td><td><strong>이미지 생성 AI 기업<\/strong><\/td><\/tr><tr><td><strong>Stability AI / Stable Diffusion / Midjourney<\/strong><\/td><td>소송 대상이 된 <strong>세 이미지 생성 기업<\/strong><\/td><\/tr><tr><td><strong>DeviantArt<\/strong><\/td><td>소송에서 함께 지목된 <strong>온라인 갤러리<\/strong><\/td><\/tr><tr><td><strong>consent<\/strong><\/td><td><strong>동의, 승낙<\/strong><\/td><\/tr><tr><td><strong>legal action<\/strong><\/td><td><strong>법적 조치, 소송<\/strong><\/td><\/tr><tr><td><strong>copyrighted works<\/strong><\/td><td><strong>저작권이 있는 작품<\/strong><\/td><\/tr><tr><td><strong>violate<\/strong><\/td><td><strong>침해하다, 위반하다<\/strong><\/td><\/tr><tr><td><strong>the Associated Press (AP)<\/strong><\/td><td>미국의 <strong>통신사<\/strong> - McKernan이 인터뷰한 매체<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 65p.~67p.)<\/h4>\n<p><strong>① 인물 소개<\/strong> (65p.)<\/p>\n<blockquote><p>Kelly McKernan's paintings are often <strong>striking images of female figures<\/strong> in bright colors of green, blue, pink or purple.<\/p><\/blockquote>\n<blockquote><p>McKernan uses the pronoun <strong>they<\/strong> instead of his or her to call themself. The <strong>37-year-old<\/strong> artist from <strong>Nashville, Tennessee<\/strong> calls their works <strong>\"surreal.\"<\/strong> They say they are \"dealing with <strong>discomfort<\/strong> in the human journey.\"<\/p><\/blockquote>\n<ul><li>화풍 = 초록·파랑·분홍·보라의 밝은 색채로 그린 <strong>강렬한 여성 인물상<\/strong><\/li><li>자기 지칭 대명사 = <strong>they<\/strong> ⭐⭐ (본문에서 명시적으로 언급)<\/li><li>나이 <strong>37세<\/strong>, 출신 <strong>내슈빌(테네시주)<\/strong>, 작품을 <strong>\"surreal\"<\/strong> 이라 부름<\/li><\/ul>\n<p><strong>② 문제의 발단<\/strong> (65p.~66p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>About a year ago<\/strong>, McKernan began seeing online images <strong>strangely similar to their own<\/strong>. They soon learned that <strong>companies were feeding artwork into AI systems to train software programs to create similar images<\/strong>.<\/p><\/blockquote>\n<ul><li>문제의 발단 = <strong>기업들이 작품을 AI 시스템에 학습 데이터로 넣어<\/strong> 비슷한 이미지를 만들게 한 것 ⭐⭐⭐<\/li><\/ul>\n<p>⚠️ 팬데믹 중 작품이 안 팔려서도, 전통 예술에 대한 관심이 식어서도, 관객을 못 찾아서도 아니다<\/p>\n<blockquote><p><strong>Surviving<\/strong> as an artist is difficult enough. The <strong>pandemic<\/strong> made it worse. But now McKernan faces another threat: <strong>artificial intelligence (AI)<\/strong>.<\/p><\/blockquote>\n<ul><li>예술가의 위협 순서: 원래 어려운 생계 → <strong>팬데믹<\/strong> → 그리고 <strong>AI<\/strong><\/li><\/ul>\n<p><strong>③ 대응 - 먼저 연락, 그러나 무응답<\/strong> (66p.) ⭐⭐⭐<\/p>\n<blockquote><p>McKernan told the *Associated Press*, \"<strong>I didn't give my consent<\/strong> for my name or work to be used this way.\"<\/p><\/blockquote>\n<blockquote><p>McKernan said they even <strong>tried to contact some of the companies<\/strong> to say \"Hey, little artist here, I know you're not thinking of me at all, but it would be really cool if you didn't use my work like this.\" <strong>But there was no answer.<\/strong><\/p><\/blockquote>\n<ul><li>발견 직후의 행동 = <strong>기업들에 연락해 사용 중단을 요청<\/strong> → <strong>답이 없었다<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p>⚠️ 보상을 요구한 것도, 추가 사용에 동의한 것도, AI 사용을 공개 지지한 것도 아니다<\/p>\n<p><strong>④ 소송<\/strong> (66p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>In January<\/strong>, McKernan, and <strong>two other artists, Karla Ortiz and Sarah Andersen<\/strong>, started <strong>legal action<\/strong> against <strong>three image-generator companies: Stability AI, Stable Diffusion and Midjourney<\/strong>. They also named the online gallery <strong>DeviantArt<\/strong> in the case.<\/p><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">원고: McKernan + Karla Ortiz + Sarah Andersen (총 3인)\n피고: Stability AI · Stable Diffusion · Midjourney (이미지 생성 3사)\n     + DeviantArt (온라인 갤러리)\n시점: 1월(January)<\/code><\/pre>\n<p><strong>⑤ 소송의 목적<\/strong> (67p.) ⭐⭐⭐<\/p>\n<blockquote><p>The artists are <strong>seeking to protect their copyrighted works and their careers<\/strong>. They say the AI image-generators <strong>violate the rights of millions of artists<\/strong> by using their artworks for training and then <strong>producing similar works that compete against the originals<\/strong>.<\/p><\/blockquote>\n<ul><li>소송의 목적 = <strong>저작권 있는 작품과 자신들의 경력을 보호하는 것<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p>⚠️ 금전적 배상도, 공개 사과도, AI 기업 폐쇄도 아니다<\/p>\n<ul><li>침해 논리: <strong>학습에 무단 사용<\/strong> → <strong>원작과 경쟁하는 유사 작품 생산<\/strong><\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>fight<\/strong> - 1형식(싸우다) / 3형식(~와 싸우다·억누르다) ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">There were children fighting in the playground.               (1형식)\nThey fought with the North during the Civil War.              (1형식)\nThe army fought against the rebels along the eastern border.  (1형식)\nThe birds were fighting over a scrap of food.                 (1형식)\nThey had to fight hard for improvements to the road system.   (1형식)\nI had to fight (back) the tears when he said he was leaving.  (3형식 - 눈물을 참다)\nWe need the public's help in fighting crime.                  (3형식)\nHe fought the disease bravely for three years.                (3형식)\nRebels have been fighting fierce battles with government forces.  (3형식)<\/code><\/pre>\n<p><strong>dis-<\/strong> ⭐⭐ - \"do the opposite of,\" \"deprive of,\" \"exclude, expel from,\" \"not\" (ex. disestablish, discourage, disbar, disagreeable, dislike, disarm, disappear, disconnect, disapprove, displace 등)<\/p>\n<p><strong>survive<\/strong> - 자동사 / <strong>타동사<\/strong> 양쪽 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">These plants cannot survive in very cold conditions.       (자동사)\nThe front passengers were lucky to survive the accident.   (타동사 - ~에서 살아남다) ⚠️ 전치사 없음\nHe is survived by his wife and four children.              (수동 - 유족으로 ~를 남기다)<\/code><\/pre>\n<p><strong>contact<\/strong> - <strong>타동사<\/strong> (전치사 불필요) ⚠️<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">I tried to contact him at his office, but he wasn't in.\nIf the solution accidentally contacts the skin, rinse the affected area thoroughly with water.<\/code><\/pre>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>fight 동사를 사용하여 <strong>1형식 문장 세 개, 3형식 문장 세 개<\/strong>를 영작하시오.<\/li><li>survive 동사를 <strong>타동사로<\/strong> 사용하여 세 개의 문장을 영작하시오.<\/li><\/ol>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What prompted McKernan to become concerned about artificial intelligence (AI)?<\/li><\/ol>\n<p>A) Their inability to sell artwork during the pandemic. <strong>B) Companies using their artwork to train AI systems without consent.<\/strong> C) A loss of interest in traditional art forms. D) Difficulty in finding an audience for their work.<\/p>\n<ol><li>What action did McKernan take upon discovering their artwork was being used by companies to train AI?<\/li><\/ol>\n<p>A) Sought compensation from the companies. B) Gave consent for further use. <strong>C) Tried to contact the companies to request they stop using their work.<\/strong> D) Publicly supported the use of AI in art.<\/p>\n<ol><li>Who did McKernan join for legal action against image-generator companies?<\/li><\/ol>\n<p>A) Only Sarah Andersen. <strong>B) Karla Ortiz and Sarah Andersen.<\/strong> C) Several unnamed digital artists. D) An international artists' union.<\/p>\n<ol><li>What are McKernan and the other artists seeking through their legal action?<\/li><\/ol>\n<p>A) Financial compensation for lost sales B) A public apology from the companies C) The shutdown of all AI image-generator companies <strong>D) Protection of their copyrighted works and careers<\/strong><\/p>\n<h4>5. 어휘 복습을 위한 읽기 (강의록 원문)<\/h4>\n<blockquote><p>During the pandemic, Sarah had to <strong>fight<\/strong> for <strong>survival<\/strong> each day. She lost <strong>contact<\/strong> with her loved ones, but her determination never wavered. Using her unique talent, she created captivating digital art. Her work gained so much attention that she had to secure a <strong>copyright<\/strong> for it. In the end, her creativity helped her not only <strong>survive<\/strong> but also thrive in challenging times.<\/p><\/blockquote>\n<ul><li>핵심어 4개(fight / survive · survival / contact / copyright)가 한 단락에 모두 들어 있다 📌<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>사건의 시간축을 그려두면 4문항이 한꺼번에 풀린다<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">약 1년 전  자신의 작품과 이상하게 닮은 이미지를 온라인에서 발견\n         ↓  원인 파악: 기업들이 작품을 AI 학습에 무단 사용\n  대응 ①  기업들에 직접 연락해 중단 요청  →  무응답\n   1월    Karla Ortiz · Sarah Andersen과 함께 소송 제기\n         피고: Stability AI · Stable Diffusion · Midjourney (+ DeviantArt)\n   목적    저작권 있는 작품과 \"경력\"의 보호<\/code><\/pre>\n<p>📌 <strong>오답은 언제나 \"돈\"으로 유혹한다<\/strong> - 소송 목적을 묻는 문항의 매력적인 오답은 늘 금전적 배상·공개 사과·기업 폐쇄다. 본문의 답은 <strong>권리와 경력의 보호<\/strong>다 ⚠️<\/p>\n<p>📌 <strong>consent(동의)가 이 단원의 열쇳말<\/strong> - \"I didn't give my <strong>consent<\/strong>\"가 사건 전체의 논리적 출발점이다. 무단 학습 → 유사 작품 생산 → 원작과 경쟁 → 권리 침해로 이어진다.<\/p>\n<p>📌 <strong>인물 정보 3종<\/strong> - 37세 / 내슈빌(테네시) / 자기 지칭 대명사 <code>they<\/code>. 특히 대명사 <code>they<\/code>를 본문이 명시적으로 설명하므로 세부 정보 문항으로 나올 수 있다.<\/p>\n<p>📌 <strong>자·타동사 3인방<\/strong> - <code>survive<\/code>(타동사로 \"~에서 살아남다\"), <code>contact<\/code>(타동사, 전치사 불필요), <code>fight<\/code>(1·3형식 모두 가능). 어휘연습이 정확히 이 구분을 겨눈다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ McKernan이 AI를 우려하게 된 계기 = 기업의 <strong>무단 학습 사용<\/strong><\/li><li>⭐⭐⭐ 발견 직후의 행동 = <strong>기업에 연락해 중단 요청<\/strong>(그러나 무응답)<\/li><li>⭐⭐⭐ 소송 동참자 = <strong>Karla Ortiz, Sarah Andersen<\/strong><\/li><li>⭐⭐⭐ 소송의 목적 = <strong>저작권 작품과 경력의 보호<\/strong><\/li><li>⭐⭐ 피고 3사 = Stability AI, Stable Diffusion, Midjourney (+ DeviantArt)<\/li><li>⭐⭐ <code>survive<\/code>의 타동사 용법 (survive the accident)<\/li><li>⭐⭐ <code>contact<\/code>는 타동사 - 전치사를 붙이지 않는다<\/li><li>⭐⭐ <code>dis-<\/code> 접두사의 네 가지 의미<\/li><li>⭐ McKernan의 인물 정보 (37세 · 내슈빌 · 대명사 they · 작품을 \"surreal\"이라 부름)<\/li><li>⭐ <code>fight<\/code>의 1형식/3형식 구분 (fight back the tears)<\/li><\/ul>"}], "terms": [{"t": "<strong>Kelly McKernan<\/strong>", "d": "테네시주 <strong>내슈빌<\/strong> 출신 <strong>37세<\/strong> 화가. 자신을 지칭할 때 <code>his/her<\/code>가 아닌 <strong><code>they<\/code><\/strong> 를 사용"}, {"t": "<strong>surreal<\/strong>", "d": "<strong>초현실적인<\/strong> - McKernan이 자기 작품을 부른 말"}, {"t": "<strong>discomfort<\/strong>", "d": "<strong>불편, 불쾌<\/strong> (<code>dis-<\/code> + comfort)"}, {"t": "<strong>image-generator company<\/strong>", "d": "<strong>이미지 생성 AI 기업<\/strong>"}, {"t": "<strong>Stability AI / Stable Diffusion / Midjourney<\/strong>", "d": "소송 대상이 된 <strong>세 이미지 생성 기업<\/strong>"}, {"t": "<strong>DeviantArt<\/strong>", "d": "소송에서 함께 지목된 <strong>온라인 갤러리<\/strong>"}, {"t": "<strong>consent<\/strong>", "d": "<strong>동의, 승낙<\/strong>"}, {"t": "<strong>legal action<\/strong>", "d": "<strong>법적 조치, 소송<\/strong>"}, {"t": "<strong>copyrighted works<\/strong>", "d": "<strong>저작권이 있는 작품<\/strong>"}, {"t": "<strong>violate<\/strong>", "d": "<strong>침해하다, 위반하다<\/strong>"}, {"t": "<strong>the Associated Press (AP)<\/strong>", "d": "미국의 <strong>통신사<\/strong> - McKernan이 인터뷰한 매체"}], "search": " 07강 - unit 7 \"artists fight back against ai using their work\" 1 part i · unit 7 · 교재 65p.~67p. · 담당 손향숙 교수 원문 출처: voa learning english, september 05, 2023 https://learningenglish.voanews.com/a/artists fight back against ai using their work/7253853.html 학습목차 1. 학습하기 2. 어휘연습 3. 연습문제 4. 어휘 복습을 위한 읽기 주요용어 용어 정의 kelly mckernan 테네시주 내슈빌 출신 37세 화가. 자신을 지칭할 때 his/her 가 아닌 they 를 사용 surreal 초현실적인 - mckernan이 자기 작품을 부른 말 discomfort 불편, 불쾌 dis + comfort image generator company 이미지 생성 ai 기업 stability ai / stable diffusion / midjourney 소송 대상이 된 세 이미지 생성 기업 deviantart 소송에서 함께 지목된 온라인 갤러리 consent 동의, 승낙 legal action 법적 조치, 소송 copyrighted works 저작권이 있는 작품 violate 침해하다, 위반하다 the associated press ap 미국의 통신사 - mckernan이 인터뷰한 매체 본문 정리 1. 학습하기 - 본문 교재 65p.~67p. ① 인물 소개 65p. kelly mckernan's paintings are often striking images of female figures in bright colors of green, blue, pink or purple. mckernan uses the pronoun they instead of his or her to call themself. the 37 year old artist from nashville, tennessee calls their works \"surreal.\" they say they are \"dealing with discomfort in the human journey.\" 화풍 = 초록·파랑·분홍·보라의 밝은 색채로 그린 강렬한 여성 인물상 자기 지칭 대명사 = they ⭐⭐ 본문에서 명시적으로 언급 나이 37세 , 출신 내슈빌 테네시주 , 작품을 \"surreal\" 이라 부름 ② 문제의 발단 65p.~66p. ⭐⭐⭐ about a year ago , mckernan began seeing online images strangely similar to their own . they soon learned that companies were feeding artwork into ai systems to train software programs to create similar images . 문제의 발단 = 기업들이 작품을 ai 시스템에 학습 데이터로 넣어 비슷한 이미지를 만들게 한 것 ⭐⭐⭐ ⚠️ 팬데믹 중 작품이 안 팔려서도, 전통 예술에 대한 관심이 식어서도, 관객을 못 찾아서도 아니다 surviving as an artist is difficult enough. the pandemic made it worse. but now mckernan faces another threat: artificial intelligence ai . 예술가의 위협 순서: 원래 어려운 생계 → 팬데믹 → 그리고 ai ③ 대응 - 먼저 연락, 그러나 무응답 66p. ⭐⭐⭐ mckernan told the associated press , \" i didn't give my consent for my name or work to be used this way.\" mckernan said they even tried to contact some of the companies to say \"hey, little artist here, i know you're not thinking of me at all, but it would be really cool if you didn't use my work like this.\" but there was no answer. 발견 직후의 행동 = 기업들에 연락해 사용 중단을 요청 → 답이 없었다 ⭐⭐⭐ ⚠️ 보상을 요구한 것도, 추가 사용에 동의한 것도, ai 사용을 공개 지지한 것도 아니다 ④ 소송 66p. ⭐⭐⭐ in january , mckernan, and two other artists, karla ortiz and sarah andersen , started legal action against three image generator companies: stability ai, stable diffusion and midjourney . they also named the online gallery deviantart in the case. ⑤ 소송의 목적 67p. ⭐⭐⭐ the artists are seeking to protect their copyrighted works and their careers . they say the ai image generators violate the rights of millions of artists by using their artworks for training and then producing similar works that compete against the originals . 소송의 목적 = 저작권 있는 작품과 자신들의 경력을 보호하는 것 ⭐⭐⭐ ⚠️ 금전적 배상도, 공개 사과도, ai 기업 폐쇄도 아니다 침해 논리: 학습에 무단 사용 → 원작과 경쟁하는 유사 작품 생산 2. 어휘·어법 노트 강의록 원문 fight - 1형식 싸우다 / 3형식 ~와 싸우다·억누르다 ⭐⭐ dis ⭐⭐ - \"do the opposite of,\" \"deprive of,\" \"exclude, expel from,\" \"not\" ex. disestablish, discourage, disbar, disagreeable, dislike, disarm, disappear, disconnect, disapprove, displace 등 survive - 자동사 / 타동사 양쪽 ⭐⭐ contact - 타동사 전치사 불필요 ⚠️ 3. 어휘연습 강의록 원문 1. fight 동사를 사용하여 1형식 문장 세 개, 3형식 문장 세 개 를 영작하시오. 2. survive 동사를 타동사로 사용하여 세 개의 문장을 영작하시오. 4. 연습문제 강의록 원문 1. what prompted mckernan to become concerned about artificial intelligence ai ? a their inability to sell artwork during the pandemic. b companies using their artwork to train ai systems without consent. c a loss of interest in traditional art forms. d difficulty in finding an audience for their work. 2. what action did mckernan take upon discovering their artwork was being used by companies to train ai? a sought compensation from the companies. b gave consent for further use. c tried to contact the companies to request they stop using their work. d publicly supported the use of ai in art. 3. who did mckernan join for legal action against image generator companies? a only sarah andersen. b karla ortiz and sarah andersen. c several unnamed digital artists. d an international artists' union. 4. what are mckernan and the other artists seeking through their legal action? a financial compensation for lost sales b a public apology from the companies c the shutdown of all ai image generator companies d protection of their copyrighted works and careers 5. 어휘 복습을 위한 읽기 강의록 원문 during the pandemic, sarah had to fight for survival each day. she lost contact with her loved ones, but her determination never wavered. using her unique talent, she created captivating digital art. her work gained so much attention that she had to secure a copyright for it. in the end, her creativity helped her not only survive but also thrive in challenging times. 핵심어 4개 fight / survive · survival / contact / copyright 가 한 단락에 모두 들어 있다 📌 핵심 정리 📌 사건의 시간축을 그려두면 4문항이 한꺼번에 풀린다 📌 오답은 언제나 \"돈\"으로 유혹한다 - 소송 목적을 묻는 문항의 매력적인 오답은 늘 금전적 배상·공개 사과·기업 폐쇄다. 본문의 답은 권리와 경력의 보호 다 ⚠️ 📌 consent 동의 가 이 단원의 열쇳말 - \"i didn't give my consent \"가 사건 전체의 논리적 출발점이다. 무단 학습 → 유사 작품 생산 → 원작과 경쟁 → 권리 침해로 이어진다. 📌 인물 정보 3종 - 37세 / 내슈빌 테네시 / 자기 지칭 대명사 they . 특히 대명사 they 를 본문이 명시적으로 설명하므로 세부 정보 문항으로 나올 수 있다. 📌 자·타동사 3인방 - survive 타동사로 \"~에서 살아남다\" , contact 타동사, 전치사 불필요 , fight 1·3형식 모두 가능 . 어휘연습이 정확히 이 구분을 겨눈다. 시험 대비 포인트 ⭐⭐⭐ mckernan이 ai를 우려하게 된 계기 = 기업의 무단 학습 사용 ⭐⭐⭐ 발견 직후의 행동 = 기업에 연락해 중단 요청 그러나 무응답 ⭐⭐⭐ 소송 동참자 = karla ortiz, sarah andersen ⭐⭐⭐ 소송의 목적 = 저작권 작품과 경력의 보호 ⭐⭐ 피고 3사 = stability ai, stable diffusion, midjourney + deviantart ⭐⭐ survive 의 타동사 용법 survive the accident ⭐⭐ contact 는 타동사 - 전치사를 붙이지 않는다 ⭐⭐ dis 접두사의 네 가지 의미 ⭐ mckernan의 인물 정보 37세 · 내슈빌 · 대명사 they · 작품을 \"surreal\"이라 부름 ⭐ fight 의 1형식/3형식 구분 fight back the tears "}, {"id": 8, "title": "Unit 7 \"Artists Fight Back against AI Using Their Work\" [2]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><li>어휘 복습을 위한 읽기<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>damages<\/strong><\/td><td>(복수형) <strong>손해배상금<\/strong> ⚠️ <code>damage<\/code>(피해)와 구별 - 법정에서 청구하는 <strong>금전적 배상<\/strong><\/td><\/tr><tr><td><strong>court order<\/strong><\/td><td><strong>법원 명령<\/strong><\/td><\/tr><tr><td><strong>without permission<\/strong><\/td><td><strong>허가 없이<\/strong><\/td><\/tr><tr><td><strong>profit (from ~)<\/strong><\/td><td><strong>~로 이익을 얻다<\/strong><\/td><\/tr><tr><td><strong>court document<\/strong><\/td><td><strong>법정 제출 문서<\/strong><\/td><\/tr><tr><td><strong>U.S. Senate hearing<\/strong><\/td><td><strong>미국 상원 청문회<\/strong><\/td><\/tr><tr><td><strong>Karla Ortiz<\/strong><\/td><td><strong>엔터테인먼트 산업<\/strong>에서 일하는 화가. 작품이 *Guardians of the Galaxy Vol. 3*, *Jurassic World* 등에 사용됨<\/td><\/tr><tr><td><strong>federal judge<\/strong><\/td><td><strong>연방 판사<\/strong> - 이 사건은 <strong>샌프란시스코<\/strong>의 연방 판사가 판단<\/td><\/tr><tr><td><strong>the U.S. Copyright Office<\/strong><\/td><td><strong>미국 저작권청<\/strong><\/td><\/tr><tr><td><strong>issue<\/strong><\/td><td>(증명서·성명을) <strong>발부·발표하다<\/strong>; (소리가) <strong>나오다<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 67p.~69p.)<\/h4>\n<p><strong>① 소송에서 구하는 것<\/strong> (67p.) ⭐⭐⭐<\/p>\n<blockquote><p>The artists are seeking <strong>damages<\/strong> and <strong>a court order to stop AI companies from using their works without permission<\/strong>.<\/p><\/blockquote>\n<ul><li>청구 내용 두 가지 = ① <strong>손해배상금(damages)<\/strong> ② <strong>무단 사용 금지 법원 명령<\/strong><\/li><li>⚠️ <code>damages<\/code>(복수) = <strong>손해배상금<\/strong>. \"피해\"가 아니다 (연습문제로 직접 출제) ⭐⭐⭐<\/li><li><code>stop A from -ing<\/code> = A가 ~하는 것을 막다 ⭐⭐<\/li><\/ul>\n<p><strong>② McKernan의 육성<\/strong> (67p.)<\/p>\n<blockquote><p>McKernan said, \"At the end of the day, someone's <strong>profiting from<\/strong> my work. I had rent due yesterday, and I'm <strong>$200 short<\/strong>… And it just doesn't feel right.\"<\/p><\/blockquote>\n<ul><li>누군가 자기 작품으로 <strong>이익을 얻고 있는데<\/strong>, 정작 본인은 <strong>월세 200달러가 모자란<\/strong> 상황<\/li><li><code>profit <strong>from<\/strong><\/code> - 전치사 <code>from<\/code> ⭐⭐ (연습문제로 직접 출제)<\/li><\/ul>\n<p><strong>③ 기업 측 입장<\/strong> (67p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Stability AI would not comment<\/strong> to the *Associated Press* for the story. In a <strong>court document<\/strong>, the company said it uses simple words to create <strong>\"new and unique images.\"<\/strong> The company added the program <strong>creates new works and does not violate copyright<\/strong>.<\/p><\/blockquote>\n<ul><li>Stability AI는 AP에 <strong>논평을 거부<\/strong>했고, <strong>법정 문서<\/strong>에서는 \"새롭고 독창적인 이미지를 만든다 → <strong>저작권을 침해하지 않는다<\/strong>\"고 주장 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>A Stability AI company official appeared before a <strong>U.S. Senate hearing in July<\/strong>. He said that <strong>artists are not paid for the images used to train AI software<\/strong>.<\/p><\/blockquote>\n<blockquote><p><strong>Midjourney and DeviantArt did not return emailed requests for comment.<\/strong><\/p><\/blockquote>\n<ul><li>7월 상원 청문회에서 Stability AI 임원이 인정한 사실 = <strong>학습에 쓰인 이미지에 대해 예술가들은 보수를 받지 못한다<\/strong> ⭐⭐⭐<\/li><li>Midjourney와 DeviantArt는 이메일 논평 요청에 <strong>응답하지 않았다<\/strong> ⚠️ (\"응답했다\"는 보기가 오답 미끼)<\/li><\/ul>\n<p><strong>④ Karla Ortiz의 우려<\/strong> (68p.) ⭐⭐<\/p>\n<blockquote><p><strong>Karla Ortiz works in the entertainment industry.<\/strong> Her work has been used in several well-known movies, including *Guardians of the Galaxy Vol. 3* and *Jurassic World*.<\/p><\/blockquote>\n<blockquote><p>She feared that companies would think artists <strong>cost too much<\/strong>. Why, she asked, would companies employ artists if they can pay <strong>$30 a month<\/strong> for AI-generated works?<\/p><\/blockquote>\n<ul><li>Ortiz의 업계 = <strong>엔터테인먼트(Entertainment)<\/strong> ⭐⭐⭐<\/li><li>우려의 핵심: 월 <strong>30달러<\/strong>면 AI 생성물을 쓸 수 있는데 굳이 화가를 고용하겠는가<\/li><\/ul>\n<p><strong>⑤ 사건의 향방<\/strong> (68p.)<\/p>\n<blockquote><p>McKernan agreed: \"<strong>Will I even have work a year from now?<\/strong>\" A <strong>federal judge in San Francisco<\/strong> will decide the case.<\/p><\/blockquote>\n<p><strong>⑥ 인간 예술가의 잠정적 승리<\/strong> (68p.~69p.) ⭐⭐⭐<\/p>\n<blockquote><p>Meanwhile, in a <strong>temporary win for human artists<\/strong> last month, another federal judge <strong>agreed with the decision by the U.S. Copyright Office not to issue copyright for AI-generated artwork<\/strong>.<\/p><\/blockquote>\n<ul><li>미국 저작권청의 결정 = <strong>AI 생성 작품에는 저작권을 발부하지 않는다<\/strong> ⭐⭐⭐<\/li><li>연방 판사가 이에 동의 → 인간 예술가들의 <strong>잠정적 승리<\/strong><\/li><li>⚠️ \"모든 AI 생성물에 저작권을 부여했다\" \"일부에 부여했다\"는 모두 반대 진술<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>stop<\/strong> - 자동사·타동사, <code>stop -ing<\/code> vs <code>stop to -부정사<\/code> ⭐⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Once I start eating chocolate, I can't stop.\nI couldn't stop laughing.                       (stop + -ing = 하던 것을 멈추다)\nStop the car, I want to get out!\nI heard him shout, \"Stop, or I'll shoot!\"\nDoes this train stop at Finsbury Park?\nI stopped to pick up a letter that I'd dropped. (stop + to부정사 = ~하기 위해 멈추다) ⚠️ 의미 다름\nThey've put barriers up to stop people (from) getting through.   (stop A from -ing)\nSomething must be done to stop the fighting.\nNow that you're here, why don't you stop for some tea?\nWe stopped (up) the gap with some rags.         (막다·메우다)<\/code><\/pre>\n<p><strong>profit<\/strong> - 동사 <code>profit from ~<\/code> ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">It's sickening that somebody would profit from her misfortune.\nWhat will it profit us to make this bargain?\nTraders can profit by buying the stocks back later at lower prices.<\/code><\/pre>\n<p><strong>cost<\/strong> - <code>cost – cost – cost<\/code> (3단 변화 동일) ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">\"How much does this book cost?\" \"It costs £25.\"\nIt costs a lot to buy a house in this part of Sydney.\nDrinking and driving costs lives.              (목숨을 앗아가다)\nThe trip will cost you $1,000.                 (4형식)\nHis affairs cost him his marriage.             (4형식 - 대가로 잃게 하다)<\/code><\/pre>\n<p><strong>issue<\/strong> - 다의어 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The school issued a statement about its plans to the press.       (발표하다)\nThe school issued the press with a statement about its plans.     (issue A with B)\nThe government issued a warning that the strikers should end their action or face dismissal.\nA tiny voice issued from a speaker.                                (나오다 - 자동사)\nA valid government-issued identification document should contain a photo, current address, signature and a unique number or bar code.<\/code><\/pre>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>cost 동사를 사용하여 다음 문장을 영작하시오.<\/li><\/ol>\n<p>1) 이 책의 가격은 얼마인가요? → <strong>How much does this book cost?<\/strong> 2) 음주 운전은 생명을 앗아간다. → <strong>Drinking and driving costs lives.<\/strong> 3) 그의 불륜은 결혼생활을 끝나게 했다. → <strong>His affairs cost him his marriage.<\/strong><\/p>\n<ol><li>괄호 안에 공통으로 들어갈 동사로 적절한 것은? → <strong>issued<\/strong><\/li><\/ol>\n<ul><li>The school ( ) a statement about its plans to the press.<\/li><li>The government ( ) a warning that the strikers should end their action or face dismissal.<\/li><li>A tiny voice ( ) from a speaker.<\/li><\/ul>\n<ol><li>괄호 안에 필요한 전치사는 무엇인가? → <strong>from<\/strong><\/li><\/ol>\n<ul><li>It's sickening that somebody would profit ( ) her misfortune.<\/li><\/ul>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What did the Stability AI company say in a court document?<\/li><\/ol>\n<p><strong>A) The Stability AI company does not violate copyright.<\/strong> B) AI-generated works have nothing to do with copyright. C) Companies should employ artists instead of using AI. D) The company relies solely on human artists for all artwork.<\/p>\n<ol><li>What industry does Karla Ortiz work in?<\/li><\/ol>\n<p>A) Automotive manufacturing B) Technology <strong>C) Entertainment<\/strong> D) Aerospace<\/p>\n<ol><li>What was the decision by the U.S. Copyright Office regarding AI-generated artwork?<\/li><\/ol>\n<p>A) They granted copyright protection for all AI-generated artwork. B) They issued copyright protection for certain AI-generated artwork. <strong>C) They declined to issue copyright for AI-generated artwork.<\/strong> D) They mandated that AI-generated artwork can only be used for specific purposes.<\/p>\n<ol><li>문맥을 고려할 때 빈 곳에 들어갈 보기로 가장 적절한 것은?<\/li><\/ol>\n<ul><li>The artists are seeking to protect their copyrighted works and their careers. They say the AI image-generators violate the rights of millions of artists by ______ and then producing similar works that compete against the originals.<\/li><li>A) painting murals in public spaces <strong>B) using their artworks for training<\/strong><\/li><\/ul>\n<p>C) creating their own music albums D) generating vivid color paintings<\/p>\n<ol><li>Which of the following is true?<\/li><\/ol>\n<p>A) Stability AI commented to the Associated Press, stating that they do not create new works. ← 논평 자체를 거부함 <strong>B) A Stability AI company official mentioned in a U.S. Senate hearing that artists are not paid for the images used to train AI software<\/strong> C) Midjourney and DeviantArt responded to emails requesting comments. ← 응답하지 않음 D) Another federal judge agreed with the U.S. Copyright Office's decision to issue copyright for AI-generated artwork. ← <strong>not to issue<\/strong>가 맞음<\/p>\n<ol><li>다음 문장에서 밑줄 친 <strong>damages<\/strong>의 의미는 무엇인가?<\/li><\/ol>\n<ul><li>The artists are seeking <strong>damages<\/strong> and a court order to stop AI companies from using their works without permission.<\/li><li>→ <strong>손해배상금<\/strong> (단순한 \"피해\"가 아니라 법적으로 청구하는 금전적 배상)<\/li><\/ul>\n<h4>5. 어휘 복습을 위한 읽기 (강의록 원문)<\/h4>\n<blockquote><p>In the crowded courtroom, the plaintiff accused the company of deceit, claiming their fraudulent practices had <strong>cost<\/strong> him thousands. The defendant's lawyer argued that their client aimed only to <strong>profit<\/strong> legitimately, with no intention to cause harm. The key issue remained whether the company had knowingly engaged in deceptive tactics. The plaintiff's evidence was compelling, showing clear financial <strong>damages<\/strong> caused by the defendant's actions. Ultimately, the judge ruled in favor of the plaintiff, ordering the defendant to <strong>stop<\/strong> its practices and pay substantial <strong>damages<\/strong>.<\/p><\/blockquote>\n<ul><li>핵심어 4개(cost / profit / damages / stop)가 한 단락에 모두 들어 있다 📌<\/li><li>📌 이 단락은 7·8강 본문과 <strong>같은 소송 구조<\/strong>(원고 vs 피고 → 손해배상 + 중지 명령)를 그대로 재현한다<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong><code>damages<\/code>는 \"피해\"가 아니라 \"손해배상금\"<\/strong> - 8강 최대 함정. 복수형으로 쓰이면 법률 용어이고, 이 단원에서는 항상 <strong>금전적 배상<\/strong>을 뜻한다 ⚠️<\/p>\n<p>📌 <strong>양측 주장을 표로 대립시켜 외운다<\/strong><\/p>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>예술가 측<\/th><th>Stability AI 측<\/th><\/tr><\/thead><tbody><tr><td>주장<\/td><td>무단 학습 → 원작과 경쟁하는 유사물 생산 → <strong>권리 침해<\/strong><\/td><td>단순한 단어로 <strong>\"새롭고 독창적인 이미지\"<\/strong> 를 만들 뿐 → <strong>침해 아님<\/strong><\/td><\/tr><tr><td>요구<\/td><td><strong>손해배상금 + 무단 사용 중지 명령<\/strong><\/td><td>(AP 논평 <strong>거부<\/strong>)<\/td><\/tr><tr><td>인정한 사실<\/td><td>-<\/td><td>상원 청문회: <strong>학습용 이미지에 예술가는 보수를 못 받는다<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>📌 <strong>응답 여부까지 출제된다<\/strong> - Stability AI는 <strong>논평 거부<\/strong>, Midjourney와 DeviantArt는 <strong>무응답<\/strong>. \"응답했다\"로 바꾼 보기가 오답으로 나온다.<\/p>\n<p>📌 <strong>저작권청의 결정은 \"발부하지 않음\"<\/strong> - <code>not to issue copyright for AI-generated artwork<\/code>. <code>not<\/code>이 빠진 보기가 함정이므로 부정어를 반드시 확인한다 ⚠️<\/p>\n<p>📌 <strong>Ortiz의 논리는 숫자로 기억한다<\/strong> - 화가 고용 vs <strong>월 30달러<\/strong> AI. 이 대비가 위기감의 근거다.<\/p>\n<p>📌 <strong>stop의 두 얼굴<\/strong> - <code>stop -ing<\/code>(하던 일을 멈추다) vs <code>stop to -부정사<\/code>(~하려고 멈추다). 그리고 <code>stop A from -ing<\/code>은 본문의 청구 내용 문장에 그대로 쓰였다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ <code>damages<\/code> = 손해배상금 (문맥상 의미 묻기)<\/li><li>⭐⭐⭐ 소송에서 구하는 것 = 손해배상금 + 무단 사용 중지 법원 명령<\/li><li>⭐⭐⭐ Stability AI의 법정 문서 주장 = 저작권을 침해하지 않는다<\/li><li>⭐⭐⭐ 미국 저작권청 결정 = AI 생성 작품에 저작권 <strong>발부하지 않음<\/strong><\/li><li>⭐⭐⭐ Karla Ortiz의 업계 = 엔터테인먼트<\/li><li>⭐⭐ 상원 청문회에서 인정된 사실 = 학습용 이미지에 대한 예술가 보수 없음<\/li><li>⭐⭐ Midjourney·DeviantArt는 논평 요청에 무응답<\/li><li>⭐⭐ <code>sto 용 문장에 그대로 쓰였다. 시험 대비 포인트 ⭐⭐⭐ damages = 손해배상금 문맥상 의미 묻기 ⭐⭐⭐ 소송에서 구하는 것 = 손해배상금 + 무단 사용 중지 법원 명령 ⭐⭐⭐ stability ai의 법정 문서 주장 = 저작권을 침해하지 않는다 ⭐⭐⭐ 미국 저작권청 결정 = ai 생성 작품에 저작권 발부하지 않음 ⭐⭐⭐ karla ortiz의 업계 = 엔터테인먼트 ⭐⭐ 상원 청문회에서 인정된 사실 = 학습용 이미지에 대한 예술가 보수 없음 ⭐⭐ midjourney·deviantart는 논평 요청에 무응답 ⭐⭐ stop a from ing , stop ing vs stop to 부정사 ⭐⭐ profit from 전치사, cost 4형식 cost him his marriage ⭐ issue 의 다의어 발부·발표하다 / 나오다 ⭐ 월 30달러 ai vs 화가 고용 - ortiz의 위기감 논거 "}, {"id": 9, "title": "Forecasting Trends: A Closer Look at the Top Keywords Shaping the Year Ahead (1)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>forecast<\/strong><\/td><td><strong>예측하다<\/strong> - 자료·근거에 기반한 예보 (일기예보 등)<\/td><\/tr><tr><td><strong>predict<\/strong><\/td><td><strong>예측하다<\/strong> - 근거 유무와 무관하게 \"앞일을 말하다\" ⚠️ forecast와 뉘앙스 차이<\/td><\/tr><tr><td><strong>shape<\/strong><\/td><td>(동사) <strong>형성하다, 좌우하다<\/strong><\/td><\/tr><tr><td><strong>geopolitical events<\/strong><\/td><td><strong>지정학적 사건<\/strong><\/td><\/tr><tr><td><strong>emerging issues<\/strong><\/td><td><strong>새로 떠오르는 이슈<\/strong><\/td><\/tr><tr><td><strong>evolve<\/strong><\/td><td><strong>진화하다, 발전하다<\/strong><\/td><\/tr><tr><td><strong>metaverse<\/strong><\/td><td><strong>메타버스<\/strong><\/td><\/tr><tr><td><strong>virtual reality (VR) / augmented reality (AR)<\/strong><\/td><td><strong>가상현실 / 증강현실<\/strong><\/td><\/tr><tr><td><strong>immersive<\/strong><\/td><td><strong>몰입형의<\/strong><\/td><\/tr><tr><td><strong>prominence<\/strong><\/td><td><strong>두드러짐, 부각<\/strong> (<code>gain more prominence<\/code> = 더 부각되다)<\/td><\/tr><tr><td><strong>intensify<\/strong><\/td><td><strong>격화되다, 심화되다<\/strong><\/td><\/tr><tr><td><strong>sustainability<\/strong><\/td><td><strong>지속가능성<\/strong><\/td><\/tr><tr><td><strong>environmental degradation<\/strong><\/td><td><strong>환경 악화<\/strong><\/td><\/tr><tr><td><strong>escalate<\/strong><\/td><td><strong>고조되다, 확대되다<\/strong><\/td><\/tr><tr><td><strong>renewable energy / circular economy<\/strong><\/td><td><strong>재생에너지 / 순환경제<\/strong><\/td><\/tr><tr><td><strong>prioritize<\/strong><\/td><td><strong>우선시하다<\/strong><\/td><\/tr><tr><td><strong>bias mitigation<\/strong><\/td><td><strong>편향 완화<\/strong><\/td><\/tr><tr><td><strong>transparency / accountability<\/strong><\/td><td><strong>투명성 / 책무성<\/strong><\/td><\/tr><tr><td><strong>responsible AI development<\/strong><\/td><td><strong>책임 있는 AI 개발<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 85p.~87p.)<\/h4>\n<p><strong>① 제목과 도입<\/strong> (85p.)<\/p>\n<blockquote><p><strong>Forecasting<\/strong> Trends: A Closer <strong>look at<\/strong> the Top Keywords [<strong>shaping<\/strong> the Year Ahead]<\/p><\/blockquote>\n<ul><li><code>a closer look at ~<\/code> = ~을 더 자세히 들여다보기<\/li><li><code>shaping the year ahead<\/code> = 앞으로 올 해를 <strong>형성하는<\/strong>(현재분사가 keywords를 수식)<\/li><li>⚠️ <strong>forecast vs. predict<\/strong> - 강의에서 명시적으로 대비시킨 쌍 ⭐⭐<\/li><\/ul>\n<blockquote><p>We explore the key keywords {that will lead the coming year} [to predict future trends]. [By looking at important keywords], we predict {what will change in the coming year}.<\/p><\/blockquote>\n<p><strong>② 예측의 어려움<\/strong> (85p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Predicting specific keywords<\/strong> for a particular year can be <strong>challenging<\/strong> {<strong>as<\/strong> it <strong>depends on<\/strong> various factors <strong>such as<\/strong> technological advancements, cultural trends, geopolitical events, and emerging issues}.<\/p><\/blockquote>\n<ul><li>특정 연도의 키워드 예측이 어려운 이유 = <strong>여러 요인에 달려 있기 때문<\/strong><\/li><li>네 가지 요인: <strong>기술 발전 · 문화적 트렌드 · 지정학적 사건 · 새로 떠오르는 이슈<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>📌 문장비교 (강의록 원문)<\/strong> - 한 문장을 쉬운 세 문장으로 풀어쓰기<\/p>\n<blockquote><p>→ Predicting specific keywords for a particular year can be challenging. / <strong>This is because<\/strong> it depends on various factors. / <strong>These factors include<\/strong> technological advancements, cultural trends, geopolitical events, and emerging issues.<\/p><\/blockquote>\n<ul><li>⚠️ <code>challenging<\/code>(형용사) ↔ <code>challenge<\/code>(명사) 혼동 주의 - 연습문제로 직접 출제 ⭐⭐⭐<\/li><li>⚠️ <code>it <strong>depends<\/strong> on<\/code> - 주어가 <code>it<\/code>이므로 <strong>3인칭 단수 -s<\/strong> 필요 (수 일치) ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>However, here are some keywords {that might be significant in next year [<strong>based on<\/strong> ongoing trends and potential developments]}. These are also <strong>based on<\/strong> emerging issues but may <strong>evolve<\/strong> over time <strong>depending on<\/strong> developments in various fields.<\/p><\/blockquote>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ However, here are some keywords that might be significant next year. / <strong>These are<\/strong> based on ongoing trends and potential developments. → These are also based on emerging issues. / <strong>However, they<\/strong> may evolve over time. / <strong>This evolution will<\/strong> depend on developments in various fields.<\/p><\/blockquote>\n<ul><li><code>based on ~<\/code>(~에 근거하여) vs <code>depending on ~<\/code>(~에 따라) - 두 표현의 구분 ⭐⭐<\/li><\/ul>\n<p><strong>③ 키워드 ① 메타버스 (Metaverse)<\/strong> (86p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Metaverse<\/strong>: [<strong>With the growing interest in<\/strong> virtual reality (VR), augmented reality (AR), and <strong>immersive<\/strong> digital experiences,] the <strong>concept<\/strong> of the metaverse <strong>is likely to<\/strong> gain more <strong>prominence<\/strong>. Companies like Meta Platforms (<strong>formerly<\/strong> Facebook) are <strong>investing heavily<\/strong> in this area, and discussions around the metaverse are likely to <strong>intensify<\/strong>.<\/p><\/blockquote>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ <strong>As more people become interested in<\/strong> VR and AR, / the <strong>idea<\/strong> of the metaverse is likely to become <strong>more important<\/strong>. → <strong>As people show more interest in<\/strong> VR and AR, / the metaverse <strong>will probably<\/strong> become <strong>more popular<\/strong>. → Companies like Meta (<strong>previously known as<\/strong> Facebook) are <strong>putting a lot of money into<\/strong> this area, and discussions <strong>about<\/strong> the metaverse <strong>will probably increase<\/strong>. → Big companies like Meta are <strong>spending a lot of money on<\/strong> this, and <strong>people will talk more about<\/strong> the metaverse.<\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>원문 표현<\/th><th>쉬운 표현<\/th><\/tr><\/thead><tbody><tr><td><code>with the growing interest in ~<\/code><\/td><td><code>as more people become interested in ~<\/code><\/td><\/tr><tr><td><code>concept<\/code><\/td><td><code>idea<\/code><\/td><\/tr><tr><td><code>gain more prominence<\/code><\/td><td><code>become more important / more popular<\/code><\/td><\/tr><tr><td><code>formerly<\/code><\/td><td><code>previously known as<\/code><\/td><\/tr><tr><td><code>invest heavily in ~<\/code><\/td><td><code>put a lot of money into ~<\/code> / <code>spend a lot of money on ~<\/code><\/td><\/tr><tr><td><code>intensify<\/code><\/td><td><code>increase<\/code> / <code>people will talk more about ~<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>④ 키워드 ② 지속가능성 (Sustainability)<\/strong> (86p.~87p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Sustainability<\/strong>: [Concerns about climate change and environmental degradation] <strong>continue to escalate<\/strong>, [<strong>driving conversations around<\/strong> sustainability]. Keywords [related to renewable energy, circular economy, eco-friendly practices, and climate action] <strong>are expected to remain significant<\/strong> {<strong>as<\/strong> individuals, businesses, and governments <strong>prioritize<\/strong> sustainability efforts}.<\/p><\/blockquote>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ Concerns about climate change and <strong>damage to the environment are growing<\/strong>, <strong>leading to more discussions about<\/strong> sustainability. → <strong>People are more worried about<\/strong> climate change and <strong>harm to<\/strong> the environment. <strong>This makes them talk more about<\/strong> sustainability. → Keywords <strong>such as<\/strong> renewable energy, <strong>recycling economy<\/strong>, eco-friendly actions, and <strong>climate protection will likely stay important<\/strong> as people, businesses, and governments <strong>focus more on<\/strong> sustainability. → <strong>Important words like<\/strong> renewable energy, recycling, being eco-friendly, and climate protection <strong>will still be important<\/strong> as everyone tries to focus on sustainability.<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ <code>driving conversations around sustainability<\/code> = <strong>사람들이 지속가능성에 대해 더 많이 이야기하게 만드는 것<\/strong><\/li><\/ul>\n<p>(연습문제로 직접 출제 - \"대화를 막다/줄이다/회피하다\"는 모두 오답)<\/p>\n<ul><li><code>circular economy<\/code> ≈ <code>recycling economy<\/code>, <code>climate action<\/code> ≈ <code>climate protection<\/code><\/li><\/ul>\n<p><strong>⑤ 키워드 ③ AI 윤리 (AI Ethics)<\/strong> (87p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Artificial Intelligence (AI) Ethics<\/strong>: {<strong>As<\/strong> AI technologies become more <strong>integrated<\/strong> into various <strong>aspects<\/strong> of society,} ethical considerations [surrounding AI use], [<strong>such as<\/strong> <strong>bias mitigation<\/strong>, <strong>transparency<\/strong>, and <strong>accountability<\/strong>,] are <strong>gaining attention<\/strong>. Keywords [related to AI ethics and <strong>responsible AI development<\/strong>] <strong>are likely to be prominent<\/strong> in discussions about the future of technology.<\/p><\/blockquote>\n<ul><li>AI 윤리의 세 축 = <strong>편향 완화 · 투명성 · 책무성<\/strong> ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>ℹ️ 참고(강의록 표기) - <strong>Responsibility<\/strong>(책임이 있음) vs. <strong>accountability<\/strong>(벌어진 결과에 대해 설명하고 답변할 책임)<\/p><\/blockquote>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ <strong>As AI technologies become more common in different parts of society<\/strong>, people are <strong>paying more attention to<\/strong> the ethical issues {that come with AI, like <strong>reducing bias<\/strong>, <strong>making AI systems clear and open<\/strong>, and <strong>ensuring responsibility<\/strong>}. → As AI becomes more common in our lives, people are starting to think more about the right and wrong ways to use it. They worry about things like <strong>making sure AI is fair<\/strong>, <strong>easy to understand<\/strong>, and that <strong>someone is responsible for what AI does<\/strong>.<\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>원문<\/th><th>쉬운 표현<\/th><\/tr><\/thead><tbody><tr><td><code>bias mitigation<\/code><\/td><td><code>reducing bias<\/code> / <code>making sure AI is fair<\/code><\/td><\/tr><tr><td><code>transparency<\/code><\/td><td><code>making AI systems clear and open<\/code> / <code>easy to understand<\/code><\/td><\/tr><tr><td><code>accountability<\/code><\/td><td><code>ensuring responsibility<\/code> / <code>someone is responsible for what AI does<\/code><\/td><\/tr><tr><td><code>integrated into aspects of society<\/code><\/td><td><code>more common in different parts of society<\/code><\/td><\/tr><tr><td><code>gaining attention<\/code><\/td><td><code>paying more attention to<\/code><\/td><\/tr><tr><td><code>be prominent<\/code><\/td><td><code>be important<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<p><strong>(1) Grammatical Understanding<\/strong> - Which of the following sentences is grammatically correct?<\/p>\n<ul><li>A) Predict<strong>ing<\/strong> specific keywords for a particular year can be <strong>challenge<\/strong> as it <strong>depend<\/strong> on various factors. ← <code>challenge<\/code>(명사), <code>depend<\/code>(수 불일치)<\/li><li><strong>B) Predicting specific keywords for a particular year can be challenging as it depends on various factors.<\/strong> ✅<\/li><li>C) <strong>Predict<\/strong> specific keywords for a particular year can be challenging as it <strong>depending<\/strong> on various factors. ← 주어 자리에 동사원형, 정동사 없음<\/li><li>D) Predicting … can be <strong>challenge<\/strong> as it <strong>depending<\/strong> on various factors. ← 둘 다 오류<\/li><\/ul>\n<p><strong>(2) Word Usage<\/strong> - \"Companies like Meta Platforms (formerly Facebook) are ______ heavily in this area.\"<\/p>\n<ul><li>A) invested <strong>B) investing<\/strong> ✅ C) investment D) invests<\/li><li>→ <code>are + -ing<\/code> 현재진행형이므로 <strong>investing<\/strong><\/li><\/ul>\n<p><strong>(3) Phrase Understanding<\/strong> - In the context of the text, what does the phrase \"driving conversations around sustainability\" most likely mean?<\/p>\n<ul><li>A) Preventing discussions about sustainability. <strong>B) Causing people to talk more about sustainability.<\/strong> ✅<\/li><li>C) Reducing interest in sustainability. D) Avoiding the topic of sustainability altogether.<\/li><\/ul>\n<p><strong>(4) Sentence Understanding<\/strong> - Which sentence best summarizes: \"As AI technologies become more integrated into various aspects of society, ethical considerations surrounding AI use, such as bias mitigation, transparency, and accountability, are gaining attention.\"<\/p>\n<ul><li>A) AI technologies are being ignored in society, leading to fewer discussions about ethics.<\/li><li><strong>B) As AI becomes more common in society, there is increasing focus on the ethical issues related to its use.<\/strong> ✅<\/li><li>C) Ethical considerations are not important when discussing AI technologies.<\/li><li>D) AI technologies have no impact on ethical considerations in society.<\/li><\/ul>\n<p><strong>(5) Understanding of the content<\/strong> - \"With the  c ethical considerations are not important when discussing ai technologies. d ai technologies have no impact on ethical considerations in society. 5 understanding of the content - \"with the growing interest in virtual reality vr , augmented reality ar , and immersive digital experiences, the concept of ______ is likely to gain more prominence.\" a sustainability b ethical considerations c the metaverse ✅ d decentralized finance 핵심 정리 📌 9강부터 학습 방식이 달라진다 - 손향숙 교수의 1~8강이 \"본문 + 어휘연습 + 연습문제\"였다면, 신현욱 교수의 9강부터는 어려운 원문 한 문장 → 쉬운 여러 문장으로 풀어쓰기 문장비교 가 핵심이다. 따라서 시험도 \"이 표현이 무슨 뜻인가\" 와 \"이 문장을 바르게 요약한 것은\" 유형으로 나온다. 📌 키워드 3종을 순서대로 잡아둔다 세 항목 모두 \" 원인 → 그래서 이 키워드가 부각된다 \" 의 동일한 구조로 쓰였다. 📌 어려운 표현 ↔ 쉬운 표현의 짝이 곧 문제다 - gain prominence = become important, invest heavily in = spend a lot of money on, intensify = increase, driving conversations around = causing people to talk more about, formerly = previously known as. 강의가 일부러 이 짝을 만들어 보여주므로 그대로 출제 후보 다 ⭐⭐⭐ 📌 문법 문항의 두 함정 - ① challenging 형용사 자리에 challenge 명사 를 넣기 ② it depends 의 3인칭 단수 s 빠뜨리기. 연습문제 1 이 정확히 이 둘을 겹쳐 출제했다 ⚠️ 📌 accountability ≠ responsibility - 강의록이 따로 표기한 구분. responsibility는 \"책임이 있음\", accountability는 \"벌어진 결과를 설명하고 답변할 책임\"이다. 시험 대비 포인트 ⭐⭐⭐ 키워드 3종 metaverse / sustainability / ai ethics 과 각각의 원인 ⭐⭐⭐ driving conversations around sustainability = 사람들이 더 많이 이야기하게 만드는 것 ⭐⭐⭐ ai 윤리의 세 축 = bias mitigation, transparency, accountability ⭐⭐⭐ challenging 형용사 vs challenge 명사 , it depends 의 수 일치 ⭐⭐⭐ 메타버스가 부각되는 이유 = vr·ar·몰입형 디지털 경험에 대한 관심 증가 ⭐⭐ 예측이 어려운 이유 = 기술 발전·문화 트렌드·지정학적 사건·신흥 이슈에 달림 ⭐⭐ 쉬운 표현 치환 gain prominence / invest heavily in / intensify / formerly ⭐⭐ are + ing 현재진행형 are investing heavily ⭐ based on ~ 근거 vs depending on ~ ~에 따라 ⭐ forecast vs predict 의 뉘앙스 차이 ⭐ meta platforms = 이전의 facebook "}, {"id": 10, "title": "Forecasting Trends: A Closer Look at the Top Keywords Shaping the Year Ahead (2)", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기 - 본문해석, 어휘와 표현, 문장비교<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>Decentralized Finance (DeFi)<\/strong><\/td><td><strong>탈중앙화 금융<\/strong> - 전통 금융 시스템을 <strong>파괴(disrupt)<\/strong> 하려는 응용<\/td><\/tr><tr><td><strong>blockchain / cryptocurrency<\/strong><\/td><td><strong>블록체인 / 암호화폐<\/strong><\/td><\/tr><tr><td><strong>emergence<\/strong><\/td><td><strong>출현, 등장<\/strong><\/td><\/tr><tr><td><strong>disrupt<\/strong><\/td><td><strong>파괴하다, 뒤흔들다<\/strong> (기존 방식을 근본적으로 바꾸다)<\/td><\/tr><tr><td><strong>smart contract<\/strong><\/td><td><strong>스마트 계약<\/strong> - 특정 조건이 맞으면 <strong>자동으로 실행되는 계약<\/strong><\/td><\/tr><tr><td><strong>decentralized exchange<\/strong><\/td><td><strong>탈중앙화 거래소<\/strong><\/td><\/tr><tr><td><strong>tokenization<\/strong><\/td><td><strong>토큰화<\/strong><\/td><\/tr><tr><td><strong>remote work arrangements<\/strong><\/td><td><strong>원격근무 방식<\/strong><\/td><\/tr><tr><td><strong>accelerate the adoption of ~<\/strong><\/td><td><strong>~의 도입을 가속하다<\/strong><\/td><\/tr><tr><td><strong>entrenched<\/strong><\/td><td><strong>깊이 자리 잡은, 확고해진<\/strong><\/td><\/tr><tr><td><strong>global workforce<\/strong><\/td><td><strong>전 세계 노동인구<\/strong><\/td><\/tr><tr><td><strong>Healthtech<\/strong><\/td><td><strong>헬스테크<\/strong> - 의료와 기술의 결합<\/td><\/tr><tr><td><strong>telemedicine<\/strong><\/td><td><strong>원격의료<\/strong> (온라인으로 의사를 만나는 것)<\/td><\/tr><tr><td><strong>wearable devices<\/strong><\/td><td><strong>웨어러블 기기<\/strong> (건강을 추적하는 스마트워치 등)<\/td><\/tr><tr><td><strong>personalized medicine<\/strong><\/td><td><strong>맞춤 의료<\/strong> (개인에게 맞춘 치료)<\/td><\/tr><tr><td><strong>health analytics<\/strong><\/td><td><strong>건강 데이터 분석<\/strong><\/td><\/tr><tr><td><strong>undergo<\/strong><\/td><td><strong>겪다, 거치다<\/strong> (<code>undergo transformation<\/code> = 변혁을 겪다)<\/td><\/tr><tr><td><strong>Cybersecurity<\/strong><\/td><td><strong>사이버보안<\/strong><\/td><\/tr><tr><td><strong>sophisticated / prevalent<\/strong><\/td><td><strong>정교한 / 만연한<\/strong><\/td><\/tr><tr><td><strong>ransomware<\/strong><\/td><td><strong>랜섬웨어<\/strong> (돈을 요구하는 악성 소프트웨어)<\/td><\/tr><tr><td><strong>data breach<\/strong><\/td><td><strong>정보 유출<\/strong> (사적 정보가 도난당하는 것)<\/td><\/tr><tr><td><strong>zero-trust architecture<\/strong><\/td><td><strong>제로 트러스트 구조<\/strong> (들여보내기 전에 <strong>모두를 검증<\/strong>하는 방식)<\/td><\/tr><tr><td><strong>digital assets<\/strong><\/td><td><strong>디지털 자산<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문해석 (교재 87p.~90p.)<\/h4>\n<p><strong>④ 키워드 ④ 탈중앙화 금융 (DeFi)<\/strong> (87p.~88p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Decentralized Finance (DeFi)<\/strong>: [The rise of blockchain technology and cryptocurrencies] <strong>has led to<\/strong> the <strong>emergence<\/strong> of decentralized finance (DeFi) applications, {which <strong>aim to disrupt traditional financial systems<\/strong>}. Keywords [related to DeFi, such as blockchain, smart contracts, decentralized exchanges, and tokenization,] are expected to be significant {as the sector continues to <strong>evolve<\/strong>}.<\/p><\/blockquote>\n<ul><li>DeFi의 목표 = <strong>전통 금융 시스템을 뒤흔드는 것(disrupt)<\/strong> ⭐⭐⭐<\/li><li>DeFi 관련 키워드 4종 = <strong>blockchain · smart contracts · decentralized exchanges · tokenization<\/strong><\/li><\/ul>\n<p><strong>📌 문장비교 (강의록 원문)<\/strong><\/p>\n<blockquote><p>→ Blockchain technology and cryptocurrencies are becoming <strong>more popular<\/strong>, leading to <strong>new financial systems called<\/strong> decentralized finance (DeFi). DeFi <strong>aims to change<\/strong> the way traditional finance works. → Blockchain technology and cryptocurrencies are becoming <strong>more common<\/strong>. This has led to <strong>a new way of handling money<\/strong> called DeFi. DeFi <strong>wants to change<\/strong> the <strong>usual<\/strong> financial systems. → <strong>Important terms related to<\/strong> DeFi <strong>include<\/strong> blockchain, smart contracts, decentralized exchanges, and tokenization. These terms <strong>will be important<\/strong> as DeFi continues to <strong>grow and develop<\/strong>.<\/p><\/blockquote>\n<ul><li>⚠️ 어법: 주어가 <strong>The rise<\/strong>(단수)이므로 <strong>has led<\/strong> ⭐⭐⭐ / 관계대명사 which의 선행사는 <strong>applications<\/strong>(복수)이므로 <strong>aim<\/strong> (연습문제 (1)이 정확히 이 둘을 겹쳐 출제)<\/li><li>⚠️ <code>lead – led – led<\/code> - <code>has <strong>lead<\/strong><\/code>는 틀린 형태 (동사원형을 과거분사 자리에 쓴 오류)<\/li><\/ul>\n<blockquote><p>ℹ️ 강의록 보충 - <strong>Smart Contracts<\/strong>: 특정 조건이 맞으면 자동으로 실행되는 계약. 예) 자판기 vs. 부동산 계약 (돈이 오가는 행위와 계약 행위 사이의 연관 관계)<\/p><\/blockquote>\n<p><strong>⑤ 키워드 ⑤ 원격근무 (Remote Work)<\/strong> (88p.~89p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Remote Work<\/strong>: The COVID-19 <strong>pandemic<\/strong> has <strong>accelerated the adoption of<\/strong> remote work arrangements, [<strong>leading to<\/strong> significant changes in {how and where work is conducted}]. Keywords [related to remote work tools, digital collaboration, flexible work policies, and work-life balance] are likely to <strong>remain relevant<\/strong> {as remote work becomes more <strong>entrenched<\/strong> in the <strong>global workforce<\/strong>}.<\/p><\/blockquote>\n<ul><li>팬데믹의 효과 = 원격근무 도입의 <strong>가속<\/strong> → <strong>어떻게·어디서 일하는가<\/strong>에 중대한 변화 ⭐⭐⭐<\/li><li>관련 키워드 4종 = <strong>원격근무 도구 · 디지털 협업 · 유연근무 정책 · 일과 삶의 균형<\/strong><\/li><\/ul>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ The COVID-19 pandemic <strong>made more people start working from home<\/strong>. This change <strong>has affected<\/strong> how and where people work. → <strong>Because of<\/strong> COVID-19, <strong>many people now work from home<\/strong>. This has changed how and where people work. → Important topics related to remote work <strong>include tools for online work, working together online, flexible work hours, and balancing work with personal life<\/strong>. These topics <strong>will continue to be important<\/strong> as remote work becomes <strong>more common<\/strong>.<\/p><\/blockquote>\n<blockquote><p>ℹ️ 강의록 보충 - <strong>pandemic<\/strong>: pertaining to all people (세계적으로 큰 영향을 미친 질병) Cf. <strong>endemic<\/strong>: particular to a people or locality (풍토병) ⭐⭐ 대비 암기<\/p><\/blockquote>\n<p><strong>⑥ 키워드 ⑥ 헬스테크 (Healthtech)<\/strong> (89p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Healthtech<\/strong>: The healthcare industry is <strong>undergoing rapid transformation<\/strong> [<strong>driven by<\/strong> advancements in technology, including <strong>telemedicine, wearable devices, personalized medicine, and health analytics<\/strong>]. Keywords [related to healthtech innovation and digital health solutions] are expected to be prominent {as the industry <strong>adapts to<\/strong> new challenges and opportunities}.<\/p><\/blockquote>\n<ul><li>헬스테크 4종 = <strong>원격의료 · 웨어러블 기기 · 맞춤 의료 · 건강 데이터 분석<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ The healthcare industry is <strong>changing quickly because of<\/strong> new technology. This includes things like telemedicine, {where you see a doctor online}, wearable devices like smartwatches {that track(check) your health}, personalized medicine {that fits your needs / made just for you}, and health analytics {that helps understand health data}. → Words related to healthtech and digital health solutions <strong>will be important<\/strong> as the industry <strong>faces<\/strong> new challenges and opportunities.<\/p><\/blockquote>\n<ul><li>⭐⭐⭐ <code>undergoing rapid transformation<\/code> = <strong>빠르고 중대한 변화를 겪는 중<\/strong><\/li><\/ul>\n<p>(연습문제 (3)으로 직접 출제 - \"성장 둔화\" \"기술에 저항\" \"변화 없음\"은 모두 오답)<\/p>\n<p><strong>⑦ 키워드 ⑦ 사이버보안 (Cybersecurity)<\/strong> (90p.) ⭐⭐⭐<\/p>\n<blockquote><p><strong>Cybersecurity<\/strong>: {As cyber threats become more <strong>sophisticated and prevalent<\/strong>,} cybersecurity <strong>remains a critical concern<\/strong> [for individuals, businesses, and governments]. Keywords [related to cybersecurity], [such as <strong>ransomware, data breaches, zero-trust architecture, and cybersecurity awareness<\/strong>,] are likely to be significant {as organizations <strong>prioritize efforts to protect their digital assets<\/strong>}.<\/p><\/blockquote>\n<ul><li>사이버보안 키워드 4종 = <strong>랜섬웨어 · 정보 유출 · 제로 트러스트 구조 · 보안 인식<\/strong> ⭐⭐⭐<\/li><li>보호 대상 = <strong>디지털 자산(digital assets)<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>📌 문장비교<\/strong><\/p>\n<blockquote><p>→ Cyber threats are becoming <strong>more advanced and common<\/strong>. <strong>Because of this<\/strong>, cybersecurity is <strong>very important<\/strong> for people, companies, and governments. → <strong>Key words to know about<\/strong> cybersecurity are ransomware (<strong>bad software that asks for money<\/strong>), data breaches (<strong>when private information is stolen<\/strong>), zero-trust architecture (<strong>checking everyone before letting them in<\/strong>), and cybersecurity awareness (<strong>understanding how to be safe online<\/strong>).<\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>원문 용어<\/th><th>쉬운 설명<\/th><\/tr><\/thead><tbody><tr><td><code>ransomware<\/code><\/td><td>bad software that asks for money<\/td><\/tr><tr><td><code>data breaches<\/code><\/td><td>when private information is stolen<\/td><\/tr><tr><td><code>zero-trust architecture<\/code><\/td><td>checking everyone before letting them in<\/td><\/tr><tr><td><code>cybersecurity awareness<\/code><\/td><td>understanding how to be safe online<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>2. 연습문제 (강의록 원문)<\/h4>\n<p><strong>(1) Grammatical Understanding<\/strong> - Which of the following sentences is grammatically correct?<\/p>\n<ul><li>A) The rise … <strong>have led<\/strong> to the emergence of DeFi applications, which <strong>aims to<\/strong> disrupt … ← 주어 수 불일치 + 관계절 수 불일치<\/li><li><strong>B) The rise of blockchain technology and cryptocurrencies has led to the emergence of decentralized finance (DeFi) applications, which aim to disrupt traditional financial systems.<\/strong> ✅<\/li><li>C) … <strong>has lead<\/strong> to … which aim to … ← <code>lead<\/code>(원형)를 과거분사 자리에 씀<\/li><li>D) … <strong>have lead<\/strong> … which <strong>aims to<\/strong> … ← 세 곳 모두 오류<\/li><\/ul>\n<p><strong>(2) Word Usage<\/strong> - \"Keywords … are likely to remain ______ as remote work becomes more entrenched in the global workforce.\"<\/p>\n<ul><li>A) relevance <strong>B) relevant<\/strong> ✅ C) relevance's D) relevantly<\/li><li>→ <code>remain<\/code>은 <strong>보어(형용사)<\/strong> 를 취하는 2형식 동사 → <strong>relevant<\/strong> ⭐⭐⭐ (3강의 <code>remain<\/code> 2형식과 연결)<\/li><\/ul>\n<p><strong>(3) Phrase Understanding<\/strong> - what does \"healthcare industry is undergoing rapid transformation\" most likely mean?<\/p>\n<ul><li>A) The healthcare industry is slowing down in terms of growth.<\/li><li><strong>B) The healthcare industry is experiencing quick and significant changes.<\/strong> ✅<\/li><li>C) The healthcare industry is resistant to technological advancements.<\/li><li>D) The healthcare industry is staying the same without much change.<\/li><\/ul>\n<p><strong>(4) Sentence Understanding<\/strong> - Which sentence best summarizes: \"Keywords related to cybersecurity, such as ransomware, data breaches, zero-trust architecture, and cybersecurity awareness, are likely to be significant as organizations prioritize efforts to protect their digital assets.\"<\/p>\n<ul><li>A) The importance of cybersecurity-related keywords will decrease as organizations focus on other priorities.<\/li><li>B) Organizations are expected to deprioritize cybersecurity, making related keywords less relevant.<\/li><li><strong>C) Cybersecurity-related keywords will continue to be important as organizations focus on protecting their digital resources.<\/strong> ✅<\/li><li>D) Cybersecurity is no longer a concern, so related keywords will become irrelevant.<\/li><\/ul>\n<p><strong>(5) Understanding of the content<\/strong> - \"Keywords related t
