/li><\/ul>\n<blockquote><p>The floodwaters continued to rise, threatening to breach the levee and inundate the nearby homes.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · think, allow<\/strong><\/li><\/ul>\n<blockquote><p>Do you think Dad will allow you to go to Jamie’s party?<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>You’re not allowed to talk during the exam.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Pets aren’t allowed in this hotel.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Smoking is not allowed in this restaurant.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · allow, finish<\/strong><\/li><\/ul>\n<blockquote><p>He didn’t allow us enough time to finish the test.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 12쪽 · 예문 · mount(mounted)<\/strong><\/li><\/ul>\n<blockquote><p>She mounted her horse and rode off.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 12쪽 · 예문 · mount<\/strong><\/li><\/ul>\n<blockquote><p>The army prepared to mount an attack on the enemy stronghold.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 12쪽 · 예문 · mount<\/strong><\/li><\/ul>\n<blockquote><p>The art gallery is ready to mount an exhibition of contemporary sculptures next week.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 15쪽 · 예문 · comprise(comprises)<\/strong><\/li><\/ul>\n<blockquote><p>The book comprises ten chapters.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 15쪽 · 예문 · comprise(comprises), offer(offering)<\/strong><\/li><\/ul>\n<blockquote><p>The national park comprises several hiking trails, offering diverse scenic views.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 15쪽 · 예문 · comprise(comprised), ensure(ensuring)<\/strong><\/li><\/ul>\n<blockquote><p>The committee is comprised of experts from different fields, ensuring a comprehensive perspective.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 22쪽 · A · regulate<\/strong><\/li><\/ul>\n<blockquote><p>To regulate body temperature<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 22쪽 · B · protect<\/strong><\/li><\/ul>\n<blockquote><p>To protect the organism from diseases<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 22쪽 · D · produce<\/strong><\/li><\/ul>\n<blockquote><p>To produce blood cells<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 23쪽 · 질문 · list(listed)<\/strong><\/li><\/ul>\n<blockquote><p>Which of the following is NOT listed as a pathogen the immune system protects against?<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 24쪽 · A · provide<\/strong><\/li><\/ul>\n<blockquote><p>To provide an immediate, non-specific response to pathogens<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 24쪽 · B · prevent, enter(entering)<\/strong><\/li><\/ul>\n<blockquote><p>To prevent pathogens from entering the organism<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 24쪽 · C · adapt, improve<\/strong><\/li><\/ul>\n<blockquote><p>To adapt its response to improve recognition of a pathogen during an infection<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 24쪽 · D · regulate<\/strong><\/li><\/ul>\n<blockquote><p>To regulate the body’s temperature in response to an infection<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 25쪽 · A · weaken<\/strong><\/li><\/ul>\n<blockquote><p>To weaken the body’s immune system<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 25쪽 · B · stimulate<\/strong><\/li><\/ul>\n<blockquote><p>To stimulate the body’s immune response against diseases<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 25쪽 · D · identify, remove<\/strong><\/li><\/ul>\n<blockquote><p>To identify and remove toxins from the body<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 26쪽 · A · contain, cause<\/strong><\/li><\/ul>\n<blockquote><p>Vaccines often contain harmful microorganisms that can cause diseases.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 26쪽 · B · scrutinize(scrutinized), validate(validated)<\/strong><\/li><\/ul>\n<blockquote><p>The efficacy and safety of vaccines are rarely scrutinized or validated.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 26쪽 · C · suppress(suppressing)<\/strong><\/li><\/ul>\n<blockquote><p>Vaccines work by suppressing the immune system’s response to pathogens.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 26쪽 · D · consider(considered), prevent(preventing)<\/strong><\/li><\/ul>\n<blockquote><p>Vaccination is considered the most effective method of preventing infectious diseases.<\/p><\/blockquote>"}, {"title": "워크북 Unit 1 (추가 확인)", "html": "<p>자료: <a href=\"english-textbook.html#unit-01-workbook\">Workbook_Unit01_Virus.md<\/a><\/p>\n<p>교재·멀티강의와 같은 예문·문제는 위 목록에서 확인하고, 워크북에서 추가로 확인할 항목만 아래에 적었습니다.<\/p>\n<ul><li class=\"chk\">☐ <strong>어휘 연습 1 · 두 번째 문장 · make(made)<\/strong><\/li><\/ul>\n<blockquote><p>They (     ) the agreement they had made with their employer.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>연습문제 3 · B · purify(purified)<\/strong><\/li><\/ul>\n<blockquote><p>Through purified water sources<\/p><\/blockquote>\n<p>참고한 가이드라인: 26-2중간과제물과제명(대학영어).pdf 1쪽의 과제 A.<\/p>"}]}, {"id": "2026-2-중간과제물-진행안내", "title": "2026학년도 2학기 대학영어 중간과제물 진행 안내", "intro": "<blockquote><p><strong>목표:<\/strong> 아래 순서대로 A와 B를 모두 작성하고 제출한다. A와 B는 각각 15점으로 총 30점이다. <strong>정시 제출 마감:<\/strong> 2026년 10월 12일 월요일 18:00. 권장 제출일은 10월 11일이다. <strong>용도:<\/strong> 과제 준비와 진행 상황을 관리하는 개인용 안내서. 실제 제출 답안은 별도의 한글 또는 Word 문서로 작성한다. 작성 기준일: 2026년 10월 4일.<\/p><\/blockquote>", "sections": [{"title": "1 먼저 해야 할 일을 한눈에 확인하기", "html": "<div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>학교가 요구하는 작업<\/th><th>완료 기준<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>교재 Unit 1과 멀티강의 1·2강의 모든 문장에서 타동사가 쓰인 문장을 찾아 문장별로 타동사와 목적어 제시<\/td><td>해당 문장 전부 검토, 번호 부여, 타동사와 목적어 정리<\/td><\/tr><tr><td>B의 교재 정리<\/td><td>교재 Part 2의 Unit 9·10에서 키워드 10개 선정, 각 키워드의 정의 또는 관련 설명을 교재에서 찾아 적고 한글 해석<\/td><td>10개 모두 교재 원문·해석·교재 쪽수 기재<\/td><\/tr><tr><td>B의 외부 자료<\/td><td>각 키워드마다 2026년도 교재 외 자료에서 영어 예문 2개를 찾아 적고 한글 해석<\/td><td>총 20개 예문과 해석, 예문 속 키워드 밑줄, 정확한 출처·연도 표시<\/td><\/tr><tr><td>B의 수행 소감<\/td><td>과제수행에서 어려웠던 점 서술<\/td><td>전체 수행에 대한 5줄 작성<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>학교 지시와 이 문서의 권장 방법을 구분한다.<\/strong> 과제 범위·개수·표시 항목은 학교 지시다. 아래 일정, 작업 메모, 파일명, 문서 구성은 실행하기 편하게 만든 권장안이다.<\/p>\n<p><strong>생성형 AI 관련 지시:<\/strong> 원본 PDF 1쪽의 A 작성 지시사항에는 “생성형AI를 사용하지 않는다.”가 명시되어 있다. A의 문장 선정과 분석은 직접 수행한다. B에 대한 별도 허용 문구는 없으므로, 이를 허용으로 단정하지 않는다. 이 안내서와 기존 요약 노트는 제출 답안으로 복사하지 않고 준비·복습에 사용한다.<\/p>"}, {"title": "2 교재와 기존 자료 준비하기", "html": "<h4>2단계에서 할 일<\/h4>\n<ul><li class=\"chk\">☐ 과제 안내 PDF의 1쪽과 2쪽을 모두 읽는다.<\/li><li class=\"chk\">☐ 현재 수강 교재의 <strong>Unit 1 전체<\/strong>와 <strong>Part 2 Unit 9·10<\/strong>을 펼칠 수 있게 준비한다.<\/li><li class=\"chk\">☐ 멀티강의 1·2강 영상과 강의록을 준비한다.<\/li><li class=\"chk\">☐ 교재 쪽수를 적을 수 있도록 인쇄된 쪽수 또는 전자교재의 실제 교재 쪽수를 확인한다.<\/li><li class=\"chk\">☐ 교재와 강의록에서 검토한 위치를 기록할 작업 메모를 만든다.<\/li><\/ul>\n<h4>기존 자료를 활용하는 순서<\/h4>\n<p>아래 경로는 이 안내서에서 클릭하여 열 수 있다. 요약 노트로 흐름을 이해한 뒤, 실제 답안의 문장·범위·쪽수는 교재와 강의 원문에서 확인한다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>자료<\/th><th>이번 과제에서의 쓰임<\/th><th>확인할 점<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#study\">대학영어 과목 로드맵<\/a><\/td><td>강의 차수와 교재 Unit의 대응 확인<\/td><td>강의 번호와 교재 Unit 번호가 항상 같지 않다<\/td><\/tr><tr><td><a href=\"english-textbook.html#unit-01-reading\">교재 Unit 1<\/a><\/td><td>A의 교재 원문 전체 검토<\/td><td>교재 MD는 <code>대학영어/교재/<\/code>에 보관하며, 워크북은 A 범위에서 제외<\/td><\/tr><tr><td><a href=\"english-textbook.html#unit-09-reading\">교재 Unit 9<\/a>와 <a href=\"english-textbook.html#unit-10-reading\">교재 Unit 10<\/a><\/td><td>B를 시작할 때 사용할 교재 원문<\/td><td>강의록 PDF와 구분하여 보관<\/td><\/tr><tr><td><a href=\"#study\">대학영어 학습 방법<\/a><\/td><td>본문 이해 → 품사·문장 구조 → 직접 확인 순서 적용<\/td><td>과제에는 전체 퀴즈 과정보다 필요한 부분을 우선 활용<\/td><\/tr><tr><td><a href=\"#lecture-1\">1강 Virus 1 노트<\/a>와 <a href=\"#lecture-2\">2강 Virus 2 노트<\/a><\/td><td>A 준비를 위한 문장 구조·수동태·어휘 복습<\/td><td>요약에 있는 문장만으로 전체 범위를 판단하지 않는다<\/td><\/tr><tr><td>1강 강의록과 2강 강의록<\/td><td>A의 실제 강의 문장을 차례로 검토<\/td><td>강의 영상과 대조하며 예문·연습문제까지 확인<\/td><\/tr><tr><td><a href=\"#lecture-9\">9강 노트<\/a>와 <a href=\"#lecture-10\">10강 노트<\/a><\/td><td>B의 Unit 9 내용을 이해하고 교재에서 키워드를 찾는 데 활용<\/td><td>두 노트 모두 <strong>교재 Unit 9<\/strong>에 해당<\/td><\/tr><tr><td>9강 강의록과 10강 강의록<\/td><td>Unit 9 복습<\/td><td>표지에 각각 ‘교재9장-1’, ‘교재9장-2’로 표시<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>범위 주의:<\/strong> B의 범위는 <strong>교재 Unit 9·10<\/strong>이다. 기존 9·10강 노트만으로 범위를 대체하지 말고 교재 Unit 10도 직접 확인한다. 교재의 정의·설명과 쪽수는 강의록이나 노트의 쉬운 풀이로 대신하지 않는다.<\/p>\n<p>기존 기출문제와 생성 모의고사는 시험 대비 자료다. 이번 중간과제물의 문제나 제출 항목으로 사용하지 않는다.<\/p>\n<p><strong>완료 기준:<\/strong> A와 B의 원자료를 모두 확보하고, 어떤 자료를 어디에 사용할지 구분했다.<\/p>"}, {"title": "3 실제 제출용 문서 틀 만들기", "html": "<ol><li>한글 또는 Word에서 새 문서를 만든다. 안내문에 명시된 형식은 <strong>hwp, hwpx, doc, docx<\/strong>이다.<\/li><li>본문을 <strong>A 타동사와 목적어 정리 → B 키워드 10개 정리 → 과제수행에서 어려웠던 점<\/strong> 순서로 구분한다.<\/li><li>표지·학번·이름 등은 학교 서식과 제출 화면의 요구에 맞춰 넣는다.<\/li><li>파일을 저장한다. 예시 파일명은 <code>2026-2_대학영어_중간과제물_이름.docx<\/code>이며 학교 지정 파일명은 아니다.<\/li><li>원문 위치, 검토 여부, 애매한 문장을 적는 <strong>작업 메모<\/strong>는 제출 본문과 구분한다.<\/li><\/ol>\n<p>학교는 A의 성격상 분량·글자 크기·줄 간격을 따로 정하지 않았다. 임의의 페이지 수에 맞추려고 해당 문장을 줄이지 않는다. B의 키워드·예문 개수와 어려웠던 점 5줄은 지킨다.<\/p>\n<p><strong>완료 기준:<\/strong> 실제 답안을 입력할 수 있는 편집 문서와 별도의 작업 메모가 준비되었다.<\/p>"}, {"title": "4 A의 범위를 처음부터 끝까지 훑기", "html": "<p><strong>학교 지시:<\/strong> 교재 Unit 1과 멀티강의 1·2강에 제시된 <strong>모든 문장<\/strong>이 범위다. 본문에만 한정하지 않는다.<\/p>\n<ol><li>기존 1·2강 노트로 본문 흐름과 문장 구조를 먼저 복습한다.<\/li><li>교재 Unit 1을 처음부터 끝까지 읽으며 검토한 쪽을 표시한다.<\/li><li>멀티강의 1강과 2강을 순서대로 확인한다. 강의록의 본문뿐 아니라 어휘 설명용 예문과 연습문제 등 문장이 제시된 부분도 검토한다.<\/li><li>각 문장에서 동사와 분사로 쓰인 형태를 찾고, 타동사 사용 여부를 직접 판단한다.<\/li><li>판단이 어려운 문장은 작업 메모에 위치와 질문을 적어 둔다. 전체 범위를 먼저 훑고 다시 검토한다.<\/li><\/ol>\n<div class=\"tbl\"><table><thead><tr><th>검토 대상<\/th><th>시작 전<\/th><th>전체 검토 후<\/th><\/tr><\/thead><tbody><tr><td>교재 Unit 1 전체<\/td><td>[ ]<\/td><td>[ ]<\/td><\/tr><tr><td>멀티강의 1강 전체<\/td><td>[ ]<\/td><td>[ ]<\/td><\/tr><tr><td>멀티강의 2강 전체<\/td><td>[ ]<\/td><td>[ ]<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>완료 기준:<\/strong> 세 범위를 모두 검토했고, 제출 대상 문장과 추가 확인할 문장을 구분했다. 학교가 문장 수를 지정하지 않았으므로 임의로 ‘몇 문장만’ 선정하지 않는다.<\/p>"}, {"title": "5 A의 문장별 답안 작성하고 재검토하기", "html": "<h4>각 문장을 처리하는 순서<\/h4>\n<ol><li>타동사가 사용된 문장 전체를 원문과 대조하여 적는다.<\/li><li><code>문장1<\/code>, <code>문장2<\/code>처럼 번호를 붙인다.<\/li><li>해당 문장의 타동사와 목적어를 짝지어 적는다. 한 문장에 여러 개가 있으면 빠짐없이 적는다.<\/li><li><strong>목적어는 핵심 단어 하나만<\/strong> 적는다. 긴 명사구 전체를 그대로 쓰지 않는다.<\/li><li><strong>과거분사·현재분사·수동태에 사용된 경우도 포함<\/strong>했는지 다시 살핀다.<\/li><li>과제에서 제외한 <strong>동사구<\/strong>를 잘못 넣지 않았는지 확인한다. 안내문은 <code>respond to ~<\/code>, <code>feed on ~<\/code>를 제외 예로 든다.<\/li><\/ol>\n<h4>입력 형식<\/h4>\n<p>아래 대괄호 부분을 직접 작성한 내용으로 바꾼다. 동사는 학교 예시처럼 원형으로 정리하는 방식이 좋다.<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">문장1: [교재 또는 강의에 나온 문장 전체]\n타동사와 목적어:\n[타동사] - [목적어의 핵심 단어 하나]\n[같은 문장에 추가로 있는 타동사] - [해당 목적어의 핵심 단어 하나]\n\n문장2: [다음 해당 문장 전체]\n타동사와 목적어:\n[타동사] - [목적어의 핵심 단어 하나]<\/code><\/pre>\n<p>수동태와 분사 구문은 동사 바로 뒤에 목적어가 보이지 않을 수 있다. 동작과 그 대상의 관계를 확인하고 안내문 예시의 처리 방식을 따른다. 원문에 없는 목적어를 임의로 만들어 넣지 않는다.<\/p>\n<p><strong>추가 확인이 필요한 경우:<\/strong> 반복해서 등장하는 동일 문장의 제출 처리, 목적어가 여러 개인 구문의 표기, 연습문제의 빈칸·오류 문장 표기처럼 안내문이 세부적으로 정하지 않은 사항은 작업 메모에 남긴다. 원문·강의 설명으로도 해결되지 않으면 과목 질의응답에서 확인한다. 이 때문에 다른 문장 검토까지 멈출 필요는 없다.<\/p>\n<p><strong>완료 기준:<\/strong> 전체 범위 검토를 마쳤고, 문장 번호·타동사·핵심 목적어를 갖췄으며 분사와 수동태까지 재검토했다.<\/p>"}, {"title": "6 B의 키워드 10개 선정하고 교재 내용 정리하기", "html": "<ol><li><strong>교재 Part 2의 Unit 9·10<\/strong>을 읽고 키워드 후보를 표시한다.<\/li><li>키워드의 정의 또는 관련 설명이 교재 어디에 있는지 확인한다.<\/li><li>2026년도 영어 자료에서도 해당 키워드를 찾을 수 있는지 먼저 살핀 후 <strong>10개<\/strong>를 확정한다.<\/li><li>각 키워드의 <strong>교재 정의 또는 관련 설명 원문<\/strong>을 적는다.<\/li><li>그 원문을 한글로 해석한다.<\/li><li>정의·설명이 실린 <strong>교재 쪽수<\/strong>를 바로 적는다. 나중에 기억으로 채우지 않는다.<\/li><\/ol>\n<p>키워드 10개는 Unit 9·10의 범위에서 고른다. 안내문에 단원별 개수 배분은 따로 명시되어 있지 않다. 임의로 ‘각 Unit에서 반드시 5개씩’이라는 조건을 추가하지 않는다.<\/p>\n<p>기존 9·10강 노트의 주요용어 표는 교재를 찾기 위한 보조 자료다. 노트에 등장한다는 이유만으로 과제 키워드에 해당한다고 확정하지 말고, 교재의 해당 내용과 대조한다.<\/p>\n<p><strong>완료 기준:<\/strong> 키워드 10개 각각에 교재 원문, 한글 해석, 교재 쪽수가 있다.<\/p>"}, {"title": "7 B의 2026년도 영어 예문 20개 수집하기", "html": "<h4>키워드 하나마다 반복할 작업<\/h4>\n<ol><li>선택한 키워드에 <code>2026<\/code>을 함께 넣어 뉴스·정보 자료 등을 검색한다.<\/li><li>검색 결과 요약만 복사하지 말고 원문 페이지를 연다.<\/li><li><strong>자료가 2026년도 자료인지<\/strong> 확인한다. 열람한 날짜나 사이트 맨 아래의 저작권 연도만으로 판단하지 않는다.<\/li><li>해당 키워드가 들어간 영어 문장 2개를 찾는다. <strong>인터넷 사전에서 가져온 예문은 제외<\/strong>한다.<\/li><li>각 문장을 정확히 옮기고 한글로 해석한다.<\/li><li><strong>예문 안에 있는 해당 키워드에 실제 밑줄<\/strong>을 긋는다. 굵게 표시하거나 제목에만 밑줄을 넣는 것으로 대신하지 않는다.<\/li><li>예문마다 정확한 원문 URL 또는 저서명을 적고, <strong>2026년이라는 자료 연도도 별도로 명시<\/strong>한다.<\/li><\/ol>\n<p>권장 검색 방식은 <code>\"선택한 키워드\" 2026<\/code>이다. 연도·발행일이 명확하고 원문을 직접 열 수 있는 자료부터 고르면 확인이 쉽다. 자료가 언제 작성되었는지 불명확하면 다른 자료를 찾는다.<\/p>\n<p>학교는 키워드마다 예문 2개를 요구하지만 반드시 서로 다른 출처여야 한다는 조건은 안내문에 없다. 다만 각 예문의 출처와 연도가 분명하게 확인되어야 한다. 뉴스·웹 자료에는 제목·발행기관·발행일을, 저서에는 저자·출판사·발행연도·쪽수를 함께 적어 두면 재확인이 편하다. 이 추가 정보는 관리용 권장 사항이다.<\/p>\n<h4>키워드별로 반복해서 사용할 구성<\/h4>\n<pre class=\"cb\"><code class=\"lang-text\">키워드 1: [영어 키워드]\n\n1. 교재 정의 또는 관련 설명\n영어 원문: [교재 내용]\n한글 해석: [직접 작성]\n교재 위치: Part 2, Unit [9 또는 10], p. [쪽수]\n\n2. 외부 예문 1\n영어 예문: [2026년도 원문 문장 / 키워드에 실제 밑줄]\n한글 해석: [직접 작성]\n출처: [정확한 원문 URL 또는 저서명]\n자료 연도: 2026년\n확인 메모: [발행일 또는 서지정보 / 권장]\n\n3. 외부 예문 2\n영어 예문: [2026년도 원문 문장 / 키워드에 실제 밑줄]\n한글 해석: [직접 작성]\n출처: [정확한 원문 URL 또는 저서명]\n자료 연도: 2026년\n확인 메모: [발행일 또는 서지정보 / 권장]<\/code><\/pre>\n<p><strong>완료 기준:<\/strong> 10개 키워드 × 2개 = <strong>20개 영어 예문<\/strong>과 <strong>20개 한글 해석<\/strong>이 있고, 각 예문에 키워드 밑줄·출처·2026년 표시가 있다.<\/p>"}, {"title": "8 과제수행에서 어려웠던 점 5줄 쓰기", "html": "<p>A와 B를 수행하며 실제로 어려웠던 점을 메모해 두었다가 B의 마지막에 5줄로 정리한다. 키워드마다 5줄씩 쓰는 요구가 아니라 과제수행에 대한 항목이다.<\/p>\n<p>아래 질문을 바탕으로 자신의 경험을 작성한다. 질문 자체를 답안으로 제출하지 않는다.<\/p>\n<ol><li>어떤 작업에서 가장 어려움을 느꼈는가?<\/li><li>구체적으로 무엇을 판단하거나 찾기 어려웠는가?<\/li><li>해결하려고 어떤 자료나 방법을 사용했는가?<\/li><li>그 방법으로 무엇이 해결되었고 무엇이 남았는가?<\/li><li>이번 경험을 통해 다음에는 어떻게 진행하려 하는가?<\/li><\/ol>\n<p><strong>완료 기준:<\/strong> 자신의 수행 경험을 썼고, 최종 한글·Word 화면에서 5줄 분량인지 확인했다. 줄바꿈과 자동 줄바꿈 때문에 줄 수가 달라지지 않는지 살핀다.<\/p>"}, {"title": "9 최종 검토하기", "html": "<h4>A 검토<\/h4>\n<ul><li class=\"chk\">☐ 교재 Unit 1과 멀티강의 1·2강을 모두 확인했다.<\/li><li class=\"chk\">☐ 본문 외의 예문과 연습문제 등 제시된 문장도 검토했다.<\/li><li class=\"chk\">☐ 문장 전체와 문장 번호를 적었다.<\/li><li class=\"chk\">☐ 각 문장의 타동사와 목적어를 빠짐없이 제시했다.<\/li><li class=\"chk\">☐ 목적어를 핵심 단어 하나로 적었다.<\/li><li class=\"chk\">☐ 과거분사·현재분사·수동태의 경우도 확인했다.<\/li><li class=\"chk\">☐ 과제에서 제외한 동사구가 섞이지 않았다.<\/li><li class=\"chk\">☐ A의 생성형 AI 사용 금지 지시를 준수했다.<\/li><\/ul>\n<h4>B 검토<\/h4>\n<ul><li class=\"chk\">☐ 키워드가 교재 Part 2 Unit 9·10 범위의 10개다.<\/li><li class=\"chk\">☐ 각 키워드에 교재 정의 또는 관련 설명과 한글 해석이 있다.<\/li><li class=\"chk\">☐ 각 교재 인용 부분에 실제 교재 쪽수를 적었다.<\/li><li class=\"chk\">☐ 키워드마다 외부 영어 예문 2개씩 총 20개가 있다.<\/li><li class=\"chk\">☐ 외부 영어 예문 20개 모두 한글 해석이 있다.<\/li><li class=\"chk\">☐ 모든 외부 예문에서 해당 키워드에 밑줄을 그었다.<\/li><li class=\"chk\">☐ 모든 외부 예문의 정확한 출처와 자료 연도를 적었다.<\/li><li class=\"chk\">☐ 실제로 2026년도 자료이며 인터넷 사전 예문을 사용하지 않았다.<\/li><li class=\"chk\">☐ 어려웠던 점을 5줄로 작성했다.<\/li><\/ul>\n<h4>파일 검토<\/h4>\n<ul><li class=\"chk\">☐ 학교 제출 화면의 표지·인적사항·파일 조건을 확인했다.<\/li><li class=\"chk\">☐ A와 B를 모두 포함한 최종 파일을 저장했다.<\/li><li class=\"chk\">☐ hwp·hwpx·doc·docx 중 하나로 저장했다.<\/li><li class=\"chk\">☐ 파일을 닫았다가 다시 열어 한글·영문·밑줄·문장 번호를 확인했다.<\/li><li class=\"chk\">☐ 빈칸, 대괄호 안내 문구, 작업용 메모 등 불필요한 내용을 제거했다.<\/li><\/ul>"}, {"title": "10 업로드하고 제출 완료 확인하기", "html": "<ol><li>MyKNOU에 로그인한다.<\/li><li><strong>과제물 → 과제제출 → 중간과제물 제출 → 대학영어<\/strong>로 이동한다.<\/li><li>최신 과제명 파일과 변경 공지를 한 번 더 확인한다.<\/li><li>최종 답안 파일을 선택하여 화면의 제출 절차를 마친다.<\/li><li>파일을 선택한 것만으로 끝내지 말고 <strong>제출 상태·파일명·제출 일시<\/strong>를 확인한다.<\/li><li>제출 파일을 다시 열거나 내려받을 수 있으면 올바른 최종본인지 확인한다.<\/li><li>제출 완료 화면과 최종 파일을 보관한다.<\/li><\/ol>\n<p><strong>정시 제출기간:<\/strong> 2026년 10월 2일 09:00부터 10월 12일 18:00까지.<\/p>\n<p><strong>추가 제출기간:<\/strong> 10월 13일 09:00부터 10월 15일 18:00까지. 학교 공지에 따르면 추가 기간에 제출하거나, 정시 제출자가 추가 기간에 수정 제출하면 1점 감점된다. 가능한 한 정시 기간 안에 제출과 수정까지 마친다.<\/p>"}, {"title": "권장 일정표", "html": "<p>아래 일정은 10월 4일 시작 기준의 개인용 권장안이다. 학교가 지정한 중간 마감일은 아니다. 외부 자료를 찾는 데 시간이 걸릴 수 있으므로 B의 자료 확보 가능 여부는 초반에 확인한다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>날짜<\/th><th>진행할 일<\/th><th>그날의 완료 기준<\/th><\/tr><\/thead><tbody><tr><td>10월 4일 일요일<\/td><td>안내문 읽기, 교재·강의 확보, 제출 문서 틀 만들기, B 자료 검색 가능 여부 확인<\/td><td>준비 완료, 작업 문서 저장<\/td><\/tr><tr><td>10월 5일 월요일<\/td><td>교재 Unit 1과 1강 검토, A 문장 정리 시작<\/td><td>검토 위치 기록, A 초안 작성<\/td><\/tr><tr><td>10월 6일 화요일<\/td><td>2강 검토, A의 분사·수동태·누락 재검토<\/td><td>A 초안 완료<\/td><\/tr><tr><td>10월 7일 수요일<\/td><td>B 키워드 10개 확정, 교재 원문·해석·쪽수 작성<\/td><td>B 교재 정리 10개 완료<\/td><\/tr><tr><td>10월 8일 목요일<\/td><td>키워드 1~5의 외부 예문과 해석 작성<\/td><td>예문 10개, 출처·연도·밑줄 완료<\/td><\/tr><tr><td>10월 9일 금요일<\/td><td>키워드 6~10의 외부 예문과 해석 작성<\/td><td>누적 예문 20개 완료<\/td><\/tr><tr><td>10월 10일 토요일<\/td><td>어려웠던 점 5줄, A·B 전체 검토<\/td><td>모든 필수 항목과 파일 점검 완료<\/td><\/tr><tr><td>10월 11일 일요일<\/td><td>최종 업로드 및 제출 확인<\/td><td>제출 완료 화면 보관<\/td><\/tr><tr><td>10월 12일 월요일<\/td><td>필요한 경우 정시 마감 전 최종 확인·수정<\/td><td><strong>18:00 전에 모든 제출 절차 완료<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "진행 상황 기록", "html": "<p>표 안의 <code>[ ]<\/code>를 <code>[x]<\/code>로 바꾸거나 완료한 수를 기록한다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>항목<\/th><th>현재 진행<\/th><th>완료<\/th><\/tr><\/thead><tbody><tr><td>자료 준비와 제출 문서 틀<\/td><td>준비한 자료:<\/td><td>[ ]<\/td><\/tr><tr><td>A 전체 범위 검토<\/td><td>교재 / 1강 / 2강:<\/td><td>[ ]<\/td><\/tr><tr><td>A 문장별 정리<\/td><td>작성한 문장 수:<\/td><td>[ ]<\/td><\/tr><tr><td>B 교재 정리<\/td><td>/ 10개<\/td><td>[ ]<\/td><\/tr><tr><td>B 외부 예문과 해석<\/td><td>/ 20개<\/td><td>[ ]<\/td><\/tr><tr><td>B 밑줄·출처·연도 확인<\/td><td>/ 20개<\/td><td>[ ]<\/td><\/tr><tr><td>어려웠던 점<\/td><td>/ 5줄<\/td><td>[ ]<\/td><\/tr><tr><td>최종 파일 점검<\/td><td>점검 일시:<\/td><td>[ ]<\/td><\/tr><tr><td>제출 완료<\/td><td>제출 일시:<\/td><td>[ ]<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "확인에 사용한 자료", "html": "<ul><li><strong>과제 요구사항:<\/strong> 사용자가 제공한 <code>26-2중간과제물과제명(대학영어).pdf<\/code>. 1쪽은 공통 안내와 A, 2쪽은 B의 요구사항이다.<\/li><li><strong>기존 학습 자료:<\/strong> 위 2절에 연결한 과목 로드맵, 학습 방법, 1·2·9·10강 노트 및 해당 강의록. 강의록의 9·10강 표지에서 교재 Unit 9에 해당함을 확인했다.<\/li><li><strong>제출기간과 경로:<\/strong> <a href=\"https://www.knou.ac.kr/bbs/knou/51/810165/artclView.do\">방송대 2026학년도 2학기 중간과제물 시행공고<\/a>.<\/li><li><strong>제출 전 변경 확인:<\/strong> <a href=\"https://www.knou.ac.kr/bbs/knou/51/810847/artclView.do\">2026학년도 2학기 중간과제물 변경 공지<\/a>. 2026년 10월 4일 확인 시 10월 2일자 5차 공지까지 대학영어 변경 사항은 없었다.<\/li><\/ul>\n<p>원본 안내문의 ‘참고문헌 없음’ 표시는 B에서 요구하는 <strong>각 예문의 정확한 출처와 연도 표시<\/strong>를 생략해도 된다는 뜻이 아니다. B의 출처 표시 지시를 따른다.<\/p>"}]}]};

}));

function fmtTime(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0'); }

function hlPlain(t) {
  return t
    .replace(/^(\s*)#(\w+)/gm, '$1<span class="c-pp">#$2</span>')
    .replace(/\b(0[xX][0-9a-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[uUlLfF]*)\b/g, '<span class="c-nu">$1</span>')
    .replace(KWRE, '<span class="c-kw">$1</span>')
    .replace(FNRE, '<span class="c-pp">$1</span>');
}
function hlC(s) {
  let out = '', i = 0; const n = s.length;
  while (i < n) {
    let next = n, kind = null;
    [[s.indexOf('/*', i), 'cm1'], [s.indexOf('//', i), 'cm2'], [s.indexOf('"', i), 'q'], [s.indexOf("'", i), 'q1']]
      .forEach(([p, k]) => { if (p !== -1 && p < next) { next = p; kind = k; } });
    if (!kind) { out += hlPlain(s.slice(i)); break; }
    out += hlPlain(s.slice(i, next));
    if (kind === 'cm1') { let e = s.indexOf('*/', next + 2); e = e < 0 ? n : e + 2; out += '<span class="c-cm">' + s.slice(next, e) + '</span>'; i = e; }
    else if (kind === 'cm2') { let e = s.indexOf('\n', next); if (e < 0) e = n; out += '<span class="c-cm">' + s.slice(next, e) + '</span>'; i = e; }
    else { const q = kind === 'q' ? '"' : "'"; let j = next + 1; while (j < n && s[j] !== q) { if (s[j] === '\\') j++; j++; } j = Math.min(j + 1, n); out += '<span class="c-st">' + s.slice(next, j) + '</span>'; i = j; }
  }
  return out;
}
function applyHL(root) {
  (root || document).querySelectorAll('pre.cb code').forEach(el => {
    if (el.dataset.hl) return;
    if (el.className.indexOf('lang-c') !== -1 || el.className.indexOf('lang-text') !== -1) el.innerHTML = hlC(el.innerHTML);
    el.dataset.hl = 1;
  });
}

function recordAnswer(q, chosen) {

  if (ok) { st.c++; if (wrong[q.qid]) { delete wrong[q.qid]; store.set('wrong', wrong); } }
  else { wrong[q.qid] = (wrong[q.qid] || 0) + 1; store.set('wrong', wrong); }
  stats[q.qid] = st; store.set('stats', stats);
  return ok;
}

  if (z.mode === 'practice') {
    if (z.feedback) return;
    z.answers[q.qid] = orig;
    z.lastOk = recordAnswer(q, orig);

    z.answers[q.qid] = orig;

function nextQ() {

  const answered = z.qids.filter(id => z.answers[id] !== undefined).length;
  return `<div class="quizBar">
      <button class="btn ghost sm" onclick="exitQuiz()">✕ 종료</button>
      <b>${esc(z.title)}</b>
      <span class="muted">${z.idx + 1} / ${z.qids.length}</span>
      <div class="bar"><i style="width:${(isBatch ? answered : z.idx) / z.qids.length * 100}%"></i></div>
      ${isBatch ? `<span class="chip">⏱ <span id="tmr">${fmtTime(Date.now() - z.start)}</span></span>` : ''}
    </div>
    <div class="panel">
      <div class="qhead"><b>Q${z.idx + 1}.</b> ${qMeta(q)}</div>
      ${q.stem}
      ${opts}
      ${feedback}
    </div>
    ${nav}`;
}
function viewResults() {
  const z = S.quiz;
  const isBatch = z.mode === 'exam' || z.mode === 'random';
  let earned = 0, total = 0, nOk = 0;
  const rows = z.qids.map((id, i) => {
    const q = QID[id], my = z.answers[id], ok = my === q.answer;
    total += q.points; if (ok) { earned += q.points; nOk++; }
    const order = q.options.map((_, k) => k);
    const optHtml = order.map(k => {
      let cls = 'opt'; if (k === q.answer) cls += ' ok'; else if (k === my) cls += ' bad';
      return `<div class="${cls}"><span class="lbl">${CIRC[k]}</span><span>${q.options[k]}</span></div>`;
    }).join('');
    return `<details class="sec"><summary>${ok ? '⭕' : '❌'} Q${i + 1} <span class="muted">(${q.points}점 · ${esc(q.qid)})</span>
        ${my === undefined || my < 0 ? '<span class="muted">- 미응답</span>' : ''}</summary>
      <div class="body"><div class="qhead">${qMeta(q)}</div>${q.stem}${optHtml}
        <div class="expl ${ok ? '' : 'wrong'}">${q.expl}${q.verify ? `<div class="muted" style="margin-top:6px">검증: ${q.verify}</div>` : ''}</div>
      </div></details>`;
  }).join('');
  const pct100 = total ? Math.round(earned / total * 100) : 0;
  return `<div class="quizBar"><button class="btn ghost sm" onclick="S.quiz=null;render()">◀ 모의고사 홈</button><b>${esc(z.title)} - 결과</b></div>
    <div class="statRow">
      <div class="stat"><b>${nOk} / ${z.qids.length}</b><span class="muted">맞힌 문항</span></div>
      <div class="stat"><b>${earned} / ${total}점</b><span class="muted">득점</span></div>
      <div class="stat"><b>${pct100}점</b><span class="muted">100점 환산</span></div>
      ${isBatch && z.elapsed ? `<div class="stat"><b>${fmtTime(z.elapsed)}</b><span class="muted">소요 시간</span></div>` : ''}
    </div>
    <h3>문항별 다시 보기 <span class="muted">(클릭해서 해설 확인)</span></h3>${rows}`;
}
/* ---------- 초기화·테마 ---------- */
function resetAll() {
  if (!confirm('학습 진도·통계·오답노트를 모두 초기화할까요?')) return;
  progress = {}; wrong = {}; stats = {};
  ['progress', 'wrong', 'stats'].forEach(k => store.del(k));
  render();
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || 'light';
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  store.set('theme', next);
}
(function init() {
  const saved = store.get('theme', null);
  document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  render();
  routeHash();
})();
</script>
</body>
</html>
