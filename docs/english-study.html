<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학영어 학습</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --text:#1c2333; --muted:#66708a; --line:#dde3ee;
  --accent:#2563eb; --accent-soft:#e8effd; --ok:#16a34a; --ok-soft:#e7f6ec;
  --bad:#dc2626; --bad-soft:#fdeaea; --chip:#eef1f7; --code-bg:#f0f3f9;
  --kw:#7c3aed; --st:#15803d; --cm:#8b93a7; --pp:#0e7490; --nu:#b45309;
}
html[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1f2b; --text:#e6e9f2; --muted:#8d96ad; --line:#2a3245;
  --accent:#5b8def; --accent-soft:#1e2a44; --ok:#4ade80; --ok-soft:#15291d;
  --bad:#f87171; --bad-soft:#361b1b; --chip:#242b3b; --code-bg:#141926;
  --kw:#b18cf8; --st:#7cd992; --cm:#6b748c; --pp:#67d3e0; --nu:#e5a45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif;line-height:1.65}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0}
header .built{font-size:.72rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
#themeBtn{font-size:1.1rem;padding:4px 8px}
main{max-width:1180px;margin:0 auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font-size:1.25rem;margin:.2em 0 .6em}
h3{font-size:1.05rem}
h4{font-size:.98rem;margin:1.1em 0 .4em}
h5{font-size:.9rem;margin:1em 0 .3em;color:var(--muted)}
a{color:var(--accent)}
blockquote{margin:.8em 0;padding:.6em 1em;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
blockquote p{margin:.3em 0}
.tbl{overflow-x:auto;margin:.7em 0}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--chip)}
code{background:var(--code-bg);border-radius:5px;padding:1px 5px;font-family:Consolas,"D2Coding","Courier New",monospace;font-size:.9em}
pre.cb{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:.7em 0}
pre.cb code{background:none;padding:0;font-size:.88em;line-height:1.55}
.c-kw{color:var(--kw);font-weight:600}.c-st{color:var(--st)}.c-cm{color:var(--cm);font-style:italic}.c-pp{color:var(--pp)}.c-nu{color:var(--nu)}
ul,ol{margin:.4em 0;padding-left:1.4em}
li{margin:.18em 0}
li.chk{list-style:none;margin-left:-1.2em}
hr{border:none;border-top:1px solid var(--line);margin:1em 0}
.muted{color:var(--muted);font-size:.85em}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:9px 18px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.sm{padding:5px 12px;font-size:.85em;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.83em;margin:2px}
.chip.on{background:var(--accent);color:#fff}
/* 학습 레이아웃 */
.study{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:64px}
.side input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);margin-bottom:10px}
.lecList{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto}
.lecItem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-align:left;width:100%}
.lecItem:hover{background:var(--chip)}
.lecItem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lecItem .no{font-weight:700;font-size:.8em;min-width:2.4em}
.lecItem .dn{margin-left:auto;font-size:.9em}
.lecItem .dn.done{color:var(--ok)}
details.sec{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--panel)}
details.sec>summary{cursor:pointer;padding:11px 16px;font-weight:700;list-style:none}
details.sec>summary::before{content:"▸ ";color:var(--accent)}
details.sec[open]>summary::before{content:"▾ "}
details.sec>.body{padding:2px 18px 14px}
.lecTools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* 과제 안내 */
.assignment{min-width:0}
.assignment .chk label{display:flex;align-items:baseline;gap:9px;cursor:pointer;padding:4px 0}
.assignment input[type="checkbox"]{accent-color:var(--accent);width:17px;height:17px;flex:none}
.assignment .chk:has(input:checked){color:var(--muted)}
.assignment .chk:has(input:checked) span{text-decoration:line-through}
.assignmentNav{display:flex;flex-direction:column;gap:4px;max-height:65vh;overflow:auto}
.assignmentNav a{padding:6px 10px;border-radius:8px;text-decoration:none;font-size:.9em}
.assignmentNav a:hover{background:var(--accent-soft)}
.assignment details{scroll-margin-top:110px}
progress{width:100%;height:12px;accent-color:var(--accent)}
@media(max-width:600px){.tabs{margin-left:0;flex-wrap:wrap}.tab{padding:6px 10px}main{padding:10px}.panel{padding:14px}.assignmentNav{max-height:180px}}
/* 모의고사 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card h3{margin:.1em 0 .4em}
.statRow{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;flex:1;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qhead .pts{background:var(--chip);border-radius:8px;padding:2px 9px;font-size:.82em}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin:7px 0;background:var(--panel)}
.opt:hover{border-color:var(--accent)}
.opt .lbl{font-weight:700;color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{border:1px solid var(--ok);border-radius:11px;padding:12px 16px;margin-top:12px;background:var(--ok-soft)}
.expl.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:.82em}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qnav button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.quizBar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.g{background:var(--ok)}
/* 플래시카드 */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,25,.55);z-index:50;flex-direction:column;gap:14px;padding:20px}
#overlay.show{display:flex}
.fcard{width:min(92vw,480px);height:280px;perspective:1200px;cursor:pointer}
.fcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fcard.back .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.face.b{transform:rotateY(180deg)}
.face .t{font-size:1.25rem;font-weight:700}
.face .d{font-size:.95rem}
.fbtns{display:flex;gap:10px}
.fbtns .btn{background:var(--panel);color:var(--text);border:1px solid var(--line)}
@media (max-width:900px){
  .study{grid-template-columns:1fr}
  .side{position:static}
  .assignmentNav{max-height:180px}
  .lecList{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .lecItem{white-space:nowrap;width:auto}
  .lecItem .dn{margin-left:6px}
}
</style>
</head>

<script>
const DATA = {"subject": "대학영어", "built": "2026-10-06 00:54", "roadmap": "<h2>대학영어 - 과목 로드맵<\/h2>\n<blockquote><p>한국방송통신대학교 <strong>컴퓨터과학과 · 1학년 2학기<\/strong> (2026학년도 2학기) 교양 <strong>3학점<\/strong> · 담당 <strong>손향숙<\/strong>(1~8강) · <strong>신현욱<\/strong>(9~15강) 교수 소스: 강의록 PDF 15강 (<code>자료/대학영어/01_강의록/<\/code>) + 기출문제 + 정답표 최종 갱신: 2026-08-19 - <strong>전 15강 학습노트 완료 / 기출 3회차 105문항 + 생성 2세트 70문항<\/strong><\/p>\n<p>📌 학습 진행 방법은 00-학습방법.md를 함께 본다.<\/p><\/blockquote>\n<h3>전 15강 구성<\/h3>\n<h4>Part I - 손향숙 교수 (1~8강)<\/h4>\n<blockquote><p>구성: <strong>본문 → 어휘·어법 노트 → 어휘연습 → 연습문제 → 어휘 복습을 위한 읽기<\/strong> 출제 초점: <strong>내용 이해 + 어법(문형·전치사·수 일치) + 형태소(접두사·접미사)<\/strong><\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>강<\/th><th>Unit<\/th><th>제목<\/th><th>노트<\/th><\/tr><\/thead><tbody><tr><td><strong>1<\/strong><\/td><td>Unit 1<\/td><td>Virus [1] - 바이러스의 정의와 전파<\/td><td>01강<\/td><\/tr><tr><td><strong>2<\/strong><\/td><td>Unit 1<\/td><td>Virus [2] - 면역계와 백신<\/td><td>02강<\/td><\/tr><tr><td><strong>3<\/strong><\/td><td>Unit 2<\/td><td>Ancient Egypt [1] - 문명의 성립과 생활상<\/td><td>03강<\/td><\/tr><tr><td><strong>4<\/strong><\/td><td>Unit 2<\/td><td>Ancient Egypt [2] - 건축·사후관·종교<\/td><td>04강<\/td><\/tr><tr><td><strong>5<\/strong><\/td><td>Unit 4<\/td><td>Fear [1] - 공포의 정의와 진화적 의의<\/td><td>05강<\/td><\/tr><tr><td><strong>6<\/strong><\/td><td>Unit 4<\/td><td>Fear [2] - 투쟁-도피 반응과 극복<\/td><td>06강<\/td><\/tr><tr><td><strong>7<\/strong><\/td><td>Unit 7<\/td><td>Artists Fight Back against AI [1] - 사건과 소송<\/td><td>07강<\/td><\/tr><tr><td><strong>8<\/strong><\/td><td>Unit 7<\/td><td>Artists Fight Back against AI [2] - 양측 주장과 판단<\/td><td>08강<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Part II - 신현욱 교수 (9~15강)<\/h4>\n<blockquote><p>구성: <strong>본문해석 → 어휘와 표현 → 문장비교(어려운 원문 ↔ 쉬운 표현) → 연습문제<\/strong> 출제 초점: <strong>어구·표현의 뜻<\/strong>이 압도적. 여기에 어법(수 일치·품사·시제)이 1~2문항 붙는다<\/p><\/blockquote>\n<div class=\"tbl\"><table><thead><tr><th>강<\/th><th>Unit<\/th><th>제목<\/th><th>노트<\/th><\/tr><\/thead><tbody><tr><td><strong>9<\/strong><\/td><td>Unit 9<\/td><td>Forecasting Trends (1) - 메타버스·지속가능성·AI 윤리<\/td><td>09강<\/td><\/tr><tr><td><strong>10<\/strong><\/td><td>Unit 9<\/td><td>Forecasting Trends (2) - DeFi·원격근무·헬스테크·사이버보안<\/td><td>10강<\/td><\/tr><tr><td><strong>11<\/strong><\/td><td>Unit 11<\/td><td>The Village of Harmony Haven (1) - 7개 개념과 Aria<\/td><td>11강<\/td><\/tr><tr><td><strong>12<\/strong><\/td><td>Unit 11<\/td><td>The Village of Harmony Haven (2) - 확산·위기·희망의 등대<\/td><td>12강<\/td><\/tr><tr><td><strong>13<\/strong><\/td><td>Unit 13<\/td><td>The Canvas of Creativity (1) - 창작 생태계와 표절 논의<\/td><td>13강<\/td><\/tr><tr><td><strong>14<\/strong><\/td><td>Unit 13<\/td><td>The Canvas of Creativity (2) - 암묵적 규범과 성장<\/td><td>14강<\/td><\/tr><tr><td><strong>15<\/strong><\/td><td>Unit 15<\/td><td>Harmony's Forge - 윤리적 혁신과 인간의 잠재력<\/td><td>15강<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>과목 전체를 관통하는 흐름<\/h3>\n<blockquote><p>📌 <strong>강의가 두 개의 다른 과목처럼 나뉜다<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">1~8강 (손향숙)   설명문 4편 - 정보를 정확히 읽고, 어법을 규칙으로 익힌다\n                 → \"무엇이 사실인가\" + \"이 문장이 문법적으로 옳은가\"\n\n9~15강 (신현욱)  트렌드 해설 1편 + 우화 3편 - 어려운 표현을 쉬운 말로 바꿔 읽는다\n                 → \"이 표현이 무슨 뜻인가\" + \"이 문장을 바르게 요약한 것은\"<\/code><\/pre>\n<p>학습 전략도 달라야 한다. <strong>1~8강은 규칙과 목록<\/strong>(전치사 짝·문형·형태소·본문 사실)을 외우고, <strong>9~15강은 표현의 치환쌍<\/strong>(gain prominence = become important, stumbled upon = accidentally discovered)을 외운다.<\/p><\/blockquote>\n<blockquote><p>📌 <strong>Part II의 세 우화는 같은 구조를 반복한다<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">문제 상황 → 새로운 시도(사람 또는 기술) → 위기 또는 회의론 → 공동체의 규범으로 극복\n         → 확산 → \"등대(beacon)\"라는 수사로 마무리<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>강<\/th><th>무대<\/th><th>주역<\/th><th>마무리 수사<\/th><\/tr><\/thead><tbody><tr><td>11·12<\/td><td>Harmony Haven 마을<\/td><td>Aria<\/td><td>a <strong>beacon of hope<\/strong><\/td><\/tr><tr><td>13·14<\/td><td>NeoTube 창작 생태계<\/td><td>Shynne<\/td><td>a <strong>beacon of inspiration<\/strong ><tr><td><strong>내용 일치 / 불일치<\/strong><\/td><td>약 25%<\/td><td>\"관계가 없는 것\", \"일치하지 않는 것\" 포함<\/td><\/tr><tr><td><strong>어법 빈칸<\/strong><\/td><td>약 20%<\/td><td>전치사·관계사·분사·동명사·시제·수 일치<\/td><\/tr><tr><td><strong>어순 배열<\/strong><\/td><td>약 10%<\/td><td><code>[보기]<\/code> 조각을 바른 순서로 잇기<\/td><\/tr><tr><td><strong>문장 성분 찾기<\/strong><\/td><td>약 5%<\/td><td>목적어·정동사 찾기<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>반복 출제 지점<\/h4>\n<ul><li><strong>같은 지문을 해마다 재활용<\/strong>한다. 2017·2018·2019 세 해가 거의 같은 지문 풀(pool)을 돌려 쓴다<\/li><\/ul>\n<p>→ 같은 문장을 <strong>어느 쪽에서 묻느냐만 바꾸는<\/strong> 변형이 흔하다 ⚠️ (예: <code>Reconciliation is ( )<\/code> ↔ <code>( ) is the settling of disagreements<\/code>)<\/p>\n<ul><li><strong>전치사 짝<\/strong>: <code>be different from<\/code> · <code>be informed of<\/code> · <code>sound like<\/code> · <code>profit from<\/code> · <code>stop A from -ing<\/code> ·<\/li><\/ul>\n<p><code>for the purpose of -ing<\/code> · <code>referred to as<\/code> · <code>embedded in<\/code><\/p>\n<ul><li><strong>전치사 to + 동명사<\/strong>: <code>when it comes to -ing<\/code> · <code>in response to -ing<\/code> · <code>be used to -ing<\/code> ⭐⭐⭐ (3년 연속)<\/li><li><strong>파생어 4형태 구분<\/strong>: genetics / geneticist / genetic / gene<\/li><li><strong>수 일치<\/strong>: 긴 수식구에 가려진 주어의 핵, 관계절의 선행사<\/li><li><strong>관계사<\/strong>: 계속적 용법에 <code>that<\/code> 불가, 선행사 종류 + 뒤 절의 완전/불완전<\/li><\/ul>\n<h4>⚠️ 교재 개정 주의<\/h4>\n<p>보유한 기출(2017~2019)은 <strong>구(舊) 교재<\/strong> 기준이라 지문이 현행 교재와 다르다. (구 교재: The Canterville Ghost · Disease Detectives · 장기이식 · 우주탐사 · IT 용어)<\/p>\n<ul><li>기출은 <strong>문항 유형과 어법 포인트를 익히는 용도<\/strong>로 쓴다 - 이 부분은 그대로 유효하다<\/li><li><strong>현행 교재 내용<\/strong>은 <code>생성-Part1-1~8강.md<\/code> · <code>생성-Part2-9~15강.md<\/code>로 대비한다<\/li><li>다만 소재가 겹치는 대목이 꽤 있다 - 고대 이집트(3·4강), 면역·바이러스(1·2강),<\/li><\/ul>\n<p>AR·암호화 등 IT 용어(9·10강), <code>resilient<\/code>(11·12강)는 기출에서도 직접 출제되었다 ⭐<\/p>\n<h3>모의고사 목록<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>파일<\/th><th>문항<\/th><th>정답 근거<\/th><\/tr><\/thead><tbody><tr><td>기출-2017-2<\/td><td>35<\/td><td>정답표 대조 35/35 ✅<\/td><\/tr><tr><td>기출-2018-2<\/td><td>35<\/td><td>정답표 대조 35/35 ✅<\/td><\/tr><tr><td>기출-2019-2<\/td><td>35<\/td><td>정답표 대조 35/35 ✅<\/td><\/tr><tr><td>생성-Part1-1~8강<\/td><td>35<\/td><td>[생성] 강의록 본문 대조 ✅<\/td><\/tr><tr><td>생성-Part2-9~15강<\/td><td>35<\/td><td>[생성] 강의록 본문 대조 ✅<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>권장 학습 순서<\/h3>\n<ol><li><strong>강별 학습<\/strong> - 1강부터 순서대로. 각 강의 <code>핵심 정리<\/code>와 <code>시험 대비 포인트<\/code>를 먼저 읽고 본문으로 돌아간다<\/li><li><strong>범위별 점검<\/strong> - 8강까지 끝내면 <code>생성-Part1<\/code>, 15강까지 끝내면 <code>생성-Part2<\/code>를 푼다<\/li><li><strong>형식 적응<\/strong> - 기출 3회차를 <strong>연도순이 아니라 연속으로<\/strong> 풀어 같은 지문의 변형 패턴을 확인한다<\/li><li><strong>오답 복습<\/strong> - 틀린 문항의 <code>#태그<\/code>로 해당 강 노트를 다시 찾아본다<\/li><\/ol>\n<hr>\n<h2>대학영어 학습 방법<\/h2>\n<h3>1. 학습 목표<\/h3>\n<p>현재의 영어 실력에 부담을 느끼더라도 한 번에 많은 내용을 해결하려 하지 않고, 강의 차수별로 범위를 제한하여 차근차근 학습한다.<\/p>\n<p>이 학습의 목표는 단순히 문제의 정답을 외우는 것이 아니다. 각 강의의 본문을 바탕으로 다음 능력을 함께 기르는 것을 목표로 한다.<\/p>\n<ul><li>핵심 단어와 표현을 알아보고 뜻을 회상한다.<\/li><li>문장 안에서 단어의 품사와 역할을 파악한다.<\/li><li>본문에 사용된 문법과 숙어를 이해한다.<\/li><li>영어 문장의 전체 의미와 글의 핵심 내용을 파악한다.<\/li><li>배운 단어와 문법을 이용해 간단한 문장을 만든다.<\/li><li>일정한 간격으로 복습하여 학습 내용을 장기 기억에 남긴다.<\/li><\/ul>\n<h3>2. 기본 학습 원칙<\/h3>\n<h4>2.1 강의 차수별로 진행한다<\/h4>\n<p>한 강의의 핵심 내용을 충분히 익힌 후 다음 강의로 넘어간다. 새로운 강의를 학습할 때도 이전 강의 내용을 일부 섞어 누적 복습한다.<\/p>\n<h4>2.2 퀴즈를 학습 도구로 사용한다<\/h4>\n<p>퀴즈는 실력을 평가하기 위한 시험만이 아니라, 기억에서 답을 직접 꺼내는 연습이다. 답을 확인하기 전에 먼저 스스로 생각하고, 답변 후에는 즉시 정답과 해설을 확인한다.<\/p>\n<h4>2.3 단어를 문맥과 함께 학습한다<\/h4>\n<p>단어의 한국어 뜻만 외우지 않고 다음 내용을 함께 확인한다.<\/p>\n<ul><li>발음과 철자<\/li><li>문장에서 사용된 의미<\/li><li>품사<\/li><li>어근, 접두사와 접미사<\/li><li>함께 자주 사용되는 단어<\/li><li>본문에 나온 표현과 예문<\/li><\/ul>\n<p>예를 들어 <code>efficacy<\/code>만 외우기보다 <code>lack efficacy against ~<\/code>를 하나의 표현으로 익힌다.<\/p>\n<h4>2.4 품사는 문장 속 역할을 중심으로 학습한다<\/h4>\n<p>명사, 동사, 형용사 등의 정의만 따로 암기하지 않는다. 실제 문장에서 다음 질문에 답하는 방식으로 학습한다.<\/p>\n<ul><li>문장의 주어와 동사는 무엇인가?<\/li><li>동사가 목적어를 필요로 하는가?<\/li><li>해당 단어는 무엇을 꾸미거나 보충하는가?<\/li><li>같은 단어가 문맥에 따라 다른 품사로 쓰일 수 있는가?<\/li><li>주어와 동사의 수가 일치하는가?<\/li><\/ul>\n<h4>2.5 문법은 본문 예문에서 출발한다<\/h4>\n<p>문법 규칙을 먼저 많이 암기하기보다 본문에 실제로 나온 문장을 관찰한다. 이후 간단한 규칙을 확인하고, 틀린 문장 고치기와 직접 문장 만들기로 확장한다.<\/p>\n<h4>2.6 한 번의 정답으로 학습 완료를 판단하지 않는다<\/h4>\n<p>학습 직후 맞힌 문제도 시간이 지나면 잊을 수 있다. 다른 날에도 같은 개념을 다시 회상할 수 있어야 학습한 것으로 판단한다.<\/p>\n<h3>3. 강의별 권장 학습 순서<\/h3>\n<h4>0단계. 진단 퀴즈<\/h4>\n<ul><li>예상 시간: 약 3분<\/li><li>문제 수: 약 5문제<\/li><li>목적: 이미 아는 내용과 처음 보는 내용을 구분한다.<\/li><\/ul>\n<p>진단 점수는 평가에 사용하지 않는다. 모르는 문제에는 부담 없이 <code>모르겠어<\/code>라고 답할 수 있다.<\/p>\n<h4>1단계. 본문 전체 의미 파악<\/h4>\n<ul><li>예상 시간: 5~10분<\/li><li>정확한 번역보다 글의 주제와 흐름을 먼저 파악한다.<\/li><\/ul>\n<p>확인할 내용:<\/p>\n<ol><li>이 글은 무엇에 관한 글인가?<\/li><li>각 문단의 핵심 내용은 무엇인가?<\/li><li>반복해서 등장하는 중요 개념은 무엇인가?<\/li><\/ol>\n<h4>2단계. 핵심 단어와 표현 학습<\/h4>\n<ul><li>예상 시간: 약 15분<\/li><li>한 강의의 모든 단어를 동일한 비중으로 외우지 않는다.<\/li><\/ul>\n<p>단어는 다음과 같이 구분한다.<\/p>\n<ul><li><strong>필수 단어:<\/strong> 뜻을 직접 말하거나 쓸 수 있어야 하는 단어<\/li><li><strong>이해 단어:<\/strong> 문장에서 보았을 때 뜻을 알아볼 수 있어야 하는 단어<\/li><li><strong>표현 덩어리:<\/strong> 여러 단어를 하나로 묶어 기억할 표현<\/li><\/ul>\n<p>퀴즈는 쉬운 형태에서 어려운 형태로 진행한다.<\/p>\n<ol><li>영어 단어를 보고 한국어 뜻 고르기<\/li><li>영어 단어를 보고 뜻 직접 말하기<\/li><li>문장의 빈칸에 알맞은 단어 넣기<\/li><li>한국어를 보고 영어 표현 회상하기<\/li><li>새로운 문장에서 문맥에 맞는 뜻 판단하기<\/li><\/ol>\n<h4>3단계. 문장 속 품사와 문장 구조 학습<\/h4>\n<ul><li>예상 시간: 약 10분<\/li><li>해당 강의의 본문 문장을 이용한다.<\/li><\/ul>\n<p>주요 문제 유형:<\/p>\n<ul><li>주어, 동사와 목적어 찾기<\/li><li>밑줄 친 단어의 품사와 역할 설명하기<\/li><li>동사와 명사 형태 구분하기<\/li><li>동사의 목적어 및 전치사 사용 판단하기<\/li><li>주어와 동사의 수 일치 고치기<\/li><li>단어의 위치를 보고 알맞은 품사 추론하기<\/li><\/ul>\n<h4>4단계. 문법과 숙어 학습<\/h4>\n<ul><li>예상 시간: 10~15분<\/li><li>한 강의에서 중요한 문법과 숙어 1~3개를 우선 학습한다.<\/li><\/ul>\n<p>학습 순서:<\/p>\n<ol><li>본문 예문 관찰<\/li><li>의미와 규칙 확인<\/li><li>비슷한 표현과 비교<\/li><li>틀린 문장 고치기<\/li><li>배운 구조로 직접 문장 만들기<\/li><\/ol>\n<h4>5단계. 독해와 실제 사용<\/h4>\n<ul><li>예상 시간: 약 10분<\/li><li>어휘와 문법 지식을 본문 이해에 연결한다.<\/li><\/ul>\n<p>활동 예시:<\/p>\n<ul><li>문장을 의미 단위로 끊기<\/li><li>문장 순서 배열하기<\/li><li>올바른 해석 고르기<\/li><li>문단의 핵심 내용 말하기<\/li><li>본문의 내용이 맞는지 판단하고 근거 찾기<\/li><li>배운 표현으로 짧은 영어 문장 만들기<\/li><li>본문을 보지 않고 핵심 내용을 한국어로 설명하기<\/li><li>중요한 문장을 소리 내어 읽기<\/li><\/ul>\n<h4>6단계. 종료 퀴즈와 복습 항목 정리<\/h4>\n<ul><li>학습 직후 5문제 정도의 종료 퀴즈를 푼다.<\/li><li>맞힌 문제와 틀린 문제를 구분한다.<\/li><li>우연히 맞혔거나 확신 없이 답한 문제도 복습 대상으로 기록한다.<\/li><li>다음 복습에서 틀린 내용과 헷갈린 내용을 우선 출제한다.<\/li><\/ul>\n<h3>4. 권장 복습 일정<\/h3>\n<p>다음 일정은 실천하기 쉬운 기본안이며, 학습 결과에 따라 간격을 조정한다.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>시점<\/th><th>학습 내용<\/th><\/tr><\/thead><tbody><tr><td>학습 직후<\/td><td>종료 퀴즈 약 5문제<\/td><\/tr><tr><td>다음 날<\/td><td>단어와 문법 5~10문제<\/td><\/tr><tr><td>3일 뒤<\/td><td>이전에 틀렸던 문제 중심의 복습<\/td><\/tr><tr><td>7일 뒤<\/td><td>다른 강의와 섞은 누적 퀴즈<\/td><\/tr><tr><td>14일 뒤<\/td><td>단답형, 독해와 문장 만들기 중심의 점검<\/td><\/tr><\/tbody><\/table><\/div>\n<p>새로운 강의를 학습할 때 퀴즈의 권장 구성은 다음과 같다.<\/p>\n<ul><li>현재 강의: 약 70%<\/li><li>이전 강의 누적 복습: 약 30%<\/li><\/ul>\n<h3>5. 채팅형 실시간 학습 진행 방식<\/h3>\n<p>채팅에서는 한 번에 한 문제씩 진행한다.<\/p>\n<ol><li>튜터가 문제를 한 개 제시한다.<\/li><li>학습자가 답하거나 <code>모르겠어<\/code>라고 말한다.<\/li><li>튜터가 정답 여부와 짧은 해설을 제공한다.<\/li><li>오답의 원인을 확인하고 필요한 경우 더 쉬운 보충 문제를 낸다.<\/li><li>이해한 경우 조금 더 어려운 문제로 확장한다.<\/li><li>틀렸거나 헷갈린 개념은 같은 학습 중 또는 다음 복습에서 다시 출제한다.<\/li><\/ol>\n<p>학습자는 번호, 단어, 문장 또는 한국어 설명 등 편한 형식으로 답할 수 있다. 철자나 문법이 틀렸더라도 의미가 전달되면 먼저 잘한 부분을 확인하고 수정할 부분을 구체적으로 설명한다.<\/p>\n<h4>답변 후 피드백 형식<\/h4>\n<p>각 문제의 피드백은 다음 순서로 제공한다.<\/p>\n<ol><li>정답 여부<\/li><li>정답과 핵심 이유<\/li><li>현재 답변에서 잘 이해한 부분<\/li><li>보완할 부분<\/li><li>다음 문제<\/li><\/ol>\n<h4>난이도 조절 원칙<\/h4>\n<ul><li>연속해서 어려워하면 보기형 문제나 힌트를 제공한다.<\/li><li>안정적으로 맞히면 단답형, 문장 해석과 문장 만들기로 확장한다.<\/li><li>단어를 알지만 문장에서 이해하지 못하면 문맥 문제를 추가한다.<\/li><li>문법 규칙은 알지만 사용하지 못하면 오류 수정과 문장 만들기를 추가한다.<\/li><li>같은 유형을 반복해서 틀리면 개념 설명 후 유사 문제를 다시 낸다.<\/li><\/ul>\n<h3>6. 퀴즈 구성 원칙<\/h3>\n<p>선택형 문제에만 의존하지 않는다. 한 학습 세트 안에서 다음 문제를 적절히 섞는다.<\/p>\n<ul><li>뜻 고르기<\/li><li>직접 뜻 말하기<\/li><li>빈칸 채우기<\/li><li>품사와 문장 성분 찾기<\/li><li>틀린 문장 고치기<\/li><li>영어 문장 해석하기<\/li><li>한국어를 보고 영어 표현 회상하기<\/li><li>본문 내용에 답하기<\/li><li>배운 표현으로 문장 만들기<\/li><\/ul>\n<p>정답을 본 뒤에는 이해한 것처럼 느끼기 쉽다. 따라서 정답을 가리는 문제, 직접 답을 만드는 문제와 시간이 지난 후의 재시험을 중요하게 다룬다.<\/p>\n<h3>7. 1강 적용 예시<\/h3>\n<p><code>01강 - Unit 1 Virus [1]<\/code>에서는 다음 내용을 중심으로 진행한다.<\/p>\n<h4>핵심 단어와 표현<\/h4>\n<ul><li><code>submicroscopic<\/code><\/li><li><code>virology<\/code><\/li><li><code>microbiology<\/code><\/li><li><code>malady<\/code><\/li><li><code>ailment<\/code><\/li><li><code>efficacy<\/code><\/li><li><code>vector<\/code><\/li><li><code>disperse<\/code><\/li><li><code>consist of ~<\/code><\/li><li><code>lack efficacy against ~<\/code><\/li><li><code>be transmitted through/by ~<\/code><\/li><li><code>feed on plant sap<\/code><\/li><\/ul>\n<h4>품사와 문장 구조<\/h4>\n<ul><li><code>lack<\/code>이 목적어를 직접 취하는 동사라는 점<\/li><li><code>disperse<\/code>의 자동사와 타동사 용법<\/li><li><code>insects that feed<\/code>에서 선행사와 동사의 수 일치<\/li><li><code>allow<\/code>가 사용된 여러 문장 구조<\/li><\/ul>\n<h4>문법과 어법<\/h4>\n<ul><li>수동태 <code>be + p.p.<\/code><\/li><li><code>allow + 목적어 + to부정사<\/code><\/li><li>관계대명사절의 수 일치<\/li><li><code>consist of<\/code>와 유사 표현<\/li><li><code>spread – spread – spread<\/code>의 불규칙 변화<\/li><\/ul>\n<h4>독해 확인<\/h4>\n<ul><li>바이러스와 세균의 차이를 설명할 수 있는가?<\/li><li>항생제가 바이러스에 효과가 없는 이유를 말할 수 있는가?<\/li><li>본문에 나온 바이러스 전파 경로를 구분할 수 있는가?<\/li><li>본문에 언급되지 않은 정보를 찾아낼 수 있는가?<\/li><\/ul>\n<h3>8. 학습 진행 기준<\/h3>\n<p>다음 조건을 만족하면 해당 강의의 기본 학습을 완료한 것으로 본다.<\/p>\n<ul><li>핵심 단어 대부분의 뜻을 직접 회상할 수 있다.<\/li><li>주요 표현을 문장에서 알아볼 수 있다.<\/li><li>핵심 문법 문제의 정답 이유를 설명할 수 있다.<\/li><li>본문의 중요한 문장을 해석할 수 있다.<\/li><li>글의 핵심 내용을 자신의 말로 설명할 수 있다.<\/li><li>시간이 지난 뒤의 복습에서도 주요 내용을 다시 회상할 수 있다.<\/li><\/ul>\n<p>한 항목을 완벽하게 익히지 못했다고 학습 전체를 중단하지 않는다. 어려운 항목은 복습 대상으로 남겨 두고 다음 강의에서도 반복해서 만난다.<\/p>\n<h3>9. 학습 근거<\/h3>\n<ul><li>미국 교육부 What Works Clearinghouse - Organizing Instruction and Study to Improve Student Learning: 능동적 회상 퀴즈와 시간 간격을 둔 복습을 권장한다.<\/li><li>Language Teaching Research - Improving second language vocabulary learning and retention: 간격을 둔 회상 연습과 피드백을 결합한 어휘 학습의 효과를 다룬다.<\/li><li>Language Learning - Does Type of Instruction Make a Difference?: 목표 언어 형식에 집중하는 명시적 제2언어 학습의 효과를 검토한다.<\/li><li>Cambridge University Press - Experimental and Intervention Studies on Formulaic Sequences in a Second Language: 단어를 숙어와 연어 같은 표현 덩어리로 학습하는 방법을 검토한다.<\/li><\/ul>", "lectures": [{"id": 1, "title": "Unit 1 Virus [1]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>submicroscopic<\/strong><\/td><td>현미경으로도 보이지 않을 만큼 <strong>극히 작은<\/strong>. <code>sub-<\/code>(아래·미만) + <code>microscopic<\/code>(현미경의)<\/td><\/tr><tr><td><strong>virology<\/strong><\/td><td><strong>바이러스학<\/strong>. <code>virus<\/code> + <code>-logy<\/code>(학문). <code>microbiology<\/code>(미생물학)의 한 분야<\/td><\/tr><tr><td><strong>microbiology<\/strong><\/td><td><strong>미생물학<\/strong>. <code>micro-<\/code>(극히 작은) + <code>bio-<\/code>(생명) + <code>-logy<\/code>(학문)<\/td><\/tr><tr><td><strong>malady<\/strong><\/td><td><strong>질병, 병폐<\/strong>. <code>mal-<\/code>(나쁜) 어근 계열<\/td><\/tr><tr><td><strong>ailment<\/strong><\/td><td>(그리 중하지 않은) <strong>질환, 병<\/strong><\/td><\/tr><tr><td><strong>antibiotics<\/strong><\/td><td><strong>항생제<\/strong>. <code>anti-<\/code>(대항) + <code>bio-<\/code>(생명) → 세균을 죽이는 약<\/td><\/tr><tr><td><strong>efficacy<\/strong><\/td><td><strong>효험, 효능<\/strong>. <code>lack efficacy against ~<\/code> = ~에 효력이 없다<\/td><\/tr><tr><td><strong>vector<\/strong><\/td><td>(병원체를 옮기는) <strong>매개체·매개생물<\/strong><\/td><\/tr><tr><td><strong>disperse<\/strong><\/td><td><strong>흩어지다, 흩뜨리다, 퍼지다<\/strong><\/td><\/tr><tr><td><strong>aphid<\/strong><\/td><td><strong>진딧물<\/strong> (식물 수액을 빨아먹는 곤충)<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 3p.~5p.)<\/h4>\n<p><strong>① 바이러스의 정의<\/strong> (3p.)<\/p>\n<blockquote><ol><li>A virus is a <strong>submicroscopic<\/strong> infectious agent that replicates only inside the living cells of an organism.<\/li><\/ol><\/blockquote>\n<ul><li>바이러스는 생물의 <strong>살아 있는 세포 안에서만 복제<\/strong>되는 극미(極微) 감염체다.<\/li><li>⚠️ <code>replicates only inside the living cells<\/code> - \"살아 있는 세포 안에서만\"이라는 <strong>한정<\/strong>이 출제 포인트<\/li><\/ul>\n<blockquote><p>Viruses infect all life forms, from animals and plants to microorganisms. The study of viruses is called <strong>virology<\/strong>, which is a part of <strong>microbiology<\/strong>. Viruses <strong>consist of<\/strong> genetic materials surrounded by a protective coat of protein, so they are more difficult to kill than bacteria.<\/p><\/blockquote>\n<ul><li>바이러스 = <strong>유전물질 + 이를 둘러싼 단백질 보호막<\/strong> → 그래서 <strong>세균보다 죽이기 어렵다<\/strong> ⭐⭐⭐<\/li><li>바이러스학(virology) ⊂ 미생물학(microbiology) ⭐⭐⭐ (연습문제로 직접 출제됨)<\/li><\/ul>\n<p><strong>② 경미한 질환의 대처법<\/strong> (3p.~4p.)<\/p>\n<blockquote><p>In the case of a minor <strong>ailment<\/strong> induced by a viral infection, the optimal strategy is to <strong>allow<\/strong> the <strong>malady<\/strong> to progress naturally.<\/p><\/blockquote>\n<ul><li>바이러스 감염으로 인한 <strong>가벼운 질환<\/strong>은 <strong>자연히 경과하도록 두는 것<\/strong>이 최선의 전략이다 ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>It is crucial to recognize that <strong>antibiotics<\/strong>, designed to combat bacterial infections, <strong>lack efficacy<\/strong> against viral entities. Antibiotics do not kill viruses and the use of them just leads to antibiotic resistance.<\/p><\/blockquote>\n<ul><li>항생제는 <strong>세균<\/strong>용이라 <strong>바이러스에는 효과가 없고<\/strong>, 남용하면 <strong>항생제 내성(antibiotic resistance)<\/strong> 만 부른다 ⭐⭐⭐<\/li><\/ul>\n<p><strong>③ 바이러스의 전파 경로<\/strong> (4p.~5p.)<\/p>\n<blockquote><ol><li>Viruses <strong>spread<\/strong> in many ways. One transmission pathway is through disease-bearing organisms <strong>known as vectors<\/strong>: for example, viruses <strong>are<\/strong> often <strong>transmitted<\/strong> from plant to plant by insects that feed on plant sap, such as aphids; and viruses in animals can <strong>be carried<\/strong> by blood-sucking insects.<\/li><\/ol><\/blockquote>\n<ul><li>전파 경로 ①: <strong>매개생물(vectors)<\/strong> - 식물은 진딧물 같은 <strong>수액을 빨아먹는 곤충<\/strong>, 동물은 <strong>흡혈 곤충<\/strong><\/li><\/ul>\n<blockquote><p>Additionally, numerous viruses <strong>disperse<\/strong> through airborne particles generated by respiratory activities such as coughing and sneezing.<\/p><\/blockquote>\n<ul><li>전파 경로 ②: <strong>기침·재채기로 생긴 공기 중 입자(airborne particles)<\/strong><\/li><\/ul>\n<blockquote><p>This airborne transmission is <strong>observed<\/strong> in pathogens like influenza viruses, SARS-CoV-2, chickenpox, smallpox, and measles. HIV is one of several viruses transmitted through <strong>sexual contact<\/strong> and by <strong>exposure to infected blood<\/strong>.<\/p><\/blockquote>\n<ul><li>공기 전파 예: 인플루엔자, SARS-CoV-2, 수두(chickenpox), 천연두(smallpox), 홍역(measles)<\/li><li>전파 경로 ③: <strong>성적 접촉·감염 혈액 노출<\/strong> - HIV<\/li><li>⚠️ 본문에 <strong>\"정화된 물(purified water)\"<\/strong> 은 전파 경로로 <strong>나오지 않는다<\/strong> - NOT 유형의 정답 근거<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>접두사·접미사<\/strong> ⭐⭐⭐<\/p>\n<div class=\"tbl\"><table><thead><tr><th>형태소<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><code>sub-<\/code><\/td><td>\"under,\" \"below,\" \"beneath\"<\/td><td>subalpine, substratum<\/td><\/tr><tr><td><\/td><td>\"slightly,\" \"imperfectly,\" \"nearly\"<\/td><td>subcolumnar, subtropical<\/td><\/tr><tr><td><\/td><td>\"secondary,\" \"subordinate\"<\/td><td>subcommittee, subplot<\/td><\/tr><tr><td><code>micro-<\/code><\/td><td>\"extremely small\"<\/td><td>microchip, microorganism<\/td><\/tr><tr><td><code>-scope<\/code><\/td><td>\"instrument for viewing\" (복합어 형성)<\/td><td>telescope<\/td><\/tr><tr><td><code>bio-<\/code><\/td><td>\"life\"<\/td><td>biology<\/td><\/tr><tr><td><code>-logy<\/code><\/td><td>학문·지식 체계의 이름에 쓰이는 결합형<\/td><td>paleontology, theology<\/td><\/tr><tr><td><code>mal-<\/code><\/td><td>\"bad,\" \"wrongful,\" \"ill\" (프랑스어 차용어에서 유래)<\/td><td>malfunction, malcontent<\/td><\/tr><tr><td><code>anti-<\/code><\/td><td>\"against,\" \"opposite of\" (복합어 형성)<\/td><td>antibody, antifreeze<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>consist of ~<\/strong> = be composed of ~ / comprise / be made up of ~ ⭐⭐<\/p>\n<p><strong>allow<\/strong> - 문형 정리 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Do you think Dad will allow you to go to Jamie's party?   ← allow + 목적어 + to부정사(5형식)\nYou're not allowed to talk during the exam.               ← 수동태\nPets aren't allowed in this hotel.\nSmoking is not allowed in this restaurant.\nHe didn't allow us enough time to finish the test.        ← allow + 간접목적어 + 직접목적어(4형식)<\/code><\/pre>\n<p><strong>lack<\/strong> (동사) - 목적어를 <strong>직접<\/strong> 취한다 (전치사 없음) ⚠️<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">She totally lacks a sense of humor.     (그녀는 유머 감각이 전혀 없다.)\nThe proposal lacked detailed data.<\/code><\/pre>\n<p><strong>불규칙 동사·수동태<\/strong> ⭐⭐<\/p>\n<ul><li><code>spread – spread – spread<\/code> (3단 변화가 모두 같음)<\/li><li><code>know – knew – known<\/code><\/li><li>수동태(the passive voice) = <strong>be동사 + p.p.(과거분사)<\/strong><\/li><\/ul>\n<p><strong>disperse<\/strong> - 자동사·타동사 양쪽으로 쓰인다<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Pollen grains disperse far and wide.                       (자동사)\nWhen the rain came down, the crowds started to disperse.   (자동사)\nPolice dispersed the crowd that had gathered.              (타동사)\nThe fragrance from the blooming flowers dispersed throughout the garden.<\/code><\/pre>\n<p><strong>observe의 파생어<\/strong> ⚠️ 혼동 주의<\/p>\n<ul><li><code>observation<\/code> - 관찰<\/li><li><code>observance<\/code> - (법·관습의) 준수, (기념일의) 기념<\/li><\/ul>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>괄호 안에 알맞은 동사를 채워 넣으시오.<\/li><\/ol>\n<ul><li>She totally ( ) a sense of humor. (그녀는 유머 감각이 전혀 없다.) → <strong>lacks<\/strong><\/li><\/ul>\n<ol><li>괄호 안에 공통으로 들어가 문장을 자연스럽게 완성시킬 수 있는 동사는 무엇인가? → <strong>disperse<\/strong><\/li><\/ol>\n<ul><li>Pollen grains ( ) far and wide.<\/li><li>When the rain came down, the crowds started to ( ).<\/li><li>Police ( ) the crowd that had gathered.<\/li><li>The fragrance from the blooming flowers ( ) throughout the garden.<\/li><\/ul>\n<ol><li>allow 동사를 사용하여 3형식, 4형식, 5형식 문장을 하나씩 만든다.<\/li><\/ol>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What is the field of study that focuses on viruses called?<\/li><\/ol>\n<p>A. Bacteriology B. <strong>Virology<\/strong> C. Microbiology D. Pathology<\/p>\n<ol><li>In the case of a minor ailment induced by a viral infection, what is the best strategy?<\/li><\/ol>\n<p>A. Take antibiotics. B. Do not drink water. C. Study genetic disease. <strong>D. Allow the malady to progress naturally.<\/strong><\/p>\n<ol><li>Which of the following is NOT a method of virus transmission mentioned in the text?<\/li><\/ol>\n<p>A. Through vectors like insects that feed on plant sap <strong>B. Through purified water sources<\/strong> C. Through airborne particles from coughing and sneezing D. Through sexual contact and exposure to infected blood<\/p>\n<ol><li>괄호 안에 알맞은 전치사는 무엇인가? - Viruses spread ( ) many ways. → <strong>in<\/strong><\/li><li>밑줄 친 ①~④에서 문법적으로 옳지 않은 부분을 찾아 바르게 고치시오.<\/li><\/ol>\n<ul><li>Viruses ①are often ②transmitted from plant to plant by insects ③that ④feeds on plant sap, such as aphids.<\/li><li>→ ④ <code>feeds<\/code> → <strong><code>feed<\/code><\/strong> (선행사 <code>insects<\/code>가 복수이므로 관계대명사절 동사도 복수)<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>바이러스 vs 세균<\/strong> - 바이러스는 <strong>유전물질을 단백질 껍질이 감싼<\/strong> 구조라서 세균보다 죽이기 어렵다. 그래서 <strong>항생제(세균용)는 바이러스에 무효<\/strong>하고, 남용은 <strong>내성(resistance)<\/strong> 을 낳는다. 이 대비가 Unit 1의 축이다.<\/p>\n<p>📌 <strong>학문 계층<\/strong> - <code>virology ⊂ microbiology<\/code>. <code>bio-<\/code>(생명) + <code>-logy<\/code>(학문) 조어를 알면 보기 4개를 즉시 가른다.<\/p>\n<p>📌 <strong>전파 3경로<\/strong> - ① 매개생물(vectors: 진딧물·흡혈곤충) ② 공기 중 입자(기침·재채기) ③ 성접촉·감염 혈액. ⚠️ <strong>물(water)<\/strong> 은 본문에 없다. \"NOT ~ mentioned\" 유형의 단골 오답 미끼.<\/p>\n<p>📌 <strong>접두사 지도<\/stron t leads to antibiotic resistance. 항생제는 세균 용이라 바이러스에는 효과가 없고 , 남용하면 항생제 내성 antibiotic resistance 만 부른다 ⭐⭐⭐ ③ 바이러스의 전파 경로 4p.~5p. 2. viruses spread in many ways. one transmission pathway is through disease bearing organisms known as vectors : for example, viruses are often transmitted from plant to plant by insects that feed on plant sap, such as aphids; and viruses in animals can be carried by blood sucking insects. 전파 경로 ①: 매개생물 vectors - 식물은 진딧물 같은 수액을 빨아먹는 곤충 , 동물은 흡혈 곤충 additionally, numerous viruses disperse through airborne particles generated by respiratory activities such as coughing and sneezing. 전파 경로 ②: 기침·재채기로 생긴 공기 중 입자 airborne particles this airborne transmission is observed in pathogens like influenza viruses, sars cov 2, chickenpox, smallpox, and measles. hiv is one of several viruses transmitted through sexual contact and by exposure to infected blood . 공기 전파 예: 인플루엔자, sars cov 2, 수두 chickenpox , 천연두 smallpox , 홍역 measles 전파 경로 ③: 성적 접촉·감염 혈액 노출 - hiv ⚠️ 본문에 \"정화된 물 purified water \" 은 전파 경로로 나오지 않는다 - not 유형의 정답 근거 2. 어휘·어법 노트 강의록 원문 접두사·접미사 ⭐⭐⭐ 형태소 의미 예 sub \"under,\" \"below,\" \"beneath\" subalpine, substratum \"slightly,\" \"imperfectly,\" \"nearly\" subcolumnar, subtropical \"secondary,\" \"subordinate\" subcommittee, subplot micro \"extremely small\" microchip, microorganism scope \"instrument for viewing\" 복합어 형성 telescope bio \"life\" biology logy 학문·지식 체계의 이름에 쓰이는 결합형 paleontology, theology mal \"bad,\" \"wrongful,\" \"ill\" 프랑스어 차용어에서 유래 malfunction, malcontent anti \"against,\" \"opposite of\" 복합어 형성 antibody, antifreeze consist of ~ = be composed of ~ / comprise / be made up of ~ ⭐⭐ allow - 문형 정리 ⭐⭐ lack 동사 - 목적어를 직접 취한다 전치사 없음 ⚠️ 불규칙 동사·수동태 ⭐⭐ spread – spread – spread 3단 변화가 모두 같음 know – knew – known 수동태 the passive voice = be동사 + p.p. 과거분사 disperse - 자동사·타동사 양쪽으로 쓰인다 observe의 파생어 ⚠️ 혼동 주의 observation - 관찰 observance - 법·관습의 준수, 기념일의 기념 3. 어휘연습 강의록 원문 1. 괄호 안에 알맞은 동사를 채워 넣으시오. she totally a sense of humor. 그녀는 유머 감각이 전혀 없다. → lacks 2. = be made up of 동의 표현 ⭐⭐ lack + 목적어 전치사 없음 , allow 3·4·5형식 ⭐ spread – spread – spread , know – knew – known , 수동태 be + p.p. ⭐ 관계대명사절 수 일치 insects that feed on plant sap "}, {"id": 2, "title": "Unit 1 Virus [2]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>immune system<\/strong><\/td><td><strong>면역계<\/strong>. 질병으로부터 유기체를 보호하는 생물학적 체계의 <strong>network<\/strong><\/td><\/tr><tr><td><strong>pathogen<\/strong><\/td><td><strong>병원체<\/strong> (바이러스·세균·기생충 등 질병을 일으키는 것)<\/td><\/tr><tr><td><strong>layered defenses<\/strong><\/td><td><strong>층위를 이룬 방어<\/strong>. 특이성(specificity)이 점점 높아지는 구조<\/td><\/tr><tr><td><strong>physical barrier<\/strong><\/td><td><strong>물리적 장벽<\/strong>. 병원체가 유기체 안으로 들어오는 것을 막는 1차 방어<\/td><\/tr><tr><td><strong>innate immune system<\/strong><\/td><td><strong>선천 면역계<\/strong>. 즉각적이지만 <strong>비특이적(non-specific)<\/strong> 반응<\/td><\/tr><tr><td><strong>adaptive immune system<\/strong><\/td><td><strong>적응(획득) 면역계<\/strong>. 감염 중 반응을 <strong>적응·개선<\/strong>시켜 병원체 인식력을 높임<\/td><\/tr><tr><td><strong>immunological memory<\/strong><\/td><td><strong>면역학적 기억<\/strong>. 병원체 제거 후에도 남아 재감염 시 더 빠르고 강한 공격을 가능케 함<\/td><\/tr><tr><td><strong>vaccine<\/strong><\/td><td><strong>백신<\/strong>. 질병에 대한 신체의 면역반응을 자극하기 위한 제제(preparation)<\/td><\/tr><tr><td><strong>attenuated / inactivated<\/strong><\/td><td><strong>약독화된 / 불활성화된<\/strong> (미생물의 형태)<\/td><\/tr><tr><td><strong>elicit<\/strong><\/td><td>(반응을) <strong>끌어내다, 유도하다<\/strong><\/td><\/tr><tr><td><strong>breach<\/strong><\/td><td>(장벽·합의를) <strong>뚫다, 위반하다<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 5p.~8p.)<\/h4>\n<p><strong>① 면역계란 무엇인가<\/strong> (5p.~6p.)<\/p>\n<blockquote><ol><li>The immune system is a <strong>network of biological systems<\/strong> that protects an organism from diseases. It detects and responds to a wide variety of pathogens, from viruses to parasitic worms, as well as cancer cells and objects such as wood splinters.<\/li><\/ol><\/blockquote>\n<ul><li>면역계의 <strong>1차 기능 = 질병으로부터 유기체를 보호<\/strong> ⭐⭐⭐<\/li><li>대응 대상: 바이러스, 기생충(parasitic worms), <strong>암세포<\/strong>, <strong>나뭇조각 같은 이물질<\/strong><\/li><li>⚠️ <strong>유익균(beneficial bacteria)<\/strong> 은 방어 대상으로 <strong>언급되지 않는다<\/strong> - NOT 유형 정답 근거<\/li><\/ul>\n<p><strong>② 층위 방어: 물리적 장벽 → 선천 면역 → 적응 면역<\/strong> ⭐⭐⭐<\/p>\n<blockquote><p>The immune system employs <strong>layered defenses<\/strong>, increasing in specificity, to protect the host from infections. <strong>Physical barriers<\/strong> prevent pathogens such as bacteria and viruses from <strong>entering<\/strong> the organism.<\/p><\/blockquote>\n<blockquote><p>If a pathogen <strong>breaches<\/strong> these barriers, the <strong>innate immune system<\/strong> provides an <strong>immediate, but non-specific<\/strong> response.<\/p><\/blockquote>\n<blockquote><p>In instances where pathogens effectively <strong>elude<\/strong> the innate immune response, vertebrates employ a secondary line of defense known as the <strong>adaptive immune system<\/strong>. Here, the immune system <strong>adapts its response during an infection to improve its recognition of the pathogen<\/strong>.<\/p><\/blockquote>\n<ul><li>방어 3단계 정리<\/li><\/ul>\n<pre class=\"cb\"><code class=\"lang-text\">물리적 장벽(physical barriers)      ← 병원체의 \"진입\" 차단\n        ↓ 뚫리면(breach)\n선천 면역(innate)                   ← 즉각적 / 비특이적\n        ↓ 회피당하면(elude)\n적응 면역(adaptive, 척추동물)        ← 감염 중 반응을 적응시켜 인식력 향상<\/code><\/pre>\n<ul><li>⚠️ <strong>특이성(specificity)이 점점 커지는<\/strong> 방향이라는 점이 핵심<\/li><\/ul>\n<p><strong>③ 면역학적 기억<\/strong> (6p.~7p.)<\/p>\n<blockquote><p>This improved response is then retained after the pathogen has been eliminated, in the form of an <strong>immunological memory<\/strong>, and <strong>allows<\/strong> the adaptive immune system to <strong>mount<\/strong> faster and stronger attacks each time this pathogen is encountered.<\/p><\/blockquote>\n<ul><li>개선된 반응은 병원체가 제거된 뒤에도 <strong>면역학적 기억<\/strong>으로 남아, <strong>같은 병원체를 만날 때마다 더 빠르고 강한 공격<\/strong>을 가능하게 한다 ⭐⭐⭐<\/li><\/ul>\n<p><strong>④ 백신<\/strong> (7p.~8p.)<\/p>\n<blockquote><ol><li>A <strong>vaccine<\/strong> is a preparation that is used to <strong>stimulate the body's immune response against diseases<\/strong>. The safety and efficacy of vaccines have undergone <strong>extensive scrutiny and validation<\/strong>.<\/li><\/ol><\/blockquote>\n<blockquote><p>Typically, a vaccine <strong>comprises<\/strong> an agent that resembles a pathogenic microorganism and is derived from <strong>attenuated or inactivated<\/strong> forms of the microbe, its toxins, or one of its surface proteins.<\/p><\/blockquote>\n<blockquote><p>This agent serves to <strong>elicit a response<\/strong> from the body's immune system, facilitating its <strong>recognition, destruction, and the development of immunological memory<\/strong> to guard against the perceived threat. <strong>Vaccination is considered as the most effective means of preventing infectious diseases.<\/strong><\/p><\/blockquote>\n<ul><li>백신의 목적 = <strong>질병에 맞선 신체 면역반응을 자극<\/strong> ⭐⭐⭐<\/li><li>백신의 재료 = 병원성 미생물을 <strong>닮은<\/strong> 물질 (약독화·불활성화된 미생물, 그 독소, 또는 표면 단백질 하나)<\/li><li>백신의 안전성·효능은 <strong>광범위한 검증을 거쳤다<\/strong> ⚠️ (\"거의 검증되지 않는다\"는 보기가 오답 미끼)<\/li><li><strong>백신접종 = 감염병 예방의 가장 효과적인 수단<\/strong> ⭐⭐⭐<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>enter<\/strong> - <strong>타동사<\/strong>로 쓰여 전치사가 필요 없다 ⚠️ (<code>enter into<\/code>가 아님)<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Please knock before you enter my office.\nTo access the building, you must enter a security code into the keypad by the door.\nBefore you enter the country, you must declare any items of value at customs.<\/code><\/pre>\n<p><strong>breach<\/strong> - (합의를) 위반하다 / (방어를) 뚫다 / (제방을) 무너뜨리다<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">They breached the agreement they had made with their employer.\nThe hackers managed to breach the company's cybersecurity defenses.\nThe floodwaters continued to rise, threatening to breach the levee and inundate the nearby homes.<\/code><\/pre>\n<p><strong>allow<\/strong> (1강에 이어 <strong>2회 반복 등장<\/strong> - 출제 신호 ⭐)<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Do you think Dad will allow you to go to Jamie's party?\nYou're not allowed to talk during the exam.\nPets aren't allowed in this hotel.\nSmoking is not allowed in this restaurant.\nHe didn't allow us enough time to finish the test.<\/code><\/pre>\n<p><strong>mount<\/strong> - 다의어 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The children's excitement is mounting as Christmas gets nearer.   (점점 커지다)\nShe mounted her horse and rode off.                                (올라타다)\nThe army prepared to mount an attack on the enemy stronghold.      (개시하다·감행하다)\nThe art gallery is ready to mount an exhibition of contemporary sculptures next week.  (열다·전시하다)<\/code><\/pre>\n<p><strong>comprise<\/strong> - \"~로 구성되다\"<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The book comprises ten chapters.\nThe national park comprises several hiking trails, offering diverse scenic views.\nThe committee is comprised of experts from different fields, ensuring a comprehensive perspective.<\/code><\/pre>\n<ul><li>동의 표현: <strong>consist of<\/strong> / <strong>be composed of<\/strong> / <strong>be made up of<\/strong> ⭐⭐ (1강과 연결)<\/li><\/ul>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>괄호 안에 알맞은 동사를 채워 넣으시오.<\/li><\/ol>\n<ul><li>They ( ) the agreement they had made with their employer. (그들은 고용주와 한 합의를 위반했다.) → <strong>breached<\/strong><\/li><\/ul>\n<ol><li>괄호 안에 적절한 동사는 무엇인가?<\/li><\/ol>\n<ul><li>The army prepared to ( ) an attack on the enemy stronghold. → <strong>mount<\/strong><\/li><\/ul>\n<ol><li>comprise와 같은 의미를 지니는 표현을 두 개 적는다. → <strong>consist of / be composed of / be made up of<\/strong> 중 둘<\/li><\/ol>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What is the primary function of the immune system?<\/li><\/ol>\n<p>A. To regulate body temperature <strong>B. To protect the organism from diseases<\/strong> C. To assist in the digestion of food D. To produce blood cells<\/p>\n<ol><li>Which of the following is NOT listed as a pathogen the immune system protects against?<\/li><\/ol>\n<p>A. Bacteria B. Viruses C. Parasitic worms <strong>D. Beneficial bacteria<\/strong><\/p>\n<ol><li>What is the role of the adaptive immune system?<\/li><\/ol>\n<p>A. To provide an immediate, non-specific response to pathogens ← 선천 면역의 역할 B. To prevent pathogens from entering the organism ← 물리적 장벽의 역할 <strong>C. To adapt its response to improve recognition of a pathogen during an infection<\/strong> D. To regulate the body's temperature in response to an infection<\/p>\n<ol><li>What is the purpose of a vaccine?<\/li><\/ol>\n<p>A. To weaken the body's immune system <strong>B. To stimulate the body's immune response against diseases<\/strong> C. To serve as a treatment for ongoing infections D. To identify and remove toxins from the body<\/p>\n<ol><li>Which of the following is true?<\/li><\/ol>\n<p>A. Vaccines often contain harmful microorganisms that can cause diseases. ← 약독화·불활성화 형태 B. The efficacy and safety of vaccines are rarely scrutinized or validated. ← 본문과 반대 C. Vaccines work by suppressing the immune system's response to pathogens. ← 자극(stimulate)이지 억제가 아님 <strong>D. Vaccination is considered the most effective method of preventing infectious diseases.<\/strong><\/p>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>3단 방어선이 Unit 1 [2]의 뼈대<\/strong> - 물리적 장벽 → 선천 면역(즉각·<strong>비특이적<\/strong>) → 적응 면역(<strong>특이적<\/strong>·학습형). 문제는 대개 \"각 층이 무엇을 하는가\"를 서로 바꿔치기해 낸다. <strong>비특이적=선천, 인식 개선=적응<\/strong>으로 못 박아 둔다.<\/p>\n<p>📌 <strong>적응 면역의 산출물이 면역학적 기억<\/strong> - 이것이 곧 <strong>백신이 노리는 것<\/strong>이다. 백신 문항과 적응 면역 문항은 같은 논리로 이어진다.<\/p>\n<p>📌 <strong>백신 4요소<\/strong> - ① 목적: 면역반응 <strong>자극<\/strong>(≠ 억제, ≠ 치료) ② 재료: 병원체를 <strong>닮은<\/strong> 약독화·불활성화 물질 ③ 검증: <strong>광범위한 검증을 거침<\/strong>(≠ 거의 검증 안 됨) ④ 위상: 감염병 예방의 <strong>가장 효과적인 수단<\/strong>. 오답 보기 4개가 정확히 이 4요소를 뒤집어 만들어진다.<\/p>\n<p>📌 <strong>enter는 타동사<\/strong> - <code>enter into<\/code>로 쓰지 않는다. 전치사 유무를 묻는 어법 문항의 단골.<\/p>\n<p>📌 <strong>mount는 다의어<\/strong> - 커지다 / 올라타다 / (공격을) 감행하다 / (전시를) 열다. 문맥에서 목적어를 보고 뜻을 고르는 연습이 필요하다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ 면역계의 1차 기능 = 질병으로부터 유기체 보호<\/li><li>⭐⭐⭐ 선천 면역(즉각·비특이적) vs 적응 면역(감염 중 인식 개선) 역할 구분<\/li><li>⭐⭐⭐ 면역학적 기억 - 병원체 제거 후에도 유지되어 재감염 시 더 빠르고 강한 반응<\/li><li>⭐⭐⭐ 백신의 목적(면역반응 자극)과 위상(감염병 예방의 가장 효과적 수단)<\/li><li>⭐⭐ 면역계가 대응하는 대상 목록과 <strong>언급되지 않은 것<\/strong>(유익균) - NOT 유형<\/li><li>⭐⭐ <code>comprise<\/code> = <code>consist of<\/code> = <code>be composed of<\/code> = <code>be made up of<\/code><\/li><li>⭐⭐ <code>mount<\/code>의 다의어 용법, <code>breach<\/code>의 두 가지 쓰임<\/li><li>⭐ <code>enter<\/code>는 타동사 (전치사 불필요)<\/li><li>⭐ <code>attenuated<\/code>(약독화) / <code>inactivated<\/code>(불활성화) / <code>elicit<\/code>(끌어내다)<\/li><\/ul>"}], "terms": [{"t": "<strong>immune system<\/strong>", "d": "<strong>면역계<\/strong>. 질병으로부터 유기체를 보호하는 생물학적 체계의 <strong>network<\/strong>"}, {"t": "<strong>pathogen<\/strong>", "d": "<strong>병원체<\/strong> (바이러스·세균·기생충 등 질병을 일으키는 것)"}, {"t": "<strong>layered defenses<\/strong>", "d": "<strong>층위를 이룬 방어<\/strong>. 특이성(specificity)이 점점 높아지는 구조"}, {"t": "<strong>physical barrier<\/strong>", "d": "<strong>물리적 장벽<\/strong>. 병원체가 유기체 안으로 들어오는 것을 막는 1차 방어"}, {"t": "<strong>innate immune system<\/strong>", "d": "<strong>선천 면역계<\/strong>. 즉각적이지만 <strong>비특이적(non-specific)<\/strong> 반응"}, {"t": "<strong>adaptive immune system<\/strong>", "d": "<strong>적응(획득) 면역계<\/strong>. 감염 중 반응을 <strong>적응·개선<\/strong>시켜 병원체 인식력을 높임"}, {"t": "<strong>immunological memory<\/strong>", "d": "<strong>면역학적 기억<\/strong>. 병원체 제거 후에도 남아 재감염 시 더 빠르고 강한 공격을 가능케 함"}, {"t": "<strong>vaccine<\/strong>", "d": "<strong>백신<\/strong>. 질병에 대한 신체의 면역반응을 자 gen . 방어 3단계 정리 ⚠️ 특이성 specificity 이 점점 커지는 방향이라는 점이 핵심 ③ 면역학적 기억 6p.~7p. this improved response is then retained after the pathogen has been eliminated, in the form of an immunological memory , and allows the adaptive immune system to mount faster and stronger attacks each time this pathogen is encountered. 개선된 반응은 병원체가 제거된 뒤에도 면역학적 기억 으로 남아, 같은 병원체를 만날 때마다 더 빠르고 강한 공격 을 가능하게 한다 ⭐⭐⭐ ④ 백신 7p.~8p. 4. a vaccine is a preparation that is used to stimulate the body's immune response against diseases . the safety and efficacy of vaccines have undergone extensive scrutiny and validation . typically, a vaccine comprises an agent that resembles a pathogenic microorganism and is derived from attenuated or inactivated forms of the microbe, its toxins, or one of its surface proteins. this agent serves to elicit a response from the body's immune system, facilitating its recognition, destruction, and the development of immunological memory to guard against the perceived threat. vaccination is considered as the most effective means of preventing infectious diseases. 백신의 목적 = 질병에 맞선 신체 면역반응을 자극 ⭐⭐⭐ 백신의 재료 = 병원성 미생물을 닮은 물질 약독화·불활성화된 미생물, 그 독소, 또는 표면 단백질 하나 백신의 안전성·효능은 광범위한 검증을 거쳤다 ⚠️ \"거의 검증되지 않는다\"는 보기가 오답 미끼 백신접종 = 감염병 예방의 가장 효과적인 수단 ⭐⭐⭐ 2. 어휘·어법 노트 강의록 원문 enter - 타동사 로 쓰여 전치사가 필요 없다 ⚠️ enter into 가 아님 breach - 합의를 위반하다 / 방어를 뚫다 / 제방을 무너뜨리다 allow 1강에 이어 2회 반복 등장 - 출제 신호 ⭐ mount - 다의어 ⭐⭐ comprise - \"~로 구성되다\" 동의 표현: consist of / be composed of / be made up of ⭐⭐ 1강과 연결 3. 어휘연습 강의록 원문 1. 괄호 안에 알맞은 동사를 채워 넣으시오. they the agreement they had made with their employer. 그들은 고용주와 한 합의를 위반했다. → breached 2. 괄호 안에 적절한 동사는 무엇인가? the army prepared to an attack on the enemy stronghold. → mount 3. comprise와 같은 의미를 지니는 표현을 두 개 적는다. → consist of / be composed of / be made up of 중 둘 4. 연습문제 강의록 원문 1. what is the primary function of the immune system? a. to regulate body temperature b. to protect the organism from diseases c. to assist in the digestion of food d. to produce blood cells 2. which of the following is not listed as a pathogen the immune system protects against? a. bacteria b. viruses c. parasitic worms d. beneficial bacteria 3. what is the role of the adaptive immune system? a. to provide an immediate, non specific response to pathogens ← 선천 면역의 역할 b. to prevent pathogens from entering the organism ← 물리적 장벽의 역할 c. to adapt its response to improve recognition of a pathogen during an infection d. to regulate the body's temperature in response to an infection 4. what is the purpose of a vaccine? a. to weaken the body's immune system b. to stimulate the body's immune response against diseases c. to serve as a treatment for ongoing infections d. to identify and remove toxins from the body 5. which of the following is true? a. vaccines often contain harmful microorganisms that can cause diseases. ← 약독화·불활성화 형태 b. the efficacy and safety of vaccines are rarely scrutinized or validated. ← 본문과 반대 c. vaccines work by suppressing the immune system's response to pathogens. ← 자극 stimulate 이지 억제가 아님 d. vaccination is considered the most effective method of preventing infectious diseases. 핵심 정리 📌 3단 방어선이 unit 1 2 의 뼈대 - 물리적 장벽 → 선천 면역 즉각· 비특이적 → 적응 면역 특이적 ·학습형 . 문제는 대개 \"각 층이 무엇을 하는가\"를 서로 바꿔치기해 낸다. 비특이적=선천, 인식 개선=적응 으로 못 박아 둔다. 📌 적응 면역의 산출물이 면역학적 기억 - 이것이 곧 백신이 노리는 것 이다. 백신 문항과 적응 면역 문항은 같은 논리로 이어진다. 📌 백신 4요소 - ① 목적: 면역반응 자극 ≠ 억제, ≠ 치료 ② 재료: 병원체를 닮은 약독화·불활성화 물질 ③ 검증: 광범위한 검증을 거침 ≠ 거의 검증 안 됨 ④ 위상: 감염병 예방의 가장 효과적인 수단 . 오답 보기 4개가 정확히 이 4요소를 뒤집어 만들어진다. 📌 enter는 타동사 - enter into 로 쓰지 않는다. 전치사 유무를 묻는 어법 문항의 단골. 📌 mount는 다의어 - 커지다 / 올라타다 / 공격을 감행하다 / 전시를 열다. 문맥에서 목적어를 보고 뜻을 고르는 연습이 필요하다. 시험 대비 포인트 ⭐⭐⭐ 면역계의 1차 기능 = 질병으로부터 유기체 보호 ⭐⭐⭐ 선천 면역 즉각·비특이적 vs 적응 면역 감염 중 인식 개선 역할 구분 ⭐⭐⭐ 면역학적 기억 - 병원체 제거 후에도 유지되어 재감염 시 더 빠르고 강한 반응 ⭐⭐⭐ 백신의 목적 면역반응 자극 과 위상 감염병 예방의 가장 효과적 수단 ⭐⭐ 면역계가 대응하는 대상 목록과 언급되지 않은 것 유익균 - not 유형 ⭐⭐ comprise = consist of = be composed of = be made up of ⭐⭐ mount 의 다의어 용법, breach 의 두 가지 쓰임 ⭐ enter 는 타동사 전치사 불필요 ⭐ attenuated 약독화 / inactivated 불활성화 / elicit 끌어내다 "}, {"id": 3, "title": "Unit 2 Ancient Egypt [1]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>\n<ul><li>어휘 복습을 위한 읽기<\/li><\/ul>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>arise<\/strong><\/td><td>(문제·기회가) <strong>생기다, 일어나다<\/strong>. <code>arise – arose – arisen<\/code> (자동사, 1형식)<\/td><\/tr><tr><td><strong>remain<\/strong><\/td><td><strong>~인 채로 남다, 계속 ~이다<\/strong>. 1형식(남다)·2형식(보어를 취함) 모두 가능<\/td><\/tr><tr><td><strong>B.C.E.<\/strong><\/td><td>Before Common Era. <strong>기원전<\/strong> (= B.C.)<\/td><\/tr><tr><td><strong>predictable<\/strong><\/td><td><strong>예측 가능한<\/strong>. <code>predict<\/code> + <code>-able<\/code><\/td><\/tr><tr><td><strong>irrigation<\/strong><\/td><td><strong>관개(灌漑)<\/strong>. 농지에 물을 대는 일<\/td><\/tr><tr><td><strong>surplus crops<\/strong><\/td><td><strong>잉여 작물<\/strong><\/td><\/tr><tr><td><strong>establish<\/strong><\/td><td><strong>세우다, 확립하다, 정하다<\/strong> (3형식)<\/td><\/tr><tr><td><strong>mudbrick<\/strong><\/td><td><strong>진흙벽돌<\/strong> - 고대 이집트 가옥의 주재료<\/td><\/tr><tr><td><strong>staple diet<\/strong><\/td><td><strong>주식(主食)<\/strong><\/td><\/tr><tr><td><strong>supplement<\/strong><\/td><td><strong>보충하다; 보충물<\/strong><\/td><\/tr><tr><td><strong>hygiene / grooming<\/strong><\/td><td><strong>위생 / 몸단장<\/strong><\/td><\/tr><tr><td><strong>dominate<\/strong><\/td><td><strong>지배하다, 압도하다<\/strong><\/td><\/tr><tr><td><strong>resemble<\/strong><\/td><td><strong>~와 닮다<\/strong> (타동사, 전치사 불필요)<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 13p.~15p.)<\/h4>\n<p><strong>① 고대 이집트 문명의 시작과 끝<\/strong> (13p.)<\/p>\n<blockquote><ol><li>Ancient Egypt was an <strong>impressive<\/strong> civilization that <strong>arose<\/strong> around <strong>3100 B.C.E.<\/strong> It <strong>remained<\/strong> a major power in North Africa and nearby regions until the <strong>Macedonians<\/strong> took over in <strong>332 B.C.E.<\/strong><\/li><\/ol><\/blockquote>\n<ul><li>성립 <strong>기원전 3100년<\/strong> ⭐⭐⭐ / 마케도니아에 정복된 <strong>기원전 332년<\/strong>까지 북아프리카의 주요 강국<\/li><li>⚠️ 연도 두 개(3100 / 332)를 서로 바꿔 내는 문항에 주의<\/li><\/ul>\n<p><strong>② 번영의 원인 - 나일강<\/strong> ⭐⭐⭐<\/p>\n<blockquote><p>The civilization <strong>thrived<\/strong> mostly because it <strong>made the most of the Nile River's flood patterns for farming<\/strong>. The <strong>predictable<\/strong> flooding and controlled <strong>irrigation<\/strong> of the fertile valley produced <strong>surplus crops<\/strong>, which allowed the population to grow and society to become more complex.<\/p><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">나일강의 예측 가능한 범람 + 통제된 관개\n        → 비옥한 계곡에서 잉여 작물 생산\n        → 인구 증가 + 사회의 복잡화(문명화)<\/code><\/pre>\n<ul><li>⚠️ 번영의 원인은 <strong>원거리 교역·영토 정복·귀금속 발견이 아니라<\/strong> 나일강 범람 패턴의 활용이다<\/li><\/ul>\n<blockquote><p><strong>By<\/strong> successfully managing their environment and resources, the Egyptians <strong>established<\/strong> a culture rich in art, knowledge, and architecture that would influence the world for centuries to come.<\/p><\/blockquote>\n<ul><li><code>By + -ing<\/code> = <strong>~함으로써<\/strong> ⭐⭐ (전치사 채우기 문항으로 직접 출제됨)<\/li><\/ul>\n<p><strong>③ 사람들의 삶 - 주거와 식생활<\/strong> (14p.)<\/p>\n<blockquote><ol><li>In ancient Egypt, the majority of the population was <strong>made up of farmers<\/strong>. Their houses were built from <strong>mudbrick<\/strong> with designs optimized to provide relief from the intense daytime heat.<\/li><\/ol><\/blockquote>\n<ul><li>인구 대다수 = <strong>농민<\/strong> / 집의 주재료 = <strong>진흙벽돌(mudbrick)<\/strong> ⭐⭐⭐ (낮의 강한 열기를 피하도록 설계)<\/li><\/ul>\n<blockquote><p>The <strong>staple diet<\/strong> consisted of <strong>bread and beer<\/strong>, <strong>supplemented<\/strong> with vegetables such as onions and garlic, and fruit such as dates and figs.<\/p><\/blockquote>\n<ul><li>주식 = <strong>빵과 맥주<\/strong>, 보충 = 양파·마늘 등 채소, 대추야자·무화과 등 과일<\/li><\/ul>\n<p><strong>④ 위생과 몸단장<\/strong> (14p.~15p.)<\/p>\n<blockquote><p>Hygiene and personal grooming were <strong>of significant importance<\/strong> to the ancient Egyptians. Their hygiene system was complex, encompassing bathing, shaving, dental care, and more.<\/p><\/blockquote>\n<ul><li><code>of + 추상명사<\/code> = 형용사 ⭐⭐ - <code>of significant importance<\/code> = <code>significantly important<\/code><\/li><\/ul>\n<blockquote><p>Many <strong>bathed in the Nile River<\/strong>, employing a homemade paste for soap composed of <strong>animal fat and chalk<\/strong>. Body shaving was a common practice and perfumes and scented oils were used to mask unpleasant smells and to <strong>calm irritated<\/strong> skin.<\/p><\/blockquote>\n<ul><li>위생법 = <strong>나일강에서 목욕<\/strong> + <strong>동물성 지방과 백악(chalk)으로 만든 수제 비누<\/strong> ⭐⭐⭐<\/li><li>향수·향유의 용도 = 불쾌한 냄새를 가리고(mask), 자극받은 피부를 진정시키기(calm)<\/li><\/ul>\n<p><strong>⑤ 음악과 춤<\/strong> (15p.)<\/p>\n<blockquote><p>Music and dance were popular entertainments. Early on, the musical scene was <strong>dominated<\/strong> by <strong>flutes and harps<\/strong>.<\/p><\/blockquote>\n<blockquote><p>As time went on, other instruments <strong>resembling<\/strong> trumpets, oboes, and various types of pipes were <strong>introduced<\/strong> and gained popularity.<\/p><\/blockquote>\n<ul><li>초기 주도 악기 = <strong>플루트와 하프<\/strong> → 이후 트럼펫·오보에·파이프류 도입<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>arise<\/strong> - <code>arise – arose – arisen<\/code> (1형식 자동사) ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">If the opportunity arises, I'd love to go to China.\nProblems arise when the payment is late.\nHe died of complications arising from heart surgery.<\/code><\/pre>\n<p><strong>remain<\/strong> - 1형식(남다) / 2형식(보어를 취함) 모두 가능 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The doctor ordered him to remain in bed for a few days.        (1형식)\nMost commentators expect the basic rate of tax to remain at 25 percent.\nA great many things remain to be done (= have not yet been done).\nHe remained silent.                                             (2형식 - 보어 silent)\nIt remains a secret.                                            (2형식 - 보어 a secret)\nThe bank will remain open while renovations are carried out.    (2형식)\nOnly a few hundred of these animals remain today.               (1형식)<\/code><\/pre>\n<p><strong>establish<\/strong> - 3형식 타동사<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">He helped to establish the University of California at Berkeley.\nOnce we establish the price, we can begin to market the product.\nThere is a strong need to establish effective communication links between parents, staff, pupils, and external bodies.\nHis reputation for carelessness was established long before the latest problems arose.<\/code><\/pre>\n<p><strong>supplement<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">He supplements his income by working in a bar at night.\nSome vegetarians like to supplement their diets with iron.\nThe new law was introduced to supplement the existing regulations, aiming to close loopholes and enhance enforcement.<\/code><\/pre>\n<p><strong>calm / irritate<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The teacher's gentle voice managed to calm the excited students within minutes.\nThe storm finally began to calm down after raging for hours.\n\nCertain skincare products irritated her sensitive skin.\nIt irritates me when people are late without giving any notice.\nAfter a while, the noise began to irritate him.<\/code><\/pre>\n<p><strong>dominate<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The cathedral dominates the landscape for miles around.\nThe dispute is likely to dominate the news.\nThey work as a group-no one person is allowed to dominate.<\/code><\/pre>\n<p><strong>resemble<\/strong> - 타동사 (전치사 없이 목적어) ⚠️<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">As he grew older, he began to resemble his grandfather, not just in looks but also in his behaviors.<\/code><\/pre>\n<p><strong>introduce<\/strong> - 도입하다 / 소개하다 (3형식)<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The company plans to introduce 45 new models over the next five years.\nWe need to introduce more stringent security measures such as identity cards.\nI'd like to introduce my son.\nThe director will introduce the film personally.\nIn the workshop, we were introduced to the basics of digital photography by a professional photographer.<\/code><\/pre>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>arise 동사를 사용하여 <strong>1형식<\/strong> 문장을 세 개 만드시오.<\/li><li>remain 동사를 사용하여 <strong>1형식 두 개와 2형식 두 개<\/strong>를 만드시오.<\/li><li>establish 동사를 사용하여 <strong>3형식<\/strong> 문장을 세 개 만드시오.<\/li><li>괄호 안에 공통으로 들어가 자연스럽게 문장을 완성할 수 있는 동사는? → <strong>supplement(s)<\/strong><\/li><\/ol>\n<ul><li>He ( ) his income by working in a bar at night.<\/li><li>Some vegetarians like to ( ) their diets with iron.<\/li><\/ul>\n<ol><li>\"그 분쟁이 가장 중요한 뉴스거리가 될 것 같다\"는 의미. 괄호에 들어갈 동사는? → <strong>dominate<\/strong><\/li><\/ol>\n<ul><li>The dispute is likely to ( ) the news.<\/li><\/ul>\n<ol><li>introduce 동사를 사용하여 <strong>3형식<\/strong> 문장을 세 개 만든다.<\/li><\/ol>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>When did ancient Egypt arise?<\/li><\/ol>\n<p>A) 5000 B.C.E. <strong>B) 3100 B.C.E.<\/strong> C) 1500 B.C.E. D) 332 B.C.E.<\/p>\n<ol><li>What allowed the civilization of ancient Egypt to thrive?<\/li><\/ol>\n<p>A) Trading with distant lands <strong>B) Utilizing the Nile River's flood patterns for farming<\/strong> C) Conquering neighboring territories D) Discovering precious metals<\/p>\n<ol><li>밑줄 친 부분의 의미는 '환경과 자원을 성공적으로 관리함으로써'이다. 괄호 안에 필요한 전치사는? → <strong>By<\/strong><\/li><\/ol>\n<ul><li>( ) successfully managing their environment and resources, the Egyptians established a culture rich in art, knowledge, and architecture.<\/li><\/ul>\n<ol><li>What was the primary material used for building houses in ancient Egypt?<\/li><\/ol>\n<p>A) Wood B) Stone <strong>C) Mudbrick<\/s
