: ["Copying someone else's work exactly", "Starting from nothing and creating something new", "Using others' ideas as a base to create something new", "Ignoring previous work and doing your own thing"], "answer": 2, "expl": "<p><code>It wasn't just about <strong>copying<\/strong>; it was about <strong>evolving ideas<\/strong>, building upon the foundation laid by others, and creating something new and meaningful.<\/code> ⚠️ ① 은 본문이 <strong>명시적으로 부정한<\/strong> 것이고, ②④ 는 \"남의 토대\"라는 핵심을 지운 오답이다 ⭐⭐⭐<\/p>", "verify": "강의록 13강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q30", "num": 30, "points": 3, "tags": ["내용일치", "저작권윤리"], "lecture": 13, "stem": "<p>According to the text, how were creators taught to view the practice of avoiding plagiarism?<\/p>", "options": ["As a legal punishment", "As a constraint that limits creativity", "As a guideline to ensure respect for the originals", "As an optional recommendation with no real purpose"], "answer": 2, "expl": "<p><code>Creators were taught the importance of avoiding plagiarism, <strong>not as a constraint but as a guideline<\/strong> to ensure respect for the originals.<\/code> 📌 목표 역시 <code><strong>not to stifle creativity but to encourage it within ethical bounds<\/strong><\/code>였다 ⭐⭐⭐<\/p>", "verify": "강의록 13강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q31", "num": 31, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 14, "stem": "<p>What does the word \"facilitated\" mean in the sentence below?<\/p>\n<blockquote><p>Advanced technology <strong>facilitated<\/strong> the creative process.<\/p><\/blockquote>", "options": ["Slowed down", "Made easier", "Prevented", "Complicated"], "answer": 1, "expl": "<p><code>facilitate<\/code> = <strong>쉽게 하다·촉진하다<\/strong>. 강의록 쉬운 풀이가 <code>made the creative process <strong>easier<\/strong><\/code>로 직접 확인해 준다.<\/p>", "verify": "강의록 14강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q32", "num": 32, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 14, "stem": "<p>What does \"voluntarily\" mean in the sentence below?<\/p>\n<blockquote><p>The true essence of the ecosystem lay in the unwritten rules-creators <strong>voluntarily<\/strong> adhering to a code that ensured the fair use of ideas.<\/p><\/blockquote>", "options": ["Without being forced", "With strict rules", "For profit", "In a confused way"], "answer": 0, "expl": "<p><code>voluntarily<\/code> = <strong>자발적으로<\/strong>(강요 없이). 앞의 <code><strong>unwritten<\/strong> rules<\/code>(불문율)와 짝을 이룬다. ② <code>strict rules<\/code>는 \"불문율\"과 정면으로 어긋난다 ⚠️ 📌 14강의 논지는 <strong>\"기술이 아니라 사람의 자발적 규범이 생태계를 지탱한다\"<\/strong> 이다 ⭐⭐⭐<\/p>", "verify": "강의록 14강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q33", "num": 33, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 14, "stem": "<p>What does the phrase \"fearing a dystopian future\" mean in the sentence below?<\/p>\n<blockquote><p>Others viewed it with skepticism, <strong>fearing a dystopian future<\/strong> where creativity was stifled by automated regulations.<\/p><\/blockquote>", "options": ["They looked forward to a perfect world.", "They were worried about a bad or oppressive future.", "They were hoping for more technology in the future.", "They were excited about creative freedom in the future."], "answer": 1, "expl": "<p><code>dystopian<\/code> ↔ <code>utopian<\/code>. 앞 문장 <code>Some hailed it as an <strong>idealistic utopia<\/strong><\/code>와 대비되는 <strong>반대 진영<\/strong>의 반응이다. ① 은 <code>utopia<\/code> 쪽 반응을 가져다 붙인 미끼다 ⚠️<\/p>", "verify": "강의록 14강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q34", "num": 34, "points": 3, "tags": ["어구해석", "Canvas-of-Creativity"], "lecture": 14, "stem": "<p>What does the phrase \"stumbled upon\" mean in the sentence below?<\/p>\n<blockquote><p>Day by day, shy visitors <strong>stumbled upon<\/strong> Shynne's channel.<\/p><\/blockquote>", "options": ["Tripped and fell", "Accidentally discovered", "Walked towards", "Ignored"], "answer": 1, "expl": "<p><code>stumble upon ~<\/code> = <strong>우연히 발견하다<\/strong>. ⚠️ ① 은 <code>stumble<\/code>의 <strong>문자 그대로의 뜻<\/strong>(비틀거리다·넘어지다)을 가져온 전형적 관용구 함정 ⭐⭐⭐ 📌 강의록 쉬운 풀이: <code>shy visitors <strong>found<\/strong> Shynne's channel <strong>by chance<\/strong><\/code><\/p>", "verify": "강의록 14강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part2-9~15강-Q35", "num": 35, "points": 3, "tags": ["어구해석", "Harmonys-Forge"], "lecture": 15, "stem": "<p>In the sentence below, what does \"succumbing to\" mean?<\/p>\n<blockquote><p>It was a technology meant to guide human advancement without <strong>succumbing to<\/strong> the pitfalls that had plagued Prometheus and Icarus.<\/p><\/blockquote>", "options": ["Overcoming", "Falling into or being affected by", "Learning from", "Protecting against"], "answer": 1, "expl": "<p><code>succumb to ~<\/code> = <strong>~에 굴복하다·빠지다<\/strong>. ⚠️ ① <code>Overcoming<\/code>(극복하다)은 <strong>정확히 반대 뜻<\/strong>인데, <code>without<\/code>이 앞에 붙어 있어 전체 의미가 비슷해 보이는 탓에 가장 매력적인 오답이다. <strong><code>without<\/code> + <code>succumbing to<\/code><\/strong>(빠지지 <strong>않고<\/strong>)로 끊어 읽어야 한다 ⭐⭐⭐ 📌 15강의 다른 핵심 어구도 함께 정리한다 - <code>visionary<\/code>(미래지향적 생각을 가진), <code>magnum opus<\/code>(최고 걸작), <code>untouched by the rapid currents of change<\/code>(큰 변화를 겪지 않은), <code>Her eyes sparkled with a mixture of awe and curiosity<\/code>(감탄과 흥미를 함께 드러냄)<\/p>", "verify": "강의록 15강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}]}, {"id": "Part1-1~8강", "title": "생성 - Part I 모의고사 (1~8강 · Unit 1·2·4·7)", "meta": "<blockquote><p><strong>[생성]<\/strong> 현행(2026학년도) 교재 <strong>1~8강<\/strong>(손향숙 교수 담당) 범위의 보완 문제 35문항. 기출(2017·2018·2019)의 <strong>문항 유형을 그대로 본떠<\/strong> 현행 강의록 본문으로 재구성했다. 유형 구성: 우리말 해석 오류 찾기 · 빈칸 어법(전치사/관계사/분사/동명사) · 목적어·동사 찾기 · 어순 배열 · 내용 일치/불일치 · 문맥 어휘 · 정의문 빈칸<\/p>\n<p>⚠️ 기출이 아니므로 <strong>정답표 대조가 불가능<\/strong>하다. 모든 문항의 근거를 <strong>강의록 본문에 직접 대조<\/strong>해 표기했다. 배점은 기출 형식에 맞춰 균등 3점으로 둔다.<\/p><\/blockquote>", "generated": true, "questions": [{"qid": "Part1-1~8강-Q01", "num": 1, "points": 3, "tags": ["내용일치", "바이러스"], "lecture": 1, "stem": "<p>According to the text, why are viruses more difficult to kill than bacteria?<\/p>\n<blockquote><p>A virus is a submicroscopic infectious agent that replicates only inside the living cells of an organism. Viruses infect all life forms, from animals and plants to microorganisms. Viruses consist of genetic materials surrounded by a protective coat of protein, so they are more difficult to kill than bacteria.<\/p><\/blockquote>", "options": ["They replicate outside of living cells.", "They consist of genetic materials surrounded by a protective coat of protein.", "They are larger than bacteria.", "They are resistant to all forms of medicine."], "answer": 1, "expl": "<p><code>Viruses <strong>consist of genetic materials surrounded by a protective coat of protein<\/strong>, so they are more difficult to kill than bacteria<\/code> - <code>so<\/code>가 인과를 직접 잇는다. ① 은 <code>replicates <strong>only inside<\/strong> the living cells<\/code>와 정반대다.<\/p>", "verify": "강의록 1강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q02", "num": 2, "points": 3, "tags": ["어휘", "형태소"], "lecture": 1, "stem": "<p>What is the relationship between virology and microbiology?<\/p>", "options": ["They are completely unrelated fields.", "Virology is a part of microbiology.", "Microbiology is a part of virology.", "They are two names for the same field."], "answer": 1, "expl": "<p><code>The study of viruses is called virology, which is <strong>a part of<\/strong> microbiology.<\/code> ⚠️ ③ 처럼 <strong>포함 관계를 뒤집은<\/strong> 보기가 단골 오답이다. 📌 <code>micro-<\/code>(극소) + <code>bio-<\/code>(생명) + <code>-logy<\/code>(학문) → 미생물학이 더 큰 범주다 ⭐<\/p>", "verify": "강의록 1강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q03", "num": 3, "points": 3, "tags": ["내용불일치", "항생제"], "lecture": 1, "stem": "<p>Which of the following is NOT true about antibiotics according to the text?<\/p>\n<blockquote><p>It is crucial to recognize that antibiotics, designed to combat bacterial infections, lack efficacy against viral entities. Antibiotics do not kill viruses and the use of them just leads to antibiotic resistance.<\/p><\/blockquote>", "options": ["They are designed to combat bacterial infections.", "They lack efficacy against viral entities.", "They kill viruses slowly but effectively.", "Their use against viruses leads to antibiotic resistance."], "answer": 2, "expl": "<p><code>Antibiotics <strong>do not kill<\/strong> viruses<\/code>라고 명시했다. \"천천히라도 죽인다\"는 진술은 본문과 정면으로 배치된다.<\/p>", "verify": "강의록 1강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q04", "num": 4, "points": 3, "tags": ["어법", "수일치"], "lecture": 1, "stem": "<p>다음 문장에서 문법적으로 옳지 <strong>않은<\/strong> 부분을 고르시오.<\/p>\n<blockquote><p>Viruses ①<strong>are<\/strong> often ②<strong>transmitted<\/strong> from plant to plant by insects ③<strong>that<\/strong> ④<strong>feeds<\/strong> on plant sap, such as aphids.<\/p><\/blockquote>", "options": ["are", "transmitted", "that", "feeds"], "answer": 3, "expl": "<p>관계대명사 <code>that<\/code>의 선행사가 <strong><code>insects<\/code>(복수)<\/strong> 이므로 관계절의 동사도 복수형 <strong><code>feed<\/code><\/strong> 여야 한다. ⚠️ 관계절의 수 일치는 <strong>바로 앞 명사가 아니라 실제 선행사<\/strong>를 봐야 한다 ⭐⭐⭐<\/p>", "verify": "강의록 1강 연습문제 5번과 동일 유형 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q05", "num": 5, "points": 3, "tags": ["어법", "타동사"], "lecture": 1, "stem": "<p>괄호에 전치사가 필요 <strong>없는<\/strong> 동사를 고르시오.<\/p>", "options": ["She is suffering ( ) a bad cold.", "She totally lacks ( ) a sense of humor.", "The disease resulted ( ) many deaths.", "They objected ( ) the new policy."], "answer": 1, "expl": "<p><code>lack<\/code>은 <strong>타동사<\/strong>로 목적어를 직접 취한다 - <code>lack a sense of humor<\/code>. ①<code>suffer from<\/code> ③<code>result in<\/code> ④<code>object to<\/code>는 모두 전치사가 필요하다. 📌 1강에서 배운 <code>lack efficacy against ~<\/code>도 <code>lack<\/code>은 전치사 없이 목적어(<code>efficacy<\/code>)를 받는다 ⭐⭐<\/p>", "verify": "강의록 1강 어휘연습 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q06", "num": 6, "points": 3, "tags": ["내용불일치", "전파경로"], "lecture": 1, "stem": "<p>Which of the following is NOT mentioned as a way viruses spread?<\/p>", "options": ["Through vectors such as aphids that feed on plant sap", "Through airborne particles from coughing and sneezing", "Through purified water sources", "Through sexual contact and exposure to infected blood"], "answer": 2, "expl": "<p>본문은 <strong>매개생물 / 공기 중 입자 / 성접촉·감염 혈액<\/strong> 세 경로만 언급한다. ⚠️ \"정화된 물\"은 아예 나오지 않는다 - <strong>본문에 없는 항목<\/strong>을 고르는 NOT 유형의 전형 ⭐⭐⭐<\/p>", "verify": "강의록 1강 연습문제 3번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q07", "num": 7, "points": 3, "tags": ["내용일치", "면역"], "lecture": 2, "stem": "<p>What is the role of physical barriers in the immune system?<\/p>\n<blockquote><p>The immune system employs layered defenses, increasing in specificity, to protect the host from infections. Physical barriers prevent pathogens such as bacteria and viruses from entering the organism. If a pathogen breaches these barriers, the innate immune system provides an immediate, but non-specific response.<\/p><\/blockquote>", "options": ["They prevent pathogens from entering the organism.", "They adapt their response during an infection.", "They create immunological memory.", "They provide a specific response to each pathogen."], "answer": 0, "expl": "<p><code>Physical barriers <strong>prevent<\/strong> pathogens ~ <strong>from entering<\/strong> the organism<\/code>이 직접 근거다. ② 는 적응 면역, ③ 도 적응 면역의 산출물이다. ⚠️ <strong>세 방어층의 역할을 서로 바꿔치기<\/strong>하는 것이 이 단원 오답의 기본 수법 ⭐⭐⭐<\/p>", "verify": "강의록 2강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q08", "num": 8, "points": 3, "tags": ["어법", "타동사"], "lecture": 2, "stem": "<p>다음 중 어법상 옳은 문장은?<\/p>", "options": ["Please knock before you enter into my office.", "Physical barriers prevent pathogens from entering the organism.", "The committee is comprised with experts from different fields.", "The book comprises of ten chapters."], "answer": 1, "expl": "<p><code>prevent A <strong>from<\/strong> -ing<\/code>가 올바른 형태다. ① <code>enter<\/code>는 <strong>타동사<\/strong>라 <code>into<\/code>가 붙지 않는다. ③ 은 <code>be comprised <strong>of<\/strong><\/code>. ④ 는 <code>comprise<\/code> 자체가 타동사라 <code>of<\/code>가 붙지 않는다(<code>The book comprises ten chapters.<\/code>). ⚠️ <code>comprise<\/code>(전치사 없음) vs <code>be comprised of<\/code> vs <code>consist of<\/code> 3형태 구분 ⭐⭐⭐<\/p>", "verify": "강의록 2강 어휘·어법 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q09", "num": 9, "points": 3, "tags": ["어휘", "문맥"], "lecture": 2, "stem": "<p>What does \"mount\" mean in the following sentence?<\/p>\n<blockquote><p>Immunological memory allows the adaptive immune system to <strong>mount<\/strong> faster and stronger attacks each time this pathogen is encountered.<\/p><\/blockquote>", "options": ["To climb onto something", "To launch or carry out", "To gradually increase in size", "To display in an exhibition"], "answer": 1, "expl": "<p>목적어가 <code>attacks<\/code>이므로 <strong>\"(공격을) 개시하다·감행하다\"<\/strong> 의 뜻이다 (cf. <code>The army prepared to <strong>mount an attack<\/strong><\/code>). ⚠️ ①③④ 모두 <code>mount<\/code>의 <strong>실제 다른 뜻<\/strong>이지만 이 문맥에는 맞지 않는다 - <strong>다의어는 목적어로 판정<\/strong> ⭐⭐⭐<\/p>", "verify": "강의록 2강 어휘 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q10", "num": 10, "points": 3, "tags": ["내용일치", "백신"], "lecture": 2, "stem": "<p>Which statement about vaccines is correct according to the text?<\/p>", "options": ["Vaccines suppress the immune system's response to pathogens.", "The efficacy and safety of vaccines are rarely scrutinized.", "Vaccination is considered the most effective means of preventing infectious diseases.", "Vaccines are primarily used to treat ongoing infections."], "answer": 2, "expl": "<p><code><strong>Vaccination is considered as the most effective means of preventing infectious diseases.<\/strong><\/code> ① 은 <code>stimulate<\/code>(자극)를 <code>suppress<\/code>(억제)로, ② 는 <code>extensive scrutiny and validation<\/code>을 <code>rarely<\/code>로 뒤집었고, ④ 는 <strong>예방(prevention)<\/strong> 을 <strong>치료(treatment)<\/strong> 로 바꾼 것이다. 📌 오답 3개가 정확히 <strong>백신 4요소를 하나씩 뒤집어<\/strong> 만들어졌다 ⭐⭐⭐<\/p>", "verify": "강의록 2강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q11", "num": 11, "points": 3, "tags": ["내용일치", "고대이집트"], "lecture": 3, "stem": "<p>What allowed the civilization of ancient Egypt to thrive?<\/p>", "options": ["Trading with distant lands", "Utilizing the Nile River's flood patterns for farming", "Conquering neighboring territories", "Discovering precious metals"], "answer": 1, "expl": "<p><code>The civilization thrived mostly because it <strong>made the most of the Nile River's flood patterns for farming<\/strong>.<\/code> 📌 인과 사슬: 예측 가능한 범람 → 관개 → 잉여 작물 → 인구 증가·사회 복잡화 ⭐⭐⭐<\/p>", "verify": "강의록 3강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q12", "num": 12, "points": 3, "tags": ["전치사", "동명사"], "lecture": 3, "stem": "<p>괄호에 들어갈 알맞은 전치사는?<\/p>\n<blockquote><p>( ) successfully managing their environment and resources, the Egyptians established a culture rich in art, knowledge, and architecture. (환경과 자원을 성공적으로 관리<strong>함으로써<\/strong>)<\/p><\/blockquote>", "options": ["By", "For", "With", "To"], "answer": 0, "expl": "<p><strong><code>By + -ing<\/code><\/strong> = \"~함으로써(수단·방법)\". 뒤에 동명사 <code>managing<\/code>이 온 것도 전치사임을 확인해 준다.<\/p>", "verify": "강의록 3강 연습문제 3번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q13", "num": 13, "points": 3, "tags": ["어법", "문형"], "lecture": 3, "stem": "<p>다음 중 <code>remain<\/code>이 <strong>2형식<\/strong>(보어를 취하는 문장)으로 쓰인 것은?<\/p>", "options": ["Only a few hundred of these animals remain today.", "A great many things remain to be done.", "He remained silent.", "The doctor ordered him to remain in bed for a few days."], "answer": 2, "expl": "<p><code>remained <strong>silent<\/strong><\/code>에서 <code>silent<\/code>는 <strong>주격 보어(형용사)<\/strong> 다. ①은 \"남아 있다\"의 1형식, ②는 <code>remain to be p.p.<\/code>(아직 ~되지 않았다), ④는 장소 부사구를 동반한 1형식이다. 📌 10강 연습문제의 <code>remain <strong>relevant<\/strong><\/code>도 같은 2형식이다 ⭐⭐⭐<\/p>", "verify": "강의록 3강 어휘 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q14", "num": 14, "points": 3, "tags": ["내용일치", "생활상"], "lecture": 3, "stem": "<p>According to the text, what was the staple diet of ancient Egyptians?<\/p>", "options": ["Meat and wine", "Bread and beer", "Fish and rice", "Milk and cheese"], "answer": 1, "expl": "<p><code>The <strong>staple diet<\/strong> consisted of <strong>bread and beer<\/strong>, supplemented with vegetables such as onions and garlic, and fruit such as dates and figs.<\/code> 📌 <code>staple diet<\/code>(주식) - <strong>보충(supplemented)<\/strong> 된 채소·과일과 구분해야 한다 ⭐<\/p>", "verify": "강의록 3강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q15", "num": 15, "points": 3, "tags": ["내용일치", "위생"], "lecture": 3, "stem": "<p>How did the ancient Egyptians maintain their personal hygiene?<\/p>", "options": ["By bathing in the Nile River and using a paste made of animal fat and chalk", "By using modern soap and water from indoor plumbing", "By avoiding water and only using dry cleaning methods", "By taking sand baths under the hot sun"], "answer": 0, "expl": "<p><code>Many <strong>bathed in the Nile River<\/strong>, employing a homemade paste for soap composed of <strong>animal fat and chalk<\/strong>.<\/code><\/p>", "verify": "강의록 3강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q16", "num": 16, "points": 3, "tags": ["내용일치", "ka"], "lecture": 4, "stem": "<p>What does the ka represent in ancient Egyptian belief?<\/p>", "options": ["A type of pyramid", "The physical strength of a pharaoh", "A vital aspect of the pharaoh's soul", "A ceremonial ritual"], "answer": 2, "expl": "<p><code>The <strong>ka<\/strong>, which is a <strong>vital aspect of the pharaoh's soul<\/strong>, was thought to dwell alongside their mummified forms.<\/code> 📌 ka(영혼) → 미라 곁에 머묾 → 그래서 시신을 정성껏 보존 - 이 사슬로 세 문항이 이어진다 ⭐⭐⭐<\/p>", "verify": "강의록 4강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q17", "num": 17, "points": 3, "tags": ["어법", "분사구문"], "lecture": 4, "stem": "<p>괄호 안의 동사를 알맞은 형태로 바꾼 것은?<\/p>\n<blockquote><p>The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, ( play ) a pivotal role within the fabric of its society.<\/p><\/blockquote>", "options": ["play", "played", "playing", "to play"], "answer": 2, "expl": "<p>주절의 주어(<code>The religion<\/code>)와 <strong>능동 관계<\/strong>인 <strong>분사구문<\/strong>이므로 <strong>현재분사 <code>playing<\/code><\/strong>. ⚠️ <code>played<\/code>(과거분사)를 쓰면 수동이 되어 \"역할이 행해지는\"이 되므로 어색하다.<\/p>", "verify": "강의록 4강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q18", "num": 18, "points": 3, "tags": ["어휘", "대비쌍"], "lecture": 4, "stem": "<p>In ancient Egyptian belief, what is the opposite of <strong>Ma'at<\/strong>?<\/p>", "options": ["Duat", "Isfet", "Ka", "Pantheon"], "answer": 1, "expl": "<p><code>they could maintain <strong>Ma'at, the order of the cosmos<\/strong>, and repel <strong>Isfet, which was chaos<\/strong>.<\/code> 📌 <strong>Ma'at(질서) ↔ Isfet(혼돈)<\/strong> 은 반드시 한 쌍으로 외운다 ⭐⭐⭐<\/p>", "verify": "강의록 4강 본문 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q19", "num": 19, "points": 3, "tags": ["어휘", "접두사"], "lecture": 4, "stem": "<p>Which of the following correctly describes the religion of ancient Egypt?<\/p>", "options": ["Monotheistic - the worship of a single god", "Polytheistic - the worship of many gods", "Atheistic - the rejection of belief in gods", "Agnostic - uncertainty about the existence of gods"], "answer": 1, "expl": "<p><code>poly-<\/code> = <strong>\"many\"<\/strong>. 본문은 <code>an intricate network of <strong>polytheistic<\/strong> doctrines<\/code>라 했고 신은 약 <strong>1500<\/strong>이었다. 📌 <code>mono-<\/code>(하나) / <code>poly-<\/code>(많은) / <code>a-<\/code>(없음) 접두사로 즉시 가른다 ⭐⭐<\/p>", "verify": "강의록 4강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q20", "num": 20, "points": 3, "tags": ["어휘", "문맥"], "lecture": 4, "stem": "<p>What does \"assume\" mean in the following sentence?<\/p>\n<blockquote><p>Egyptian deities <strong>assumed<\/strong> various forms, including those of animals or composite beings with an animal's head atop a human frame.<\/p><\/blockquote>", "options": ["To suppose without proof", "To take on a particular form or appearance", "To accept a responsibility", "To pretend to feel something"], "answer": 1, "expl": "<p>목적어가 <code>various <strong>forms<\/strong><\/code>이므로 <strong>\"(형태를) 띠다·취하다\"<\/strong> 의 뜻이다. ①③④ 모두 <code>assume<\/code>의 실제 다른 뜻이지만 이 문맥에는 맞지 않는다. 📌 <code>assume<\/code> = 가정하다 / 떠맡다 / 띠다 - <strong>목적어로 판정<\/strong> ⭐⭐<\/p>", "verify": "강의록 4강 어휘 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q21", "num": 21, "points": 3, "tags": ["어법", "전치사+동명사"], "lecture": 5, "stem": "<p>다음 문장에서 문법적으로 옳지 <strong>않은<\/strong> 부분을 찾아 바르게 고친 것은?<\/p>\n<blockquote><p>Fear is an intensely unpleasant emotion in response to <strong>perceive<\/strong> a danger or threat.<\/p><\/blockquote>", "options": ["perceive → perceived", "perceive → perceiving", "perceive → to perceive", "고칠 곳 없음"], "answer": 1, "expl": "<p><code>in response <strong>to<\/strong><\/code>의 <code>to<\/code>는 <strong>to부정사의 to가 아니라 전치사<\/strong>다. 따라서 뒤에 <strong>동명사 <code>perceiving<\/code><\/strong> 이 와야 한다. ⚠️ 같은 원리의 표현: <code>when it comes <strong>to<\/strong> -ing<\/code>, <code>be used <strong>to<\/strong> -ing<\/code>, <code>look forward <strong>to<\/strong> -ing<\/code> ⭐⭐⭐<\/p>", "verify": "강의록 5강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q22", "num": 22, "points": 3, "tags": ["전치사"], "lecture": 5, "stem": "<p>괄호에 필요한 전치사를 차례대로 짝지은 것은?<\/p>\n<blockquote><p>The innate fear response, often referred ( ) ( ) the fight-or-flight mechanism, is deeply embedded ( ) the human experience.<\/p><\/blockquote>", "options": ["for - as - on", "to - as - in", "to - for - on", "of - as - in"], "answer": 1, "expl": "<p><code>be referred <strong>to as<\/strong> ~<\/code>(~라고 불리다) + <code>be embedded <strong>in<\/strong> ~<\/code>(~에 깊이 박히다).<\/p>", "verify": "강의록 5강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q23", "num": 23, "points": 3, "tags": ["내용일치", "공포"], "lecture": 5, "stem": "<p>What purpose does the fear response serve in terms of evolution?<\/p>", "options": ["It has no significant role.", "To ensure proper social behavior.", "To elicit suitable behavioral reactions for survival.", "To suppress unnecessary emotions."], "answer": 2, "expl": "<p><code>The fear response plays a crucial role in <strong>survival<\/strong> by <strong>eliciting suitable behavioral reactions<\/strong>, and so this mechanism has been preserved over the course of evolution.<\/code> 📌 진화 관련 문항의 답은 언제나 <strong>\"생존\"<\/strong> 으로 수렴한다 ⭐⭐⭐<\/p>", "verify": "강의록 5강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q24", "num": 24, "points": 3, "tags": ["내용일치", "공포"], "lecture": 5, "stem": "<p>According to the text, what two factors influence the experience of fear?<\/p>", "options": ["Dietary preferences and educational background", "Inherent nature and dietary preferences", "Inherent nature and social relations and culture", "Social relations and educational background"], "answer": 2, "expl": "<p><code>Individuals' fears are <strong>not only influenced by their inherent nature<\/strong> but are also <strong>molded by their social relations and culture<\/strong>.<\/code> ⚠️ 식습관·학력은 본문에 없다 - <code>not only A but also B<\/code> 구문이 그대로 정답 근거 ⭐⭐⭐<\/p>", "verify": "강의록 5강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q25", "num": 25, "points": 3, "tags": ["어휘", "문맥"], "lecture": 5, "stem": "<p>What does \"affected\" mean in the following sentence?<\/p>\n<blockquote><p>To all his problems she <strong>affected<\/strong> indifference.<\/p><\/blockquote>", "options": ["Was deeply moved by", "Had an influence on", "Pretended to have", "Was damaged by"], "answer": 2, "expl": "<p><code>affect<\/code>는 \"영향을 주다·감동시키다\" 외에 <strong>\"~인 척하다·가장하다\"<\/strong> 의 뜻이 있다. 목적어가 <code>indifference<\/code>(무관심)라는 <strong>감정·태도<\/strong>이므로 \"무관심을 가장했다\"가 맞다 ⚠️<\/p>", "verify": "강의록 5강 어휘연습 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q26", "num": 26, "points": 3, "tags": ["내용일치", "공포와용기"], "lecture": 6, "stem": "<p>Which of the following describes the relationship between fear and courage correctly?<\/p>", "options": ["Fear eradicates courage entirely.", "Courage exists independently of fear.", "Fear is a necessary condition for the exercise of courage.", "Courage diminishes the presence of fear in human experience."], "answer": 2, "expl": "<p><code>Contrary to common perception, fear is <strong>not the antithesis of courage<\/strong>; rather, it is <strong>a condition that makes the exercise of courage possible<\/strong>.<\/code> 📌 <code>Contrary to common perception<\/code>(통념과 달리)으로 시작하는 문장은 <strong>통념을 뒤집는 정답<\/strong>의 신호다 ⭐⭐⭐<\/p>", "verify": "강의록 6강 연습문제 1번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q27", "num": 27, "points": 3, "tags": ["내용일치", "생리반응"], "lecture": 6, "stem": "<p>Which of the following is mentioned as a result of the fight-or-flight response?<\/p>", "options": ["Reduction in muscle tension", "Contraction of muscles leading to goosebumps", "Decrease in breathing rate", "Lowering of blood glucose levels"], "answer": 1, "expl": "<p><code>This process also <strong>heightens muscle tension<\/strong>, leading to the <strong>contraction of muscles connected to each hair follicle<\/strong>, resulting in the occurrence of \"goosebumps.\"<\/code> ⚠️ ①③④는 모두 본문의 <strong>방향을 뒤집은<\/strong> 것이다 - 투쟁-도피 반응은 말초 혈관 수축을 빼면 전부 \"↑\" ⭐⭐⭐<\/p>", "verify": "강의록 6강 연습문제 2번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q28", "num": 28, "points": 3, "tags": ["내용일치", "치료"], "lecture": 6, "stem": "<p>What key strategy is involved in the successful approach to overcoming fears?<\/p>", "options": ["Avoiding any situation that might trigger fear", "Facing fears repeatedly in a safe environment", "Taking medication only", "Forgetting or erasing memories associated with the fear"], "answer": 1, "expl": "<p><code>Fear is <strong>more intricate than just forgetting or erasing memories<\/strong>, so a successful approach involves <strong>people facing their fears repeatedly<\/strong>.<\/code> ④ 는 본문이 <strong>명시적으로 부정한<\/strong> 방법이라 매력적인 오답이다 ⚠️<\/p>", "verify": "강의록 6강 연습문제 4번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q29", "num": 29, "points": 3, "tags": ["수치", "치료"], "lecture": 6, "stem": "<p>What percentage of individuals with specific phobias experience a significant decrease in their fears through exposure therapy?<\/p>", "options": ["About 50%", "Approximately 75%", "Approximately 90%", "Almost 100%"], "answer": 2, "expl": "<p><code>approximately <strong>90%<\/strong> of individuals with specific phobias experience a significant decrease in their fears over time.<\/code> 📌 <strong>수치는 그대로 출제 후보<\/strong> - 기출도 연도·비율을 즐겨 묻는다 ⭐⭐<\/p>", "verify": "강의록 6강 연습문제 5번과 동일 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q30", "num": 30, "points": 3, "tags": ["어휘", "접미사"], "lecture": 6, "stem": "<p>다음 중 짝이 바르지 <strong>않은<\/strong> 것은?<\/p>", "options": ["acrophobia - 고소공포증", "claustrophobia - 폐소공포증", "agoraphobia - 광장공포증", "hydrophobia - 불에 대한 공포"], "answer": 3, "expl": "<p><code>hydro-<\/code> = <strong>물<\/strong>. 따라서 <code>hydrophobia<\/code>는 <strong>물공포증(공수병)<\/strong> 이다. 📌 <code>-phobia<\/code> = \"exaggerated fear of ~\" ⭐⭐<\/p>", "verify": "강의록 6강 어휘 노트 대조 ✅ / 직접 풀이 ✅", "generated": true}, {"qid": "Part1-1~8강-Q31", "num": 31, "points": 3, "tags": ["내용일치", "AI소송"], "lecture": 7, "stem": "<p>What prompted Kelly , "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q06", "num": 6, "points": 3, "tags": ["우리말해석", "The-Canterville-Ghost"], "lecture": null, "stem": "<p>밑줄 친 (A) 부분의 우리말 뜻으로 가장 알맞은 것을 고르시오.<\/p>\n<blockquote><p>When the ghost got to the top of the stairs, a door opened, two little people appeared and a large pillow went flying past his head. This was too much for the ghost, so he (A)<strong>quickly disappeared through the wall<\/strong> and soon the house was quiet again.<\/p><\/blockquote>", "options": ["빠르게 벽에서 나타났다.", "재빨리 벽을 통해 사라졌다.", "예상치 않게 지갑이 사라졌다.", "재빨리 우물 속으로 떨어졌다."], "answer": 1, "expl": "<p><code>disappeared<\/code>(사라졌다) + <code>through the wall<\/code>(벽을 통과해). ① 은 <code>appeared<\/code>로 뜻을 뒤집었고, ③ 은 <code>wall<\/code>을 <code>wallet<\/code>으로 오독하게 만든 미끼다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q07", "num": 7, "points": 3, "tags": ["내용불일치", "The-Canterville-Ghost"], "lecture": null, "stem": "<p>아래의 글의 내용과 가장 <strong>관계가 없는 것<\/strong>을 고르시오.<\/p>\n<blockquote><p>For a second or two the Canterville ghost stood still. He was so angry! Then he knocked the bottle of oil on to the floor and hurried away. A strange green light came from his body, and he gave a long and terrible cry that rang through the house.<\/p><\/blockquote>", "options": ["캔터빌 유령은 아주 오랫동안 가만히 서 있었다.", "캔터빌 유령은 매우 화가 났다.", "캔터빌 유령은 기름병을 마루에 팽개치고 그 자리를 떠났다.", "캔터빌 유령은 온 집안에 울리는 길고 무시한 소리를 질렀다."], "answer": 0, "expl": "<p><code>For <strong>a second or two<\/strong><\/code>는 \"<strong>1~2초 동안<\/strong>\"이므로 \"아주 오랫동안\"은 정반대다. ⚠️ <strong>짧은 시간 표현을 긴 시간으로 바꿔치기<\/strong>하는 함정 - 숫자·시간 표현은 반드시 원문과 대조한다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q08", "num": 8, "points": 3, "tags": ["내용불일치", "유전자"], "lecture": null, "stem": "<p>아래의 글의 내용과 가장 <strong>관계가 없는 것<\/strong>을 고르시오.<\/p>\n<blockquote><p>New drugs, however, now help the human body to accept a new part. In addition, knowledge of genes and DNA increases the  <strong>사람 명사 <code>geneticists<\/code>(유전학자)<\/strong>, 둘째 빈칸은 <code>study DNA and ~<\/code>의 목적어이므로 <strong>명사 <code>genes<\/code>(유전자)<\/strong> 다. ⚠️ <code>genetics<\/code>(유전학, 학문) / <code>geneticist<\/code>(유전학자, 사람) / <code>genetic<\/code>(유전의, 형용사) / <code>gene<\/code>(유전자) 4형태 구분 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q11", "num": 11, "points": 3, "tags": ["전치사"], "lecture": null, "stem": "<p>다음 빈칸에 들어갈 수 있는 단어를 차례대로 짝지은 것을 고르시오.<\/p>\n<blockquote><p>_____ the future, scientist may put human genes into pigs or other animals. The strange noise went _____, and he also heard the sound of footsteps. Then he put on his shoes.<\/p><\/blockquote>", "options": ["To - in", "Out - off", "For - of", "In - on"], "answer": 3, "expl": "<p><code><strong>In<\/strong> the future<\/code>(미래에는) - 정해진 짝. <code>go <strong>on<\/strong><\/code> = <strong>계속되다<\/strong>(\"이상한 소리가 계속되었다\"). ② <code>go off<\/code>는 \"(폭탄이) 터지다·(알람이) 울리다\"로 뜻이 다르다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q12", "num": 12, "points": 3, "tags": ["관계사"], "lecture": null, "stem": "<p>다음 빈칸에 들어갈 수 있는 단어를 차례대로 짝지은 것을 고르시오.<\/p>\n<blockquote><p>The Canterville Ghost is set in England in a large, old house _____ the Canterville family has lived for 300 years. They find with laboratory scientist _____ have benefits of microscopes and computers.<\/p><\/blockquote>", "options": ["when - that", "that - where", "where - who", "who - how"], "answer": 2, "expl": "<p>첫 빈칸은 선행사가 <strong>장소(house)<\/strong> 이고 뒤에 완전한 절이 오므로 <strong>관계부사 <code>where<\/code><\/strong>, 둘째 빈칸은 선행사가 <strong>사람(scientist)<\/strong> 이고 뒤에 동사 <code>have<\/code>가 바로 오므로 <strong>주격 관계대명사 <code>who<\/code><\/strong> 다. 📌 <strong>선행사의 종류 + 뒤 절의 완전/불완전<\/strong>으로 관계사를 고르는 것이 원칙 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q13", "num": 13, "points": 3, "tags": ["어휘"], "lecture": 3, "stem": "<p>괄호 안에 들어가 가장 자연스럽게 문장을 완성할 단어는 무엇인가?<\/p>\n<blockquote><p>They suffered periodic plagues of insects that ( ) crops and caused famine.<\/p><\/blockquote>", "options": ["engraved", "destroyed", "ensured", "became"], "answer": 1, "expl": "<p>뒤에 <code>caused <strong>famine<\/strong><\/code>(기근을 초래했다)이 이어지므로 작물을 <strong>파괴했다(destroyed)<\/strong> 가 인과에 맞는다. ① 새기다 ③ 보장하다 ④ 되다. 📌 2018-2 Q13과 <strong>같은 지문의 다른 빈칸<\/strong>이다 - 기출은 같은 지문을 해마다 재활용한다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q14", "num": 14, "points": 3, "tags": ["내용일치"], "lecture": 3, "stem": "<p>다음 문장의 의미와 일치하는 보기는 무엇인가?<\/p>\n<blockquote><p>They perfected the technique of artificially incubating chickens.<\/p><\/blockquote>", "options": ["그들은 기술 발달에 관심이 없었다.", "닭은 그들의 주식이 아니었다.", "그들은 닭을 인위적으로 부화시킬 수 있었다.", "인공부화 기술은 결국 완성되지 못했다."], "answer": 2, "expl": "<p><code>perfected<\/code>(완성했다) + <code>artificially incubating<\/code>(인위적으로 부화시키는). ④ 는 <code>perfected<\/code>를 부정으로 뒤집은 미끼.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q15", "num": 15, "points": 3, "tags": ["내용일치"], "lecture": 4, "stem": "<p>다음 문장에 따르면 고대 이집트 유적의 놀라운 점은 무엇인가?<\/p>\n<blockquote><p>One of the most striking things about the remains of ancient Egypt is the monumental scale of its architecture.<\/p><\/blockquote>", "options": ["건축물의 규모", "건축가의 상상력", "폭력적 상징성", "건축물의 영속성"], "answer": 0, "expl": "<p><code>the <strong>monumental scale<\/strong> of its architecture<\/code>(건축의 기념비적 <strong>규모<\/strong>)가 그대로 근거다. 📌 현행 교재 <strong>4강<\/strong>의 \"기자의 대피라미드·테베의 신전\" 건축 단락과 통한다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q16", "num": 16, "points": 3, "tags": ["내용일치"], "lecture": 3, "stem": "<p>다음 문장의 의미와 일치하는 보기는 무엇인가?<\/p>\n<blockquote><p>Many of ancient Egypt's herbal cures such as garlic, used in cooking and as a medicine, are still widely used today.<\/p><\/blockquote>", "options": ["고대 이집트인들은 좋은 요리가 치료제라고 믿었다.", "고대 이집트에서 마늘은 요리에만 쓰였다.", "고대 이집트에서 쓰이던 허브 치료제는 오늘날에도 널리 사용된다.", "고대 이집트인들은 허브가 약효를 지니고 있다는 것을 알지 못했다."], "answer": 2, "expl": "<p><code>are <strong>still widely used today<\/strong><\/code>가 직접 근거다. ② 는 <code>used in cooking <strong>and as a medicine<\/strong><\/code>(요리 <strong>및<\/strong> 약으로)을 \"요리에만\"으로 축소한 오답. 📌 현행 교재 <strong>3강<\/strong>의 \"주식에 양파·마늘 등 채소를 곁들였다\"와 소재가 겹친다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q17", "num": 17, "points": 3, "tags": ["내용일치"], "lecture": 4, "stem": "<p>다음 문장에서 Duat는 무엇이라 제시되어 있는가?<\/p>\n<blockquote><p>They believed in an underworld, called Duat, where the dead had to make a perilous journey to reach a kind of 'promised land.'<\/p><\/blockquote>", "options": ["살아 있는 사람들의 땅", "지하세계", "약속된 땅", "위험한 여행"], "answer": 1, "expl": "<p><code>an <strong>underworld<\/strong>, called Duat<\/code>가 동격 구조로 직접 정의한다. ③ <code>promised land<\/code>는 Duat를 지나 <strong>도달하는 곳<\/strong>이고, ④ 는 그 <strong>여정<\/strong>이다. ⚠️ 같은 문장 안의 <strong>다른 명사<\/strong>를 답으로 제시하는 함정 ⭐ 📌 현행 교재 <strong>4강<\/strong>의 \"죽음은 다음 세계로 가는 여정의 시작\"과 정확히 같은 관념이다 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q18", "num": 18, "points": 3, "tags": ["어휘"], "lecture": 3, "stem": "<p>괄호 안에 들어가 가장 자연스럽게 문장을 완성할 수 있는 단어는 무엇인가?<\/p>\n<blockquote><p>Many ailments were thought to be caused by worm-like creatures that had to be ( ) from the body.<\/p><\/blockquote>", "options": ["etched", "sacrificed", "confined", "purged"], "answer": 3, "expl": "<p>몸에서 <strong>제거·배출되어야<\/strong> 한다는 뜻이므로 <code>purge<\/code>(정화하다·몰아내다)가 맞다. ① 새기다 ② 제물로 바치다 ③ 가두다. 📌 <code>ailment<\/code>(질환)는 현행 교재 <strong>1강<\/strong>의 주요용어와 동일하다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q19", "num": 19, "points": 3, "tags": ["어휘", "장기이식"], "lecture": null, "stem": "<p>밑줄 친 단어의 뜻이 <strong>잘못<\/strong> 제시된 보기는 무엇인가?<\/p>\n<blockquote><p>ⓐ<strong>Organ<\/strong> ⓑ<strong>transplantation<\/strong> is a ⓒ<strong>medical<\/strong> procedure in which an organ is removed from one body and placed in the body of a ⓓ<strong>recipient<\/strong>.<\/p><\/blockquote>", "options": ["ⓐ Organ - 장기", "ⓑ transplantation - 이식", "ⓒ medical - 의료의", "ⓓ recipient - 은인"], "answer": 3, "expl": "<p><code>recipient<\/code>는 <strong>받는 사람(수혜자·수령인)<\/strong> 이다. \"은인\"은 <code>benefactor<\/code>(주는 사람)로 <strong>주는 쪽과 받는 쪽이 정반대<\/strong>다 ⚠️ 📌 장기이식 문맥의 짝: <strong>donor<\/strong>(기증자) ↔ <strong>recipient<\/strong>(수혜자) ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q20", "num": 20, "points": 3, "tags": ["주제파악", "장기이식"], "lecture": null, "stem": "<p>다음 문장은 무엇에 대해 설명하고 있는가?<\/p>\n<blockquote><p>When possible, transplant rejection can be reduced through the use of immunosuppressant drugs.<\/p><\/blockquote>", "options": ["거부반응을 줄일 수 있는 방법", "거부반응의 정의", "면역체계의 정의", "거부반응이 일어나는 이유"], "answer": 0, "expl": "<p><code>can be <strong>reduced through<\/strong> the use of ~<\/code>(~을 통해 줄일 수 있다)는 <strong>방법<\/strong>을 말한다. ②는 정의, ④는 원인이므로 문장이 다루는 층위가 다르다. ⚠️ <strong>정의 / 원인 / 방법<\/strong>을 구분해 묻는 유형 - 문장의 술어가 무엇을 서술하는지 본다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q21", "num": 21, "points": 3, "tags": ["내용일치"], "lecture": 1, "stem": "<p>다음 문장의 의미와 일치하는 보기는 무엇인가?<\/p>\n<blockquote><p>Cancer growth is often triggered by viruses.<\/p><\/blockquote>", "options": ["암세포의 증식은 먹는 음식과 관련이 있다.", "암은 바이러스 증식을 억제한다.", "바이러스 때문에 암세포가 성장하기도 한다.", "암과 바이러스는 아무 관련성이 없다."], "answer": 2, "expl": "<p><code>A is triggered by B<\/code> = <strong>B가 A를 유발한다<\/strong>. 즉 바이러스가 암 성장을 촉발한다. ② 는 주어·목적어를 뒤바꿨고, ④ 는 관계를 부정했다. ⚠️ <strong>수동태의 방향<\/strong>(by 뒤가 원인)을 뒤집는 것이 단골 함정 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q22", "num": 22, "points": 3, "tags": ["내용일치", "장기이식"], "lecture": null, "stem": "<p>다음 문장의 의미와 일치하는 보기는 무엇인가?<\/p>\n<blockquote><p>There is a global need for healthy body parts, far exceeding the numbers available.<\/p><\/blockquote>", "options": ["건강한 장기에 대한 수요를 모두 충족시키기 어렵다.", "장기를 기증하겠다는 사람들이 늘고 있다.", "건강한 장기에 대한 수요는 일부 국가에서 더 많다.", "장기를 구하는 것은 전 지구적으로 금지되어 있다."], "answer": 0, "expl": "<p><code>far <strong>exceeding the numbers available<\/strong><\/code>(구할 수 있는 수를 훨씬 초과하여) → <strong>수요 &gt; 공급<\/strong>이므로 충족이 어렵다. ③ 은 <code>global<\/code>(전 지구적)을 \"일부 국가\"로 축소했다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q23", "num": 23, "points": 3, "tags": ["어휘", "장기이식"], "lecture": null, "stem": "<p>다음 문장에서 밑줄 친 <strong>harvesting<\/strong>의 의미는 무엇인가?<\/p>\n<blockquote><p>Organ <strong>harvesting<\/strong> from live people is one of the most frequently discussed debate topic.<\/p><\/blockquote>", "options": ["식물", "적출", "취약함", "기증"], "answer": 1, "expl": "<p><code>harvest<\/code>는 본래 \"수확하다\"지만 의학 문맥에서는 <strong>(장기를) 적출하다<\/strong>의 뜻이다. ④ \"기증\"은 <code>donation<\/code>으로, <strong>적출은 행위 자체<\/strong>이고 기증은 의사 표시라 다르다 ⚠️ 📌 <strong>다의어를 문맥으로 판정<\/strong>하는 유형 - 현행 교재 신현욱 교수 단원의 어구 해석 문항과 같은 원리다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q24", "num": 24, "points": 3, "tags": ["내용일치", "법적사망"], "lecture": null, "stem": "<p>다음 문장에 따르면 문제를 더욱 복잡하게 만드는 사실은 무엇인가?<\/p>\n<blockquote><p>The question is made even more complicated by the fact that the \"irreversibly\" criterion for legal death can easily change with changing technology.<\/p><\/blockquote>", "options": ["죽음은 철학적, 윤리적 문제이다.", "기술이 발달하면 죽음을 가볍게 여길 수 있게 된다.", "법적 사망에 대한 \"돌이킬 수 없이\"라는 기준이 기술의 변화에 따라 쉽게 변할 수 있다.", "법적으로 죽음을 정의하는 것이 너무 간단하다."], "answer": 2, "expl": "<p><code>by <strong>the fact that<\/strong> ~<\/code> 뒤의 동격절이 그대로 답이다. <strong>문장 구조를 따라가면 답이 그대로 옮겨 적혀 있다<\/strong> ⭐ ④ 는 \"복잡하게 만든다\"는 전제와 모순.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q25", "num": 25, "points": 3, "tags": ["어순", "우주탐사"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 가장 적절한 것은?<\/p>\n<blockquote><p>An international team of scientists and business leaders announced ( ⓐ ). ( ⓑ ) there is alien life in space. ( ⓒ ) means different from what you are used to. The team thinks there might be life outside of Earth. If so, it could be different from us, or alien.<\/p><\/blockquote>", "options": ["plans for a huge space exploration program", "a huge space exploration program plans for", "a huge space exploration program for plans", "for plans a huge space exploration program"], "answer": 0, "expl": "<p><code>announced<\/code>의 목적어가 될 <strong>명사구<\/strong>여야 하고, 어순은 <code>plans <strong>for<\/strong> + 대상<\/code>(~에 대한 계획)이 자연스럽다. ②③④는 전치사 <code>for<\/code>의 위치가 어긋나 명사구를 이루지 못한다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q26", "num": 26, "points": 3, "tags": ["어순", "명사절"], "lecture": null, "stem": "<p>위의 빈칸 ⓑ에 가장 적절한 것은?<\/p>\n<blockquote><p>An international team of scientists and business leaders announced plans for a huge space exploration program. ( ⓑ ) there is alien life in space. ( ⓒ ) means different from what you are used to.<\/p><\/blockquote>", "options": ["To discover is its goal if", "Its goal is to discover if", "Its goal is if discover to", "If its goal is to discover"], "answer": 1, "expl": "<p><strong>주어(Its goal) + 동사(is) + 보어(to discover) + 목적어절(if ~)<\/strong> 순서가 맞다. <code>if<\/code>는 여기서 \"~인지 아닌지\"의 <strong>명사절 접속사<\/strong>로 <code>discover<\/code>의 목적어를 이끈다. ④ 는 <code>If<\/code>로 시작해 종속절만 남아 문장이 완결되지 않는다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q27", "num": 27, "points": 3, "tags": ["어휘", "우주탐사"], "lecture": null, "stem": "<p>위의 빈칸 ⓒ에 적절한 것은?<\/p>\n<blockquote><p>An international team of scientists and business leaders announced plans for a huge space exploration program. Its goal is to discover if there is alien life in space. ( ⓒ ) means different from what you are used to. The team thinks there might be life outside of Earth. If so, it could be different from us, or alien.<\/p><\/blockquote>", "options": ["Illegal", "A citizen", "Authentic", "Alien"], "answer": 3, "expl": "<p>뒤 문장에 <code>it could be different from us, <strong>or alien<\/strong><\/code>이라고 같은 단어가 반복된다. \"익숙한 것과 다르다\"는 정의에 맞는 것은 <strong><code>Alien<\/code><\/strong>. 📌 <strong>정의문의 주어를 뒤 문장에서 확인<\/strong>하는 방식 - 2018-2 Q19와 같은 원리 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q28", "num": 28, "points": 3, "tags": ["어휘", "정의문"], "lecture": null, "stem": "<p>다음 빈칸 ⓐ, ⓑ에 공통으로 적절한 것은?<\/p>\n<blockquote><p>If something is ( ⓐ ), it is real and not a copy. When people are described as ( ⓑ ), it means they are true to their individual identity.<\/p><\/blockquote>", "options": ["augmented", "an avatar", "authentic", "alien"], "answer": 2, "expl": "<p>\"<strong>진짜이고 복제가 아닌<\/strong>\", \"<strong>자기 정체성에 충실한<\/strong>\" = <strong><code>authentic<\/code>(진정한·진짜의)<\/strong>. ⚠️ 두 빈칸에 <strong>공통으로<\/strong> 들어가야 하므로, 사람과 사물 양쪽에 쓸 수 있는 형용사여야 한다. ② 는 명사라 ⓑ 자리에 부적합.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q29", "num": 29, "points": 3, "tags": ["문장삽입", "IT용어"], "lecture": null, "stem": "<p>위의 인용문에서 아래 내용이 들어갈 가장 적절한 부분은?<\/p>\n<blockquote><p>The robot ( ⓐ ) is carried between classes by the child's friends and is placed on the desk ( ⓑ ). From home or a hospital bed ( ⓒ ), the recovering child can also participate in class ( ⓓ ).<\/p>\n<p>삽입할 내용: <strong>where the child usually sits<\/strong><\/p><\/blockquote>", "options": ["ⓐ", "ⓑ", "ⓒ", "ⓓ"], "answer": 1, "expl": "<p><code>where<\/code>는 <strong>장소 선행사<\/strong>를 받는 관계부사다. 바로 앞에 장소 명사 <strong><code>the desk<\/code><\/strong> 가 있는 ⓑ 자리가 맞다 - \"아이가 평소 앉는 <strong>책상<\/strong> 위에 놓인다\". ⚠️ 관계부사 삽입 문제는 <strong>바로 앞 명사가 무엇인지<\/strong>만 보면 된다 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q30", "num": 30, "points": 3, "tags": ["어휘", "IT용어"], "lecture": null, "stem": "<p>위의 내용과 관련된 것으로 가장 적절한 것은?<\/p>\n<blockquote><p>The robot is carried between classes by the child's friends and is placed on the desk where the child usually sits. From home or a hospital bed, the recovering child can also participate in class.<\/p><\/blockquote>", "options": ["avatar", "alien", "authentic", "encryption"], "answer": 0, "expl": "<p>아픈 아이를 <strong>대신해<\/strong> 교실에 존재하는 로봇 = <strong>아바타(avatar)<\/strong>.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q31", "num": 31, "points": 3, "tags": ["어휘", "정의문"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 가장 적절한 것은?<\/p>\n<blockquote><p>( ⓐ ) means no longer happy or satisfied with something. Some farmers in Cambodia are ( ⓑ ).<\/p>\n<p>㉠ when it comes to  ㉡ helping farmers improve their crops  ㉢ disenchanted with their leaders<\/p><\/blockquote>", "options": ["Encrypted", "Disenchanted", "Deliberate", "Augmented"], "answer": 1, "expl": "<p>\"더 이상 행복하거나 만족스럽지 않은\" = <strong><code>Disenchanted<\/code>(환멸을 느낀)<\/strong>. 📌 [보기] ㉢에 같은 단어가 그대로 들어 있어 교차 확인이 된다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q32", "num": 32, "points": 3, "tags": ["어순배열"], "lecture": null, "stem": "<p>위의 빈칸 ⓑ에 맥락에 맞게 들어갈 적절한 어순의 문장은?<\/p>\n<blockquote><p>Disenchanted means no longer happy or satisfied with something. Some farmers in Cambodia are ( ⓑ ).<\/p>\n<p>㉠ when it comes to  ㉡ helping farmers improve their crops  ㉢ disenchanted with their leaders<\/p><\/blockquote>", "options": ["㉠-㉡-㉢", "㉡-㉠-㉢", "㉢-㉡-㉠", "㉢-㉠-㉡"], "answer": 3, "expl": "<p><strong>Some farmers in Cambodia are ㉢disenchanted with their leaders ㉠when it comes to ㉡helping farmers improve their crops.<\/strong> <code>are<\/code> 뒤에 <strong>보어(㉢)<\/strong>, 그 다음 <code>when it comes to<\/code>(~에 관해서라면)의 <strong>to는 전치사<\/strong>이므로 뒤에 <strong>동명사 ㉡<\/strong> 이 온다. ⚠️ 2018-2 Q30과 <strong>같은 지문이지만 보기 기호가 달라 정답 번호가 다르다<\/strong>(2018은 ③, 2019는 ④). 번호를 외우지 말고 <strong>구조로 풀어야<\/strong> 하는 이유다 ⭐⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q33", "num": 33, "points": 3, "tags": ["어휘", "IT용어"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 가장 적절한 것은?<\/p>\n<blockquote><p>( ⓐ ) is a way to ( ⓑ ). It is meant to permit access only to those ( ⓒ ). But, it can also prevent law officers from finding evidence of possible crimes.<\/p>\n<p><strong>[보기]<\/strong> ㉠ settle disagreements ㉡ meant to receive a message or data ㉢ make digital information secure ㉣ recover from difficult conditions and unexpected changes<\/p><\/blockquote>", "options": ["Reconciliation", "Crypto money", "Momentum", "Encryption"], "answer": 3, "expl": "<p>접근을 허용된 사람에게만 제한하고, 수사기관의 증거 확보까지 막을 수 있는 것은 <strong>암호화(Encryption)<\/strong> 다. ③ <code>Momentum<\/code>(운동량·추진력)은 2018-2에 나온 <code>momentous<\/code>와 어근만 같은 미끼다 ⚠️<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q34", "num": 34, "points": 3, "tags": ["빈칸보기고르기", "IT용어"], "lecture": null, "stem": "<p>위의 빈칸 ⓑ에 적절한 것을 [보기]에서 고르면?<\/p>\n<blockquote><p>( ⓐ ) is a way to ( ⓑ ). It is meant to permit access only to those ( ⓒ ). But, it can also prevent law officers from finding evidence of possible crimes.<\/p>\n<p><strong>[보기]<\/strong> ㉠ settle disagreements ㉡ meant to receive a message or data ㉢ make digital information secure ㉣ recover from difficult conditions and unexpected changes<\/p><\/blockquote>", "options": ["㉠", "㉡", "㉢", "㉣"], "answer": 2, "expl": "<p><code>a way <strong>to<\/strong> + 동사원형<\/code> 자리이고, 암호화의 목적은 <strong>디지털 정보를 안전하게 만드는 것<\/strong>이므로 ㉢. ㉠ 은 <code>reconciliation<\/code>(화해), ㉣ 은 <code>resilient<\/code>(회복력 있는)의 정의로, <strong>다른 어휘 문항의 정답을 오답으로 재배치<\/strong>한 것이다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2019-2-Q35", "num": 35, "points": 3, "tags": ["빈칸보기고르기", "IT용어"], "lecture": null, "stem": "<p>위의 빈칸 ⓒ에 적절한 것을 [보기]에서 고르면?<\/p>\n<blockquote><p>( ⓐ ) is a way to ( ⓑ ). It is meant to permit access only to those ( ⓒ ). But, it can also prevent law officers from finding evidence of possible crimes.<\/p>\n<p><strong>[보기]<\/strong> ㉠ settle disagreements ㉡ meant to receive a message or data ㉢ make digital information secure ㉣ recover from difficult conditions and unexpected changes<\/p><\/blockquote>", "options": ["㉠", "㉡", "㉢", "㉣"], "answer": 1, "expl": "<p><code>permit access only to <strong>those<\/strong> ( ⓒ )<\/code>에서 <code>those<\/code>를 수식하는 <strong>형용사구(과거분사구)<\/strong> 가 필요하다. \"메시지나 데이터를 <strong>받도록 되어 있는<\/strong> 사람들\"이므로 ㉡ <code>meant to receive a message or data<\/code>. 📌 ㉢은 이미 ⓑ에 쓰였으므로 중복될 수 없다는 점도 단서다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}]}, {"id": "2018-2", "title": "기출 - 2018학년도 2학기 기말시험 (1학년 1교시 · 1과목)", "meta": "<blockquote><p>출처: <code>자료/대학영어/02_기출문제/017-대학영어-1학년-1교시.pdf<\/code> (스캔본 판독) 출제위원: (방송대) 안승신 · (방송대) 손향숙 · 신현욱 출제범위: 멀티미디어 강의 <strong>Unit 1, 3, 8, 9, 11, 12<\/strong>의 6개 단원 및 교재 해당 범위 정답 근거: <code>자료/대학영어/03_기출문제정답/2018 2학기 기말시험 정답표(전학년).pdf<\/code> 대학영어 행 <code>41223 41234 13142 31431 12132 14133 14142<\/code> (35문항) 35문항 전수를 직접 풀이로 대조하여 <strong>35/35 일치<\/strong> 확인<\/p>\n<p>⚠️ <strong>교재 개정 주의<\/strong> - 이 기출은 <strong>구(舊) 교재<\/strong> 기준이다. 현행(2026학년도) 교재의 단원 (Virus / Ancient Egypt / Fear / Artists Fight Back / Forecasting Trends / Harmony Haven / Canvas of Creativity / Harmony's Forge)과 지문이 다르다. 따라서 <strong>지문 내용이 아니라 문항 유형<\/strong>(우리말 해석 오류 찾기 · 빈칸 어법 · 목적어 찾기 · 어순 배열 · 내용 일치 · 어휘 뜻 · 전치사)을 익히는 용도로 활용한다. <code>#N강<\/code> 태그는 주제가 실제로 겹치는 문항에만 붙였다.<\/p>\n<p>⚠️ 문제지에 <strong>문항별 배점 표기가 없어<\/strong> 편의상 균등 배점(3점)으로 기록한다.<\/p><\/blockquote>", "generated": false, "questions": [{"qid": "2018-2-Q01", "num": 1, "points": 3, "tags": ["우리말해석", "The-Canterville-Ghost"], "lecture": null, "stem": "<p>제시된 글을 읽고 물음에 답하시오. 밑줄 친 곳의 우리말 해석이 바르지 <strong>않은<\/strong> 것은?<\/p>\n<blockquote><p>There was the Duchess of Bolton (a)<strong>not long ago<\/strong>. I put my (b)<strong>skeleton hands<\/strong> on her shoulders, and she (c)<strong>nearly died of terror<\/strong>. She has been ill (d)<strong>ever since<\/strong>. Before that, there were three housekeepers, ( e ) ran away from the house, ( f ).<\/p><\/blockquote>", "options": ["(a): 얼마 전에", "(b): 뼈만 앙상한 두 손", "(c): 공포로 거의 죽을 뻔했다.", "(d): 그 일로 인하여"], "answer": 3, "expl": "<p><code>ever since<\/code>는 \"<strong>그 이후로 (죽) 계속<\/strong>\"이라는 뜻이다. \"그 일로 인하여\"는 인과를 나타내는 <code>because of that<\/code> 계열의 해석이라 틀렸다. ①②③은 모두 올바른 해석.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q02", "num": 2, "points": 3, "tags": ["관계대명사", "The-Canterville-Ghost"], "lecture": null, "stem": "<p>어법상 괄호 ( e )에 들어갈 맞는 낱말은?<\/p>\n<blockquote><p>There was the Duchess of Bolton (a)<strong>not long ago<\/strong>. I put my (b)<strong>skeleton hands<\/strong> on her shoulders, and she (c)<strong>nearly died of terror<\/strong>. She has been ill (d)<strong>ever since<\/strong>. Before that, there were three housekeepers, ( e ) ran away from the house, ( f ).<\/p><\/blockquote>", "options": ["who", "they", "then", "those"], "answer": 0, "expl": "<p>선행사가 사람(<strong>three housekeepers<\/strong>)이고 뒤에 동사 <code>ran<\/code>이 이어지는 <strong>주격 관계대명사<\/strong> 자리이므로 <code>who<\/code>가 맞다. ② <code>they<\/code>를 쓰면 접속사 없이 두 절이 이어져 비문이 된다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q03", "num": 3, "points": 3, "tags": ["분사구문", "The-Canterville-Ghost"], "lecture": null, "stem": "<p>괄호 ( f )에 들어갈 낱말 형이 바른 것은?<\/p>\n<blockquote><p>There was the Duchess of Bolton (a)<strong>not long ago<\/strong>. I put my (b)<strong>skeleton hands<\/strong> on her shoulders, and she (c)<strong>nearly died of terror<\/strong>. She has been ill (d)<strong>ever since<\/strong>. Before that, there were three housekeepers, ( e ) ran away from the house, ( f ).<\/p><\/blockquote>", "options": ["scream", "screaming", "screamed", "to scream"], "answer": 1, "expl": "<p>주절과 <strong>동시에 일어나는 동작<\/strong>을 덧붙이는 <strong>분사구문<\/strong> 자리다. 주어(housekeepers)와 능동 관계이므로 <strong>현재분사 <code>screaming<\/code><\/strong>(\"비명을 지르면서\")이 맞다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q04", "num": 4, "points": 3, "tags": ["시제일치", "어휘"], "lecture": null, "stem": "<p>괄호 ( a )에 들어갈 우리말 뜻에 적합한 낱말 형은?<\/p>\n<blockquote><p>Lady Stutfield never spoke again after my cold fingers ( a <strong>잡다<\/strong> ) her long white neck while she ( b <strong>앉아 식사를 하다<\/strong> ).<\/p><\/blockquote>", "options": ["hold", "held", "touch", "touched"], "answer": 1, "expl": "<p>주절이 과거(<code>never spoke<\/code>)이므로 <strong>과거형<\/strong>이어야 하고, \"(목을) 잡다\"는 <code>hold<\/code>다. 따라서 <code>held<\/code>. ④ <code>touched<\/code>는 \"만졌다\"로 뜻이 다르다. ⚠️ <strong>시제와 어휘를 동시에<\/strong> 물어보는 형태.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q05", "num": 5, "points": 3, "tags": ["숙어", "어휘"], "lecture": null, "stem": "<p>괄호 ( b )에 들어갈 우리말 뜻에 적절한 낱말은?<\/p>\n<blockquote><p>Lady Stutfield never spoke again after my cold fingers ( a <strong>잡다<\/strong> ) her long white neck while she ( b <strong>앉아 식사를 하다<\/strong> ).<\/p><\/blockquote>", "options": ["sit on dinner", "sit behind dinner", "sat at dinner", "sit next to dinner"], "answer": 2, "expl": "<p>\"식사 중이다\"는 <strong><code>be/sit at dinner<\/code><\/strong> 가 관용 표현이고, 주절 시제에 맞춰 <strong>과거형 <code>sat<\/code><\/strong> 이어야 한다. 전치사 <code>at<\/code>이 핵심.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q06", "num": 6, "points": 3, "tags": ["문맥추론"], "lecture": null, "stem": "<p>빈 란에 들어갈 문장으로서 앞 문장과 의미상으로 가장 어울리는 것은?<\/p>\n<blockquote><p>I have been the most famous ghost in the country. ______________________________<\/p><\/blockquote>", "options": ["He was both angry and unhappy.", "He knocked a bottle of oil on to the floor.", "For a second or two the Canterville ghost stood still.", "Everyone-everyone-has been afraid of me."], "answer": 3, "expl": "<p>앞 문장이 <strong>1인칭(<code>I<\/code>) 현재완료<\/strong>로 \"나는 이 나라에서 가장 유명한 유령이었다\"라고 말하므로, 이어지는 문장도 <strong>같은 화자·같은 시제<\/strong>로 그 이유를 뒷받침해야 자연스럽다. ①②③은 모두 <strong>3인칭(He/the ghost)<\/strong> 이라 화자가 바뀌어 어색하다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q07", "num": 7, "points": 3, "tags": ["우리말해석", "Disease-Detectives"], "lecture": null, "stem": "<p>밑줄 친 부분의 우리말 해석이 바르지 <strong>않은<\/strong> 것은?<\/p>\n<blockquote><p>Modern (a)<strong>disease detectives<\/strong> share the information that they (b)<strong>find<\/strong> with (c)<strong>laboratory scientists<\/strong> who (d)<strong>have the benefits of<\/strong> microscopes and computers. ( e ), these disease detectives work to find the causes of modern (f)<strong>killer diseases<\/strong>.<\/p><\/blockquote>", "options": ["(a): 질병 환자들", "(c): 시험실 과학자들", "(d): ~의 혜택을 누리다", "(f): 치명적인 질병들"], "answer": 0, "expl": "<p><code>disease detectives<\/code>는 \"질병 <strong>탐정<\/strong>(질병의 원인을 추적하는 사람들)\"이다. \"질병 환자들\"은 <code>disease patients<\/code>에 해당하므로 틀렸다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q08", "num": 8, "points": 3, "tags": ["목적어찾기", "관계대명사"], "lecture": null, "stem": "<p>동사 (b)의 목적어는 무엇인가?<\/p>\n<blockquote><p>Modern (a)<strong>disease detectives<\/strong> share the information that they (b)<strong>find<\/strong> with (c)<strong>laboratory scientists<\/strong> who (d)<strong>have the benefits of<\/strong> microscopes and computers. ( e ), these disease detectives work to find the causes of modern (f)<strong>killer diseases<\/strong>.<\/p><\/blockquote>", "options": ["disease detectives", "the information", "the benefits", "killer diseases"], "answer": 1, "expl": "<p><code>the information <strong>that<\/strong> they find<\/code>에서 <code>that<\/code>은 <strong>목적격 관계대명사<\/strong>이고 선행사는 <code>the information<\/code>이다. 즉 <code>find<\/code>의 목적어가 관계대명사로 앞으로 나간 형태이므로 목적어는 <strong>the information<\/strong>. ⚠️ <code>share A with B<\/code>(A를 B와 공유하다) 구조와 헷갈리지 말 것 - <code>with laboratory scientists<\/code>는 <code>share<\/code>에 딸린 구다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q09", "num": 9, "points": 3, "tags": ["부사", "어휘"], "lecture": null, "stem": "<p>괄호 ( e )에 들어갈 '함께/협력하여'란 의미의 부사로서 바른 것은?<\/p>\n<blockquote><p>Modern (a)<strong>disease detectives<\/strong> share the information that they (b)<strong>find<\/strong> with (c)<strong>laboratory scientists<\/strong> who (d)<strong>have the benefits of<\/strong> microscopes and computers. ( e ), these disease detectives work to find the causes of modern (f)<strong>killer diseases<\/strong>.<\/p><\/blockquote>", "options": ["Genetically", "Probably", "Together", "Availably"], "answer": 2, "expl": "<p>\"함께/협력하여\" = <strong><code>Together<\/code><\/strong>. ① 유전적으로 ② 아마도 ④ (비표준형) 이용 가능하게.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q10", "num": 10, "points": 3, "tags": ["어순배열", "비교급"], "lecture": null, "stem": "<p>다음의 구절들이 바른 문장을 이루도록 맞게 연결된 것은? (문장 첫 대문자는 무시함.)<\/p>\n<blockquote><p>(a) in the past  (b) organ transplants (c) than they were  (d) are more successful now<\/p><\/blockquote>", "options": ["(a)-(b)-(d)-(c)", "(a)-(b)-(c)-(d)", "(b)-(a)-(d)-(c)", "(b)-(d)-(c)-(a)"], "answer": 3, "expl": "<p><strong>Organ transplants are more successful now than they were in the past.<\/strong> (주어 → 동사구 → 비교급 <code>than<\/code> 절 → 시간 부사구) 순서다. <strong>비교급 <code>more successful<\/code> 뒤에 <code>than<\/code>이 온다<\/strong>는 점이 배열의 결정적 단서.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q11", "num": 11, "points": 3, "tags": ["어휘", "장기이식"], "lecture": null, "stem": "<p>두 괄호에 들어갈 낱말이 순서대로 바른 것은?<\/p>\n<blockquote><p>Knowledge of genes and DNA ( <strong>증가하다<\/strong> ) the possibility of successful organ transplants. As a result, doctors can try to match the ( <strong>특성들<\/strong> ) of the organ donor and the receiver<\/p><\/blockquote>", "options": ["increases, characteristics", "increases, figures", "decreases, characteristics", "decreases, figures"], "answer": 0, "expl": "<p>\"증가하다\" = <code>increases<\/code>(주어가 단수 <code>Knowledge<\/code>이므로 -s), \"특성들\" = <code>characteristics<\/code>. <code>figures<\/code>는 \"수치·인물\"이라 뜻이 다르다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q12", "num": 12, "points": 3, "tags": ["완료부정사", "어법"], "lecture": 3, "stem": "<p>㉠~㉣ 중 문법적으로 올바르지 <strong>않은<\/strong> 것은 무엇인가?<\/p>\n<blockquote><p>Most Egyptians ㉠<strong>seem<\/strong> ㉡<strong>to<\/strong> have ㉢<strong>eat<\/strong> very well, though they did ㉣<strong>suffer<\/strong> periodic plagues of insects that destroyed crops and caused ( ⓐ ). Their agricultural methods were somewhat primitive and most practised a subsistence form of farming, growing just sufficient for their needs.<\/p><\/blockquote>", "options": ["㉠ seem", "㉡ to", "㉢ eat", "㉣ suffer"], "answer": 2, "expl": "<p><code>seem to <strong>have<\/strong> + p.p.<\/code>는 <strong>완료부정사<\/strong>로 \"(과거에) ~했던 것으로 보인다\"를 뜻한다. 따라서 <code>have<\/code> 뒤에는 <strong>과거분사 <code>eaten<\/code><\/strong> 이 와야 하는데 원형 <code>eat<\/code>이 쓰여 틀렸다. ㉣ <code>did suffer<\/code>는 <strong>동사 강조의 조동사 do<\/strong> 용법으로 원형 <code>suffer<\/code>가 맞다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q13", "num": 13, "points": 3, "tags": ["문맥추론", "어휘"], "lecture": 3, "stem": "<p>글의 흐름상 ( ⓐ )에 가장 자연스러운 단어는 무엇인가?<\/p>\n<blockquote><p>Most Egyptians ㉠<strong>seem<\/strong> ㉡<strong>to<\/strong> have ㉢<strong>eat<\/strong> very well, though they did ㉣<strong>suffer<\/strong> periodic plagues of insects that destroyed crops and caused ( ⓐ ). Their agricultural methods were somewhat primitive and most practised a subsistence form of farming, growing just sufficient for their needs.<\/p><\/blockquote>", "options": ["famine", "meat", "insomnia", "virus"], "answer": 0, "expl": "<p><strong>작물을 파괴한(destroyed crops)<\/strong> 결과로 이어질 말이므로 <strong><code>famine<\/code>(기근)<\/strong> 이 자연스럽다. ③ 불면증 ④ 바이러스는 작물 파괴와 인과가 닿지 않는다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q14", "num": 14, "points": 3, "tags": ["내용일치"], "lecture": 3, "stem": "<p>글의 내용과 일치하는 것은 무엇인가?<\/p>\n<blockquote><p>Most Egyptians seem to have eaten very well, though they did suffer periodic plagues of insects that destroyed crops and caused famine. Their agricultural methods were somewhat primitive and most practised a subsistence form of farming, growing just sufficient for their needs.<\/p><\/blockquote>", "options": ["이집트인들은 언제나 먹을 게 없어서 고통을 받았다.", "이집트인들의 농사법은 매우 현대적이었다.", "이집트인들은 농산물 수확량이 너무 많아 항상 이웃 나라에 농산물을 팔았다.", "이집트인들은 곤충 때문에 피해를 입기도 했다."], "answer": 3, "expl": "<p><code>periodic plagues of insects that destroyed crops<\/code>가 근거다. ① 본문은 \"<strong>대체로 잘 먹었다<\/strong>(seem to have eaten very well)\"이므로 반대. ② <code>somewhat <strong>primitive<\/strong><\/code>(다소 원시적)라 했으므로 반대. ③ <code>subsistence form of farming, growing just sufficient for their needs<\/code>(자급 수준)라 했으므로 반대.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q15", "num": 15, "points": 3, "tags": ["내용일치"], "lecture": 4, "stem": "<p>이집트인들은 질병에 걸리는 것을 막기 위해 어떻게 했는가?<\/p>\n<blockquote><p>Magical charms in the form of amulets were worn as protection against disease, and votive offerings or ⓐ<strong>sacrifices<\/strong> were made to the gods. Because Egyptians believed in an afterlife, they did not believe ill-health was confined to the living so they buried magical charms with the deceased as protection in the underworld.<\/p><\/blockquote>", "options": ["사람을 만나지 않았다.", "부적을 지니고 다녔다.", "짐승의 가죽을 지니고 다녔다.", "일찍 잤다."], "answer": 1, "expl": "<p><code>Magical charms in the form of <strong>amulets<\/strong> were <strong>worn<\/strong> as protection against disease<\/code>(부적 형태의 주술적 부적을 질병 방지용으로 <strong>착용했다<\/strong>)가 근거다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q16", "num": 16, "points": 3, "tags": ["어휘"], "lecture": 4, "stem": "<p>ⓐ <strong>sacrifices<\/strong>의 뜻은 무엇인가?<\/p>\n<blockquote><p>Magical charms in the form of amulets were worn as protection against disease, and votive offerings or ⓐ<strong>sacrifices<\/strong> were made to the gods. Because Egyptians believed in an afterlife, they did not believe ill-health was confined to the living so they buried magical charms with the deceased as protection in the underworld.<\/p><\/blockquote>", "options": ["매장", "저승", "제물", "영혼"], "answer": 2, "expl": "<p><code>votive offerings or sacrifices were made <strong>to the gods<\/strong><\/code>(신들에게 바쳐진 봉헌물 또는 <strong>제물<\/strong>)라는 문맥이다. <code>sacrifice<\/code>는 \"희생·<strong>제물<\/strong>\"의 뜻으로 쓰였다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q17", "num": 17, "points": 3, "tags": ["어휘"], "lecture": 4, "stem": "<p>괄호 ( ⓐ )에 가장 자연스러운 단어는 무엇인가?<\/p>\n<blockquote><p>There were several hundred different gods and goddesses in ancient Egypt, many of whom ( ⓐ ) themselves as animals on earth.<\/p><\/blockquote>", "options": ["manifested", "mummified", "preserved", "unraveled"], "answer": 0, "expl": "<p><code>manifest oneself as ~<\/code> = \"<strong>~의 모습으로 나타나다<\/strong>\". 신들이 지상에서 동물의 모습으로 현현했다는 뜻이므로 적절하다. 📌 현행 교재 <strong>4강<\/strong>의 \"이집트 신들은 동물이나 인간 몸에 동물 머리를 얹은 형상을 취했다(assumed various forms)\"와 같은 내용이다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q18", "num": 18, "points": 3, "tags": ["전치사"], "lecture": null, "stem": "<p>괄호 ( ⓐ )에 알맞은 전치사는 무엇인가?<\/p>\n<blockquote><p>The angular form of these carvings is very different ( ⓐ ) the huge statues, which were executed with perfect perspective.<\/p><\/blockquote>", "options": ["on", "for", "despite", "from"], "answer": 3, "expl": "<p><strong><code>be different from ~<\/code><\/strong>(~와 다르다)이 정해진 짝이다. ⚠️ 전치사 짝 문항은 대학영어 기출의 단골 유형.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q19", "num": 19, "points": 3, "tags": ["어휘", "장기이식"], "lecture": null, "stem": "<p>괄호 ( ⓐ )에 가장 알맞은 단어는 무엇인가?<\/p>\n<blockquote><p>Some of the key areas for medical management are the problems of transplant ( ⓐ ), during which the body has an immune response to the transplanted organ, possibly leading to transplant failure and the need to immediately remove the organ from the recipient. When possible, transplant rejection can be reduced through serotyping to determine the most appropriate donor-recipient match and through the use of immunosuppressant drugs.<\/p><\/blockquote>", "options": ["legalization", "trial", "rejection", "cooperation"], "answer": 2, "expl": "<p>뒤 문장에 <strong><code>transplant rejection<\/code><\/strong> 이라는 같은 표현이 그대로 나온다. 몸이 이식 장기에 면역 반응을 일으켜 이식 실패로 이어지는 현상은 <strong>거부반응(rejection)<\/strong> 이다. 📌 <strong>뒤 문장에 정답 단어가 반복되는<\/strong> 전형적 빈칸 유형 - 지문 전체를 훑으면 바로 보인다 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q20", "num": 20, "points": 3, "tags": ["내용일치", "장기이식"], "lecture": 2, "stem": "<p>장기이식을 실패에 이르게 할 수 있는 것으로 무엇이 언급되었는가?<\/p>\n<blockquote><p>Some of the key areas for medical management are the problems of transplant rejection, during which the body has an immune response to the transplanted organ, possibly leading to transplant failure and the need to immediately remove the organ from the recipient.<\/p><\/blockquote>", "options": ["면역반응", "바이러스", "수술 장비의 문제", "청결의 문제"], "answer": 0, "expl": "<p><code>the body has an <strong>immune response<\/strong> to the transplanted organ, possibly leading to <strong>transplant failure<\/strong><\/code>가 그대로 근거다. ②③④는 본문에 언급되지 않았다. 📌 현행 교재 <strong>2강<\/strong>의 면역계(immune system) 내용과 연결해 읽으면 좋다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q21", "num": 21, "points": 3, "tags": ["내용일치", "장기이식"], "lecture": null, "stem": "<p>문장의 내용과 일치하는 것은 무엇인가?<\/p>\n<blockquote><p>Organ transplant recipients have a much greater risk of cancer than the general population, according to a new study, but the reason is not entirely clear.<\/p><\/blockquote>", "options": ["장기기증을 받을 경우 암에 걸릴 확률이 높아진다.", "일반인이 장기기증자보다 암에 잘 걸린다.", "암에 걸리면 장기기증을 받아야 한다.", "장기기증과 암 발병률의 관계에 대해서는 전혀 연구가 이루어지지 않고 있다."], "answer": 0, "expl": "<p><code><strong>recipients<\/strong>(수혜자) have a much greater risk of cancer <strong>than the general population<\/strong><\/code>이 근거다. ② 방향이 반대. ④ <code>according to <strong>a new study<\/strong><\/code>라 했으므로 연구가 있었다. ⚠️ <strong>비교 대상의 방향<\/strong>(수혜자 &gt; 일반인)을 뒤집은 보기가 함정.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q22", "num": 22, "points": 3, "tags": ["숙어", "우리말해석"], "lecture": null, "stem": "<p>밑줄 친 ⓐ <strong>On average<\/strong>의 우리말 뜻은 무엇인가?<\/p>\n<blockquote><p>ⓐ<strong>On average<\/strong>, an individual will wait three and a half years for an organ to become available for transplant.<\/p><\/blockquote>", "options": ["불행하게도", "평균적으로", "인간적으로", "운 좋게도"], "answer": 1, "expl": "<p><code>on average<\/code> = <strong>평균적으로<\/strong>. 뒤에 \"3년 반을 기다린다\"는 <strong>수치<\/strong>가 이어지는 것도 단서다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q23", "num": 23, "points": 3, "tags": ["내용일치", "장기이식"], "lecture": null, "stem": "<p>다음 문장에서 장기이식과 관련하여 가장 자주 논의되는 토론 주제 중 하나로 언급된 것은 무엇인가?<\/p>\n<blockquote><p>Organ harvesting from live people is one of the most frequently discussed debate topics in organ transplantation.<\/p><\/blockquote>", "options": ["살아 있는 사람으로부터의 장기 적출", "이식을 목적으로 한 장기 배양", "건강한 장기를 식별하는 법", "장기이식에 관한 법적 규제"], "answer": 0, "expl": "<p><code>Organ <strong>harvesting<\/strong> from <strong>live people<\/strong><\/code>을 그대로 옮기면 \"살아 있는 사람으로부터의 장기 적출\"이다. <code>harvest<\/code>가 여기서는 \"(장기를) 적출하다\"의 뜻으로 쓰였다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q24", "num": 24, "points": 3, "tags": ["빈칸보기고르기", "우주탐사"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 적절한 것을 [보기]에서 고르시오.<\/p>\n<blockquote><p>An international team of scientists and business leaders announced ( ⓐ ). Its goal is to discover if there is alien life in space. Alien means different from ( ⓑ ). The team thinks there might be life outside of Earth. If so, it could be different from us, or alien. Here in the U.S., a person ( ⓒ ) is also called an alien.<\/p>\n<p><strong>[보기]<\/strong> ㉠ who is not a citizen / ㉡ what you are used to / ㉢ plans for a huge space exploration program / ㉣ who are going to search for life in outer space<\/p><\/blockquote>", "options": ["㉠", "㉡", "㉢", "㉣"], "answer": 2, "expl": "<p><code>announced<\/code>의 <strong>목적어(명사구)<\/strong> 자리이므로 명사구인 ㉢ <code>plans for a huge space exploration program<\/code>이 들어간다. ⚠️ ㉣도 그럴듯하지만 관계절이라 <code>announced<\/code>의 목적어가 될 수 없다. <strong>품사·구조로 먼저 거른다<\/strong> ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q25", "num": 25, "points": 3, "tags": ["빈칸보기고르기", "우주탐사"], "lecture": null, "stem": "<p>위의 빈칸 ⓑ에 적절한 것을 [보기]에서 고르시오.<\/p>\n<blockquote><p>An international team of scientists and business leaders announced ( ⓐ ). Its goal is to discover if there is alien life in space. Alien means different from ( ⓑ ). The team thinks there might be life outside of Earth. If so, it could be different from us, or alien. Here in the U.S., a person ( ⓒ ) is also called an alien.<\/p>\n<p><strong>[보기]<\/strong> ㉠ who is not a citizen / ㉡ what you are used to / ㉢ plans for a huge space exploration program / ㉣ who are going to search for life in outer space<\/p><\/blockquote>", "options": ["㉠", "㉡", "㉢", "㉣"], "answer": 1, "expl": "<p><code>different <strong>from<\/strong><\/code> 뒤의 <strong>전치사 목적어<\/strong>이므로 명사절 ㉡ <code>what you are used to<\/code>(당신이 익숙한 것)가 맞다. \"alien = 익숙한 것과 다른\"이라는 정의가 완성된다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q26", "num": 26, "points": 3, "tags": ["빈칸보기고르기", "우주탐사"], "lecture": null, "stem": "<p>위의 빈칸 ⓒ에 적절한 것을 [보기]에서 고르시오.<\/p>\n<blockquote><p>An international team of scientists and business leaders announced ( ⓐ ). Its goal is to discover if there is alien life in space. Alien means different from ( ⓑ ). The team thinks there might be life outside of Earth. If so, it could be different from us, or alien. Here in the U.S., a person ( ⓒ ) is also called an alien.<\/p>\n<p><strong>[보기]<\/strong> ㉠ who is not a citizen / ㉡ what you are used to / ㉢ plans for a huge space exploration program / ㉣ who are going to search for life in outer space<\/p><\/blockquote>", "options": ["㉠", "㉡", "㉢", "㉣"], "answer": 0, "expl": "<p>선행사가 <strong><code>a person<\/code>(단수)<\/strong> 이므로 관계절의 동사도 단수 <code>is<\/code>인 ㉠ <code>who <strong>is<\/strong> not a citizen<\/code>이 맞다. ㉣은 <code>who <strong>are<\/strong><\/code>로 복수라 수 일치가 어긋난다. 📌 미국에서 <code>alien<\/code>이 \"<strong>외국인(비시민권자)<\/strong>\"을 뜻한다는 문맥과도 맞는다. ⭐ <strong>수 일치가 결정적 단서<\/strong><\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q27", "num": 27, "points": 3, "tags": ["어휘", "IT용어"], "lecture": null, "stem": "<p>다음과 관련된 것으로 가장 적절한 것은?<\/p>\n<blockquote><p>It mixes digital information or images with what users see of the real world through their devices.<\/p><\/blockquote>", "options": ["authentic", "alien", "avatar", "augmented reality"], "answer": 3, "expl": "<p><strong>디지털 정보를 현실 세계의 모습과 섞는 것<\/strong> = <strong>증강현실(augmented reality)<\/strong>. 📌 현행 교재 <strong>9강<\/strong>에도 <code>augmented reality (AR)<\/code>이 메타버스 키워드로 등장한다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q28", "num": 28, "points": 3, "tags": ["빈칸추론", "IT용어"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 가장 적절한 것은?<\/p>\n<blockquote><p>The robot is carried between classes by the child's friends and is placed on the desk where the child usually sits. From home or a hospital bed, the recovering child can also participate in class. On the Internet, or in computer games, it represents ( ⓐ ).<\/p><\/blockquote>", "options": ["the computer user", "a human or animal form of a Hindu god", "the desire to tell the truth", "a person who is not a citizen"], "answer": 0, "expl": "<p>지문은 아픈 아이를 대신해 교실에 앉는 로봇, 즉 <strong>아바타(avatar)<\/strong> 를 설명한다. 인터넷·컴퓨터 게임에서 아바타가 대표하는 것은 <strong>사용자 자신(the computer user)<\/strong> 이다. ② 는 <code>avatar<\/code>의 <strong>어원<\/strong>(힌두교 신의 화신)이지 이 문맥의 답이 아니고, ④ 는 Q26의 <code>alien<\/code> 정의다. ⚠️ <strong>다른 문항의 정답을 오답 보기로 재활용<\/strong>하는 전형적 배치 ⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q29", "num": 29, "points": 3, "tags": ["어휘", "IT용어"], "lecture": null, "stem": "<p>위의 내용과 관련된 것으로 가장 적절한 것은?<\/p>\n<blockquote><p>The robot is carried between classes by the child's friends and is placed on the desk where the child usually sits. From home or a hospital bed, the recovering child can also participate in class. On the Internet, or in computer games, it represents the computer user.<\/p><\/blockquote>", "options": ["identity", "alien", "avatar", "augmented reality"], "answer": 2, "expl": "<p>사용자를 대신해 존재하며 사용자를 대표하는 것은 <strong>아바타(avatar)<\/strong> 다. ④ 증강현실은 \"현실에 디지털 정보를 겹치는 것\"이므로 Q27의 답이다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q30", "num": 30, "points": 3, "tags": ["어순배열"], "lecture": null, "stem": "<p>다음의 빈칸 ⓐ에 들어갈 적절한 어순의 문장은?<\/p>\n<blockquote><p>Disenchanted means no longer happy or satisfied with something. Some farmers in Cambodia are ( ⓐ ).<\/p>\n<p>㉠ helping farmers improve their crops ㉡ when it comes to ㉢ disenchanted with their leaders<\/p><\/blockquote>", "options": ["㉠-㉡-㉢", "㉡-㉠-㉢", "㉢-㉡-㉠", "㉢-㉠-㉡"], "answer": 2, "expl": "<p><strong>Some farmers in Cambodia are ㉢disenchanted with their leaders ㉡when it comes to ㉠helping farmers improve their crops.<\/strong> <code>are<\/code> 뒤에는 <strong>보어(㉢)<\/strong> 가 와야 하고, <code>when it comes to<\/code>의 <strong>to는 전치사<\/strong>라 뒤에 <strong>동명사(㉠ helping)<\/strong> 가 온다. 📌 현행 교재 <strong>5강<\/strong>의 <code>in response to <strong>perceiving<\/strong><\/code>과 같은 원리다 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2018-2-Q31", "num": 31, "points": 3, "tags": ["어휘", "IT용어"], "lecture": null, "stem": "<p>위의 빈칸 ⓐ에 가장 적절한 것은?<\/p>\n<blockquote><p>( ⓐ ) is a way to make digital information secure. It is meant to permit access only to those ( ⓑ ).<\/p><\/blockquote>", "options": ["Encryption", "Embro", "Data highway", "Cryptocurrency"], "answer": 0, "expl": "<p><strong>디지털 정보를 안전하게 만드는 방법<\/strong> = <strong>암호화(Encryption)<\/strong>. ④ <code>Cryptocurrency<\/code>(암호화폐)는 <code>crypto-<\/code>가 겹쳐 혼동을 노린 미끼다. 📌 현행 교재 <strong>10강<\/strong>의 사이버보안 키워드와 이어진다.<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "ge 에서 회복할 수 있는<\/strong> = <code>Resilient<\/code>. 📌 2018-2 Q35와 같은 문항. 현행 교재 <strong>11·12강<\/strong>의 7개 개념 중 <code>resilience<\/code>와 같은 어근이다 ⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}, {"qid": "2017-2-Q35", "num": 35, "points": 3, "tags": ["어휘", "정의문"], "lecture": null, "stem": "<p>다음 빈칸 ⓐ에 적절한 것은?<\/p>\n<blockquote><p>( ⓐ ) is the settling of disagreements. Reconciliation often results in friendly relations following a dispute or wrongdoing.<\/p><\/blockquote>", "options": ["Reconciliation", "Resilience", "Flexibility", "Elasticity"], "answer": 0, "expl": "<p><strong>뒤 문장에 <code>Reconciliation<\/code>이 그대로 반복<\/strong>되므로 빈칸도 같은 단어다. ⚠️ 2018-2 Q34는 <strong>같은 지문을 뒤집어<\/strong>(\"Reconciliation is ( ⓐ )\") 정의 쪽을 물었다. <strong>같은 문장을 어느 쪽에서 묻느냐만 바꾸는<\/strong> 전형적 변형이다 ⭐⭐⭐<\/p>", "verify": "정답표 ✅ / 직접 풀이 ✅", "generated": false}]}], "assignments": [{"id": "2026-2-과제A-누락범위확인", "title": "대학영어 과제 A - 누락 타동사 확인 목록", "intro": "<p>교재는 MD 파일, 멀티강의는 강의록 PDF를 기준으로 구분했습니다. 같은 예문이 양쪽 자료에 있으면 각 목록에 표시했습니다.<\/p>", "sections": [{"title": "교재 Unit 1", "html": "<p>자료: <a href=\"english-textbook.html#unit-01-reading\">Unit01_Virus.md<\/a><\/p>\n<ul><li class=\"chk\">☐ <strong>교재 01 · lack(lacks)<\/strong><\/li><\/ul>\n<blockquote><p>She totally lacks a sense of humor.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 02 · lack(lacked)<\/strong><\/li><\/ul>\n<blockquote><p>The proposal lacked detailed data.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 03 · disperse(dispersed)<\/strong><\/li><\/ul>\n<blockquote><p>Police dispersed the crowd that had gathered.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 04 · enter<\/strong><\/li><\/ul>\n<blockquote><p>Please knock before you enter my office.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 05 · access, enter<\/strong><\/li><\/ul>\n<blockquote><p>To access the building, you must enter a security code into the keypad by the door.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 06 · enter, declare<\/strong><\/li><\/ul>\n<blockquote><p>Before you enter the country, you must declare any items of value at customs.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 07 · breach(breached), make(made)<\/strong><\/li><\/ul>\n<blockquote><p>They breached the agreement they had made with their employer.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 08 · breach<\/strong><\/li><\/ul>\n<blockquote><p>The hackers managed to breach the company’s cybersecurity defenses.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 09 · breach, inundate<\/strong><\/li><\/ul>\n<blockquote><p>The floodwaters continued to rise, threatening to breach the levee and inundate the nearby homes.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 10 · think, allow<\/strong><\/li><\/ul>\n<blockquote><p>Do you think Dad will allow you to go to Jamie’s party?<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 11 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>You’re not allowed to talk during the exam.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 12 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Pets aren’t allowed in this hotel.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 13 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Smoking is not allowed in this restaurant.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 14 · allow, finish<\/strong><\/li><\/ul>\n<blockquote><p>He didn’t allow us enough time to finish the test.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 15 · mount(mounted)<\/strong><\/li><\/ul>\n<blockquote><p>She mounted her horse and rode off.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 16 · mount<\/strong><\/li><\/ul>\n<blockquote><p>The army prepared to mount an attack on the enemy stronghold.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 17 · mount<\/strong><\/li><\/ul>\n<blockquote><p>The art gallery is ready to mount an exhibition of contemporary sculptures next week.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 18 · comprise(comprises)<\/strong><\/li><\/ul>\n<blockquote><p>The book comprises ten chapters.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 19 · comprise(comprises), offer(offering)<\/strong><\/li><\/ul>\n<blockquote><p>The national park comprises several hiking trails, offering diverse scenic views.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>교재 20 · comprise(comprised), ensure(ensuring)<\/strong><\/li><\/ul>\n<blockquote><p>The committee is comprised of experts from different fields, ensuring a comprehensive perspective.<\/p><\/blockquote>"}, {"title": "멀티강의 1강", "html": "<p>자료: 대학영어_1강_강의록.pdf<\/p>\n<ul><li class=\"chk\">☐ <strong>PDF 9쪽 · 예문 · think, allow<\/strong><\/li><\/ul>\n<blockquote><p>Do you think Dad will allow you to go to Jamie’s party?<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 9쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>You’re not allowed to talk during the exam.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 9쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Pets aren’t allowed in this hotel.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 9쪽 · 예문 · allow(allowed)<\/strong><\/li><\/ul>\n<blockquote><p>Smoking is not allowed in this restaurant.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 9쪽 · 예문 · allow, finish<\/strong><\/li><\/ul>\n<blockquote><p>He didn’t allow us enough time to finish the test.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · lack(lacks)<\/strong><\/li><\/ul>\n<blockquote><p>She totally lacks a sense of humor.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 11쪽 · 예문 · lack(lacked)<\/strong><\/li><\/ul>\n<blockquote><p>The proposal lacked detailed data.<\/p><\/blockquote>\n<ul><li class=\"chk\">☐ <strong>PDF 15쪽 · 예문 · disperse(dispersed)<\/strong><\/li><\/ul>\n<blockquote><p>Police dispersed the crowd that had gathered.<\/p><\/blockquote>\n<ul><li class=\"c
