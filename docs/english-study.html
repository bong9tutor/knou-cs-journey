nile river , employing a homemade paste for soap composed of animal fat and chalk . body shaving was a common practice and perfumes and scented oils were used to mask unpleasant smells and to calm irritated skin. 위생법 = 나일강에서 목욕 + 동물성 지방과 백악 chalk 으로 만든 수제 비누 ⭐⭐⭐ 향수·향유의 용도 = 불쾌한 냄새를 가리고 mask , 자극받은 피부를 진정시키기 calm ⑤ 음악과 춤 15p. music and dance were popular entertainments. early on, the musical scene was dominated by flutes and harps . as time went on, other instruments resembling trumpets, oboes, and various types of pipes were introduced and gained popularity. 초기 주도 악기 = 플루트와 하프 → 이후 트럼펫·오보에·파이프류 도입 2. 어휘·어법 노트 강의록 원문 arise - arise – arose – arisen 1형식 자동사 ⭐⭐ remain - 1형식 남다 / 2형식 보어를 취함 모두 가능 ⭐⭐ establish - 3형식 타동사 supplement calm / irritate dominate resemble - 타동사 전치사 없이 목적어 ⚠️ introduce - 도입하다 / 소개하다 3형식 3. 어휘연습 강의록 원문 1. arise 동사를 사용하여 1형식 문장을 세 개 만드시오. 2. remain 동사를 사용하여 1형식 두 개와 2형식 두 개 를 만드시오. 3. establish 동사를 사용하여 3형식 문장을 세 개 만드시오. 4. 괄호 안에 공통으로 들어가 자연스럽게 문장을 완성할 수 있는 동사는? → supplement s he his income by working in a bar at night. some vegetarians like to their diets with iron. 5. \"그 분쟁이 가장 중요한 뉴스거리가 될 것 같다\"는 의미. 괄호에 들어갈 동사는? → dominate the dispute is likely to the news. 6. introduce 동사를 사용하여 3형식 문장을 세 개 만든다. 4. 연습문제 강의록 원문 1. when did ancient egypt arise? a 5000 b.c.e. b 3100 b.c.e. c 1500 b.c.e. d 332 b.c.e. 2. what allowed the civilization of ancient egypt to thrive? a trading with distant lands b utilizing the nile river's flood patterns for farming c conquering neighboring territories d discovering precious metals 3. 밑줄 친 부분의 의미는 '환경과 자원을 성공적으로 관리함으로써'이다. 괄호 안에 필요한 전치사는? → by successfully managing their environment and resources, the egyptians established a culture rich in art, knowledge, and architecture. 4. what was the primary material used for building houses in ancient egypt? a wood b stone c mudbrick d canvas 5. how did the ancient egyptians maintain their personal hygiene? a by bathing in the nile river and using a paste made of animal fat and chalk b by using modern soap and water from indoor plumbing c by avoiding water and only using dry cleaning methods d by taking sand baths under the hot sun 5. 어휘 복습을 위한 읽기 강의록 원문 in a distant kingdom, conflicts often arose among the neighboring realms, threatening the peace that queen elara worked tirelessly to establish . despite the turmoil, she remained steadfast, determined to supplement her kingdom's strength with wisdom and diplomacy. one sunny morning, she decided to introduce a new council to help govern the lands more effectively. 이 단락 하나에 이번 강의 핵심 동사 5개 arise / establish / remain / supplement / introduce 가 모두 들어 있다 📌 핵심 정리 📌 연도 두 개가 곧 문제 - 성립 3100 b.c.e. , 마케도니아 정복 332 b.c.e. 보기 4개 중 두 개가 이 숫자로 채워지므로 \"시작\"인지 \"끝\"인지 질문을 정확히 읽어야 한다. 📌 번영의 인과 사슬 - 나일강의 예측 가능한 범람 → 관개 → 잉여 작물 → 인구 증가·사회 복잡화 . \"무엇이 번영을 가능하게 했나\" 유형의 정답은 언제나 이 사슬의 출발점 나일강 활용 이다. 📌 생활상 3종 세트 - 집: 진흙벽돌 / 주식: 빵과 맥주 / 위생: 나일강 목욕 + 동물성 지방·백악 비누 . 세 항목 모두 단답형 4지선다로 그대로 출제된다. 📌 동사 문형이 어휘연습의 축 - arise 1형식 · remain 1·2형식 · establish 3형식 · introduce 3형식 . 문형을 지정해 문장을 만들라는 연습은 곧 자·타동사 구분 문항으로 바뀐다. 📌 전치사 두 개 - by + ing ~함으로써 , of + 추상명사 = 형용사, of significant importance . 실제 연습문제로 by 를 직접 물었다. 시험 대비 포인트 ⭐⭐⭐ 3100 b.c.e. 성립 / 332 b.c.e. 마케도니아 정복 ⭐⭐⭐ 번영의 원인 = 나일강 범람 패턴 활용 교역·정복·귀금속이 아님 ⭐⭐⭐ 가옥 재료 = mudbrick, 주식 = bread and beer ⭐⭐⭐ 위생 = 나일강 목욕 + 동물성 지방과 백악으로 만든 수제 비누 ⭐⭐ by + ing = ~함으로써 전치사 채우기 ⭐⭐ arise – arose – arisen 3단 변화와 1형식 용법 ⭐⭐ remain 의 1형식/2형식 구분 he remained silent. ← 보어 ⭐⭐ resemble 은 타동사 - 전치사를 붙이지 않는다 ⭐ 초기 음악 = flutes and harps가 주도 ⭐ of significant importance = significantly important "}, {"id": 4, "title": "Unit 2 Ancient Egypt [2]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>\n<ul><li>어휘 복습을 위한 읽기<\/li><\/ul>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>the Great Pyramids of Giza<\/strong><\/td><td><strong>기자의 대피라미드<\/strong> - 고대 이집트 건축의 대표작<\/td><\/tr><tr><td><strong>the temples at Thebes<\/strong><\/td><td><strong>테베의 신전들<\/strong><\/td><\/tr><tr><td><strong>commemorative<\/strong><\/td><td><strong>기념의, 추모의<\/strong><\/td><\/tr><tr><td><strong>reinforce<\/strong><\/td><td><strong>강화하다<\/strong><\/td><\/tr><tr><td><strong>pharaoh<\/strong><\/td><td><strong>파라오<\/strong> - 고대 이집트의 왕<\/td><\/tr><tr><td><strong>safeguard<\/strong><\/td><td><strong>보호하다, 지키다<\/strong><\/td><\/tr><tr><td><strong>ka<\/strong><\/td><td>파라오 <strong>영혼의 핵심적 측면<\/strong>. 미라화된 육신 곁에 머문다고 여겨짐<\/td><\/tr><tr><td><strong>mummified<\/strong><\/td><td><strong>미라로 만든<\/strong><\/td><\/tr><tr><td><strong>afterlife<\/strong><\/td><td><strong>사후 세계<\/strong><\/td><\/tr><tr><td><strong>ethos<\/strong><\/td><td>(집단의) <strong>기풍, 정신, 가치관<\/strong><\/td><\/tr><tr><td><strong>polytheistic<\/strong><\/td><td><strong>다신교의<\/strong>. <code>poly-<\/code>(많은) + <code>theistic<\/code>(신의)<\/td><\/tr><tr><td><strong>pantheon<\/strong><\/td><td>(한 종교의) <strong>모든 신들, 만신전<\/strong> - 약 <strong>1500<\/strong> 신<\/td><\/tr><tr><td><strong>reverence / worship<\/strong><\/td><td><strong>경외 / 숭배<\/strong><\/td><\/tr><tr><td><strong>Ma'at / Isfet<\/strong><\/td><td><strong>마아트(우주의 질서)<\/strong> ↔ <strong>이스페트(혼돈)<\/strong><\/td><\/tr><tr><td><strong>deities<\/strong><\/td><td><strong>신들<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 15p.~18p.)<\/h4>\n<p><strong>① 건축<\/strong> (15p.)<\/p>\n<blockquote><ol><li>The architecture of ancient Egypt includes some of the most famous structures in the world: <strong>the Great Pyramids of Giza<\/strong> and <strong>the temples at Thebes<\/strong>.<\/li><\/ol><\/blockquote>\n<blockquote><p>Building projects were <strong>organized<\/strong> and funded <strong>by the state<\/strong> not only for religious and <strong>commemorative<\/strong> purposes, but also to <strong>reinforce the wide-ranging power of the pharaoh<\/strong>.<\/p><\/blockquote>\n<ul><li>건축 사업의 주체 = <strong>국가(the state)<\/strong> / 목적 = ① 종교적·기념적 ② <strong>파라오 권력의 강화<\/strong> ⭐⭐⭐<\/li><li><code>not only A but also B<\/code> 구문 ⭐⭐<\/li><\/ul>\n<p><strong>② 피라미드와 ka<\/strong> (16p.)<\/p>\n<blockquote><p>These massive stone structures <strong>were believed to<\/strong> safeguard the physical and spiritual essence of the pharaohs.<\/p><\/blockquote>\n<blockquote><p>The <strong>ka<\/strong>, which is a vital aspect of the pharaoh's soul, <strong>was thought to<\/strong> dwell alongside their mummified forms.<\/p><\/blockquote>\n<ul><li><strong>ka = 파라오 영혼의 핵심적 측면<\/strong> ⭐⭐⭐ (피라미드도, 의식도 아니다)<\/li><li><code>be believed to<\/code> / <code>be thought to<\/code> - <strong>~라고 여겨지다<\/strong> 수동 구문 ⭐⭐<\/li><\/ul>\n<p><strong>③ 미라화의 이유<\/strong> (16p.~17p.)<\/p>\n<blockquote><p>The <strong>meticulous preservation<\/strong> of the pharaoh's body was crucial for <strong>enabling the departed ruler to adhere to his responsibilities in the afterlife<\/strong> as the monarch of the deceased. In the <strong>ethos<\/strong> of Ancient Egypt, <strong>death on the earth was the start of a journey to the next world<\/strong>.<\/p><\/blockquote>\n<ul><li>시신 보존이 결정적이었던 이유 = <strong>죽은 통치자가 사후 세계에서 자기 책무를 계속 수행할 수 있도록<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p>(제국의 부를 과시하려는 것도, 보물 지도로 쓰려는 것도, 후대를 위한 예술도 아니다)<\/p>\n<ul><li>고대 이집트의 죽음관 = <strong>다음 세계로 가는 여정의 시작<\/strong> ⭐⭐⭐<\/li><\/ul>\n<p><strong>④ 종교 - 다신교<\/strong> (17p.)<\/p>\n<blockquote><ol><li>The religion of ancient Egypt was an intricate network of <strong>polytheistic<\/strong> doctrines and ceremonial activities, <strong>playing<\/strong> a pivotal role within the fabric of its society.<\/li><\/ol><\/blockquote>\n<ul><li>고대 이집트의 종교 = <strong>다신교(polytheism)<\/strong> ⭐⭐⭐<\/li><li><code>playing<\/code> = 분사구문 (연습문제에서 동사 형태를 바꿔 넣는 문항으로 출제) ⚠️<\/li><\/ul>\n<blockquote><p>The <strong>pantheon<\/strong> comprised approximately <strong>1500 divinities<\/strong>, each <strong>commanding<\/strong> reverence and worship.<\/p><\/blockquote>\n<ul><li>신의 수 ≈ <strong>1500<\/strong> ⭐⭐<\/li><\/ul>\n<p><strong>⑤ 파라오의 위치<\/strong> (17p.~18p.)<\/p>\n<blockquote><p>The pharaoh <strong>occupied<\/strong> a distinct position, <strong>bridging the mundane and the divine<\/strong>, participating in the divine realm, and constructed great, religiously motivated funerary monuments for his afterlife.<\/p><\/blockquote>\n<ul><li>파라오 = <strong>세속(mundane)과 신성(divine)을 잇는 다리<\/strong> ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>Pharaohs were obligated to retain the benevolence of the gods through rituals and offerings so that they could maintain <strong>Ma'at, the order of the cosmos<\/strong>, and repel <strong>Isfet, which was chaos<\/strong>.<\/p><\/blockquote>\n<ul><li>파라오의 의무 = 의식과 제물로 신들의 호의를 유지 → <strong>마아트(질서) 유지 / 이스페트(혼돈) 격퇴<\/strong> ⭐⭐⭐<\/li><\/ul>\n<blockquote><p>Notable for their diverse representations, Egyptian deities <strong>assumed<\/strong> various forms, including those of animals or composite beings with an animal's head atop a human frame.<\/p><\/blockquote>\n<ul><li>이집트 신들의 형상 = 동물, 또는 <strong>인간 몸에 동물 머리<\/strong>를 얹은 복합적 존재<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>poly-<\/strong> - \"many\"를 뜻하는 접두사 ⭐⭐⭐ (ex. polygamy, polyglot, polygon, polytheism 등)<\/p>\n<p><strong>theistic / atheistic / monotheistic<\/strong> - 유신론의 / 무신론의 / 일신교의 ⚠️ 대비 암기<\/p>\n<p><strong>organize<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Most British schools organize social events for the students.\nThe books were organized on the shelves according to their size.\nI am trying to organize my office so I can work more efficiently.\nThey organized a car to pick me up at the airport.<\/code><\/pre>\n<p><strong>believe<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">No one believed us when we told them we'd been visited by a creature from Mars.\nHe believes that all children are born with equal intelligence.\nShe's arriving tomorrow, I believe.\nI believe her to be the finest violinist in the world.\nCan we believe a word of what this man says?<\/code><\/pre>\n<p><strong>think<\/strong> - 수동형 <code>be thought to<\/code> ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">I think (that) I've met you before.\nHe was thought to have boarded the plane in New York.\nSalmon used to be thought of as a luxury.<\/code><\/pre>\n<p><strong>command<\/strong> - 다의어 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The officer commanded his men to shoot.                              (명령하다, 5형식)\nHe commanded that the troops (should) cross the water.               (that절 + should 생략)\nColonel Sailing commands the Guards Regiment.                        (지휘하다)\nThe old castle commands a stunning view of the surrounding countryside.  (내려다보다)\nShe commands respect from her peers.                                 (받을 만하다·자아내다)<\/code><\/pre>\n<p><strong>occupy<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The programme will occupy that half-hour slot before the nine o'clock news.\nAll physical objects occupy space.\nTroops quickly occupied the city.\nAn increasing number of women occupy senior positions on Wall Street.\nHe occupied himself with painting and gardening after his retirement.<\/code><\/pre>\n<p><strong>bridge<\/strong> (동사)<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The new educational program aims to bridge the gap between theoretical knowledge and practical application.\nThe river had been bridged at its narrowest point.<\/code><\/pre>\n<p><strong>assume<\/strong> - 다의어 ⭐⭐<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Let's assume that they're coming and make plans on that basis.       (가정하다)\nWe can't assume the suspects to be guilty simply because they've decided to remain silent.\nUpon her retirement, her successor will assume all responsibilities associated with the position.  (떠맡다)\nHe assumed a look of indifference but I knew how he felt.            (~한 태도를 취하다·띠다)<\/code><\/pre>\n<h4>3. 어휘연습 (강의록 원문)<\/h4>\n<ol><li>organize 동사를 사용하여 <strong>3형식<\/strong> 문장을 세 개 만든다.<\/li><li>괄호 안에 자연스러운 동사는 무엇인가?<\/li><\/ol>\n<ul><li>He ( ) a look of indifference but I knew how he felt. → <strong>assumed<\/strong><\/li><\/ul>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>What does the ka represent in ancient Egyptian belief?<\/li><\/ol>\n<p>A) A type of pyramid B) The physical strength of a pharaoh <strong>C) A vital aspect of the pharaoh's soul<\/strong> D) A ceremonial ritual<\/p>\n<ol><li>Why was the preservation of the pharaoh's body crucial?<\/li><\/ol>\n<p>A) To display the wealth of the empire <strong>B) To enable the departed ruler to adhere to his responsibilities in the afterlife<\/strong> C) To use as a treasure map for hidden wealth D) To serve as historical art for future generations<\/p>\n<ol><li>According to ancient Egyptian ethos, what did death signify?<\/li><\/ol>\n<p>A) The absolute end of existence B) A curse for misdeeds in life <strong>C) The start of a journey to the next world<\/strong> D) A time for mourning and sorrow without hope<\/p>\n<ol><li>괄호 안에 필요한 동사를 알맞은 형태로 바꾸어 적으시오.<\/li><\/ol>\n<ul><li>The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, ( ) a pivotal role within the fabric of its society.<\/li><li>→ <strong>playing<\/strong> (분사구문 - 주절의 주어와 능동 관계이므로 현재분사)<\/li><\/ul>\n<ol><li>What type of religion was practiced in ancient Egypt?<\/li><\/ol>\n<p>A) Monotheism <strong>B) Polytheism<\/strong> C) Atheism D) Animism<\/p>\n<h4>5. 어휘 복습을 위한 읽기 (강의록 원문)<\/h4>\n<blockquote><p>General Pierce swiftly moved to <strong>organize<\/strong> his troops at dawn, knowing the battle ahead would be fierce. He stood tall, ready to <strong>command<\/strong> the battalion with precision. The soldiers moved to <strong>occupy<\/strong> strategic positions on the battlefield, the tension palpable. As the enemy forces advanced, each soldier prepared to <strong>assume<\/strong> their role in the well-planned defense. With a sharp <strong>command<\/strong> from General Pierce, the battle began, echoing across the plains.<\/p><\/blockquote>\n<ul><li>이번 강의 핵심 동사 4개(organize / command / occupy / assume)가 한 단락에 모두 들어 있다 📌<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>건축은 권력의 도구<\/strong> - 국가가 조직·재정을 대고, 목적은 종교·기념 <strong>그리고 파라오 권력의 강화<\/strong>. <code>not only A but also B<\/code>가 그대로 정답 근거 문장이 된다.<\/p>\n<p>📌 <strong>ka → 미라화 → 사후 세계<\/strong>가 한 줄로 이어진다 - ka(영혼의 핵심)가 미라 곁에 머문다고 믿었기에 시신을 정성껏 보존했고, 그 이유는 <strong>죽은 왕이 사후 세계에서 계속 통치하도록<\/strong> 하기 위함이다. 세 문항이 모두 이 사슬 위에 있다.<\/p>\n<p>📌 <strong>다신교 세트<\/strong> - <code>poly-<\/code>(많은) → polytheism, 신 약 <strong>1500<\/strong>, 신들은 <strong>동물 머리 + 인간 몸<\/strong>의 형상. <code>monotheism / atheism / animism<\/code>이 오답 보기로 붙어 나오므로 접두사로 갈라낸다.<\/p>\n<p>📌 <strong>Ma'at ↔ Isfet<\/strong> - 질서 ↔ 혼돈. 파라오는 의식과 제물로 신의 호의를 유지해 질서를 지킨다. 두 단어를 한 쌍으로 외워야 서로 바꿔 낸 보기를 잡아낸다.<\/p>\n<p>📌 <strong>수동 인식 구문<\/strong> - <code>be believed to<\/code> / <code>be thought to<\/code> = \"~라고 여겨지다\". 본문에서 연달아 두 번 등장하므로 어법 문항 신호로 본다 ⭐<\/p>\n<p>📌 <strong>다의어 3인방<\/strong> - <code>command<\/code>(명령·지휘·조망·자아내다), <code>occupy<\/code>(차지·점령·종사), <code>assume<\/code>(가정·떠맡다·띠다). 이 강의 어휘연습이 정확히 이 셋을 겨눈다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ ka = 파라오 영혼의 핵심적 측면 (피라미드·의식이 아님)<\/li><li>⭐⭐⭐ 시신 보존의 이유 = 사후 세계에서 통치자의 책무 수행<\/li><li>⭐⭐⭐ 죽음 = 다음 세계로 가는 여정의 시작<\/li><li>⭐⭐⭐ 고대 이집트 종교 = 다신교(polytheism)<\/li><li>⭐⭐⭐ 건축 사업의 주체(국가)와 목적(종교·기념 + 파라오 권력 강화)<\/li><li>⭐⭐ Ma'at(우주 질서) ↔ Isfet(혼돈), 파라오는 의식·제물로 신의 호의 유지<\/li><li>⭐⭐ <code>poly-<\/code> = many, <code>monotheistic / atheistic / theistic<\/code> 구분<\/li><li>⭐⭐ <code>be believed to<\/code> / <code>be thought to<\/code> 수동 인식 구문<\/li><li>⭐⭐ 분사구문 <code>playing a pivotal role<\/code> - 동사 형태 바꾸기<\/li><li>⭐ 신의 수 약 1500, 신의 형상(동물 머리 + 인간 몸)<\/li><li>⭐ <code>command<\/code> <code>occupy<\/code> <code>assume<\/code>의 다의어 용법<\/li><\/ul>"}], "terms": [{"t": "<strong>the Great Pyramids of Giza<\/strong>", "d": "<strong>기자의 대피라미드<\/strong> - 고대 이집트 건축의 대표작"}, {"t": "<strong>the temples at Thebes<\/strong>", "d": "<strong>테베의 신전들<\/strong>"}, {"t": "<strong>commemorative<\/strong>", "d": "<strong>기념의, 추모의<\/strong>"}, {"t": "<strong>reinforce<\/strong>", "d": "<strong>강화하다<\/strong>"}, {"t": "<strong>pharaoh<\/strong>", "d": "<strong>파라오<\/strong> - 고대 이집트의 왕"}, {"t": "<strong>safeguard<\/strong>", "d": "<strong>보호하다, 지키다<\/strong>"}, {"t": "<strong>ka<\/strong>", "d": "파라오 <strong>영혼의 핵심적 측면<\/strong>. 미라화된 육신 곁에 머문다고 여겨짐"}, {"t": "<strong>mummified<\/strong>", "d": "<strong>미라로 만든<\/strong>"}, {"t": "<strong>afterlife<\/strong>", "d": "<strong>사후 세계<\/strong>"}, {"t": "<strong>ethos<\/strong>", "d": "(집단의) <strong>기풍, 정신, 가치관<\/strong>"}, {"t": "<strong>polytheistic<\/strong>", "d": "<strong>다신교의<\/strong>. <code>poly-<\/code>(많은) + <code>theistic<\/code>(신의)"}, {"t": "<strong>pantheon<\/strong>", "d": "(한 종교의) <strong>모든 신들, 만신전<\/strong> - 약 <strong>1500<\/strong> 신"}, {"t": "<strong>reverence / worship<\/strong>", "d": "<strong>경외 / 숭배<\/strong>"}, {"t": "<strong>Ma'at / Isfet<\/strong>", "d": "<strong>마아트(우주의 질서)<\/strong> ↔ <strong>이스페트(혼돈)<\/strong>"}, {"t": "<strong>deities<\/strong>", "d": "<strong>신들<\/strong>"}], "search": " 04강 - unit 2 ancient egypt 2 part i · unit 2 · 교재 15p.~18p. · 담당 손향숙 교수 학습목차 1. 학습하기 2. 어휘연습 3. 연습문제 어휘 복습을 위한 읽기 주요용어 용어 정의 the great pyramids of giza 기자의 대피라미드 - 고대 이집트 건축의 대표작 the temples at thebes 테베의 신전들 commemorative 기념의, 추모의 reinforce 강화하다 pharaoh 파라오 - 고대 이집트의 왕 safeguard 보호하다, 지키다 ka 파라오 영혼의 핵심적 측면 . 미라화된 육신 곁에 머문다고 여겨짐 mummified 미라로 만든 afterlife 사후 세계 ethos 집단의 기풍, 정신, 가치관 polytheistic 다신교의 . poly 많은 + theistic 신의 pantheon 한 종교의 모든 신들, 만신전 - 약 1500 신 reverence / worship 경외 / 숭배 ma'at / isfet 마아트 우주의 질서 ↔ 이스페트 혼돈 deities 신들 본문 정리 1. 학습하기 - 본문 교재 15p.~18p. ① 건축 15p. 3. the architecture of ancient egypt includes some of the most famous structures in the world: the great pyramids of giza and the temples at thebes . building projects were organized and funded by the state not only for religious and commemorative purposes, but also to reinforce the wide ranging power of the pharaoh . 건축 사업의 주체 = 국가 the state / 목적 = ① 종교적·기념적 ② 파라오 권력의 강화 ⭐⭐⭐ not only a but also b 구문 ⭐⭐ ② 피라미드와 ka 16p. these massive stone structures were believed to safeguard the physical and spiritual essence of the pharaohs. the ka , which is a vital aspect of the pharaoh's soul, was thought to dwell alongside their mummified forms. ka = 파라오 영혼의 핵심적 측면 ⭐⭐⭐ 피라미드도, 의식도 아니다 be believed to / be thought to - ~라고 여겨지다 수동 구문 ⭐⭐ ③ 미라화의 이유 16p.~17p. the meticulous preservation of the pharaoh's body was crucial for enabling the departed ruler to adhere to his responsibilities in the afterlife as the monarch of the deceased. in the ethos of ancient egypt, death on the earth was the start of a journey to the next world . 시신 보존이 결정적이었던 이유 = 죽은 통치자가 사후 세계에서 자기 책무를 계속 수행할 수 있도록 ⭐⭐⭐ 제국의 부를 과시하려는 것도, 보물 지도로 쓰려는 것도, 후대를 위한 예술도 아니다 고대 이집트의 죽음관 = 다음 세계로 가는 여정의 시작 ⭐⭐⭐ ④ 종교 - 다신교 17p. 4. the religion of ancient egypt was an intricate network of polytheistic doctrines and ceremonial activities, playing a pivotal role within the fabric of its society. 고대 이집트의 종교 = 다신교 polytheism ⭐⭐⭐ playing = 분사구문 연습문제에서 동사 형태를 바꿔 넣는 문항으로 출제 ⚠️ the pantheon comprised approximately 1500 divinities , each commanding reverence and worship. 신의 수 ≈ 1500 ⭐⭐ ⑤ 파라오의 위치 17p.~18p. the pharaoh occupied a distinct position, bridging the mundane and the divine , participating in the divine realm, and constructed great, religiously motivated funerary monuments for his afterlife. 파라오 = 세속 mundane 과 신성 divine 을 잇는 다리 ⭐⭐⭐ pharaohs were obligated to retain the benevolence of the gods through rituals and offerings so that they could maintain ma'at, the order of the cosmos , and repel isfet, which was chaos . 파라오의 의무 = 의식과 제물로 신들의 호의를 유지 → 마아트 질서 유지 / 이스페트 혼돈 격퇴 ⭐⭐⭐ notable for their diverse representations, egyptian deities assumed various forms, including those of animals or composite beings with an animal's head atop a human frame. 이집트 신들의 형상 = 동물, 또는 인간 몸에 동물 머리 를 얹은 복합적 존재 2. 어휘·어법 노트 강의록 원문 poly - \"many\"를 뜻하는 접두사 ⭐⭐⭐ ex. polygamy, polyglot, polygon, polytheism 등 theistic / atheistic / monotheistic - 유신론의 / 무신론의 / 일신교의 ⚠️ 대비 암기 organize believe think - 수동형 be thought to ⭐⭐ command - 다의어 ⭐⭐ occupy bridge 동사 assume - 다의어 ⭐⭐ 3. 어휘연습 강의록 원문 1. organize 동사를 사용하여 3형식 문장을 세 개 만든다. 2. 괄호 안에 자연스러운 동사는 무엇인가? he a look of indifference but i knew how he felt. → assumed 4. 연습문제 강의록 원문 1. what does the ka represent in ancient egyptian belief? a a type of pyramid b the physical strength of a pharaoh c a vital aspect of the pharaoh's soul d a ceremonial ritual 2. why was the preservation of the pharaoh's body crucial? a to display the wealth of the empire b to enable the departed ruler to adhere to his responsibilities in the afterlife c to use as a treasure map for hidden wealth d to serve as historical art for future generations 3. according to ancient egyptian ethos, what did death signify? a the absolute end of existence b a curse for misdeeds in life c the start of a journey to the next world d a time for mourning and sorrow without hope 4. 괄호 안에 필요한 동사를 알맞은 형태로 바꾸어 적으시오. the religion of ancient egypt was an intricate network of polytheistic doctrines and ceremonial activities, a pivotal role within the fabric of its society. → playing 분사구문 - 주절의 주어와 능동 관계이므로 현재분사 5. what type of religion was practiced in ancient egypt? a monotheism b polytheism c atheism d animism 5. 어휘 복습을 위한 읽기 강의록 원문 general pierce swiftly moved to organize his troops at dawn, knowing the battle ahead would be fierce. he stood tall, ready to command the battalion with precision. the soldiers moved to occupy strategic positions on the battlefield, the tension palpable. as the enemy forces advanced, each soldier prepared to assume their role in the well planned defense. with a sharp command from general pierce, the battle began, echoing across the plains. 이번 강의 핵심 동사 4개 organize / command / occupy / assume 가 한 단락에 모두 들어 있다 📌 핵심 정리 📌 건축은 권력의 도구 - 국가가 조직·재정을 대고, 목적은 종교·기념 그리고 파라오 권력의 강화 . not only a but also b 가 그대로 정답 근거 문장이 된다. 📌 ka → 미라화 → 사후 세계 가 한 줄로 이어진다 - ka 영혼의 핵심 가 미라 곁에 머문다고 믿었기에 시신을 정성껏 보존했고, 그 이유는 죽은 왕이 사후 세계에서 계속 통치하도록 하기 위함이다. 세 문항이 모두 이 사슬 위에 있다. 📌 다신교 세트 - poly 많은 → polytheism, 신 약 1500 , 신들은 동물 머리 + 인간 몸 의 형상. monotheism / atheism / animism 이 오답 보기로 붙어 나오므로 접두사로 갈라낸다. 📌 ma'at ↔ isfet - 질서 ↔ 혼돈. 파라오는 의식과 제물로 신의 호의를 유지해 질서를 지킨다. 두 단어를 한 쌍으로 외워야 서로 바꿔 낸 보기를 잡아낸다. 📌 수동 인식 구문 - be believed to / be thought to = \"~라고 여겨지다\". 본문에서 연달아 두 번 등장하므로 어법 문항 신호로 본다 ⭐ 📌 다의어 3인방 - command 명령·지휘·조망·자아내다 , occupy 차지·점령·종사 , assume 가정·떠맡다·띠다 . 이 강의 어휘연습이 정확히 이 셋을 겨눈다. 시험 대비 포인트 ⭐⭐⭐ ka = 파라오 영혼의 핵심적 측면 피라미드·의식이 아님 ⭐⭐⭐ 시신 보존의 이유 = 사후 세계에서 통치자의 책무 수행 ⭐⭐⭐ 죽음 = 다음 세계로 가는 여정의 시작 ⭐⭐⭐ 고대 이집트 종교 = 다신교 polytheism ⭐⭐⭐ 건축 사업의 주체 국가 와 목적 종교·기념 + 파라오 권력 강화 ⭐⭐ ma'at 우주 질서 ↔ isfet 혼돈 , 파라오는 의식·제물로 신의 호의 유지 ⭐⭐ poly = many, monotheistic / atheistic / theistic 구분 ⭐⭐ be believed to / be thought to 수동 인식 구문 ⭐⭐ 분사구문 playing a pivotal role - 동사 형태 바꾸기 ⭐ 신의 수 약 1500, 신의 형상 동물 머리 + 인간 몸 ⭐ command occupy assume 의 다의어 용법 "}, {"id": 5, "title": "Unit 4 Fear [1]", "sections": [{"title": "학습목차", "html": "<ol><li>학습하기<\/li><li>어휘연습<\/li><li>연습문제<\/li><\/ol>\n<ul><li>어휘 복습을 위한 읽기<\/li><\/ul>"}, {"title": "주요용어", "html": "<div class=\"tbl\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><strong>fear<\/strong><\/td><td>위험이나 위협을 <strong>인지·인식하는 데 대한 반응<\/strong>으로 나타나는 <strong>강렬하게 불쾌한 감정<\/strong><\/td><\/tr><tr><td><strong>perceive<\/strong><\/td><td><strong>인지하다, 지각하다, ~로 여기다<\/strong><\/td><\/tr><tr><td><strong>physiological changes<\/strong><\/td><td><strong>생리적 변화<\/strong><\/td><\/tr><tr><td><strong>fight-or-flight mechanism<\/strong><\/td><td><strong>투쟁-도피 기제<\/strong>. 선천적 공포 반응의 다른 이름<\/td><\/tr><tr><td><strong>innate<\/strong><\/td><td><strong>선천적인, 타고난<\/strong><\/td><\/tr><tr><td><strong>embed<\/strong><\/td><td><strong>깊이 박아 넣다, 끼워 넣다<\/strong><\/td><\/tr><tr><td><strong>visceral reaction<\/strong><\/td><td><strong>본능적(내장에서 우러나는) 반응<\/strong><\/td><\/tr><tr><td><strong>heightened awareness<\/strong><\/td><td><strong>고조된 경계 상태<\/strong><\/td><\/tr><tr><td><strong>anxiety<\/strong><\/td><td><strong>불안<\/strong>. 통제 불가능하거나 불가피하다고 인식되는 <strong>미래의 위협<\/strong>에서 자주 발생<\/td><\/tr><tr><td><strong>inevitable<\/strong><\/td><td><strong>불가피한<\/strong><\/td><\/tr><tr><td><strong>elicit<\/strong><\/td><td><strong>끌어내다, 유도하다<\/strong> (2강과 연결)<\/td><\/tr><tr><td><strong>inherent nature<\/strong><\/td><td><strong>타고난 본성<\/strong><\/td><\/tr><tr><td><strong>mold<\/strong><\/td><td><strong>(성격·형태를) 빚다, 형성하다<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "본문 정리", "html": "<h4>1. 학습하기 - 본문 (교재 39p.~40p.)<\/h4>\n<p><strong>① 공포의 정의<\/strong> (39p.) ⭐⭐⭐<\/p>\n<blockquote><ol><li>Fear is an <strong>intensely unpleasant emotion<\/strong> in response to <strong>perceiving or recognizing<\/strong> a danger or threat.<\/li><\/ol><\/blockquote>\n<ul><li>공포 = 위험·위협을 <strong>인지하는 것에 대한 반응<\/strong>으로서의 강렬하게 불쾌한 감정<\/li><li>⚠️ 어법: <code>in response to<\/code>의 <strong>to는 전치사<\/strong> → 뒤에 <strong>동명사(perceiving)<\/strong> 가 온다.<\/li><\/ul>\n<p><code>in response to perceive<\/code>는 틀린 형태 (연습문제로 직접 출제됨) ⭐⭐⭐<\/p>\n<p><strong>② 공포의 생리·행동 반응<\/strong> (39p.)<\/p>\n<blockquote><p>Fear causes <strong>physiological changes<\/strong> that may produce behavioral reactions such as <strong>mounting an aggressive response<\/strong> or <strong>fleeing the threat<\/strong>. This <strong>innate<\/strong> fear response, often <strong>referred to as<\/strong> the <strong>fight-or-flight mechanism<\/strong>, is deeply <strong>embedded in<\/strong> the human experience.<\/p><\/blockquote>\n<ul><li>공포 → 생리적 변화 → 행동 반응(<strong>공격<\/strong> 또는 <strong>도피<\/strong>)<\/li><li>이 선천적 공포 반응의 별칭 = <strong>fight-or-flight mechanism<\/strong> ⭐⭐⭐<\/li><li>⚠️ 전치사 3종: <code>referred <strong>to<\/strong> <strong>as<\/strong><\/code> / <code>embedded <strong>in<\/strong><\/code> (연습문제로 직접 출제) ⭐⭐⭐<\/li><li><code>mount an aggressive response<\/code> - 2강의 <code>mount<\/code>가 다시 등장 (⭐ 반복 2회)<\/li><\/ul>\n<blockquote><p>Whether in the face of an immediate danger or in anticipation of a future threat, fear manifests as a <strong>visceral reaction<\/strong>, propelling individuals into a state of <strong>heightened awareness and readiness for action<\/strong>.<\/p><\/blockquote>\n<ul><li>즉각적 위험이든 미래 위협의 예상이든, 공포는 <strong>본능적 반응<\/strong>으로 드러나 개인을 <strong>고조된 경계와 행동 준비 상태<\/strong>로 몰아넣는다<\/li><\/ul>\n<p><strong>③ 공포와 불안의 관계<\/strong> (40p.) ⭐⭐<\/p>\n<blockquote><ol><li>Fear is closely related to the emotion of <strong>anxiety<\/strong>, which arises frequently from <strong>future threats perceived as uncontrollable or inevitable<\/strong>.<\/li><\/ol><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">공포(fear)   ← 지금 여기의 위험·위협을 인지한 반응\n불안(anxiety) ← 통제 불가·불가피하다고 인식되는 \"미래\" 위협에서 자주 발생<\/code><\/pre>\n<p><strong>④ 진화적 의의<\/strong> ⭐⭐⭐<\/p>\n<blockquote><p>The fear response <strong>plays a crucial role in survival<\/strong> by <strong>eliciting suitable behavioral reactions<\/strong>, and so this mechanism <strong>has been preserved over the course of evolution<\/strong>.<\/p><\/blockquote>\n<ul><li>공포 반응의 진화적 목적 = <strong>생존에 적합한 행동 반응을 끌어내는 것<\/strong> → 그래서 진화 과정에서 보존되었다<\/li><li>⚠️ \"사회적 행동을 보장하려고\"나 \"불필요한 감정을 억제하려고\"가 아니다<\/li><\/ul>\n<p><strong>⑤ 공포를 좌우하는 두 요인<\/strong> ⭐⭐⭐<\/p>\n<blockquote><p>Individuals' fears are <strong>not only influenced by their inherent nature<\/strong> but are also <strong>molded by their social relations and culture<\/strong>. These factors <strong>affect<\/strong> when and to what extent they should experience fear.<\/p><\/blockquote>\n<pre class=\"cb\"><code class=\"lang-text\">공포의 결정 요인 ① 타고난 본성(inherent nature)\n                ② 사회적 관계와 문화(social relations and culture)<\/code><\/pre>\n<ul><li>⚠️ 식습관(dietary preferences)·학력(educational background)은 <strong>본문에 없다<\/strong> - 오답 미끼<\/li><\/ul>\n<h4>2. 어휘·어법 노트 (강의록 원문)<\/h4>\n<p><strong>perceive<\/strong> - 인지하다 / ~로 여기다<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">He perceives himself to be a failure, though nothing could be further from the truth.\nShe perceives me as some sort of tyrant.\nHow do you perceive your new role?\nNew technology was perceived to be a threat to employment.\nI perceived a note of unhappiness in her voice.\nPerceiving that he wasn't happy with the arrangements, I tried to book a different hotel.<\/code><\/pre>\n<p><strong>embed<\/strong><\/p>\n<pre class=\"cb\"><code class=\"lang-text\">The artist decided to embed small, intricate details within the painting.\nThe journalist sought to embed the key quotes seamlessly into the article.\nThe archaeologist discovered a relic with symbols embedded in the ancient stone, offering valuable insights into the civilization's culture.<\/code><\/pre>\n<p><strong>affect<\/strong> - 다의어 ⚠️ 마지막 용법 주의<\/p>\n<pre class=\"cb\"><code class=\"lang-text\">Both buildings were badly affected by the fire.        (영향을 미치다)\nThe disease only affects cattle.                        (영향을 미치다)\nI was deeply affected by the film.                      (감동시키다)\nTo all his problems she affected indifference.          (~인 척하다·가장하다) ← 함정<\/code><\/pre>\n<ul><li>ℹ️ 참고(강의 밖): <code>affect<\/code>(동사, 영향을 주다) vs <code>effect<\/code>(명사, 효과) 혼동에 주의<\/li><\/ul>\n<h4>3. 어휘연습 (강의원문)<\/h4>\n<ol><li>괄호 안에 공통으로 들어갈 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.) → <strong>affect(ed)<\/strong><\/li><\/ol>\n<ul><li>Both buildings were badly ( ) by the fire.<\/li><li>The disease only ( ) cattle.<\/li><li>I was deeply ( ) by the film.<\/li><\/ul>\n<h4>4. 연습문제 (강의록 원문)<\/h4>\n<ol><li>다음 문장에서 문법적으로 옳지 <strong>않은<\/strong> 부분을 찾아 바르게 고치시오.<\/li><\/ol>\n<ul><li>Fear is an intensely unpleasant emotion in response to <strong>perceive<\/strong> a danger or threat.<\/li><li>→ <strong>perceiving<\/strong> (<code>in response to<\/code>의 to는 전치사 → 동명사)<\/li><\/ul>\n<ol><li>괄호 안에 필요한 전치사를 차례대로 적으시오.<\/li><\/ol>\n<ul><li>The innate fear response, often referred ( ) ( ) the fight-or-flight mechanism, is deeply embedded ( ) the human experience.<\/li><li>→ <strong>to / as / in<\/strong><\/li><\/ul>\n<ol><li>괄호 안에 필요한 동사를 알맞은 형태로 바꾸어 적으시오.<\/li><\/ol>\n<ul><li>The fear response ( ) a crucial role in survival by eliciting suitable behavioral reactions.<\/li><li>→ <strong>plays<\/strong><\/li><\/ul>\n<ol><li>What purpose does the fear response serve in terms of evolution?<\/li><\/ol>\n<p>A) It has no significant role. B) To ensure proper social behavior. <strong>C) To elicit suitable behavioral reactions for survival.<\/strong> D) To suppress unnecessary emotions.<\/p>\n<ol><li>Choose <strong>the two factors<\/strong> that influence the experience of fear in individuals.<\/li><\/ol>\n<p><strong>A) Inherent nature<\/strong> B) Their dietary preferences <strong>C) Their social relations and culture<\/strong> D) Their educational background<\/p>\n<h4>5. 어휘 복습을 위한 읽기 (강의록 원문)<\/h4>\n<blockquote><p>Sarah could <strong>perceive<\/strong> a subtle change in her surroundings, as if something new had been <strong>embedded<\/strong> in her daily routine. This shift seemed to <strong>affect<\/strong> her mood, leaving her more contemplative than usual. As she reflected, she realized that change was <strong>inevitable<\/strong> and embraced it with curiosity rather than fear. The idea that life was constantly evolving brought her a sense of freedom and opportunity. Sarah decided to approach each day with an open mind, ready to embrace whatever the future held.<\/p><\/blockquote>\n<ul><li>핵심어 4개(perceive / embed / affect / inevitable)가 한 단락에 모두 들어 있다 📌<\/li><\/ul>"}, {"title": "핵심 정리", "html": "<blockquote><p>📌 <strong>정의 문장이 곧 어법 문제<\/strong> - \"Fear is an intensely unpleasant emotion <strong>in response to perceiving<\/strong>…\" <code>in response to<\/code>의 to는 to부정사가 아니라 <strong>전치사<\/strong>다. 그래서 뒤에 <code>-ing<\/code>가 온다. 이 한 문장이 정의 문항과 어법 문항 양쪽으로 쓰인다 ⭐⭐⭐<\/p>\n<p>📌 <strong>fight-or-flight 세트<\/strong> - 선천적(innate) 공포 반응 → 별칭 <strong>투쟁-도피 기제<\/strong> → 인간 경험에 <strong>깊이 박혀(embedded in)<\/strong> 있다. 전치사 <code>referred to as<\/code> / <code>embedded in<\/code>이 그대로 빈칸이 된다.<\/p>\n<p>📌 <strong>fear ↔ anxiety<\/strong> - 공포는 <strong>지금의 위험 인지<\/strong>에 대한 반응, 불안은 <strong>통제 불가·불가피한 미래 위협<\/strong>에서 온다. 시점(현재 vs 미래)으로 갈라 두면 서로 바꿔 낸 보기를 잡는다.<\/p>\n<p>📌 <strong>진화적 답은 언제나 \"생존\"<\/strong> - 공포 반응이 보존된 이유는 <strong>생존에 적합한 행동 반응을 끌어내기<\/strong> 때문. \"사회적 행동 보장\" \"감정 억제\"는 모두 오답.<\/p>\n<p>📌 <strong>두 요인은 반드시 짝으로<\/strong> - ① 타고난 본성 ② 사회적 관계와 문화. <code>not only A but also B<\/code> 구문이 정답 근거이며, 식습관·학력은 본문에 없다.<\/p><\/blockquote>"}, {"title": "시험 대비 포인트", "html": "<ul><li>⭐⭐⭐ <code>in response to perceiving<\/code> - 전치사 to + 동명사 (틀린 형태 고치기)<\/li><li>⭐⭐⭐ <code>referred to as<\/code> / <code>embedded in<\/code> 전치사 채우기<\/li><li>⭐⭐⭐ 공포 반응의 진화적 목적 = 생존에 적합한 행동 반응 유도<\/li><li>⭐⭐⭐ 공포에 영향을 주는 두 요인 = 타고난 본성 + 사회적 관계와 문화<\/li><li>⭐⭐ 공포의 정의 (위험·위협 인지에 대한 강렬하게 불쾌한 감정)<\/li><li>⭐⭐ 선천적 공포 반응의 별칭 = fight-or-flight mechanism<\/li><li>⭐⭐ fear와 anxiety의 차이 (현재 위험 vs 미래 위협)<\/li><li>⭐⭐ <code>affect<\/code>의 다의어 - 특히 \"~인 척하다\"(affected indifference)<\/li><li>⭐ 공포의 행동 반응 두 갈래 = 공격(aggressive response) / 도피(fleeing)<\/li><li>⭐ <code>perceive A as B<\/code> / <code>perceive A to be B<\/code> 문형<\/li><\/ul>"}], "terms": [{"t": "<strong>fear<\/strong>", "d": "위험이나 위협을 <strong>인지·인식하는 데 대한 반응<\/strong>으로 나타나는 <strong>강렬하게 불쾌한 감정<\/strong>"}, {"t": "<strong>perceive<\/strong>", "d": "<strong>인지하다, 지각하다, ~로 여기다<\/strong>"}, {"t": "<strong>physiological changes<\/strong>", "d": "<strong>생리적 변화<\/strong>"}, {"t": "<strong>fight-or-flight mechanism<\/strong>", "d": "<strong>투쟁-도피 기제<\/strong>. 선천적 공포 반응의 다른 이름"}, {"t": "<strong>innate<\/strong>", "d": "<strong>선천적인, 타고난<\/strong>"}, {"t": "<strong>embed<\/strong>", "d": "<strong>깊이 박아 넣다, 끼워 넣다<\/strong>"}, {"t": "<strong>visceral reaction<\/strong>", "d": "<strong>본능적(내장에서 우러나는) 반응<\/strong>"}, {"t": "<strong>heightened awarenes
