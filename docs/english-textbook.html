    <script type="application/json" id="textbook-data">{"units":[{"id":"01","title":"UNIT 01 · Virus","bookFile":"Unit01_Virus.md","workbookFile":"Workbook_Unit01_Virus.md","bookSource":"제공된 사진 9장(교재 3–11쪽)을 옮긴 문서입니다. 페이지와 줄바꿈 때문에 나뉜 단어·문장은 연결했습니다. 본문의 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 사진 1000009667.jpg–1000009670.jpg, 워크북 6–13쪽. 페이지 사이에 끊긴 문장을 연결했습니다. 빈칸은 `(     )`으로 표시하고, 문법 문제의 표시 부분은 번호와 굵은 글씨로 나타냈습니다. 본문과 해설은 교재 내용을 옮긴 것입니다.","paragraphs":[{"number":1,"english":"A virus is a submicroscopic infectious agent that replicates only inside the living cells of an organism. Viruses infect all life forms, from animals and plants to microorganisms. The study of viruses is called virology, which is a part of microbiology. Viruses consist of genetic materials surrounded by a protective coat of protein, so they are more difficult to kill than bacteria. In the case of a minor ailment induced by a viral infection, the optimal strategy is to allow the malady to progress naturally. It is crucial to recognize that antibiotics, designed to combat bacterial infections, lack efficacy against viral entities. Antibiotics do not kill viruses and the use of them just leads to antibiotic resistance.","korean":"바이러스는 유기체의 살아 있는 세포 내에서만 복제되는 초미세한 전염성 물질이다. 바이러스는 동물과 식물에서부터 미생물까지 모든 생명체를 감염시킨다. 바이러스 연구는 바이러스학이라고 하며, 이는 미생물학의 일부이다. 바이러스는 단백질 보호막으로 둘러싸인 유전 물질로 구성되어 있어 세균보다 죽이기가 더 어렵다. 바이러스 감염으로 인한 가벼운 질병의 경우, 질병이 자연스럽게 진행되도록 하는 것이 최선의 전략이다. 세균 감염과 싸우도록 고안된 항생제가 바이러스에 대해서는 효능이 부족하다는 것을 인식하는 것이 중요하다. 항생제는 바이러스를 죽이지 않으며 항생제를 사용하는 것은 항생제 내성으로 이어질 뿐이다."},{"number":2,"english":"Viruses spread in many ways. One transmission pathway is through disease-bearing organisms known as vectors: for example, viruses are often transmitted from plant to plant by insects that feed on plant sap, such as aphids; and viruses in animals can be carried by blood-sucking insects. Additionally, numerous viruses disperse through airborne particles generated by respiratory activities such as coughing and sneezing. This airborne transmission is observed in pathogens like influenza viruses, SARS-CoV-2, chickenpox, smallpox, and measles. HIV is one of several viruses transmitted through sexual contact and by exposure to infected blood.","korean":"바이러스는 다양한 방법으로 전파된다. 한 가지 전염 경로는 질병을 가진 유기체-매개체로 알려진-를 통해서인데, 예를 들어, 바이러스는 진딧물과 같은 식물 수액을 먹고 사는 곤충에 의해 종종 식물에서 식물로 전염되고 동물의 바이러스는 피를 빨아먹는 곤충에 의해 옮겨질 수 있다. 또한 기침이나 재채기와 같은 호흡기 활동으로 생성된 공기 중 입자를 통해 확산되는 바이러스도 많다. 이러한 공기 전염은 인플루엔자 바이러스, SARS-CoV-2, 수두, 천연두, 홍역과 같은 병원체에서 관찰된다. HIV는 성적 접촉, 그리고 감염된 혈액에 대한 노출을 통해 전염되는 몇몇 바이러스 중 하나이다."},{"number":3,"english":"The immune system is a network of biological systems that protects an organism from diseases. It detects and responds to a wide variety of pathogens, from viruses to parasitic worms, as well as cancer cells and objects such as wood splinters. The immune system employs layered defenses, increasing in specificity, to protect the host from infections. Physical barriers prevent pathogens such as bacteria and viruses from entering the organism. If a pathogen breaches these barriers, the innate immune system provides an immediate, but non-specific response. In instances where pathogens effectively elude the innate immune response, vertebrates employ a secondary line of defense known as the adaptive immune system. Here, the immune system adapts its response during an infection to improve its recognition of the pathogen. This improved response is then retained after the pathogen has been eliminated, in the form of an immunological memory, and allows the adaptive immune system to mount faster and stronger attacks each time this pathogen is encountered.","korean":"면역 체계는 유기체를 질병으로부터 보호하는 생물학적 시스템의 네트워크이다. 암세포나 나무 파편 같은 물체를 포함하여 바이러스부터 기생충에 이르기까지 매우 다양한 병원체를 감지하고 이에 대응한다. 면역 체계는 숙주를 감염으로부터 보호하기 위해, 특이성이 증가하는 계층적 방어 수단을 사용한다. 물리적 장벽은 세균 및 바이러스와 같은 병원체가 유기체에 침입하는 것을 방지한다. 만약 병원체가 이러한 장벽을 통과하면 선천적 면역 체계는 즉각적이지만 비특이적인 반응을 제공한다. 병원체가 선천적 면역 반응을 효과적으로 회피하는 경우, 척추동물은 적응 면역 체계라고 알려진 2차 방어선을 사용한다. 여기에서 면역 체계는 병원체에 대한 인식을 개선하기 위해 감염 중 반응을 조정한다. 이렇게 개선된 반응은 병원체가 제거된 후에도 면역학적 기억의 형태로 유지되어, 이 병원체를 만날 때마다 적응 면역 체계가 더 빠르고 강력한 공격을 가할 수 있도록 한다."},{"number":4,"english":"A vaccine is a preparation that is used to stimulate the body’s immune response against diseases. The safety and efficacy of vaccines have undergone extensive scrutiny and validation. Typically, a vaccine comprises an agent that resembles a pathogenic microorganism and is derived from attenuated or inactivated forms of the microbe, its toxins, or one of its surface proteins. This agent serves to elicit a response from the body’s immune system, facilitating its recognition, destruction, and the development of immunological memory to guard against the perceived threat. Vaccination is considered as the most effective means of preventing infectious diseases.","korean":"백신은 질병에 대한 인체의 면역 반응을 촉진하기 위해 사용되는 제제이다. 백신의 안전성과 효능은 광범위한 정밀 조사와 검증을 거쳤다. 일반적으로 백신은 병원성 미생물과 유사하고 약화된 혹은 비활성화된 형태의 미생물, 독소, 혹은 표면 단백질 중 하나로부터 유래된 물질을 포함한다. 이 물질은 인체의 면역 체계로부터 반응을 이끌어내어 병원체를 인식하고 파괴하는 것을 용이하게 하며, 또한 면역학적 기억력 발달을 촉진하여 인지된 위협에 대비한다. 예방 접종은 전염병을 예방하는 가장 효과적인 수단으로 간주된다."}],"vocabulary":[{"number":1,"word":"submicroscopic","meaning":"극미의, 초현미경적인"},{"number":2,"word":"infectious","meaning":"전염성의"},{"number":3,"word":"replicate","meaning":"복제하다"},{"number":4,"word":"microorganism","meaning":"미생물"},{"number":5,"word":"microbiology","meaning":"미생물학"},{"number":6,"word":"consist of~","meaning":"~으로 구성되다"},{"number":7,"word":"ailment","meaning":"병 [a physical disorder or illness, especially of a minor or chronic nature]"},{"number":8,"word":"induce","meaning":"유발하다"},{"number":9,"word":"optimal","meaning":"최선의"},{"number":10,"word":"malady","meaning":"병 [any disorder or disease of the body, especially one that is chronic or deep-seated]"},{"number":11,"word":"antibiotic","meaning":"항생제, 항생 물질"},{"number":12,"word":"lead to~","meaning":"~로 이어지다"},{"number":13,"word":"antibiotic resistance","meaning":"항생제 내성"},{"number":14,"word":"transmission","meaning":"전염, 전파, 전달"},{"number":15,"word":"vector","meaning":"질병의 매개체"},{"number":16,"word":"transmit","meaning":"전송하다, 전염시키다"},{"number":17,"word":"feed on~","meaning":"~을 먹고 살다"},{"number":18,"word":"disperse","meaning":"퍼지다, 흩어지다"},{"number":19,"word":"airborne","meaning":"공기로 운반되는"},{"number":20,"word":"generate","meaning":"발생시키다, 만들어내다"},{"number":21,"word":"respiratory","meaning":"호흡의, 호흡 기관의"},{"number":22,"word":"observe","meaning":"관찰하다"},{"number":23,"word":"pathogen","meaning":"병원균, 병원체"},{"number":24,"word":"SARS-CoV-2 (Severe Acute Respiratory Syndrome Coronavirus 2)","meaning":"제2형중증급성호흡기증후군 코로나바이러스"},{"number":25,"word":"HIV (Human Immunodeficiency Virus)","meaning":"인간면역결핍바이러스"},{"number":26,"word":"exposure","meaning":"노출"},{"number":27,"word":"immune system","meaning":"면역 체계"},{"number":28,"word":"detect","meaning":"감지하다"},{"number":29,"word":"parasitic","meaning":"기생적인, 기생 생물의, 기생충에 의한"},{"number":30,"word":"splinter","meaning":"파편, 깨진 조각, 가시"},{"number":31,"word":"layered","meaning":"층을 이룬"},{"number":32,"word":"breach","meaning":"돌파하다, 위반하다"},{"number":33,"word":"elude","meaning":"피하다"},{"number":34,"word":"vertebrate","meaning":"척추동물"},{"number":35,"word":"eliminate","meaning":"제거하다"},{"number":36,"word":"immunological","meaning":"면역학의"},{"number":37,"word":"mount","meaning":"(공격 등을) 개시하다"},{"number":38,"word":"each time","meaning":"~할 때마다 매번"},{"number":39,"word":"encounter","meaning":"우연히 만나다"},{"number":40,"word":"preparation","meaning":"(약품, 식품 등의) 조제품, 조합제, 조합약"},{"number":41,"word":"extensive","meaning":"광범위한, 방대한"},{"number":42,"word":"scrutiny","meaning":"정밀한 조사, 검증"},{"number":43,"word":"validation","meaning":"검증, 타당성, 타당성 확인"},{"number":44,"word":"attenuate","meaning":"약하게 하다, 묽어지게 하다"},{"number":45,"word":"microbe","meaning":"미생물, 병원균, 세균"},{"number":46,"word":"toxin","meaning":"독소, 독성 물질"},{"number":47,"word":"elicit","meaning":"끌어내다"}],"verbs":[{"title":"1. lack","examples":[{"english":"She totally lacks a sense of humor.","korean":"그녀는 유머 감각이 전혀 없다."},{"english":"The proposal lacked detailed data.","korean":"제안서는 구체적인 데이터가 부족했다."}],"checks":"<ul><li>lack 동사가 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"2. disperse","examples":[{"english":"Pollen grains disperse far and wide.","korean":"꽃가루는 멀리 흩어진다."},{"english":"When the rain came down, the crowds started to disperse.","korean":"비가 내리자 군중은 흩어지기 시작했다."},{"english":"Police dispersed the crowd that had gathered.","korean":"경찰은 모여 있던 군중을 해산시켰다."},{"english":"The fragrance from the blooming flowers dispersed throughout the garden.","korean":"개화한 꽃에서 나는 향기가 정원 전체에 퍼져 나갔다."}],"checks":"<ul><li>disperse 동사가 자동사, 타동사로 모두 사용되었음을 확인한다.<\/li><li>자동사 disperse 동사의 주어로 pollen grains, crowd, fragrance 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"3. enter","examples":[{"english":"Please knock before you enter my office.","korean":"제 사무실에 들어오기 전에 노크해 주세요."},{"english":"To access the building, you must enter a security code into the keypad by the door.","korean":"건물에 들어가기 위해서는 문 옆의 키패드에 보안 코드를 입력해야 한다."},{"english":"Before you enter the country, you must declare any items of value at customs.","korean":"입국 전에 세관에 귀중품을 신고해야 한다."}],"checks":"<ul><li>enter 동사가 타동사로 사용되었음을 확인한다.<\/li><li>enter 동사의 목적어로 office, code, country 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"4. breach","examples":[{"english":"They breached the agreement they had made with their employer.","korean":"그들은 고용주와 한 합의를 위반했다."},{"english":"The hackers managed to breach the company’s cybersecurity defenses.","korean":"해커들은 회사의 사이버 보안망을 뚫는 데 성공했다."},{"english":"The floodwaters continued to rise, threatening to breach the levee and inundate the nearby homes.","korean":"홍수로 물이 계속 불어나면서 제방이 무너져 주변의 가옥들이 침수될 위기에 처했다."}],"checks":"<ul><li>breach 동사의 목적어로 agreement, defenses, levee 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"5. allow","examples":[{"english":"Do you think Dad will allow you to go to Jamie’s party?","korean":"아빠가 네가 제이미의 파티에 가도록 허락해줄 것 같아?"},{"english":"You’re not allowed to talk during the exam.","korean":"시험 중에는 말하는 것이 허용되지 않는다."},{"english":"Pets aren’t allowed in this hotel.","korean":"이 호텔에서는 반려동물의 출입이 허용되지 않는다."},{"english":"Smoking is not allowed in this restaurant.","korean":"이 레스토랑에서는 흡연이 허용되지 않는다."},{"english":"He didn’t allow us enough time to finish the test.","korean":"그는 시험을 끝내기에 충분한 시간을 우리에게 허락하지 않았다."}],"checks":"<ul><li>allow 동사가 3형식, 4형식, 5형식 문장에서 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"6. mount","examples":[{"english":"The children’s excitement is mounting as Christmas gets nearer.","korean":"크리스마스가 가까워지면서 어린이들의 흥분이 증가하고 있다."},{"english":"She mounted her horse and rode off.","korean":"그녀는 말에 올라타 가 버렸다."},{"english":"The army prepared to mount an attack on the enemy stronghold.","korean":"군대는 적의 요새에 대한 공격을 시작할 준비를 하였다."},{"english":"The art gallery is ready to mount an exhibition of contemporary sculptures next week.","korean":"미술관은 다음 주에 현대 조각품 전시를 개최할 준비가 되었다."}],"checks":"<ul><li>mount 동사가 자동사, 타동사로 사용되었음을 확인한다.<\/li><li>mount 동사의 목적어로 horse, attack, exhibition이 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"7. comprise","examples":[{"english":"The book comprises ten chapters.","korean":"그 책은 열 개의 장으로 구성되어 있다."},{"english":"The national park comprises several hiking trails, offering diverse scenic views.","korean":"국립 공원에는 하이킹 코스가 여러 개 포함되어 있어 다양한 경치를 제공한다."},{"english":"The committee is comprised of experts from different fields, ensuring a comprehensive perspective.","korean":"위원회는 여러 분야의 전문가로 구성되어 포괄적 시각을 확보한다."}],"checks":"<ul><li>comprise 동사가 타동사로 사용되었음을 확인한다.<\/li><li>‘comprise~’와 ‘be comprised of~’가 같은 의미를 지닌다.<\/li><li>같은 의미를 지니는 다른 표현으로는 ‘consist of~’, ‘be made up of~’ 등이 있다.<\/li><\/ul>"}],"vocabularyExercises":[{"number":1,"prompt":"<p>괄호 안에 알맞은 동사를 채워 넣으시오. (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>She totally (     ) a sense of humor. (그녀는 유머 감각이 전혀 없다.)<\/li><li>They (     ) the agreement they had made with their employer. (그들은 고용주와 한 합의를 위반했다.)<\/li><\/ul>","explanation":""},{"number":2,"prompt":"<p>괄호 안에 공통으로 들어가 문장을 자연스럽게 완성시킬 수 있는 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>Pollen grains (     ) far and wide.<\/li><li>When the rain came down, the crowds started to (     ).<\/li><li>Police (     ) the crowd that had gathered.<\/li><li>The fragrance from the blooming flowers (     ) throughout the garden.<\/li><\/ul>","explanation":""},{"number":3,"prompt":"<p>allow 동사를 사용하여 3형식, 4형식, 5형식 문장을 하나씩 만들어 보시오.<\/p>","explanation":""},{"number":4,"prompt":"<p>괄호 안에 적절한 동사는 무엇인가?<\/p><p>The army prepared to (     ) an attack on the enemy stronghold. (군대는 적의 요새에 대한 공격을 시작할 준비를 하였다.)<\/p>","explanation":""},{"number":5,"prompt":"<p>comprise와 같은 의미를 지니는 표현을 두 개 적어 보시오.<\/p>","explanation":""}],"exercises":[{"number":1,"prompt":"<p>What is the field of study that focuses on viruses called?<\/p><ul><li>A) Bacteriology<\/li><li>B) Virology<\/li><li>C) Microbiology<\/li><li>D) Pathology<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":2,"prompt":"<p>In the case of a minor ailment induced by a viral infection, what is the best strategy?<\/p><ul><li>A) Take antibiotics.<\/li><li>B) Do not drink water.<\/li><li>C) Study genetic disease.<\/li><li>D) Allow the malady to progress naturally.<\/li><\/ul>","explanation":"<p>항생제는 세균 감염을 치료하는 것이기에 바이러스 감염에 의한 질병에 항생제를 복용할 경우 효과가 없고 오히려 항생제 내성을 키운다는 것, 바이러스성 질병의 경우에는 자연스럽게 질병이 진행되도록 놔두는 것이 최고의 방책이라는 것이 본문의 내용입니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":3,"prompt":"<p>Which of the following is NOT a method of virus transmission mentioned in the text?<\/p><ul><li>A) Through vectors like insects that feed on plant sap<\/li><li>B) Through purified water sources<\/li><li>C) Through airborne particles from coughing and sneezing<\/li><li>D) Through sexual contact and exposure to infected blood<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":4,"prompt":"<p>괄호 안에 알맞은 전치사는 무엇인가?<\/p><p>Viruses spread (     ) many ways.<\/p>","explanation":"","answer":{"answer":"in","evidence":"교재 수록 정답표"}},{"number":5,"prompt":"<p>밑줄 친 ①~④에서 문법적으로 옳지 않은 부분을 찾아 바르게 고치시오.<\/p><p>Viruses ①<strong>are often<\/strong> ②<strong>transmitted<\/strong> from plant to plant by insects ③<strong>that<\/strong> ④<strong>feeds<\/strong> on plant sap, such as aphids.<\/p>","explanation":"<p>위 문장에서 that은 관계대명사로 사용되었습니다. 관계대명사 that은 주어로 사용되고 있으며 선행사는 insects입니다. 관계대명사로 연결되기 전 두 문장은 ‘Viruses are often transmitted from plant to plant by insects.’, ‘Insects feed on plant sap, such as aphids.’입니다. 즉 관계대명사 that의 주어는 insects(복수)이기에 동사는 feed가 되어야 합니다.<\/p>","answer":{"answer":"④ feeds → feed","evidence":"교재 수록 정답표"}},{"number":6,"prompt":"<p>What is the primary function of the immune system?<\/p><ul><li>A) To regulate body temperature<\/li><li>B) To protect the organism from diseases<\/li><li>C) To assist in the digestion of food<\/li><li>D) To produce blood cells<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":7,"prompt":"<p>Which of the following is NOT listed as a pathogen the immune system protects against?<\/p><ul><li>A) Bacteria<\/li><li>B) Viruses<\/li><li>C) Parasitic worms<\/li><li>D) Beneficial bacteria<\/li><\/ul>","explanation":"<p>beneficial의 의미를 알면 쉽게 풀 수 있는 문제입니다. beneficial은 ‘이로운’, ‘유익한’이라는 의미를 지닙니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":8,"prompt":"<p>What is the role of the adaptive immune system?<\/p><ul><li>A) To provide an immediate, non-specific response to pathogens<\/li><li>B) To prevent pathogens from entering the organism<\/li><li>C) To adapt its response to improve recognition of a pathogen during an infection<\/li><li>D) To regulate the body’s temperature in response to an infection<\/li><\/ul>","explanation":"<p>본문에서는 면역 체계를 세 단계-물리적 장벽, 선천적 면역 체계, 적응 면역 체계-로 설명합니다. 적응 면역 체계는 병원체를 기억하고 병원체가 이후 다시 침입할 때 빠르고 강력하게 공격을 개시할 수 있게 한다고 했으므로 정답은 C입니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":9,"prompt":"<p>What is the purpose of a vaccine?<\/p><ul><li>A) To weaken the body’s immune system<\/li><li>B) To stimulate the body’s immune response against diseases<\/li><li>C) To serve as a treatment for ongoing infections<\/li><li>D) To identify and remove toxins from the body<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":10,"prompt":"<p>Which of the following is true?<\/p><ul><li>A) Vaccines often contain harmful microorganisms that can cause diseases.<\/li><li>B) The efficacy and safety of vaccines are rarely scrutinized or validated.<\/li><li>C) Vaccines work by suppressing the immune system’s response to pathogens.<\/li><li>D) Vaccination is considered the most effective method of preventing infectious diseases.<\/li><\/ul>","explanation":"<p>백신은 병원체를 닮은 물질을 포함하기에 질병을 일으키는 해로운 물질을 포함한다는 A는 답이 아닙니다. 백신의 유효성과 안전성은 정밀하고도 광범위한 검사를 거친다고 했으므로 B 역시 틀린 진술입니다. C는 백신이 면역 반응을 억압한다는 의미이므로 답이 될 수 없고, 정답은 ‘백신이 전염성 질병을 예방하는 가장 효과적인 방법이다’라고 한 D입니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}}],"answerNote":"","confirmedAnswers":10},{"id":"02","title":"UNIT 02 · Ancient Egypt","bookFile":"Unit02_Ancient_Egypt.md","workbookFile":"Workbook_Unit02_Ancient_Egypt.md","bookSource":"제공된 사진 11장(교재 13–23쪽)을 옮긴 문서입니다. 페이지와 줄바꿈 때문에 나뉜 단어·문장은 연결했습니다. 본문의 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 사진 1000009671.jpg–1000009676.jpg, 워크북 14–24쪽. 페이지 사이에 끊긴 문장을 연결했습니다. 빈칸은 `(     )`으로 표시했습니다. 마지막 사진의 정답표는 아래쪽이 잘려 있어 확인 가능한 부분과 해설에 명시된 정답만 옮겼습니다. 본문과 해설은 교재 내용을 옮긴 것입니다.","paragraphs":[{"number":1,"english":"Ancient Egypt was an impressive civilization that arose around 3100 B.C.E. It remained a major power in North Africa and nearby regions until the Macedonians took over in 332 B.C.E. The civilization thrived mostly because it made the most of the Nile River’s flood patterns for farming. The predictable flooding and controlled irrigation of the fertile valley produced surplus crops, which allowed the population to grow and society to become more complex. By successfully managing their environment and resources, the Egyptians established a culture rich in art, knowledge, and architecture that would influence the world for centuries to come.","korean":"고대 이집트는 기원전 3100년경에 일어난 인상적인 문명이었다. 기원전 332년에 마케도니아인들이 장악할 때까지 고대 이집트는 북아프리카와 인근 지역의 주요 강국으로 남아 있었다. 이 문명은 주로 나일강의 홍수 패턴을 농업에 최대한 활용했기 때문에 번성했다. 예측 가능한 홍수와 비옥한 계곡의 통제된 관개로 인해 잉여 농작물이 생산되었고, 이로 인해 인구가 증가하고 사회는 더욱 복잡해질 수 있었다. 이집트인들은 환경과 자원을 성공적으로 관리함으로써 예술, 지식, 그리고 건축에서 풍성한 문화를 확립했으며 이는 이후 수 세기 동안 세계에 영향을 미치게 되었다."},{"number":2,"english":"In ancient Egypt, the majority of the population was made up of farmers. Their houses were built from mudbrick with designs optimized to provide relief from the intense daytime heat. The staple diet consisted of bread and beer, supplemented with vegetables such as onions and garlic, and fruit such as dates and figs. Hygiene and personal grooming were of significant importance to the ancient Egyptians. Their hygiene system was complex, encompassing bathing, shaving, dental care, and more. Many bathed in the Nile River, employing a homemade paste for soap composed of animal fat and chalk. Body shaving was a common practice and perfumes and scented oils were used to mask unpleasant smells and to calm irritated skin. Music and dance were popular entertainments. Early on, the musical scene was dominated by flutes and harps. As time went on, other instruments resembling trumpets, oboes, and various types of pipes were introduced and gained popularity.","korean":"고대 이집트에서는 인구의 대부분이 농부로 구성되어 있었다. 그들의 집은 극심한 낮의 열기로부터 안식을 제공할 수 있도록 최적화된 디자인을 갖췄고, 진흙 벽돌로 지어졌다. 주식은 빵과 맥주로 이루어졌으며, 양파, 마늘과 같은 채소와 대추, 무화과 같은 과일이 곁들여졌다. 위생과 개인적인 몸단장은 고대 이집트인들에게 매우 중요했다. 그들의 위생 시스템은 복잡했고 목욕, 면도, 치아 관리 등이 포함되었다. 많은 사람이 나일강에서 목욕했고, 동물성 지방과 백악질로 구성된 수제 반죽을 비누로 사용했다. 몸을 면도하는 것은 일반적인 관행이었고 향수와 향 오일은 불쾌한 냄새를 가리고 염증이 난 피부를 진정시키기 위해 사용되었다. 음악과 춤은 대중적인 오락이었다. 초기에는 플루트와 하프가 음악계를 지배했다. 시간이 지남에 따라 트럼펫, 오보에 및 다양한 종류의 파이프를 닮은 다른 악기들이 소개되고 인기를 얻었다."},{"number":3,"english":"The architecture of ancient Egypt includes some of the most famous structures in the world: the Great Pyramids of Giza and the temples at Thebes. Building projects were organized and funded by the state not only for religious and commemorative purposes, but also to reinforce the wide-ranging power of the pharaoh. These massive stone structures were believed to safeguard the physical and spiritual essence of the pharaohs. The ka, which is a vital aspect of the pharaoh’s soul, was thought to dwell alongside their mummified forms. The meticulous preservation of the pharaoh’s body was crucial for enabling the departed ruler to adhere to his responsibilities in the afterlife as the monarch of the deceased. In the ethos of Ancient Egypt, death on the earth was the start of a journey to the next world.","korean":"고대 이집트의 건축물에는 기자의 피라미드와 테베에 있는 사원들 등 세계에서 가장 유명한 건축물들이 포함되어 있다. 국가는 종교적이고 기념적인 목적을 위해서뿐 아니라 파라오의 광범위한 권력을 강화하기 위해서 건축 프로젝트를 조직하고 자금을 지원했다. 이 거대한 석조 건축물들은 파라오의 육체적, 정신적 본질을 수호하는 것으로 여겨졌다. 파라오의 영혼에서 매우 중요한 요소인 카는, 미라의 형태를 띤 파라오와 함께 거하고 있는 것으로 여겨졌다. 파라오의 시신을 세심하게 보존하는 것은 죽은 통치자가 사후 세계에서 죽은 자들의 군주로 책임을 다할 수 있도록 하는 데 중요했다. 고대 이집트의 기풍에서 이승에서의 죽음은 다음 세계로 향하는 여행의 시작이었다."},{"number":4,"english":"The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, playing a pivotal role within the fabric of its society. The pantheon comprised approximately 1,500 divinities, each commanding reverence and worship. The pharaoh occupied a distinct position, bridging the mundane and the divine, participating in the divine realm, and constructed great, religiously motivated funerary monuments for his afterlife. Pharaohs were obligated to retain the benevolence of the gods through rituals and offerings so that they could maintain Ma’at, the order of the cosmos, and repel Isfet, which was chaos. Notable for their diverse representations, Egyptian deities assumed various forms, including those of animals or composite beings with an animal’s head atop a human frame.","korean":"고대 이집트의 종교는 다신교 교리와 의식 활동의 복잡한 네트워크였으며, 그 사회의 구조 내에서 중추적인 역할을 했다. 신전에는 1,500여 개의 신이 있었고 그 각각은 경배와 숭배를 명했다. 파라오는 신의 영역에 참여함으로써 세속과 신성을 연결하는 독특한 위치를 가졌고, 자신의 내세를 위해 종교적 동기를 지닌 거대한 장례 기념물을 건설했다. 파라오는 우주의 질서인 마아트를 유지하고 혼돈인 이스페트를 물리치기 위해, 의식과 제물을 통해 신들의 자비를 유지해야 할 의무가 있었다. 다채로운 모습으로 유명한 이집트의 신들은 다양한 형상을 취했는데 이중에는 동물의 형상, 혹은 인간의 몸에 동물의 머리를 한 복합적인 존재도 포함되어 있었다."}],"vocabulary":[{"number":1,"word":"arise","meaning":"생기다, 일어나다, 발생하다"},{"number":2,"word":"take over","meaning":"탈취하다, 장악하다"},{"number":3,"word":"thrive","meaning":"번창하다"},{"number":4,"word":"make the most of~","meaning":"~을 최대한 활용하다"},{"number":5,"word":"irrigation","meaning":"관개"},{"number":6,"word":"fertile","meaning":"비옥한, 다산의"},{"number":7,"word":"be made up of~","meaning":"~로 구성되다"},{"number":8,"word":"mudbrick","meaning":"진흙 벽돌"},{"number":9,"word":"optimize","meaning":"최적화하다"},{"number":10,"word":"supplement","meaning":"보완하다, 채우다"},{"number":11,"word":"date","meaning":"대추야자(의 열매)"},{"number":12,"word":"hygiene","meaning":"위생, 보건"},{"number":13,"word":"grooming","meaning":"차림새, 몸단장"},{"number":14,"word":"encompass","meaning":"포함하다, 망라하다, 둘러싸다"},{"number":15,"word":"composed of~","meaning":"~으로 구성된"},{"number":16,"word":"chalk","meaning":"백악(백색 연토질 석회암), 분필"},{"number":17,"word":"scented","meaning":"향기로운"},{"number":18,"word":"calm","meaning":"진정시키다, 가라앉히다"},{"number":19,"word":"irritated","meaning":"염증을 일으킨, 따끔따끔한, 벌겋게 된, 안달이 난"},{"number":20,"word":"early on","meaning":"초기에, 처음에"},{"number":21,"word":"dominate","meaning":"~의 가장 두드러진 특징이 되다, 지배하다"},{"number":22,"word":"architecture","meaning":"건축(학), 건축 양식"},{"number":23,"word":"reinforce","meaning":"보강하다, 강화하다"},{"number":24,"word":"wide-ranging","meaning":"광범위한"},{"number":25,"word":"massive","meaning":"거대한"},{"number":26,"word":"safeguard","meaning":"지키다"},{"number":27,"word":"vital","meaning":"생명과 관련된, 필수적인, 치명적인, 생기 넘치는"},{"number":28,"word":"dwell","meaning":"거주하다"},{"number":29,"word":"alongside","meaning":"~의 곁에, ~와 나란히"},{"number":30,"word":"meticulous","meaning":"꼼꼼한, 세심한"},{"number":31,"word":"preservation","meaning":"보존"},{"number":32,"word":"crucial","meaning":"중대한, 결정적인"},{"number":33,"word":"adhere to~","meaning":"~을 고수하다, 충실히 지키다"},{"number":34,"word":"afterlife","meaning":"내세"},{"number":35,"word":"monarch","meaning":"군주"},{"number":36,"word":"deceased","meaning":"죽은 사람들, 사망한"},{"number":37,"word":"ethos","meaning":"기풍, 풍조"},{"number":38,"word":"intricate","meaning":"복잡한, 뒤얽힌"},{"number":39,"word":"polytheistic","meaning":"다신론의, 다신교의 (cf. monotheistic: 일신교의)"},{"number":40,"word":"pivotal","meaning":"중추적인, 중요한"},{"number":41,"word":"play a role","meaning":"역할을 하다"},{"number":42,"word":"fabric","meaning":"구조, 직물"},{"number":43,"word":"pantheon","meaning":"(집합적) 신화의 신들, 판테온"},{"number":44,"word":"comprise","meaning":"~을 포함하다, ~으로 구성되다"},{"number":45,"word":"divinity","meaning":"신성, 신"},{"number":46,"word":"reverence","meaning":"숭배, 존경"},{"number":47,"word":"mundane","meaning":"속세의, 평범한"},{"number":48,"word":"participate in~","meaning":"~에 참여하다, 관여하다"},{"number":49,"word":"funerary","meaning":"장례식의, 매장의"},{"number":50,"word":"be obligated to~","meaning":"~할 의무가 있다"},{"number":51,"word":"retain","meaning":"유지하다, 보유하다"},{"number":52,"word":"benevolence","meaning":"자비심, 선의"},{"number":53,"word":"ritual","meaning":"의식"},{"number":54,"word":"offering","meaning":"공물, 제물"},{"number":55,"word":"repel","meaning":"쫓아버리다, 몰아내다"},{"number":56,"word":"chaos","meaning":"혼돈, 카오스"},{"number":57,"word":"composite","meaning":"합성의, 복합의"},{"number":58,"word":"atop","meaning":"~의 꼭대기에"}],"verbs":[{"title":"1. arise","examples":[{"english":"If the opportunity arises, I’d love to go to China.","korean":"기회가 생긴다면 나는 중국에 가고 싶다."},{"english":"Problems arise when the payment is late.","korean":"지불이 늦어지면 문제가 발생한다."},{"english":"He died of complications arising from heart surgery.","korean":"그는 심장 수술로 인한 합병증으로 사망했다."}],"checks":"<ul><li>arise 동사의 주어로 opportunity, problems, complications 등이 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"2. remain","examples":[{"english":"The doctor ordered him to remain in bed for a few days.","korean":"의사는 그에게 며칠 동안 침대에 있으라고 지시했다."},{"english":"Most commentators expect the basic rate of tax to remain at 25 percent.","korean":"대부분의 해설자들은 기본 세율이 25퍼센트에 머물 것으로 예상한다."},{"english":"A great many things remain to be done (= have not yet been done).","korean":"해야 할 일이 아직 많이 남아 있다."},{"english":"He remained silent.","korean":"그는 침묵을 지키고 있었다."},{"english":"It remains a secret.","korean":"그것은 비밀로 남아 있다."},{"english":"The bank will remain open while renovations are carried out.","korean":"은행은 보수가 진행되는 동안 계속 열려 있을 것이다."},{"english":"Only a few hundred of these animals remain today.","korean":"오늘날 이 동물들 중 몇 백 마리만 남아 있다."}],"checks":"<ul><li>remain 동사가 1형식과 2형식 문장에서 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"3. establish","examples":[{"english":"He helped to establish the University of California at Berkeley.","korean":"그는 버클리에 캘리포니아 대학을 설립하는 데 도움을 주었다."},{"english":"Once we establish the price, we can begin to market the product.","korean":"일단 가격을 정하면, 상품 광고를 시작할 수 있다."},{"english":"There is a strong need to establish effective communication links between parents, staff, pupils, and external bodies.","korean":"부모, 교직원, 학생 및 외부 기관 간에 효과적인 소통 링크를 수립하는 것이 매우 필요하다."},{"english":"His reputation for carelessness was established long before the latest problems arose.","korean":"그가 부주의하다는 평판은 최근의 문제가 발생하기 오래전에 이미 확고했다."}],"checks":"<ul><li>establish의 목적어로 university, price, communication links, reputation 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"4. supplement","examples":[{"english":"He supplements his income by working in a bar at night.","korean":"그는 밤에 바에서 일하면서 소득을 보충한다."},{"english":"Some vegetarians like to supplement their diets with iron.","korean":"일부 채식주의자들은 식사에 철분을 보충하고 싶어 한다."},{"english":"The new law was introduced to supplement the existing regulations, aiming to close loopholes and enhance enforcement.","korean":"기존 규정을 보충하기 위해 새로운 법이 도입되었으며, 이는 빠져나갈 틈을 차단하고 집행을 강화하기 위한 것이었다."}],"checks":"<ul><li>supplement의 목적어로 income, diets, regulations 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"5. calm","examples":[{"english":"The teacher’s gentle voice managed to calm the excited students within minutes.","korean":"선생님의 부드러운 목소리는 몇 분 안에 흥분한 학생들을 진정시켰다."},{"english":"The storm finally began to calm down after raging for hours.","korean":"몇 시간 동안 격렬했던 폭풍이 마침내 가라앉기 시작했다."}],"checks":"<ul><li>calm 동사가 자동사, 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"6. irritate","examples":[{"english":"Certain skincare products irritated her sensitive skin.","korean":"특정 스킨케어 제품이 그녀의 민감한 피부에 염증을 일으켰다."},{"english":"It irritates me when people are late without giving any notice.","korean":"사람들이 사전 통보 없이 늦게 오면 화가 난다."},{"english":"After a while, the noise began to irritate him.","korean":"잠시 후 그 소음은 그를 짜증나게 하기 시작했다."}],"checks":"<ul><li>irritate 동사가 어떤 맥락에서 사용되는지 확인한다.<\/li><\/ul>"},{"title":"7. dominate","examples":[{"english":"The cathedral dominates the landscape for miles around.","korean":"수 마일 내의 풍경에서 가장 두드러지는 것은 대성당이다."},{"english":"The dispute is likely to dominate the news.","korean":"그 분쟁은 가장 중요한 뉴스거리가 될 것이다."},{"english":"They work as a group - no one person is allowed to dominate.","korean":"그들은 단체로 일한다. 그 누구도 군림하는 것은 허락되지 않는다."}],"checks":"<ul><li>dominate 동사가 자동사, 타동사로 모두 사용되었음을 확인한다.<\/li><li>dominate 동사가 어떤 맥락에서 사용되는지 확인한다.<\/li><\/ul>"},{"title":"8. resemble","examples":[{"english":"As he grew older, he began to resemble his grandfather, not just in looks but also in his behaviors.","korean":"나이가 들어감에 따라 그는 외모뿐만 아니라 행동에서도 할아버지를 닮아 가기 시작했다."}],"checks":"<ul><li>resemble 동사가 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"9. introduce","examples":[{"english":"The company plans to introduce 45 new models over the next five years.","korean":"회사는 다음 5년 동안 45종의 새로운 모델을 내놓을 계획이다."},{"english":"We need to introduce more stringent security measures such as identity cards.","korean":"우리는 신분증과 같은 보다 엄격한 보안 조치를 도입해야 한다."},{"english":"I’d like to introduce my son.","korean":"제 아들을 소개하고 싶습니다."},{"english":"The director will introduce the film personally.","korean":"감독은 영화를 직접 소개할 것이다."},{"english":"In the workshop, we were introduced to the basics of digital photography by a professional photographer.","korean":"워크숍에서 우리는 전문 사진작가로부터 디지털 사진의 기초를 소개받았다."}],"checks":"<ul><li>introduce 동사가 사용되는 다양한 맥락을 살핀다.<\/li><\/ul>"},{"title":"10. organize","examples":[{"english":"Most British schools organize social events for the students.","korean":"대부분의 영국 학교들은 학생들을 위해 사교 행사를 개최한다."},{"english":"The books were organized on the shelves according to their size.","korean":"책들은 책장에 크기에 따라 정리되어 있었다."},{"english":"I am trying to organize my office so I can work more efficiently.","korean":"나는 더 효율적으로 일할 수 있도록 사무실을 정리하려고 노력하고 있다."},{"english":"They organized a car to pick me up at the airport.","korean":"그들은 공항에 나를 데리러 올 차를 준비했다."}],"checks":"<ul><li>organize의 목적어로 events, books, office, car 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"11. command","examples":[{"english":"The officer commanded his men to shoot.","korean":"장교는 병사들에게 총을 쏘라고 명령했다."},{"english":"He commanded that the troops (should) cross the water.","korean":"그는 부대가 물을 건널 것을 명했다."},{"english":"Colonel Sailing commands the Guards Regiment.","korean":"세일링 대령은 가드 군단을 지휘한다."},{"english":"The old castle commands a stunning view of the surrounding countryside.","korean":"그 고성에서는 주변의 멋진 전원 풍경이 잘 보인다."},{"english":"She commands respect from her peers.","korean":"그녀는 동료들로부터 존경을 받는다."}],"checks":"<ul><li>command 동사가 to 부정사, that 절과 함께 쓰였음을 확인한다.<\/li><li>command 동사의 목적어로 regiment, view, respect 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"12. occupy","examples":[{"english":"The programme will occupy that half-hour slot before the nine o’clock news.","korean":"이 프로그램은 9시 뉴스 전의 삼십 분 코너를 차지할 것이다."},{"english":"All physical objects occupy space.","korean":"모든 물리적 물체는 공간을 차지한다."},{"english":"Troops quickly occupied the city.","korean":"군대는 빠르게 그 도시를 점령했다."},{"english":"An increasing number of women occupy senior positions on Wall Street.","korean":"점점 더 많은 여성이 월스트리트에서 고위 직책을 차지한다."},{"english":"He occupied himself with painting and gardening after his retirement.","korean":"그는 은퇴 후 그림 그리기와 정원 가꾸기에 몰두했다."}],"checks":"<ul><li>occupy 동사의 목적어로 slot, space, city, position 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"13. bridge","examples":[{"english":"The new educational program aims to bridge the gap between theoretical knowledge and practical application.","korean":"새 교육 프로그램은 이론적 지식과 실용적 적용 사이의 간극을 메우는 것을 목표로 한다."},{"english":"The river had been bridged at its narrowest point.","korean":"강에서 가장 폭이 좁은 지점에 다리가 놓였다."}],"checks":"<ul><li>bridge 동사의 목적어로 gap, river 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"14. assume","examples":[{"english":"Let’s assume that they’re coming and make plans on that basis.","korean":"그들이 오고 있다고 가정하고 거기에 기반하여 계획을 세워 보자."},{"english":"We can’t assume the suspects to be guilty simply because they’ve decided to remain silent.","korean":"침묵을 지키기로 결정했다고 해서 용의자들을 유죄로 가정해서는 안 된다."},{"english":"Upon her retirement, her successor will assume all responsibilities associated with the position.","korean":"그녀가 은퇴하면 후임자가 그 자리에 관련된 모든 책임을 맡을 것이다."},{"english":"He assumed a look of indifference but I knew how he felt.","korean":"그는 무관심한 표정을 지었지만 나는 그가 어떻게 느끼는지 알았다."}],"checks":"<ul><li>assume 동사가 that 절, to 부정사와 함께 쓰였음을 확인한다.<\/li><li>assume 동사의 목적어로 responsibilities, look 등이 사용되었음을 확인한다.<\/li><\/ul>"}],"vocabularyExercises":[{"number":1,"prompt":"<p>arise 동사를 사용하여 1형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":2,"prompt":"<p>remain 동사를 사용하여 1형식 문장 두 개와 2형식 문장 두 개를 만드시오.<\/p>","explanation":""},{"number":3,"prompt":"<p>establish 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":4,"prompt":"<p>괄호 안에 공통으로 들어가 자연스럽게 문장을 완성할 수 있는 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>He (     ) his income by working in a bar at night.<\/li><li>Some vegetarians like to (     ) their diets with iron.<\/li><\/ul>","explanation":""},{"number":5,"prompt":"<p>다음 문장은 ‘그 분쟁이 가장 중요한 뉴스거리가 될 것 같다’는 의미를 지닌다. 괄호 안에 들어갈 동사로 자연스러운 것은 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><p>The dispute is likely to (     ) the news.<\/p>","explanation":""},{"number":6,"prompt":"<p>introduce 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":7,"prompt":"<p>organize 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":8,"prompt":"<p>괄호 안에 자연스러운 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><p>He (     ) a look of indifference but I knew how he felt.<\/p>","explanation":""}],"exercises":[{"number":1,"prompt":"<p>When did ancient Egypt arise?<\/p><ul><li>A) 5000 B.C.E.<\/li><li>B) 3100 B.C.E.<\/li><li>C) 1500 B.C.E.<\/li><li>D) 332 B.C.E.<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"사진 하단 정답표"}},{"number":2,"prompt":"<p>What allowed the civilization of ancient Egypt to thrive?<\/p><ul><li>A) Trading with distant lands<\/li><li>B) Utilizing the Nile River’s flood patterns for farming<\/li><li>C) Conquering neighboring territories<\/li><li>D) Discovering precious metals<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"사진 하단 정답표"}},{"number":3,"prompt":"<p>밑줄 친 부분의 의미는 ‘환경과 자원을 성공적으로 관리함으로써’이다. 괄호 안에 필요한 전치사는 무엇인가?<\/p><p><u>(     ) successfully managing their environment and resources<\/u>, the Egyptians established a culture rich in art, knowledge, and architecture.<\/p>","explanation":"<p>‘by ~ing’는 ‘~함으로써’라는 의미를 지닙니다.<\/p>","answer":{"answer":"by","evidence":"3번 해설"}},{"number":4,"prompt":"<p>What was the primary material used for building houses in ancient Egypt?<\/p><ul><li>A) Wood<\/li><li>B) Stone<\/li><li>C) Mudbrick<\/li><li>D) Canvas<\/li><\/ul>","explanation":"","answer":null},{"number":5,"prompt":"<p>How did the ancient Egyptians maintain their personal hygiene?<\/p><ul><li>A) By bathing in the Nile River and using a paste made of animal fat and chalk<\/li><li>B) By using modern soap and water from indoor plumbing<\/li><li>C) By avoiding water and only using dry cleaning methods<\/li><li>D) By taking sand baths under the hot sun<\/li><\/ul>","explanation":"","answer":null},{"number":6,"prompt":"<p>What does the ka represent in ancient Egyptian belief?<\/p><ul><li>A) A type of pyramid<\/li><li>B) The physical strength of a pharaoh<\/li><li>C) A vital aspect of the pharaoh’s soul<\/li><li>D) A ceremonial ritual<\/li><\/ul>","explanation":"","answer":null},{"number":7,"prompt":"<p>Why was the preservation of the pharaoh’s body crucial?<\/p><ul><li>A) To display the wealth of the empire<\/li><li>B) To enable the departed ruler to adhere to his responsibilities in the afterlife<\/li><li>C) To use as a treasure map for hidden wealth<\/li><li>D) To serve as historical art for future generations<\/li><\/ul>","explanation":"","answer":null},{"number":8,"prompt":"<p>According to ancient Egyptian ethos, what did death signify?<\/p><ul><li>A) The absolute end of existence<\/li><li>B) A curse for misdeeds in life<\/li><li>C) The start of a journey to the next world<\/li><li>D) A time for mourning and sorrow without hope<\/li><\/ul>","explanation":"","answer":null},{"number":9,"prompt":"<p>괄호 안에 필요한 동사를 알맞은 형태로 바꾸어 적으시오.<\/p><p>The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, (     ) a pivotal role within the fabric of its society.<\/p>","explanation":"<p>role을 목적어로 취하여 ‘~ 역할을 하다’라는 의미를 만드는 동사는 play입니다. 위 문장의 경우 ‘and the religion played a pivotal role~’이 분사구문으로 표현된 것으로 볼 수 있기에, 접속사를 생략하고 and로 연결된 두 문장의 주어가 같으므로 주어도 생략하고, 동사의 시제가 같으므로 played는 현재분사인 playing으로 바뀌어야 합니다.<\/p>","answer":{"answer":"playing","evidence":"9번 해설"}},{"number":10,"prompt":"<p>What type of religion was practiced in ancient Egypt?<\/p><ul><li>A) Monotheism<\/li><li>B) Polytheism<\/li><li>C) Atheism<\/li><li>D) Animism<\/li><\/ul>","explanation":"<p>monotheism: 일신교, atheism: 무신론, animism: 애니미즘<\/p>","answer":null}],"answerNote":"<p>마지막 사진 하단의 정답표가 잘려 있어 전체 정답표를 확인할 수 없습니다. 아래는 사진에서 읽을 수 있는 정답과 해설에 명시된 내용입니다.<\/p><p>그 외 번호의 정답은 잘린 정답표를 추정하여 추가하지 않았습니다.<\/p>","confirmedAnswers":4}]}</script>
