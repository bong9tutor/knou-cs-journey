    <script type="application/json" id="textbook-data">{"units":[{"id":"01","title":"UNIT 01 · Virus","shortTitle":"UNIT 01 · Virus","bookSource":"제공된 사진 9장(교재 3–11쪽)을 옮긴 문서입니다. 페이지와 줄바꿈 때문에 나뉜 단어·문장은 연결했습니다. 본문의 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 사진 1000009667.jpg–1000009670.jpg, 워크북 6–13쪽. 페이지 사이에 끊긴 문장을 연결했습니다. 빈칸은 `(     )`으로 표시하고, 문법 문제의 표시 부분은 번호와 굵은 글씨로 나타냈습니다. 본문과 해설은 교재 내용을 옮긴 것입니다.","paragraphs":[{"number":1,"title":"문단 1","english":"A virus is a submicroscopic infectious agent that replicates only inside the living cells of an organism. Viruses infect all life forms, from animals and plants to microorganisms. The study of viruses is called virology, which is a part of microbiology. Viruses consist of genetic materials surrounded by a protective coat of protein, so they are more difficult to kill than bacteria. In the case of a minor ailment induced by a viral infection, the optimal strategy is to allow the malady to progress naturally. It is crucial to recognize that antibiotics, designed to combat bacterial infections, lack efficacy against viral entities. Antibiotics do not kill viruses and the use of them just leads to antibiotic resistance.","korean":"바이러스는 유기체의 살아 있는 세포 내에서만 복제되는 초미세한 전염성 물질이다. 바이러스는 동물과 식물에서부터 미생물까지 모든 생명체를 감염시킨다. 바이러스 연구는 바이러스학이라고 하며, 이는 미생물학의 일부이다. 바이러스는 단백질 보호막으로 둘러싸인 유전 물질로 구성되어 있어 세균보다 죽이기가 더 어렵다. 바이러스 감염으로 인한 가벼운 질병의 경우, 질병이 자연스럽게 진행되도록 하는 것이 최선의 전략이다. 세균 감염과 싸우도록 고안된 항생제가 바이러스에 대해서는 효능이 부족하다는 것을 인식하는 것이 중요하다. 항생제는 바이러스를 죽이지 않으며 항생제를 사용하는 것은 항생제 내성으로 이어질 뿐이다."},{"number":2,"title":"문단 2","english":"Viruses spread in many ways. One transmission pathway is through disease-bearing organisms known as vectors: for example, viruses are often transmitted from plant to plant by insects that feed on plant sap, such as aphids; and viruses in animals can be carried by blood-sucking insects. Additionally, numerous viruses disperse through airborne particles generated by respiratory activities such as coughing and sneezing. This airborne transmission is observed in pathogens like influenza viruses, SARS-CoV-2, chickenpox, smallpox, and measles. HIV is one of several viruses transmitted through sexual contact and by exposure to infected blood.","korean":"바이러스는 다양한 방법으로 전파된다. 한 가지 전염 경로는 질병을 가진 유기체-매개체로 알려진-를 통해서인데, 예를 들어, 바이러스는 진딧물과 같은 식물 수액을 먹고 사는 곤충에 의해 종종 식물에서 식물로 전염되고 동물의 바이러스는 피를 빨아먹는 곤충에 의해 옮겨질 수 있다. 또한 기침이나 재채기와 같은 호흡기 활동으로 생성된 공기 중 입자를 통해 확산되는 바이러스도 많다. 이러한 공기 전염은 인플루엔자 바이러스, SARS-CoV-2, 수두, 천연두, 홍역과 같은 병원체에서 관찰된다. HIV는 성적 접촉, 그리고 감염된 혈액에 대한 노출을 통해 전염되는 몇몇 바이러스 중 하나이다."},{"number":3,"title":"문단 3","english":"The immune system is a network of biological systems that protects an organism from diseases. It detects and responds to a wide variety of pathogens, from viruses to parasitic worms, as well as cancer cells and objects such as wood splinters. The immune system employs layered defenses, increasing in specificity, to protect the host from infections. Physical barriers prevent pathogens such as bacteria and viruses from entering the organism. If a pathogen breaches these barriers, the innate immune system provides an immediate, but non-specific response. In instances where pathogens effectively elude the innate immune response, vertebrates employ a secondary line of defense known as the adaptive immune system. Here, the immune system adapts its response during an infection to improve its recognition of the pathogen. This improved response is then retained after the pathogen has been eliminated, in the form of an immunological memory, and allows the adaptive immune system to mount faster and stronger attacks each time this pathogen is encountered.","korean":"면역 체계는 유기체를 질병으로부터 보호하는 생물학적 시스템의 네트워크이다. 암세포나 나무 파편 같은 물체를 포함하여 바이러스부터 기생충에 이르기까지 매우 다양한 병원체를 감지하고 이에 대응한다. 면역 체계는 숙주를 감염으로부터 보호하기 위해, 특이성이 증가하는 계층적 방어 수단을 사용한다. 물리적 장벽은 세균 및 바이러스와 같은 병원체가 유기체에 침입하는 것을 방지한다. 만약 병원체가 이러한 장벽을 통과하면 선천적 면역 체계는 즉각적이지만 비특이적인 반응을 제공한다. 병원체가 선천적 면역 반응을 효과적으로 회피하는 경우, 척추동물은 적응 면역 체계라고 알려진 2차 방어선을 사용한다. 여기에서 면역 체계는 병원체에 대한 인식을 개선하기 위해 감염 중 반응을 조정한다. 이렇게 개선된 반응은 병원체가 제거된 후에도 면역학적 기억의 형태로 유지되어, 이 병원체를 만날 때마다 적응 면역 체계가 더 빠르고 강력한 공격을 가할 수 있도록 한다."},{"number":4,"title":"문단 4","english":"A vaccine is a preparation that is used to stimulate the body’s immune response against diseases. The safety and efficacy of vaccines have undergone extensive scrutiny and validation. Typically, a vaccine comprises an agent that resembles a pathogenic microorganism and is derived from attenuated or inactivated forms of the microbe, its toxins, or one of its surface proteins. This agent serves to elicit a response from the body’s immune system, facilitating its recognition, destruction, and the development of immunological memory to guard against the perceived threat. Vaccination is considered as the most effective means of preventing infectious diseases.","korean":"백신은 질병에 대한 인체의 면역 반응을 촉진하기 위해 사용되는 제제이다. 백신의 안전성과 효능은 광범위한 정밀 조사와 검증을 거쳤다. 일반적으로 백신은 병원성 미생물과 유사하고 약화된 혹은 비활성화된 형태의 미생물, 독소, 혹은 표면 단백질 중 하나로부터 유래된 물질을 포함한다. 이 물질은 인체의 면역 체계로부터 반응을 이끌어내어 병원체를 인식하고 파괴하는 것을 용이하게 하며, 또한 면역학적 기억력 발달을 촉진하여 인지된 위협에 대비한다. 예방 접종은 전염병을 예방하는 가장 효과적인 수단으로 간주된다."}],"vocabulary":[{"number":1,"word":"submicroscopic","meaning":"극미의, 초현미경적인"},{"number":2,"word":"infectious","meaning":"전염성의"},{"number":3,"word":"replicate","meaning":"복제하다"},{"number":4,"word":"microorganism","meaning":"미생물"},{"number":5,"word":"microbiology","meaning":"미생물학"},{"number":6,"word":"consist of~","meaning":"~으로 구성되다"},{"number":7,"word":"ailment","meaning":"병 [a physical disorder or illness, especially of a minor or chronic nature]"},{"number":8,"word":"induce","meaning":"유발하다"},{"number":9,"word":"optimal","meaning":"최선의"},{"number":10,"word":"malady","meaning":"병 [any disorder or disease of the body, especially one that is chronic or deep-seated]"},{"number":11,"word":"antibiotic","meaning":"항생제, 항생 물질"},{"number":12,"word":"lead to~","meaning":"~로 이어지다"},{"number":13,"word":"antibiotic resistance","meaning":"항생제 내성"},{"number":14,"word":"transmission","meaning":"전염, 전파, 전달"},{"number":15,"word":"vector","meaning":"질병의 매개체"},{"number":16,"word":"transmit","meaning":"전송하다, 전염시키다"},{"number":17,"word":"feed on~","meaning":"~을 먹고 살다"},{"number":18,"word":"disperse","meaning":"퍼지다, 흩어지다"},{"number":19,"word":"airborne","meaning":"공기로 운반되는"},{"number":20,"word":"generate","meaning":"발생시키다, 만들어내다"},{"number":21,"word":"respiratory","meaning":"호흡의, 호흡 기관의"},{"number":22,"word":"observe","meaning":"관찰하다"},{"number":23,"word":"pathogen","meaning":"병원균, 병원체"},{"number":24,"word":"SARS-CoV-2 (Severe Acute Respiratory Syndrome Coronavirus 2)","meaning":"제2형중증급성호흡기증후군 코로나바이러스"},{"number":25,"word":"HIV (Human Immunodeficiency Virus)","meaning":"인간면역결핍바이러스"},{"number":26,"word":"exposure","meaning":"노출"},{"number":27,"word":"immune system","meaning":"면역 체계"},{"number":28,"word":"detect","meaning":"감지하다"},{"number":29,"word":"parasitic","meaning":"기생적인, 기생 생물의, 기생충에 의한"},{"number":30,"word":"splinter","meaning":"파편, 깨진 조각, 가시"},{"number":31,"word":"layered","meaning":"층을 이룬"},{"number":32,"word":"breach","meaning":"돌파하다, 위반하다"},{"number":33,"word":"elude","meaning":"피하다"},{"number":34,"word":"vertebrate","meaning":"척추동물"},{"number":35,"word":"eliminate","meaning":"제거하다"},{"number":36,"word":"immunological","meaning":"면역학의"},{"number":37,"word":"mount","meaning":"(공격 등을) 개시하다"},{"number":38,"word":"each time","meaning":"~할 때마다 매번"},{"number":39,"word":"encounter","meaning":"우연히 만나다"},{"number":40,"word":"preparation","meaning":"(약품, 식품 등의) 조제품, 조합제, 조합약"},{"number":41,"word":"extensive","meaning":"광범위한, 방대한"},{"number":42,"word":"scrutiny","meaning":"정밀한 조사, 검증"},{"number":43,"word":"validation","meaning":"검증, 타당성, 타당성 확인"},{"number":44,"word":"attenuate","meaning":"약하게 하다, 묽어지게 하다"},{"number":45,"word":"microbe","meaning":"미생물, 병원균, 세균"},{"number":46,"word":"toxin","meaning":"독소, 독성 물질"},{"number":47,"word":"elicit","meaning":"끌어내다"}],"verbs":[{"title":"1. lack","examples":[{"english":"She totally lacks a sense of humor.","korean":"그녀는 유머 감각이 전혀 없다."},{"english":"The proposal lacked detailed data.","korean":"제안서는 구체적인 데이터가 부족했다."}],"checks":"<ul><li>lack 동사가 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"2. disperse","examples":[{"english":"Pollen grains disperse far and wide.","korean":"꽃가루는 멀리 흩어진다."},{"english":"When the rain came down, the crowds started to disperse.","korean":"비가 내리자 군중은 흩어지기 시작했다."},{"english":"Police dispersed the crowd that had gathered.","korean":"경찰은 모여 있던 군중을 해산시켰다."},{"english":"The fragrance from the blooming flowers dispersed throughout the garden.","korean":"개화한 꽃에서 나는 향기가 정원 전체에 퍼져 나갔다."}],"checks":"<ul><li>disperse 동사가 자동사, 타동사로 모두 사용되었음을 확인한다.<\/li><li>자동사 disperse 동사의 주어로 pollen grains, crowd, fragrance 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"3. enter","examples":[{"english":"Please knock before you enter my office.","korean":"제 사무실에 들어오기 전에 노크해 주세요."},{"english":"To access the building, you must enter a security code into the keypad by the door.","korean":"건물에 들어가기 위해서는 문 옆의 키패드에 보안 코드를 입력해야 한다."},{"english":"Before you enter the country, you must declare any items of value at customs.","korean":"입국 전에 세관에 귀중품을 신고해야 한다."}],"checks":"<ul><li>enter 동사가 타동사로 사용되었음을 확인한다.<\/li><li>enter 동사의 목적어로 office, code, country 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"4. breach","examples":[{"english":"They breached the agreement they had made with their employer.","korean":"그들은 고용주와 한 합의를 위반했다."},{"english":"The hackers managed to breach the company’s cybersecurity defenses.","korean":"해커들은 회사의 사이버 보안망을 뚫는 데 성공했다."},{"english":"The floodwaters continued to rise, threatening to breach the levee and inundate the nearby homes.","korean":"홍수로 물이 계속 불어나면서 제방이 무너져 주변의 가옥들이 침수될 위기에 처했다."}],"checks":"<ul><li>breach 동사의 목적어로 agreement, defenses, levee 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"5. allow","examples":[{"english":"Do you think Dad will allow you to go to Jamie’s party?","korean":"아빠가 네가 제이미의 파티에 가도록 허락해줄 것 같아?"},{"english":"You’re not allowed to talk during the exam.","korean":"시험 중에는 말하는 것이 허용되지 않는다."},{"english":"Pets aren’t allowed in this hotel.","korean":"이 호텔에서는 반려동물의 출입이 허용되지 않는다."},{"english":"Smoking is not allowed in this restaurant.","korean":"이 레스토랑에서는 흡연이 허용되지 않는다."},{"english":"He didn’t allow us enough time to finish the test.","korean":"그는 시험을 끝내기에 충분한 시간을 우리에게 허락하지 않았다."}],"checks":"<ul><li>allow 동사가 3형식, 4형식, 5형식 문장에서 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"6. mount","examples":[{"english":"The children’s excitement is mounting as Christmas gets nearer.","korean":"크리스마스가 가까워지면서 어린이들의 흥분이 증가하고 있다."},{"english":"She mounted her horse and rode off.","korean":"그녀는 말에 올라타 가 버렸다."},{"english":"The army prepared to mount an attack on the enemy stronghold.","korean":"군대는 적의 요새에 대한 공격을 시작할 준비를 하였다."},{"english":"The art gallery is ready to mount an exhibition of contemporary sculptures next week.","korean":"미술관은 다음 주에 현대 조각품 전시를 개최할 준비가 되었다."}],"checks":"<ul><li>mount 동사가 자동사, 타동사로 사용되었음을 확인한다.<\/li><li>mount 동사의 목적어로 horse, attack, exhibition이 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"7. comprise","examples":[{"english":"The book comprises ten chapters.","korean":"그 책은 열 개의 장으로 구성되어 있다."},{"english":"The national park comprises several hiking trails, offering diverse scenic views.","korean":"국립 공원에는 하이킹 코스가 여러 개 포함되어 있어 다양한 경치를 제공한다."},{"english":"The committee is comprised of experts from different fields, ensuring a comprehensive perspective.","korean":"위원회는 여러 분야의 전문가로 구성되어 포괄적 시각을 확보한다."}],"checks":"<ul><li>comprise 동사가 타동사로 사용되었음을 확인한다.<\/li><li>‘comprise~’와 ‘be comprised of~’가 같은 의미를 지닌다.<\/li><li>같은 의미를 지니는 다른 표현으로는 ‘consist of~’, ‘be made up of~’ 등이 있다.<\/li><\/ul>"}],"vocabularyExercises":[{"number":1,"passage":"","prompt":"<p>괄호 안에 알맞은 동사를 채워 넣으시오. (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>She totally (     ) a sense of humor. (그녀는 유머 감각이 전혀 없다.)<\/li><li>They (     ) the agreement they had made with their employer. (그들은 고용주와 한 합의를 위반했다.)<\/li><\/ul>","explanation":""},{"number":2,"passage":"","prompt":"<p>괄호 안에 공통으로 들어가 문장을 자연스럽게 완성시킬 수 있는 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>Pollen grains (     ) far and wide.<\/li><li>When the rain came down, the crowds started to (     ).<\/li><li>Police (     ) the crowd that had gathered.<\/li><li>The fragrance from the blooming flowers (     ) throughout the garden.<\/li><\/ul>","explanation":""},{"number":3,"passage":"","prompt":"<p>allow 동사를 사용하여 3형식, 4형식, 5형식 문장을 하나씩 만들어 보시오.<\/p>","explanation":""},{"number":4,"passage":"","prompt":"<p>괄호 안에 적절한 동사는 무엇인가?<\/p><p>The army prepared to (     ) an attack on the enemy stronghold. (군대는 적의 요새에 대한 공격을 시작할 준비를 하였다.)<\/p>","explanation":""},{"number":5,"passage":"","prompt":"<p>comprise와 같은 의미를 지니는 표현을 두 개 적어 보시오.<\/p>","explanation":""}],"exercises":[{"number":1,"passage":"","prompt":"<p>What is the field of study that focuses on viruses called?<\/p><ul><li>A) Bacteriology<\/li><li>B) Virology<\/li><li>C) Microbiology<\/li><li>D) Pathology<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":2,"passage":"","prompt":"<p>In the case of a minor ailment induced by a viral infection, what is the best strategy?<\/p><ul><li>A) Take antibiotics.<\/li><li>B) Do not drink water.<\/li><li>C) Study genetic disease.<\/li><li>D) Allow the malady to progress naturally.<\/li><\/ul>","explanation":"<p>항생제는 세균 감염을 치료하는 것이기에 바이러스 감염에 의한 질병에 항생제를 복용할 경우 효과가 없고 오히려 항생제 내성을 키운다는 것, 바이러스성 질병의 경우에는 자연스럽게 질병이 진행되도록 놔두는 것이 최고의 방책이라는 것이 본문의 내용입니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":3,"passage":"","prompt":"<p>Which of the following is NOT a method of virus transmission mentioned in the text?<\/p><ul><li>A) Through vectors like insects that feed on plant sap<\/li><li>B) Through purified water sources<\/li><li>C) Through airborne particles from coughing and sneezing<\/li><li>D) Through sexual contact and exposure to infected blood<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":4,"passage":"","prompt":"<p>괄호 안에 알맞은 전치사는 무엇인가?<\/p><p>Viruses spread (     ) many ways.<\/p>","explanation":"","answer":{"answer":"in","evidence":"교재 수록 정답표"}},{"number":5,"passage":"","prompt":"<p>밑줄 친 ①~④에서 문법적으로 옳지 않은 부분을 찾아 바르게 고치시오.<\/p><p>Viruses ①<strong>are often<\/strong> ②<strong>transmitted<\/strong> from plant to plant by insects ③<strong>that<\/strong> ④<strong>feeds<\/strong> on plant sap, such as aphids.<\/p>","explanation":"<p>위 문장에서 that은 관계대명사로 사용되었습니다. 관계대명사 that은 주어로 사용되고 있으며 선행사는 insects입니다. 관계대명사로 연결되기 전 두 문장은 ‘Viruses are often transmitted from plant to plant by insects.’, ‘Insects feed on plant sap, such as aphids.’입니다. 즉 관계대명사 that의 주어는 insects(복수)이기에 동사는 feed가 되어야 합니다.<\/p>","answer":{"answer":"④ feeds → feed","evidence":"교재 수록 정답표"}},{"number":6,"passage":"","prompt":"<p>What is the primary function of the immune system?<\/p><ul><li>A) To regulate body temperature<\/li><li>B) To protect the organism from diseases<\/li><li>C) To assist in the digestion of food<\/li><li>D) To produce blood cells<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":7,"passage":"","prompt":"<p>Which of the following is NOT listed as a pathogen the immune system protects against?<\/p><ul><li>A) Bacteria<\/li><li>B) Viruses<\/li><li>C) Parasitic worms<\/li><li>D) Beneficial bacteria<\/li><\/ul>","explanation":"<p>beneficial의 의미를 알면 쉽게 풀 수 있는 문제입니다. beneficial은 ‘이로운’, ‘유익한’이라는 의미를 지닙니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":8,"passage":"","prompt":"<p>What is the role of the adaptive immune system?<\/p><ul><li>A) To provide an immediate, non-specific response to pathogens<\/li><li>B) To prevent pathogens from entering the organism<\/li><li>C) To adapt its response to improve recognition of a pathogen during an infection<\/li><li>D) To regulate the body’s temperature in response to an infection<\/li><\/ul>","explanation":"<p>본문에서는 면역 체계를 세 단계-물리적 장벽, 선천적 면역 체계, 적응 면역 체계-로 설명합니다. 적응 면역 체계는 병원체를 기억하고 병원체가 이후 다시 침입할 때 빠르고 강력하게 공격을 개시할 수 있게 한다고 했으므로 정답은 C입니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":9,"passage":"","prompt":"<p>What is the purpose of a vaccine?<\/p><ul><li>A) To weaken the body’s immune system<\/li><li>B) To stimulate the body’s immune response against diseases<\/li><li>C) To serve as a treatment for ongoing infections<\/li><li>D) To identify and remove toxins from the body<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":10,"passage":"","prompt":"<p>Which of the following is true?<\/p><ul><li>A) Vaccines often contain harmful microorganisms that can cause diseases.<\/li><li>B) The efficacy and safety of vaccines are rarely scrutinized or validated.<\/li><li>C) Vaccines work by suppressing the immune system’s response to pathogens.<\/li><li>D) Vaccination is considered the most effective method of preventing infectious diseases.<\/li><\/ul>","explanation":"<p>백신은 병원체를 닮은 물질을 포함하기에 질병을 일으키는 해로운 물질을 포함한다는 A는 답이 아닙니다. 백신의 유효성과 안전성은 정밀하고도 광범위한 검사를 거친다고 했으므로 B 역시 틀린 진술입니다. C는 백신이 면역 반응을 억압한다는 의미이므로 답이 될 수 없고, 정답은 ‘백신이 전염성 질병을 예방하는 가장 효과적인 방법이다’라고 한 D입니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}}],"answerNote":"","confirmedAnswers":10},{"id":"02","title":"UNIT 02 · Ancient Egypt","shortTitle":"UNIT 02 · Ancient Egypt","bookSource":"제공된 사진 11장(교재 13–23쪽)을 옮긴 문서입니다. 페이지와 줄바꿈 때문에 나뉜 단어·문장은 연결했습니다. 본문의 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 사진 1000009671.jpg–1000009676.jpg, 워크북 14–24쪽. 페이지 사이에 끊긴 문장을 연결했습니다. 빈칸은 `(     )`으로 표시했습니다. 마지막 사진의 정답표는 아래쪽이 잘려 있어 확인 가능한 부분과 해설에 명시된 정답만 옮겼습니다. 본문과 해설은 교재 내용을 옮긴 것입니다.","paragraphs":[{"number":1,"title":"문단 1","english":"Ancient Egypt was an impressive civilization that arose around 3100 B.C.E. It remained a major power in North Africa and nearby regions until the Macedonians took over in 332 B.C.E. The civilization thrived mostly because it made the most of the Nile River’s flood patterns for farming. The predictable flooding and controlled irrigation of the fertile valley produced surplus crops, which allowed the population to grow and society to become more complex. By successfully managing their environment and resources, the Egyptians established a culture rich in art, knowledge, and architecture that would influence the world for centuries to come.","korean":"고대 이집트는 기원전 3100년경에 일어난 인상적인 문명이었다. 기원전 332년에 마케도니아인들이 장악할 때까지 고대 이집트는 북아프리카와 인근 지역의 주요 강국으로 남아 있었다. 이 문명은 주로 나일강의 홍수 패턴을 농업에 최대한 활용했기 때문에 번성했다. 예측 가능한 홍수와 비옥한 계곡의 통제된 관개로 인해 잉여 농작물이 생산되었고, 이로 인해 인구가 증가하고 사회는 더욱 복잡해질 수 있었다. 이집트인들은 환경과 자원을 성공적으로 관리함으로써 예술, 지식, 그리고 건축에서 풍성한 문화를 확립했으며 이는 이후 수 세기 동안 세계에 영향을 미치게 되었다."},{"number":2,"title":"문단 2","english":"In ancient Egypt, the majority of the population was made up of farmers. Their houses were built from mudbrick with designs optimized to provide relief from the intense daytime heat. The staple diet consisted of bread and beer, supplemented with vegetables such as onions and garlic, and fruit such as dates and figs. Hygiene and personal grooming were of significant importance to the ancient Egyptians. Their hygiene system was complex, encompassing bathing, shaving, dental care, and more. Many bathed in the Nile River, employing a homemade paste for soap composed of animal fat and chalk. Body shaving was a common practice and perfumes and scented oils were used to mask unpleasant smells and to calm irritated skin. Music and dance were popular entertainments. Early on, the musical scene was dominated by flutes and harps. As time went on, other instruments resembling trumpets, oboes, and various types of pipes were introduced and gained popularity.","korean":"고대 이집트에서는 인구의 대부분이 농부로 구성되어 있었다. 그들의 집은 극심한 낮의 열기로부터 안식을 제공할 수 있도록 최적화된 디자인을 갖췄고, 진흙 벽돌로 지어졌다. 주식은 빵과 맥주로 이루어졌으며, 양파, 마늘과 같은 채소와 대추, 무화과 같은 과일이 곁들여졌다. 위생과 개인적인 몸단장은 고대 이집트인들에게 매우 중요했다. 그들의 위생 시스템은 복잡했고 목욕, 면도, 치아 관리 등이 포함되었다. 많은 사람이 나일강에서 목욕했고, 동물성 지방과 백악질로 구성된 수제 반죽을 비누로 사용했다. 몸을 면도하는 것은 일반적인 관행이었고 향수와 향 오일은 불쾌한 냄새를 가리고 염증이 난 피부를 진정시키기 위해 사용되었다. 음악과 춤은 대중적인 오락이었다. 초기에는 플루트와 하프가 음악계를 지배했다. 시간이 지남에 따라 트럼펫, 오보에 및 다양한 종류의 파이프를 닮은 다른 악기들이 소개되고 인기를 얻었다."},{"number":3,"title":"문단 3","english":"The architecture of ancient Egypt includes some of the most famous structures in the world: the Great Pyramids of Giza and the temples at Thebes. Building projects were organized and funded by the state not only for religious and commemorative purposes, but also to reinforce the wide-ranging power of the pharaoh. These massive stone structures were believed to safeguard the physical and spiritual essence of the pharaohs. The ka, which is a vital aspect of the pharaoh’s soul, was thought to dwell alongside their mummified forms. The meticulous preservation of the pharaoh’s body was crucial for enabling the departed ruler to adhere to his responsibilities in the afterlife as the monarch of the deceased. In the ethos of Ancient Egypt, death on the earth was the start of a journey to the next world.","korean":"고대 이집트의 건축물에는 기자의 피라미드와 테베에 있는 사원들 등 세계에서 가장 유명한 건축물들이 포함되어 있다. 국가는 종교적이고 기념적인 목적을 위해서뿐 아니라 파라오의 광범위한 권력을 강화하기 위해서 건축 프로젝트를 조직하고 자금을 지원했다. 이 거대한 석조 건축물들은 파라오의 육체적, 정신적 본질을 수호하는 것으로 여겨졌다. 파라오의 영혼에서 매우 중요한 요소인 카는, 미라의 형태를 띤 파라오와 함께 거하고 있는 것으로 여겨졌다. 파라오의 시신을 세심하게 보존하는 것은 죽은 통치자가 사후 세계에서 죽은 자들의 군주로 책임을 다할 수 있도록 하는 데 중요했다. 고대 이집트의 기풍에서 이승에서의 죽음은 다음 세계로 향하는 여행의 시작이었다."},{"number":4,"title":"문단 4","english":"The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, playing a pivotal role within the fabric of its society. The pantheon comprised approximately 1,500 divinities, each commanding reverence and worship. The pharaoh occupied a distinct position, bridging the mundane and the divine, participating in the divine realm, and constructed great, religiously motivated funerary monuments for his afterlife. Pharaohs were obligated to retain the benevolence of the gods through rituals and offerings so that they could maintain Ma’at, the order of the cosmos, and repel Isfet, which was chaos. Notable for their diverse representations, Egyptian deities assumed various forms, including those of animals or composite beings with an animal’s head atop a human frame.","korean":"고대 이집트의 종교는 다신교 교리와 의식 활동의 복잡한 네트워크였으며, 그 사회의 구조 내에서 중추적인 역할을 했다. 신전에는 1,500여 개의 신이 있었고 그 각각은 경배와 숭배를 명했다. 파라오는 신의 영역에 참여함으로써 세속과 신성을 연결하는 독특한 위치를 가졌고, 자신의 내세를 위해 종교적 동기를 지닌 거대한 장례 기념물을 건설했다. 파라오는 우주의 질서인 마아트를 유지하고 혼돈인 이스페트를 물리치기 위해, 의식과 제물을 통해 신들의 자비를 유지해야 할 의무가 있었다. 다채로운 모습으로 유명한 이집트의 신들은 다양한 형상을 취했는데 이중에는 동물의 형상, 혹은 인간의 몸에 동물의 머리를 한 복합적인 존재도 포함되어 있었다."}],"vocabulary":[{"number":1,"word":"arise","meaning":"생기다, 일어나다, 발생하다"},{"number":2,"word":"take over","meaning":"탈취하다, 장악하다"},{"number":3,"word":"thrive","meaning":"번창하다"},{"number":4,"word":"make the most of~","meaning":"~을 최대한 활용하다"},{"number":5,"word":"irrigation","meaning":"관개"},{"number":6,"word":"fertile","meaning":"비옥한, 다산의"},{"number":7,"word":"be made up of~","meaning":"~로 구성되다"},{"number":8,"word":"mudbrick","meaning":"진흙 벽돌"},{"number":9,"word":"optimize","meaning":"최적화하다"},{"number":10,"word":"supplement","meaning":"보완하다, 채우다"},{"number":11,"word":"date","meaning":"대추야자(의 열매)"},{"number":12,"word":"hygiene","meaning":"위생, 보건"},{"number":13,"word":"grooming","meaning":"차림새, 몸단장"},{"number":14,"word":"encompass","meaning":"포함하다, 망라하다, 둘러싸다"},{"number":15,"word":"composed of~","meaning":"~으로 구성된"},{"number":16,"word":"chalk","meaning":"백악(백색 연토질 석회암), 분필"},{"number":17,"word":"scented","meaning":"향기로운"},{"number":18,"word":"calm","meaning":"진정시키다, 가라앉히다"},{"number":19,"word":"irritated","meaning":"염증을 일으킨, 따끔따끔한, 벌겋게 된, 안달이 난"},{"number":20,"word":"early on","meaning":"초기에, 처음에"},{"number":21,"word":"dominate","meaning":"~의 가장 두드러진 특징이 되다, 지배하다"},{"number":22,"word":"architecture","meaning":"건축(학), 건축 양식"},{"number":23,"word":"reinforce","meaning":"보강하다, 강화하다"},{"number":24,"word":"wide-ranging","meaning":"광범위한"},{"number":25,"word":"massive","meaning":"거대한"},{"number":26,"word":"safeguard","meaning":"지키다"},{"number":27,"word":"vital","meaning":"생명과 관련된, 필수적인, 치명적인, 생기 넘치는"},{"number":28,"word":"dwell","meaning":"거주하다"},{"number":29,"word":"alongside","meaning":"~의 곁에, ~와 나란히"},{"number":30,"word":"meticulous","meaning":"꼼꼼한, 세심한"},{"number":31,"word":"preservation","meaning":"보존"},{"number":32,"word":"crucial","meaning":"중대한, 결정적인"},{"number":33,"word":"adhere to~","meaning":"~을 고수하다, 충실히 지키다"},{"number":34,"word":"afterlife","meaning":"내세"},{"number":35,"word":"monarch","meaning":"군주"},{"number":36,"word":"deceased","meaning":"죽은 사람들, 사망한"},{"number":37,"word":"ethos","meaning":"기풍, 풍조"},{"number":38,"word":"intricate","meaning":"복잡한, 뒤얽힌"},{"number":39,"word":"polytheistic","meaning":"다신론의, 다신교의 (cf. monotheistic: 일신교의)"},{"number":40,"word":"pivotal","meaning":"중추적인, 중요한"},{"number":41,"word":"play a role","meaning":"역할을 하다"},{"number":42,"word":"fabric","meaning":"구조, 직물"},{"number":43,"word":"pantheon","meaning":"(집합적) 신화의 신들, 판테온"},{"number":44,"word":"comprise","meaning":"~을 포함하다, ~으로 구성되다"},{"number":45,"word":"divinity","meaning":"신성, 신"},{"number":46,"word":"reverence","meaning":"숭배, 존경"},{"number":47,"word":"mundane","meaning":"속세의, 평범한"},{"number":48,"word":"participate in~","meaning":"~에 참여하다, 관여하다"},{"number":49,"word":"funerary","meaning":"장례식의, 매장의"},{"number":50,"word":"be obligated to~","meaning":"~할 의무가 있다"},{"number":51,"word":"retain","meaning":"유지하다, 보유하다"},{"number":52,"word":"benevolence","meaning":"자비심, 선의"},{"number":53,"word":"ritual","meaning":"의식"},{"number":54,"word":"offering","meaning":"공물, 제물"},{"number":55,"word":"repel","meaning":"쫓아버리다, 몰아내다"},{"number":56,"word":"chaos","meaning":"혼돈, 카오스"},{"number":57,"word":"composite","meaning":"합성의, 복합의"},{"number":58,"word":"atop","meaning":"~의 꼭대기에"}],"verbs":[{"title":"1. arise","examples":[{"english":"If the opportunity arises, I’d love to go to China.","korean":"기회가 생긴다면 나는 중국에 가고 싶다."},{"english":"Problems arise when the payment is late.","korean":"지불이 늦어지면 문제가 발생한다."},{"english":"He died of complications arising from heart surgery.","korean":"그는 심장 수술로 인한 합병증으로 사망했다."}],"checks":"<ul><li>arise 동사의 주어로 opportunity, problems, complications 등이 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"2. remain","examples":[{"english":"The doctor ordered him to remain in bed for a few days.","korean":"의사는 그에게 며칠 동안 침대에 있으라고 지시했다."},{"english":"Most commentators expect the basic rate of tax to remain at 25 percent.","korean":"대부분의 해설자들은 기본 세율이 25퍼센트에 머물 것으로 예상한다."},{"english":"A great many things remain to be done (= have not yet been done).","korean":"해야 할 일이 아직 많이 남아 있다."},{"english":"He remained silent.","korean":"그는 침묵을 지키고 있었다."},{"english":"It remains a secret.","korean":"그것은 비밀로 남아 있다."},{"english":"The bank will remain open while renovations are carried out.","korean":"은행은 보수가 진행되는 동안 계속 열려 있을 것이다."},{"english":"Only a few hundred of these animals remain today.","korean":"오늘날 이 동물들 중 몇 백 마리만 남아 있다."}],"checks":"<ul><li>remain 동사가 1형식과 2형식 문장에서 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"3. establish","examples":[{"english":"He helped to establish the University of California at Berkeley.","korean":"그는 버클리에 캘리포니아 대학을 설립하는 데 도움을 주었다."},{"english":"Once we establish the price, we can begin to market the product.","korean":"일단 가격을 정하면, 상품 광고를 시작할 수 있다."},{"english":"There is a strong need to establish effective communication links between parents, staff, pupils, and external bodies.","korean":"부모, 교직원, 학생 및 외부 기관 간에 효과적인 소통 링크를 수립하는 것이 매우 필요하다."},{"english":"His reputation for carelessness was established long before the latest problems arose.","korean":"그가 부주의하다는 평판은 최근의 문제가 발생하기 오래전에 이미 확고했다."}],"checks":"<ul><li>establish의 목적어로 university, price, communication links, reputation 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"4. supplement","examples":[{"english":"He supplements his income by working in a bar at night.","korean":"그는 밤에 바에서 일하면서 소득을 보충한다."},{"english":"Some vegetarians like to supplement their diets with iron.","korean":"일부 채식주의자들은 식사에 철분을 보충하고 싶어 한다."},{"english":"The new law was introduced to supplement the existing regulations, aiming to close loopholes and enhance enforcement.","korean":"기존 규정을 보충하기 위해 새로운 법이 도입되었으며, 이는 빠져나갈 틈을 차단하고 집행을 강화하기 위한 것이었다."}],"checks":"<ul><li>supplement의 목적어로 income, diets, regulations 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"5. calm","examples":[{"english":"The teacher’s gentle voice managed to calm the excited students within minutes.","korean":"선생님의 부드러운 목소리는 몇 분 안에 흥분한 학생들을 진정시켰다."},{"english":"The storm finally began to calm down after raging for hours.","korean":"몇 시간 동안 격렬했던 폭풍이 마침내 가라앉기 시작했다."}],"checks":"<ul><li>calm 동사가 자동사, 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"6. irritate","examples":[{"english":"Certain skincare products irritated her sensitive skin.","korean":"특정 스킨케어 제품이 그녀의 민감한 피부에 염증을 일으켰다."},{"english":"It irritates me when people are late without giving any notice.","korean":"사람들이 사전 통보 없이 늦게 오면 화가 난다."},{"english":"After a while, the noise began to irritate him.","korean":"잠시 후 그 소음은 그를 짜증나게 하기 시작했다."}],"checks":"<ul><li>irritate 동사가 어떤 맥락에서 사용되는지 확인한다.<\/li><\/ul>"},{"title":"7. dominate","examples":[{"english":"The cathedral dominates the landscape for miles around.","korean":"수 마일 내의 풍경에서 가장 두드러지는 것은 대성당이다."},{"english":"The dispute is likely to dominate the news.","korean":"그 분쟁은 가장 중요한 뉴스거리가 될 것이다."},{"english":"They work as a group - no one person is allowed to dominate.","korean":"그들은 단체로 일한다. 그 누구도 군림하는 것은 허락되지 않는다."}],"checks":"<ul><li>dominate 동사가 자동사, 타동사로 모두 사용되었음을 확인한다.<\/li><li>dominate 동사가 어떤 맥락에서 사용되는지 확인한다.<\/li><\/ul>"},{"title":"8. resemble","examples":[{"english":"As he grew older, he began to resemble his grandfather, not just in looks but also in his behaviors.","korean":"나이가 들어감에 따라 그는 외모뿐만 아니라 행동에서도 할아버지를 닮아 가기 시작했다."}],"checks":"<ul><li>resemble 동사가 타동사로 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"9. introduce","examples":[{"english":"The company plans to introduce 45 new models over the next five years.","korean":"회사는 다음 5년 동안 45종의 새로운 모델을 내놓을 계획이다."},{"english":"We need to introduce more stringent security measures such as identity cards.","korean":"우리는 신분증과 같은 보다 엄격한 보안 조치를 도입해야 한다."},{"english":"I’d like to introduce my son.","korean":"제 아들을 소개하고 싶습니다."},{"english":"The director will introduce the film personally.","korean":"감독은 영화를 직접 소개할 것이다."},{"english":"In the workshop, we were introduced to the basics of digital photography by a professional photographer.","korean":"워크숍에서 우리는 전문 사진작가로부터 디지털 사진의 기초를 소개받았다."}],"checks":"<ul><li>introduce 동사가 사용되는 다양한 맥락을 살핀다.<\/li><\/ul>"},{"title":"10. organize","examples":[{"english":"Most British schools organize social events for the students.","korean":"대부분의 영국 학교들은 학생들을 위해 사교 행사를 개최한다."},{"english":"The books were organized on the shelves according to their size.","korean":"책들은 책장에 크기에 따라 정리되어 있었다."},{"english":"I am trying to organize my office so I can work more efficiently.","korean":"나는 더 효율적으로 일할 수 있도록 사무실을 정리하려고 노력하고 있다."},{"english":"They organized a car to pick me up at the airport.","korean":"그들은 공항에 나를 데리러 올 차를 준비했다."}],"checks":"<ul><li>organize의 목적어로 events, books, office, car 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"11. command","examples":[{"english":"The officer commanded his men to shoot.","korean":"장교는 병사들에게 총을 쏘라고 명령했다."},{"english":"He commanded that the troops (should) cross the water.","korean":"그는 부대가 물을 건널 것을 명했다."},{"english":"Colonel Sailing commands the Guards Regiment.","korean":"세일링 대령은 가드 군단을 지휘한다."},{"english":"The old castle commands a stunning view of the surrounding countryside.","korean":"그 고성에서는 주변의 멋진 전원 풍경이 잘 보인다."},{"english":"She commands respect from her peers.","korean":"그녀는 동료들로부터 존경을 받는다."}],"checks":"<ul><li>command 동사가 to 부정사, that 절과 함께 쓰였음을 확인한다.<\/li><li>command 동사의 목적어로 regiment, view, respect 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"12. occupy","examples":[{"english":"The programme will occupy that half-hour slot before the nine o’clock news.","korean":"이 프로그램은 9시 뉴스 전의 삼십 분 코너를 차지할 것이다."},{"english":"All physical objects occupy space.","korean":"모든 물리적 물체는 공간을 차지한다."},{"english":"Troops quickly occupied the city.","korean":"군대는 빠르게 그 도시를 점령했다."},{"english":"An increasing number of women occupy senior positions on Wall Street.","korean":"점점 더 많은 여성이 월스트리트에서 고위 직책을 차지한다."},{"english":"He occupied himself with painting and gardening after his retirement.","korean":"그는 은퇴 후 그림 그리기와 정원 가꾸기에 몰두했다."}],"checks":"<ul><li>occupy 동사의 목적어로 slot, space, city, position 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"13. bridge","examples":[{"english":"The new educational program aims to bridge the gap between theoretical knowledge and practical application.","korean":"새 교육 프로그램은 이론적 지식과 실용적 적용 사이의 간극을 메우는 것을 목표로 한다."},{"english":"The river had been bridged at its narrowest point.","korean":"강에서 가장 폭이 좁은 지점에 다리가 놓였다."}],"checks":"<ul><li>bridge 동사의 목적어로 gap, river 등의 명사가 사용되었음을 확인한다.<\/li><\/ul>"},{"title":"14. assume","examples":[{"english":"Let’s assume that they’re coming and make plans on that basis.","korean":"그들이 오고 있다고 가정하고 거기에 기반하여 계획을 세워 보자."},{"english":"We can’t assume the suspects to be guilty simply because they’ve decided to remain silent.","korean":"침묵을 지키기로 결정했다고 해서 용의자들을 유죄로 가정해서는 안 된다."},{"english":"Upon her retirement, her successor will assume all responsibilities associated with the position.","korean":"그녀가 은퇴하면 후임자가 그 자리에 관련된 모든 책임을 맡을 것이다."},{"english":"He assumed a look of indifference but I knew how he felt.","korean":"그는 무관심한 표정을 지었지만 나는 그가 어떻게 느끼는지 알았다."}],"checks":"<ul><li>assume 동사가 that 절, to 부정사와 함께 쓰였음을 확인한다.<\/li><li>assume 동사의 목적어로 responsibilities, look 등이 사용되었음을 확인한다.<\/li><\/ul>"}],"vocabularyExercises":[{"number":1,"passage":"","prompt":"<p>arise 동사를 사용하여 1형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":2,"passage":"","prompt":"<p>remain 동사를 사용하여 1형식 문장 두 개와 2형식 문장 두 개를 만드시오.<\/p>","explanation":""},{"number":3,"passage":"","prompt":"<p>establish 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":4,"passage":"","prompt":"<p>괄호 안에 공통으로 들어가 자연스럽게 문장을 완성할 수 있는 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><ul><li>He (     ) his income by working in a bar at night.<\/li><li>Some vegetarians like to (     ) their diets with iron.<\/li><\/ul>","explanation":""},{"number":5,"passage":"","prompt":"<p>다음 문장은 ‘그 분쟁이 가장 중요한 뉴스거리가 될 것 같다’는 의미를 지닌다. 괄호 안에 들어갈 동사로 자연스러운 것은 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><p>The dispute is likely to (     ) the news.<\/p>","explanation":""},{"number":6,"passage":"","prompt":"<p>introduce 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":7,"passage":"","prompt":"<p>organize 동사를 사용하여 3형식 문장을 세 개 만드시오.<\/p>","explanation":""},{"number":8,"passage":"","prompt":"<p>괄호 안에 자연스러운 동사는 무엇인가? (필요한 경우 동사를 알맞은 형태로 바꾸시오.)<\/p><p>He (     ) a look of indifference but I knew how he felt.<\/p>","explanation":""}],"exercises":[{"number":1,"passage":"","prompt":"<p>When did ancient Egypt arise?<\/p><ul><li>A) 5000 B.C.E.<\/li><li>B) 3100 B.C.E.<\/li><li>C) 1500 B.C.E.<\/li><li>D) 332 B.C.E.<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"사진 하단 정답표"}},{"number":2,"passage":"","prompt":"<p>What allowed the civilization of ancient Egypt to thrive?<\/p><ul><li>A) Trading with distant lands<\/li><li>B) Utilizing the Nile River’s flood patterns for farming<\/li><li>C) Conquering neighboring territories<\/li><li>D) Discovering precious metals<\/li><\/ul>","explanation":"","answer":{"answer":"B","evidence":"사진 하단 정답표"}},{"number":3,"passage":"","prompt":"<p>밑줄 친 부분의 의미는 ‘환경과 자원을 성공적으로 관리함으로써’이다. 괄호 안에 필요한 전치사는 무엇인가?<\/p><p><u>(     ) successfully managing their environment and resources<\/u>, the Egyptians established a culture rich in art, knowledge, and architecture.<\/p>","explanation":"<p>‘by ~ing’는 ‘~함으로써’라는 의미를 지닙니다.<\/p>","answer":{"answer":"by","evidence":"3번 해설"}},{"number":4,"passage":"","prompt":"<p>What was the primary material used for building houses in ancient Egypt?<\/p><ul><li>A) Wood<\/li><li>B) Stone<\/li><li>C) Mudbrick<\/li><li>D) Canvas<\/li><\/ul>","explanation":"","answer":null},{"number":5,"passage":"","prompt":"<p>How did the ancient Egyptians maintain their personal hygiene?<\/p><ul><li>A) By bathing in the Nile River and using a paste made of animal fat and chalk<\/li><li>B) By using modern soap and water from indoor plumbing<\/li><li>C) By avoiding water and only using dry cleaning methods<\/li><li>D) By taking sand baths under the hot sun<\/li><\/ul>","explanation":"","answer":null},{"number":6,"passage":"","prompt":"<p>What does the ka represent in ancient Egyptian belief?<\/p><ul><li>A) A type of pyramid<\/li><li>B) The physical strength of a pharaoh<\/li><li>C) A vital aspect of the pharaoh’s soul<\/li><li>D) A ceremonial ritual<\/li><\/ul>","explanation":"","answer":null},{"number":7,"passage":"","prompt":"<p>Why was the preservation of the pharaoh’s body crucial?<\/p><ul><li>A) To display the wealth of the empire<\/li><li>B) To enable the departed ruler to adhere to his responsibilities in the afterlife<\/li><li>C) To use as a treasure map for hidden wealth<\/li><li>D) To serve as historical art for future generations<\/li><\/ul>","explanation":"","answer":null},{"number":8,"passage":"","prompt":"<p>According to ancient Egyptian ethos, what did death signify?<\/p><ul><li>A) The absolute end of existence<\/li><li>B) A curse for misdeeds in life<\/li><li>C) The start of a journey to the next world<\/li><li>D) A time for mourning and sorrow without hope<\/li><\/ul>","explanation":"","answer":null},{"number":9,"passage":"","prompt":"<p>괄호 안에 필요한 동사를 알맞은 형태로 바꾸어 적으시오.<\/p><p>The religion of ancient Egypt was an intricate network of polytheistic doctrines and ceremonial activities, (     ) a pivotal role within the fabric of its society.<\/p>","explanation":"<p>role을 목적어로 취하여 ‘~ 역할을 하다’라는 의미를 만드는 동사는 play입니다. 위 문장의 경우 ‘and the religion played a pivotal role~’이 분사구문으로 표현된 것으로 볼 수 있기에, 접속사를 생략하고 and로 연결된 두 문장의 주어가 같으므로 주어도 생략하고, 동사의 시제가 같으므로 played는 현재분사인 playing으로 바뀌어야 합니다.<\/p>","answer":{"answer":"playing","evidence":"9번 해설"}},{"number":10,"passage":"","prompt":"<p>What type of religion was practiced in ancient Egypt?<\/p><ul><li>A) Monotheism<\/li><li>B) Polytheism<\/li><li>C) Atheism<\/li><li>D) Animism<\/li><\/ul>","explanation":"<p>monotheism: 일신교, atheism: 무신론, animism: 애니미즘<\/p>","answer":null}],"answerNote":"<p>마지막 사진 하단의 정답표가 잘려 있어 전체 정답표를 확인할 수 없습니다. 아래는 사진에서 읽을 수 있는 정답과 해설에 명시된 내용입니다.<\/p><p>그 외 번호의 정답은 잘린 정답표를 추정하여 추가하지 않았습니다.<\/p>","confirmedAnswers":4},{"id":"09","title":"UNIT 09 · Forecasting Trends: A Closer Look at the Top Keywords Shaping the Year Ahead","shortTitle":"UNIT 09 · Forecasting Trends","bookSource":"제공된 교재 사진을 옮긴 문서입니다. 페이지와 줄바꿈으로 나뉜 단어·문장을 연결했고, 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 워크북 81–86쪽. 본문 해석, 연습문제, 선택지, 해설과 정답을 사진에서 옮겼습니다. 페이지에 걸쳐 나뉜 문장은 연결했습니다.","paragraphs":[{"number":1,"title":"도입","english":"Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments. These are also based on emerging issues but may evolve over time depending on developments in various fields.","korean":"특정 연도를 위한 특정 핵심어를 예측하는 것은 기술적 발전, 문화적 트렌드, 지정학적 사건, 그리고 최근 생겨난 문제들 등 다양한 요인에 의해 결정되기 때문에 힘든 일입니다. 그러나 최근 진행 중인 경향과 잠재적 발전에 근거하여 다음해에 중요할 수 있는 몇 가지 핵심 단어를 제시하겠습니다. 이러한 키워드들은 최근 생겨난 쟁점을 기반으로 하지만, 다양한 분야에서의 발전에 따라 시간이 지나면서 변할 수 있습니다."},{"number":2,"title":"Metaverse","english":"With the growing interest in virtual reality (VR), augmented reality (AR), and immersive digital experiences, the concept of the metaverse is likely to gain more prominence. Companies like Meta Platforms are investing heavily in this area, and discussions around the metaverse are likely to intensify.","korean":"가상 현실(VR), 증강 현실(AR), 그리고 몰입형 디지털 경험에 대한 관심이 증가함에 따라 메타버스 개념이 더 많은 주목을 받을 것으로 예상됩니다. (이전에는 Facebook이었던) 메타 플랫폼(Meta Platforms)과 같은 기업들이 이 분야에 큰 투자를 하고 있으며, 메타버스에 관한 토론은 더욱 거세질 것으로 예상됩니다."},{"number":3,"title":"Sustainability","english":"Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.","korean":"기후 변화와 환경 파괴에 대한 우려가 계속해서 증가하면서 지속 가능성에 대한 대화가 활발해지고 있습니다. 재생 가능 에너지, 순환 경제, 친환경적인 실천, 그리고 기후 행동과 관련된 주요 단어들은 개인, 기업 및 정부가 지속 가능성을 위한 노력을 우선시하는 만큼 여전히 중요할 것으로 예상됩니다."},{"number":4,"title":"Artificial Intelligence (AI) Ethics","english":"As AI technologies become more integrated into various aspects of society, ethical considerations surrounding AI use, such as bias mitigation, transparency, and accountability, are gaining attention. Keywords related to AI ethics and responsible AI development are likely to be prominent in discussions about the future of technology.","korean":"AI 기술이 사회의 다양한 측면에 더욱 통합되면서, AI 사용을 둘러싼 윤리적 고려 사항인 편견 완화, 투명성, 책임 등이 주목받고 있습니다. AI 윤리와 책임 있는 AI 개발과 관련된 키워드들은 기술의 미래에 대한 토론에서 중요한 위치를 차지할 것으로 예상됩니다."},{"number":5,"title":"Decentralized Finance (DeFi)","english":"The rise of blockchain technology and cryptocurrencies has led to the emergence of decentralized finance applications, which aim to disrupt traditional financial systems. Keywords related to DeFi, such as blockchain, smart contracts, decentralized exchanges, and tokenization, are expected to be significant as the sector continues to evolve.","korean":"블록체인 기술과 암호 화폐의 급격한 부상은 전통적인 금융 시스템에 지장을 주는 탈중앙화된 금융 애플리케이션의 등장을 이끌었습니다. 블록체인, 스마트 계약, 탈중앙화된 거래, 그리고 토큰화와 같은 DeFi 관련 키워드들은 이 분야가 계속 발전함에 따라 중요성을 유지할 것으로 예상됩니다."},{"number":6,"title":"Remote Work","english":"The COVID-19 pandemic has accelerated the adoption of remote work arrangements, leading to significant changes in how and where work is conducted. Keywords related to remote work tools, digital collaboration, flexible work policies, and work-life balance are likely to remain relevant as remote work becomes more entrenched in the global workforce.","korean":"코로나 19 대유행이 원격 근무 배치에 대한 채택을 가속화시키면서, 업무가 어떻게 어디서 수행되어야 하는지에 관해 중요한 변화를 이끌었습니다. 원격 근무가 국제적 (업무를 하는) 직장인들에게 더욱 단단히 자리 잡으면서 원격 근무 수단, 디지털 협업, 유연한 근무 정책, 그리고 워라밸 등의 관련 키워드들은 지속해서 밀접한 관련성을 유지할 것으로 예상됩니다."},{"number":7,"title":"Healthtech","english":"The healthcare industry is undergoing rapid transformation driven by advancements in technology, including telemedicine, wearable devices, personalized medicine, and health analytics. Keywords related to healthtech innovation and digital health solutions are expected to be prominent as the industry adapts to new challenges and opportunities.","korean":"의료 서비스 산업은 원격 의료, 몸에 착용 가능한 스마트 기기, 개인 맞춤형 의료, 건강 분석을 포함한 기술 발전이 주도한 급격한 변화를 겪고 있습니다. 건강 관련 기술의 혁신과 디지털 건강 대응책과 관련된 키워드들은 (의료) 산업이 새로운 도전과 기회에 순응하면서 중요해질 것으로 예상됩니다."},{"number":8,"title":"Cybersecurity","english":"As cyber threats become more sophisticated and prevalent, cybersecurity remains a critical concern for individuals, businesses, and governments. Keywords related to cybersecurity, such as ransomware, data breaches, zero-trust architecture, and cybersecurity awareness, are likely to be significant as organizations prioritize efforts to protect their digital assets.","korean":"사이버 위협이 더욱 정교하고 보편화되면서, 사이버 보안은 개인, 기업 및 정부에게 계속 중대한 관심사입니다. 랜섬웨어, 데이터 유출, 철통 인증 양식, 그리고 사이버 보안에 관한 인식 등 사이버 보안과 관련된 키워드들은 여러 단체가 그들의 디지털 자산을 보호하기 위한 노력을 우선시함에 따라 계속 중요할 것으로 예상됩니다."}],"vocabulary":[{"number":1,"word":"forecast","meaning":"예측하다, 예보하다"},{"number":2,"word":"predict","meaning":"예측하다, 예견하다"},{"number":3,"word":"challenging","meaning":"힘 드는, 도전 의식을 북돋우는"},{"number":4,"word":"depend on","meaning":"~에 의존하다"},{"number":5,"word":"factor","meaning":"요인"},{"number":6,"word":"geopolitical","meaning":"지정학적인"},{"number":7,"word":"emerging","meaning":"최근 생겨난"},{"number":8,"word":"ongoing","meaning":"계속 진행중인"},{"number":9,"word":"metaverse","meaning":"사이버 공간, 가상 공간"},{"number":10,"word":"virtual reality","meaning":"컴퓨터를 이용해서 만들어진 가상 현실"},{"number":11,"word":"augmented reality","meaning":"증강 현실"},{"number":12,"word":"immersive","meaning":"컴퓨터 시스템이 마치 사용자를 에워싸는 듯한, 몰입감을 강화하는"},{"number":13,"word":"prominence","meaning":"중요성, 명성"},{"number":14,"word":"invest","meaning":"투자하다"},{"number":15,"word":"intensify","meaning":"심해지다, 격렬해지다"},{"number":16,"word":"sustainability","meaning":"지속 가능성, 환경 파괴 없이 지속될 수 있음"},{"number":17,"word":"environmental degradation","meaning":"환경 악화(파괴)"},{"number":18,"word":"escalate","meaning":"확대되다, 악화되다"},{"number":19,"word":"circular economy","meaning":"순환경제(쓰레기를 줄이고 자원의 생산성을 최대한 활용하자는 경제 시스템)"},{"number":20,"word":"eco-friendly","meaning":"친환경적인"},{"number":21,"word":"climate action","meaning":"기후 행동(국가 혹은 국제적으로 기후 변화에 대응하기 위한 정책, 실질적인 노력)"},{"number":22,"word":"prioritize","meaning":"우선적으로 처리하다"},{"number":23,"word":"artificial intelligence","meaning":"인공 지능"},{"number":24,"word":"integrate into","meaning":"~에 통합되다, 흡수되다"},{"number":25,"word":"ethical considerations","meaning":"윤리적 고려 사항, 윤리 심의"},{"number":26,"word":"mitigation","meaning":"완화, 경감"},{"number":27,"word":"transparency","meaning":"투명성, 명백함"},{"number":28,"word":"decentralized finance","meaning":"[경제] 분산화된, 탈집중화된 금융, 탈중앙화된 금융"},{"number":29,"word":"blockchain","meaning":"블록체인, 공공 거래 장부(특정 기관의 온라인 거래 명세가 기록된 블록을 연결한 것으로 누구나 접근 가능함)"},{"number":30,"word":"cryptocurrency","meaning":"암호 화폐, 가상 화폐"},{"number":31,"word":"disrupt","meaning":"지장을 주다, 방해하다"},{"number":32,"word":"smart contract","meaning":"스마트 계약(서로 계약서를 작성하고 이행하는 데 시간이 소요됐던 기존의 방식과 달리 블록체인의 보안성과 안정성이 담보되어 계약 조건만 성사되면 스마트하게 실현되는 계약)"},{"number":33,"word":"sector","meaning":"(산업 등의) 부문, 분야"},{"number":34,"word":"remote work","meaning":"원격 근무"},{"number":35,"word":"pandemic","meaning":"전 세계적인 유행병"},{"number":36,"word":"accelerate","meaning":"가속화하다, 속도를 높이다"},{"number":37,"word":"adoption","meaning":"채택, 선정"},{"number":38,"word":"flexible","meaning":"유연한, 융통성 있는"},{"number":39,"word":"work-life balance","meaning":"워라밸, 일과 삶의 균형"},{"number":40,"word":"entrenched","meaning":"견고한, 확립된"},{"number":41,"word":"workforce","meaning":"노동자, 노동 인구"},{"number":42,"word":"industry","meaning":"산업"},{"number":43,"word":"undergo","meaning":"겪다"},{"number":44,"word":"telemedicine","meaning":"(전화, 텔레비전으로 환자가 받을 수 있는) 원격 의료"},{"number":45,"word":"personalized","meaning":"개인 맞춤형"},{"number":46,"word":"solution","meaning":"해법, 해답, 해결책"},{"number":47,"word":"prominent","meaning":"중요한"},{"number":48,"word":"adapt","meaning":"(새로운 용도, 상황에) 적응하다[조정하다]"},{"number":49,"word":"opportunity","meaning":"기회, 기망"},{"number":50,"word":"cybersecurity","meaning":"사이버 보안"},{"number":51,"word":"cyber threat","meaning":"사이버 위협"},{"number":52,"word":"sophisticated","meaning":"정교한, 복잡한"},{"number":53,"word":"prevalent","meaning":"널리 퍼진, 일반적인"},{"number":54,"word":"critical","meaning":"중대한, 결정적인"},{"number":55,"word":"concern","meaning":"우려, 걱정"},{"number":56,"word":"ransomware","meaning":"랜섬웨어(컴퓨터의 작동이 중단되게 만든 뒤 재가동을 조건으로 금품을 요구하는 데 이용되는 악성 프로그램의 일종), ransom: (납치, 유괴된 사람에 대한) 몸값"},{"number":57,"word":"data breach","meaning":"데이터 유출(기밀 데이터가 무단으로 복사, 전송, 열람, 도난, 변경 또는 사용되는 보안 위반)"},{"number":58,"word":"zero-trust","meaning":"철통 인증, ‘아무도 어떤 것도 믿지 말라’는 뜻"},{"number":59,"word":"organization","meaning":"단체, 기구, 협회"},{"number":60,"word":"protect","meaning":"보호하다, 지키다"},{"number":61,"word":"asset","meaning":"자산, 재산"}],"verbs":[],"vocabularyExercises":[],"exercises":[{"number":1,"passage":"<p>Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments.<\/p>","prompt":"<p>Which factor(s) influence(s) the prediction of keywords for a particular year?<\/p><ul><li>A) Cultural trends<\/li><li>B) Technological advancements<\/li><li>C) Geopolitical events<\/li><li>D) All of the above<\/li><\/ul>","explanation":"<p>특정 연도의 키워드를 예측하는 것은 기술적 발전, 문화적 트렌드, 지정학적 사건 및 신흥 이슈와 같은 다양한 요소에 의존한다고 언급되어 있습니다. 따라서 나열된 모든 옵션들이 올바릅니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":2,"passage":"<p>Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments.<\/p>","prompt":"<p>Which factor(s) make(s) predicting specific keywords challenging?<\/p><ul><li>A) Technological advancements<\/li><li>B) Cultural trends<\/li><li>C) Geopolitical events, Emerging issues<\/li><li>D) All of the above<\/li><\/ul>","explanation":"<p>특정 연도의 특정 키워드를 예측하는 것은 기술적 발전, 문화적 트렌드, 지정학적 사건 및 신흥 이슈와 같은 여러 요소로 인해 어렵습니다. 이러한 각 요소는 주어진 연도에 특정 키워드의 중요성에 영향을 줄 수 있습니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":3,"passage":"<p>Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments.<\/p>","prompt":"<p>What determines the significance of keywords for a particular year?<\/p><ul><li>A) Number of technological advancements<\/li><li>B) Random selection<\/li><li>C) Cultural trends and geopolitical events<\/li><li>D) Weather patterns<\/li><\/ul>","explanation":"<p>특정 연도의 키워드의 중요성은 문화적 트렌드와 지정학적 사건을 포함한 다른 요소에 의해 결정됩니다. 이러한 요소는 특정 시기 내에서 특정 키워드의 역할과 관련성을 형성합니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":4,"passage":"<p>Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments.<\/p>","prompt":"<p>What might be significant in the next year based on ongoing trends and potential developments?<\/p><ul><li>A) Past events<\/li><li>B) Historical figures<\/li><li>C) Predicted keywords<\/li><li>D) Fictional characters<\/li><\/ul>","explanation":"<p>지속적인 트렌드와 잠재적인 발전에 기반하여 예측된 키워드가 다음해에 중요할 수 있습니다. 이러한 키워드는 다양한 도메인 내에서의 신흥 테마와 관심 영역을 반영합니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":5,"passage":"<p>Predicting specific keywords for a particular year can be challenging as it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues. However, here are some keywords that might be significant in next year based on ongoing trends and potential developments.<\/p>","prompt":"<p>Why is predicting specific keywords challenging?<\/p><ul><li>A) Due to the absence of factors influencing them<\/li><li>B) Because it solely depends on historical data<\/li><li>C) Because it depends on various factors such as technological advancements, cultural trends, geopolitical events, and emerging issues<\/li><li>D) Because predicting the future is impossible<\/li><\/ul>","explanation":"<p>특정 연도의 특정 키워드를 예측하는 것은 기술적 발전, 문화적 트렌드, 지정학적 사건 및 신흥 이슈와 같은 여러 요소에 의존하기 때문에 어렵습니다. 이러한 요소는 동적이며 시간이 지남에 따라 변화할 수 있어 정확한 예측을 어렵게 만듭니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":6,"passage":"<p>Sustainability: Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.<\/p>","prompt":"<p>What is driving conversations around sustainability?<\/p><ul><li>A) Decreasing concerns about climate change<\/li><li>B) Escalating concerns about climate change and environmental degradation<\/li><li>C) Lack of interest in environmental issues<\/li><li>D) Rising costs of renewable energy<\/li><\/ul>","explanation":"<p>기후 변화 및 환경 파괴에 대한 우려가 계속 증가하고 있으며, 이것이 지속 가능성 주제에 대한 대화를 촉진하고 있다고 언급됩니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":7,"passage":"<p>Sustainability: Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.<\/p>","prompt":"<p>Which of the following is NOT mentioned as a keyword related to sustainability?<\/p><ul><li>A) Renewable energy<\/li><li>B) Linear economy<\/li><li>C) Circular economy<\/li><li>D) Eco-friendly practices<\/li><\/ul>","explanation":"<p>재생 에너지, 순환 경제, 그리고 친환경적인 실천과 같은 지속 가능성과 관련된 키워드를 언급하지만, ‘선형 경제’는 언급되지 않습니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":8,"passage":"<p>Sustainability: Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.<\/p>","prompt":"<p>Who is expected to prioritize sustainability efforts?<\/p><ul><li>A) Only individuals<\/li><li>B) Only businesses<\/li><li>C) Only governments<\/li><li>D) Individuals, businesses, and governments<\/li><\/ul>","explanation":"<p>개인, 기업 및 정부가 지속 가능성을 위한 노력을 우선시할 것으로 예상되며, 이는 다양한 부문에서의 집단적 책임을 강조합니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":9,"passage":"<p>Sustainability: Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.<\/p>","prompt":"<p>What is expected to remain significant in the context of sustainability?<\/p><ul><li>A) Ignoring environmental concerns<\/li><li>B) Focusing solely on economic growth<\/li><li>C) Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action<\/li><li>D) Disregarding climate change<\/li><\/ul>","explanation":"<p>지속 가능성 주제에 대한 토론이 계속 발전함에 따라 재생 에너지, 순환 경제, 친환경적인 실천 및 기후 조치와 같은 지속 가능성과 관련된 키워드가 계속 중요할 것으로 예상됩니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":10,"passage":"<p>Sustainability: Concerns about climate change and environmental degradation continue to escalate, driving conversations around sustainability. Keywords related to renewable energy, circular economy, eco-friendly practices, and climate action are expected to remain significant as individuals, businesses, and governments prioritize sustainability efforts.<\/p>","prompt":"<p>Which phrase best summarizes the passage?<\/p><ul><li>A) Sustainability efforts are irrelevant.<\/li><li>B) Climate change has no impact on sustainability.<\/li><li>C) Concerns about climate change and environmental degradation drive conversations around sustainability, with a focus on keywords such as renewable energy and circular economy.<\/li><li>D) Renewable energy is not a priority for sustainability efforts.<\/li><\/ul>","explanation":"<p>해당 보기는 기후 변화 및 환경 파괴에 대한 우려가 지속 가능성에 대한 대화를 주도하며, 여러 관련된 키워드에 집중한다는, 지문의 주요 아이디어를 가장 잘 요약합니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}}],"answerNote":"","confirmedAnswers":10},{"id":"10","title":"UNIT 10 · Navigating the Decade Ahead: Key Themes and Trends Shaping Our Future","shortTitle":"UNIT 10 · Navigating the Decade Ahead","bookSource":"제공된 교재 사진을 옮긴 문서입니다. 페이지와 줄바꿈으로 나뉜 단어·문장을 연결했고, 위첨자 어휘 번호는 아래 어휘 표에 모았습니다.","workbookSource":"원본: 워크북 87–91쪽. 본문 해석, 연습문제, 선택지, 해설과 정답을 사진에서 옮겼습니다. 페이지에 걸쳐 나뉜 문장은 연결했습니다.","paragraphs":[{"number":1,"title":"도입","english":"Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.","korean":"앞으로 오는 십 년을 위한 중요한 핵심어를 예측하는 것은 장기적인 경향, 기술적 발전, 사회적 변화, 그리고 세계적 도전 과제에 대한 고려를 포함합니다. 확신을 가지고 예측하기는 어렵지만, 다가올 십 년을 위해 잠재적으로 중요한 핵심어들과 그것이 중요한 이유들이 여기 있습니다."},{"number":2,"title":"Climate Crisis Solutions","english":"With the increasing urgency to address climate change, keywords related to renewable energy, carbon capture and storage, sustainable agriculture, climate adaptation, and eco-friendly technologies are likely to remain significant. The next decade will be crucial for implementing solutions to mitigate the impacts of climate change and transition to a low-carbon economy.","korean":"기후 변화에 대처해야 하는 급박성이 증가함에 따라 재생 가능 에너지, 탄소 포집 및 저장, 지속 가능한 농업, 기후 적응, 그리고 친환경 기술과 관련된 키워드들이 여전히 중요할 것으로 예상됩니다. 향후 십 년은 기후 변화의 영향을 완화하기 위한 해결책과 저탄소 경제로의 전환을 시행하는 데 결정적인 시기가 될 것입니다."},{"number":3,"title":"Artificial General Intelligence (AGI)","english":"As AI continues to advance, there may be a shift towards achieving AGI, which refers to AI systems that can understand, learn, and apply knowledge across a wide range of tasks similar to human intelligence. Keywords related to AGI research, ethics, and implications are expected to gain prominence as society grapples with the potential benefits and risks of achieving AGI.","korean":"AI가 계속 발전함에 따라, 범용 일반 지능을 달성하기 위한 변화가 있을 수 있습니다. 이는 광범위한 직무 영역에서 지식을 이해하고 학습하며 적용할 수 있는 인간 지능과 유사한 AI 시스템을 의미합니다. 사회가 AGI 달성의 잠재적 이점과 위험을 고심함에 따라 AGI 연구, 윤리, 영향과 관련된 키워드들이 주목받을 것으로 예상됩니다."},{"number":4,"title":"Space Exploration and Colonization","english":"With the increasing interest and investment in space exploration by both governments and private companies, keywords related to space exploration, lunar and Mars colonization, space tourism, and asteroid mining are likely to be significant. The next decade may see significant advancements in space technology and exploration efforts beyond Earth’s orbit.","korean":"정부와 민간 기업 모두에 의해 우주 탐사에 대한 관심과 투자가 증가함에 따라 우주 탐사, 달과 화성의 식민지화, 우주 관광, 그리고 소행성 채굴과 관련된 키워드들이 중요해질 것으로 예상됩니다. 향후 십 년은 지구 궤도를 넘어서는 우주 기술과 탐사 노력에서 중요한 발전을 보게 될 것입니다."},{"number":5,"title":"Healthcare Innovation","english":"The healthcare industry is poised for significant innovation driven by advances in biotechnology, genomics, precision medicine, and telehealth. Keywords related to personalized medicine, gene editing, regenerative medicine, digital health platforms, and healthcare accessibility are expected to be prominent as the industry evolves to meet the growing healthcare needs of an aging population.","korean":"생명 과학, 유전체학, 정밀 의료, 그리고 원격 의료 등의 발전에 따라 의료 산업은 중요한 혁신을 위한 준비가 되었습니다. 개인 맞춤형 의료, 유전자 편집, 재생 의학, 디지털 건강 플랫폼, 그리고 의료 접근성과 관련된 키워드들은 의료 산업이 고령 인구의 증가하는 건강 관련 요구를 충족하기 위해 발전함에 따라 중요해질 것으로 예상됩니다."},{"number":6,"title":"Cybersecurity Resilience","english":"As cyber threats continue to evolve and become more sophisticated, keywords related to cybersecurity resilience, cyber defense strategies, quantum encryption, and cyber risk management are likely to be significant. Organizations will increasingly prioritize cybersecurity measures to protect critical infrastructure, data, and systems from cyber attacks.","korean":"사이버 위협이 계속해서 진화하고 정교해지면서, 사이버 보안 회복력, 사이버 방어 전략, 양자 암호, 그리고 사이버 리스크 관리와 관련된 키워드들이 중요해질 것입니다. 기관들은 중요한 인프라(기반 시설), 데이터 및 시스템을 사이버 공격으로부터 보호하기 위해 사이버 보안 조치를 갈수록 더 우선시할 것입니다."},{"number":7,"title":"Augmented Reality (AR) and Virtual Reality (VR)","english":"AR and VR technologies are expected to become more integrated into various aspects of daily life, including entertainment, education, healthcare, and remote work. Keywords related to AR/VR development, immersive experiences, virtual collaboration, and mixed reality applications are likely to gain prominence as these technologies become more widespread.","korean":"AR 및 VR 기술이 엔터테인먼트, 교육, 의료, 원격 근무 등 일상의 다양한 측면에 점점 더 통합될 것으로 예상됩니다. AR/VR 개발, 몰입형 경험, 가상 협업, 그리고 혼합 현실 애플리케이션과 관련된 키워드들은 이러한 기술이 보다 널리 보급되면서 중요성을 인정받을 것입니다."},{"number":8,"title":"Ethical and Responsible Technology","english":"As technology plays an increasingly central role in society, there will be a growing emphasis on ethical considerations, responsible use of technology, and digital rights. Keywords related to tech ethics, algorithmic transparency, data privacy, digital citizenship, and tech regulation are expected to be significant as society grapples with the ethical implications of technological advancements.\n\nThese keywords reflect ongoing trends, emerging issues, and anticipated developments that are likely to shape the trajectory of the next decade. However, it is important to note that unforeseen events and breakthroughs may also influence the significance of certain keywords in the coming years.","korean":"기술이 사회에서 점점 중요한 역할을 하면서 윤리적 고려 사항, 기술의 책임감 있는 사용, 그리고 디지털 권리가 점점 더 강조될 것입니다. 기술 윤리, 알고리즘 투명성, 데이터 개인 정보 보호, 디지털 시민권, 그리고 기술 규제와 관련된 키워드들은 사회가 기술 발전의 윤리적 영향에 대해 고심하면서 중요해질 것으로 예상됩니다.\n\n이러한 키워드들은 계속 진행 중인 추세, 새로 발생할 사안들, 그리고 예상되는 발전을 반영하며, 향후 십 년의 궤적을 형성할 것으로 예상됩니다. 그러나 예기치 못한 사건과 돌파구가 향후 몇 년 동안 특정 키워드들의 중요성에 영향을 줄 수 있다는 점을 주의하는 게 중요합니다."}],"vocabulary":[{"number":1,"word":"navigate","meaning":"(지도 등을 보며) 길을 찾다[방향을 읽다]"},{"number":2,"word":"decade","meaning":"10년"},{"number":3,"word":"predict","meaning":"예언하다, 내다보다"},{"number":4,"word":"involve","meaning":"포함하다, 필요로 하다"},{"number":5,"word":"technological advancement","meaning":"기술적 발전, 진보"},{"number":6,"word":"shift","meaning":"변화"},{"number":7,"word":"certainty","meaning":"확실성, 확신"},{"number":8,"word":"potential","meaning":"잠재적인, 가능성 있는"},{"number":9,"word":"climate crisis","meaning":"기후 위기"},{"number":10,"word":"urgency","meaning":"긴급, 절박"},{"number":11,"word":"address","meaning":"(문제, 사안 등을) 다루다, 해결하려 하다, (...에 대해) 고심하다"},{"number":12,"word":"renewable","meaning":"재생 가능한"},{"number":13,"word":"carbon capture and storage","meaning":"이산화탄소 포집 및 저장"},{"number":14,"word":"sustainable agriculture","meaning":"지속 농업"},{"number":15,"word":"climate adaptation","meaning":"기후(변화에 대한) 적응"},{"number":16,"word":"implement","meaning":"시행하다"},{"number":17,"word":"mitigate","meaning":"완화시키다, 경감시키다"},{"number":18,"word":"transition","meaning":"(다른 상태, 조건으로의) 변화, 전환"},{"number":19,"word":"Artificial General Intelligence","meaning":"범용 인공 지능(미래에 개발될 것으로 믿는 인공 지능의 한 유형으로, 모든 종류의 문제를 파악하고 해결하는 능력이 인간과 동등하거나 더 뛰어난 것으로 여겨짐)"},{"number":20,"word":"advance","meaning":"증진되다, 진전되다"},{"number":21,"word":"apply","meaning":"적용하다, 응용하다"},{"number":22,"word":"implication","meaning":"영향, 결과"},{"number":23,"word":"prominence","meaning":"중요성, 명성"},{"number":24,"word":"grapple","meaning":"붙잡고 씨름하다, 해결하려고 고심하다"},{"number":25,"word":"benefit","meaning":"혜택, 이득"},{"number":26,"word":"risk","meaning":"위험, 위험 요소"},{"number":27,"word":"exploration","meaning":"탐사, 탐구"},{"number":28,"word":"colonization","meaning":"식민지화"},{"number":29,"word":"investment","meaning":"투자"},{"number":30,"word":"asteroid","meaning":"소행성"},{"number":31,"word":"mining","meaning":"채굴"},{"number":32,"word":"orbit","meaning":"궤도, 범위"},{"number":33,"word":"innovation","meaning":"혁신, 쇄신"},{"number":34,"word":"poised","meaning":"(~을 할 준비가 다 된, ~을 할 태세인)"},{"number":35,"word":"genomics","meaning":"유전체학, 게놈학"},{"number":36,"word":"precision medicine","meaning":"정밀 의료"},{"number":37,"word":"telehealth","meaning":"원격 의료(전자 장비를 이용하여 멀리 있는 환자에게 제공하는 의료 서비스)"},{"number":38,"word":"personalized medicine","meaning":"개인 맞춤형 의료"},{"number":39,"word":"gene editing","meaning":"유전자 편집"},{"number":40,"word":"accessibility","meaning":"접근성"},{"number":41,"word":"aging population","meaning":"노령화 인구"},{"number":42,"word":"threat","meaning":"위협"},{"number":43,"word":"quantum encryption","meaning":"양자 암호"},{"number":44,"word":"risk management","meaning":"(안전 대책, 보험 등으로 손실 위험을 막고 손해를 최소화하는) 위기관리"},{"number":45,"word":"protect","meaning":"보호하다, 지키다"},{"number":46,"word":"infrastructure","meaning":"사회(공공) 기반 시설"},{"number":47,"word":"augmented reality","meaning":"증강 현실"},{"number":48,"word":"virtual reality","meaning":"가상 현실(컴퓨터 기술이 연출해내는 3차원 그래픽을 포함한 가상의 환경으로 실존하지 않는 소리나 감각, 환경 등을 현실처럼 의사 체험할 수 있음. 약어: VR)"},{"number":49,"word":"integrated","meaning":"통합적인"},{"number":50,"word":"including","meaning":"~을 포함하여"},{"number":51,"word":"immersive","meaning":"몰입형의"},{"number":52,"word":"virtual collaboration","meaning":"가상 협업, 가상 협동"},{"number":53,"word":"mixed reality","meaning":"혼합 현실"},{"number":54,"word":"widespread","meaning":"광범위한, 널리 퍼진"},{"number":55,"word":"ethical","meaning":"윤리적인, 도덕적으로 옳은"},{"number":56,"word":"responsible","meaning":"책임을 다하는"},{"number":57,"word":"emphasis","meaning":"강조"},{"number":58,"word":"transparency","meaning":"투명성"},{"number":59,"word":"regulation","meaning":"규제, 통제, 단속"},{"number":60,"word":"implication","meaning":"영향, 결과"},{"number":61,"word":"reflect","meaning":"반영하다, 나타내다"},{"number":62,"word":"anticipated","meaning":"기대하던, 대망의"},{"number":63,"word":"trajectory","meaning":"궤적, 궤도"},{"number":64,"word":"unforeseen","meaning":"예측하지 못한, 뜻밖의"},{"number":65,"word":"breakthrough","meaning":"돌파구"},{"number":66,"word":"influence","meaning":"영향을 주다, 미치다"},{"number":67,"word":"significance","meaning":"의의, 의미"}],"verbs":[],"vocabularyExercises":[],"exercises":[{"number":1,"passage":"<p>Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.<\/p>","prompt":"<p>What factors are involved in predicting significant keywords for the coming decade?<\/p><ul><li>A) Short-term trends<\/li><li>B) Technological advancements<\/li><li>C) Immediate challenges only<\/li><li>D) Personal preferences<\/li><\/ul>","explanation":"<p>지문에서는 다가오는 10년 동안 중요한 키워드를 예측할 때 장기 트렌드, 기술적 발전, 사회적 변화 및 글로벌 도전 과제를 고려한다고 언급합니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":2,"passage":"<p>Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.<\/p>","prompt":"<p>Which part of speech is the word “predicting” in the given sentence?<\/p><ul><li>A) Verb<\/li><li>B) Adjective<\/li><li>C) Adverb<\/li><li>D) Noun<\/li><\/ul>","explanation":"<p>“Predicting”은 동사 “predict”의 동명사 형태입니다. 이는 문장의 주어로 사용되며, 무언가가 일어나는 동작을 나타냅니다.<\/p>","answer":{"answer":"D","evidence":"교재 수록 정답표"}},{"number":3,"passage":"<p>Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.<\/p>","prompt":"<p>What does the phrase “long-term trends” refer to in the context of the sentence?<\/p><ul><li>A) Short-lived patterns<\/li><li>B) Temporary fluctuations<\/li><li>C) Patterns persisting over a considerable period<\/li><li>D) Seasonal variations<\/li><\/ul>","explanation":"<p>“장기적인 추세”는 짧은 기간 동안이 아닌 상당한 기간 동안 지속되는 패턴이나 경향을 의미합니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":4,"passage":"<p>Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.<\/p>","prompt":"<p>In the phrase “technological advancements,” what does “advancements” mean?<\/p><ul><li>A) Regressions<\/li><li>B) Progresses<\/li><li>C) Setbacks<\/li><li>D) Stagnations<\/li><\/ul>","explanation":"<p>“Advancements”는 기술의 발전이나 전진을 나타냅니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":5,"passage":"<p>Predicting significant keywords for the coming decade involves considering long-term trends, technological advancements, societal shifts, and global challenges. While it is difficult to predict with certainty, here are some potential significant keywords for the coming decade and the reasons behind them.<\/p>","prompt":"<p>What does the phrase “the reasons behind them” refer to in the given sentence?<\/p><ul><li>A) Causes for the trends<\/li><li>B) Consequences of the trends<\/li><li>C) Predictions about the trends<\/li><li>D) Impacts of the trends<\/li><\/ul>","explanation":"<p>“그 이유들”은 문장에서 이전에 언급된 추세의 원인이나 이유를 나타내며, 인과 관계를 강조합니다.<\/p>","answer":{"answer":"A","evidence":"교재 수록 정답표"}},{"number":6,"passage":"<p>Artificial General Intelligence (AGI): As AI continues to advance, there may be a shift towards achieving AGI, which refers to AI systems that can understand, learn, and apply knowledge across a wide range of tasks similar to human intelligence. Keywords related to AGI research, ethics, and implications are expected to gain prominence as society grapples with the potential benefits and risks of achieving AGI.<\/p>","prompt":"<p>What does AGI stand for?<\/p><ul><li>A) Advanced Global Innovation<\/li><li>B) Artificial General Intelligence<\/li><li>C) Applied Graphical Interface<\/li><li>D) Automated Gaming Integration<\/li><\/ul>","explanation":"<p>AGI를 범용(일반) 인공 지능으로 정의하고 있으며, 이는 인간 지능과 유사하게 다양한 작업에서 지식을 이해하고 학습하며 적용할 수 있는 AI 시스템을 의미합니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":7,"passage":"<p>Artificial General Intelligence (AGI): As AI continues to advance, there may be a shift towards achieving AGI, which refers to AI systems that can understand, learn, and apply knowledge across a wide range of tasks similar to human intelligence. Keywords related to AGI research, ethics, and implications are expected to gain prominence as society grapples with the potential benefits and risks of achieving AGI.<\/p>","prompt":"<p>What does the term “Artificial General Intelligence (AGI)” refer to?<\/p><ul><li>A) AI systems specialized in one narrow task<\/li><li>B) AI systems capable of mimicking human intelligence across various tasks<\/li><li>C) AI systems restricted to specific domains<\/li><li>D) AI systems incapable of learning and adaptation<\/li><\/ul>","explanation":"<p>AGI는 특정 기능에 국한되지 않고 인간 지능과 유사하게 다양한 작업을 이해하고 학습하며 지식을 적용할 수 있는 AI 시스템을 나타냅니다.<\/p>","answer":{"answer":"B","evidence":"교재 수록 정답표"}},{"number":8,"passage":"<p>Artificial General Intelligence (AGI): As AI continues to advance, there may be a shift towards achieving AGI, which refers to AI systems that can understand, learn, and apply knowledge across a wide range of tasks similar to human intelligence. Keywords related to AGI research, ethics, and implications are expected to gain prominence as society grapples with the potential benefits and risks of achieving AGI.<\/p>","prompt":"<p>What does the phrase “grapples with” imply in the context of the sentence?<\/p><ul><li>A) Accepts easily<\/li><li>B) Ignores completely<\/li><li>C) Struggles with<\/li><li>D) Understands thoroughly<\/li><\/ul>","explanation":"<p>“Grapples with”는 어려운 것에 대처하거나 투쟁하는 것을 의미하며, 이는 사회가 AGI의 영향에 대한 불확실성이나 장애물에 직면하고 있다는 것을 나타냅니다.<\/p>","answer":{"answer":"C","evidence":"교재 수록 정답표"}},{"number":9,"passage":"<p>Artificial General Intelligence (AGI): As AI continues to advance, there may be a shift towards achieving AGI, which refers to AI systems that can understand, learn, and apply knowledge across a wide r
